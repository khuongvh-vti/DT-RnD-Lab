# Nguồn tin cho mục "📰 Tin tức & Cơ hội" – sửa thoải mái, server đọc lại mỗi lần cập nhật.
# kind: news | research ; region: vn | intl
# Google News RSS: https://news.google.com/rss/search?q=<truy vấn>&hl=vi&gl=VN&ceid=VN:vi  (tiếng Việt)
#                  https://news.google.com/rss/search?q=<query>&hl=en-US&gl=US&ceid=US:en (tiếng Anh)
schedule: "06:30"      # giờ tự cập nhật mỗi ngày (giờ máy Mac)
keep_days: 60          # giữ bản tin bao nhiêu ngày
max_age_hours: 72      # chỉ lấy tin trong 72 giờ gần nhất
ai_top: 8              # số tin Qwen viết tóm tắt + gợi ý hành động cho VTI

google_news_vn:
  - "EVN dự án trạm biến áp"
  - "EVNNPT đóng điện trạm biến áp 220kV OR 500kV"
  - "khởi công trạm biến áp 110kV"
  - "mời thầu trạm biến áp OR đấu thầu lưới điện"
  - "Quy hoạch điện VIII điều chỉnh"
  - "chuyển đổi số ngành điện"
  - "trạm biến áp không người trực"
  - "lưu trữ năng lượng BESS Việt Nam"
  - "điện gió ngoài khơi Việt Nam"
  - "điện mặt trời áp mái Việt Nam"
  - "nhà máy điện khởi công Việt Nam"
  - "giám sát trực tuyến máy biến áp"
  - "Bộ Công Thương năng lượng kế hoạch"
  - "đường dây 500kV mạch 3 OR đường dây 500kV"
  - "trung tâm dữ liệu điện năng Việt Nam"

google_news_intl:
  - "power transformer monitoring"
  - "digital twin utility grid"
  - "substation digitalization"
  - "transformer shortage utilities"
  - "Vietnam power grid investment"
  - "ASEAN power grid interconnection"
  - "Hitachi Energy transformer"
  - "Siemens Energy grid"
  - "GE Vernova grid"
  - "battery energy storage Southeast Asia"
  - "dissolved gas analysis transformer"

rss:
  - {name: "VnExpress Kinh doanh", url: "https://vnexpress.net/rss/kinh-doanh.rss", region: vn, kind: news}
  - {name: "Utility Dive", url: "https://www.utilitydive.com/feeds/news/", region: intl, kind: news}
  - {name: "pv magazine", url: "https://www.pv-magazine.com/feed/", region: intl, kind: news}
  - {name: "Transformers Magazine", url: "https://transformers-magazine.com/feed/", region: intl, kind: news}

arxiv:   # bài nghiên cứu mới (arXiv API, miễn phí)
  - 'all:"power transformer" AND (all:"digital twin" OR all:"condition monitoring" OR all:"dissolved gas")'
  - 'all:"substation" AND all:"digital twin"'
  - 'all:"transformer" AND all:"hot-spot temperature"'

