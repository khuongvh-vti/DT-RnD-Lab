# Nguồn Internet cho chuyên viên AI tra cứu (lab/web.py).
# Nguyên tắc: ưu tiên website CHÍNH THỨC (tổ chức tiêu chuẩn, cơ quan nhà nước, hãng sản xuất), rồi nguồn UY TÍN
# (tạp chí ngành, nhà xuất bản khoa học, báo chuyên ngành). Nguồn khác vẫn dùng được nhưng bị đánh dấu "Chưa xác minh".
# Mọi khẳng định trong câu trả lời phải dẫn [S#] (kho) hoặc [W#] (web, có URL); không có nguồn thì không được khẳng định.

enabled: true
engines: [bing, duckduckgo, openalex]   # công cụ tìm; openalex = bài báo khoa học
max_pages: 5                             # số trang web đọc cho mỗi câu hỏi / nhiệm vụ
excerpt_chars: 1400                      # độ dài trích đoạn mỗi trang đưa vào Qwen (giữ vừa 16K context)
allow_other_domains: true                # false = chỉ dùng nguồn chính thức/uy tín

