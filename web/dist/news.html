<script>
const NEWS=[{"day": "2026-11-12", "title": "Bản tin năng lượng & Cơ hội VTI – 12/11/2026", "html": "<blockquote>Tổng hợp từ báo chí và tài liệu công khai (Dân trí, Báo Công Thương, Pháp luật VN, Đại biểu Nhân dân, Tạp chí Công Thương, pvpower.vn, T&amp;D World, Fortune, CIGRE, arXiv); tin đã đưa 10–11/11 chỉ nhắc lại khi có diễn biến mới. Cần tải và đọc kỹ YCKT/HSMT (và xác nhận hạn trên trang bên mời) trước khi quyết định chào giá/dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>PV Power – mời chào giá \"giám sát MBA chính NMĐ Nhơn Trạch 1\"<\/b>: 3 bộ thiết bị DGA online (H₂, CO, CO₂, CH₄, C₂H₂, C₂H₄, C₂H₆, O₂, N₂ + ẩm) cho 3 MBA chính, giám sát làm mát (quạt/bơm) và tải/quá tải, phần mềm dashboard + cảnh báo theo IEC/IEEE/CIGRE, xếp hạng thiết bị, tích hợp SCADA/EMS/Historian, 1 máy chủ trung tâm, bộ thở tự sấy<\/td><td>Trúng đúng lõi VTI: <b>online DGA + phần mềm asset health + tích hợp SCADA<\/b>; phạm vi phần mềm gần như trùng Transformer DT mức Diagnostic<\/td><td>Tải phụ lục phạm vi; chọn cấu hình multi-gas (đối tác thiết bị/Seiko) + phần mềm VTI; lập chào giá trọn gói (thiết bị + phần mềm + lắp đặt + đào tạo)<\/td><td>Tài liệu đăng trên pvpower.vn (thư mục 2026), <b>chưa thấy hạn<\/b> → gọi ngay Văn phòng PV Power/NMĐ Nhơn Trạch xác nhận hạn<\/td><\/tr><tr><td>2<\/td><td><b>PV Power – \"Trang bị hệ thống giám sát khí cho MBA chính NMĐ Cà Mau 2 năm 2026\"<\/b>: 2 bộ đo H₂ + ẩm trong dầu, 2 bộ thở tự sấy, phần mềm giám sát, PC trung tâm, dịch vụ lắp đặt–thử nghiệm–đào tạo<\/td><td>Gói nhỏ, kỹ thuật đơn giản (H₂/moisture) → dễ thắng, mở cửa khách hàng nhà máy điện khí PV Power<\/td><td>Chào giá cùng đợt với gói NT1 (dùng chung phần mềm); đề xuất phương án nâng cấp lên multi-gas về sau<\/td><td>Như trên – xác nhận hạn ngay<\/td><\/tr><tr><td>3<\/td><td><b>EVNNPT–EVNNPC chốt kế hoạch 2026–2027 (10/11)<\/b>: 37 dự án (32 TBA 220 kV mới + 5 nâng công suất, 203 ngăn lộ 110 kV); 2027 xây TBA 220 kV Điện Biên, Phong Thổ, Bắc Ninh 5, Lục Yên, Móng Cái, <b>lắp MBA thứ 3 tại một số TBA 220 kV<\/b>; EVNNPT đề nghị <b>EVNNPC làm chủ đầu tư một số TBA 220 kV<\/b><\/td><td>MBA mới/MBA thứ 3 → gói monitoring MBA; EVNNPC có thể thành chủ đầu tư 220 kV mới, ít ràng buộc khung thiết bị EVNNPT<\/td><td>Lập pipeline 5 TBA 2027 + danh sách TBA lắp MBA3; hẹn Ban QLDA EVNNPC trình bày \"Substation DT 220 kV / MBA monitoring-ready\"<\/td><td>Ưu tiên Q4/2026: ngăn lộ tại Sầm Sơn, Hải Hậu, Yên Dũng, Sông Công, Bắc Ninh 3, Yên Bái, An Lão<\/td><\/tr><tr><td>4<\/td><td><b>EVNNPT gọi vốn 5 dự án 1.119 tỷ<\/b> (Bắc Tân Uyên, MBA 63 MVA tại Chèm, nâng công suất Yên Bái…) – nhắc lại vì sát hạn; tiếp theo là đợt <b>8 dự án ~200,9 triệu EUR<\/b><\/td><td>Sau khi chốt ngân hàng sẽ ra KHLCNT thiết bị/MBA<\/td><td>Đặt cảnh báo muasamcong theo tên 3 dự án TBA; chuẩn bị hồ sơ năng lực<\/td><td><b>17/11/2026<\/b> (còn 5 ngày); <b>27/11/2026<\/b><\/td><\/tr><tr><td>5<\/td><td><b>BESS miền Bắc: 805 MW năm 2026 → thêm ~930 MW năm 2027 (~1.734 MW cuối 2027)<\/b><\/td><td>Nhu cầu EMS, giám sát nhiệt/cell, cảnh báo cháy, tích hợp SCADA cho hàng chục trạm BESS mới<\/td><td>Tiếp cận EVNNPC/Ban QLDA điện 2 và nhà thầu BESS để làm thầu phụ phần mềm giám sát<\/td><td>Gói 2027 dự kiến mời thầu từ Q1/2027<\/td><\/tr><tr><td>6<\/td><td><b>EVNSPC nhân rộng AI phân tích DGA MBA 110 kV và nhận dạng PD<\/b> (2 đề tài được EVN công nhận); 245 TBA 110 kV không người trực; 862 bất thường phát hiện nhờ CBM 2024–2025<\/td><td>Thị trường đã chấp nhận AI-DGA/PD → khách hàng hiểu giá trị; VTI cần định vị khác biệt (DT nhiệt + lão hóa + health index đa nguồn)<\/td><td>Chuẩn bị bản so sánh tính năng; đề xuất PoC Transformer DT bổ trợ cho hệ AI hiện có của EVNSPC<\/td><td>Giai đoạn 2027–2030 \"Một hạ tầng – Một CSDL\"<\/td><\/tr><\/table>\n<p><i>Nhận xét: hôm nay có 2 gói chào giá trực tiếp về giám sát online MBA (PV Power) – nên xử lý trong tuần này.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVNNPT–EVNNPC họp phối hợp (10/11):<\/b> đã đóng điện đồng bộ 49 ngăn lộ 110 kV tại 10 TBA 220 kV; EVNNPT dự kiến hoàn thành 25 ngăn lộ cuối 2026 và 52 ngăn lộ năm 2027; hai bên họp định kỳ hàng quý.<\/li><li><b>EVN chuẩn bị cấp điện 2027 (Báo Công Thương, 10/11):<\/b> Pmax 2027 có thể vượt 62.000 MW; El Niño rất mạnh khả năng kéo dài tới ~6/2027; miền Bắc có nguy cơ phải điều hòa phụ tải tháng 5–9; truyền tải Trung–Bắc đã sát giới hạn 5.000–5.200 MW.<\/li><li><b>Lưới điện 2026–2030:<\/b> EVNNPT dự kiến hoàn thành 292 dự án 500–220 kV (~16.665 km, 91.263 MVA MBA); các TCT điện lực ~1.320 dự án 110 kV (~55.000 MVA). TBA 500 kV Thái Bình, Hải Phòng phấn đấu đóng điện trước 30/4/2027.<\/li><li><b>Đầu tư EVN 2026–2030 ~830.000 tỷ (≈166.000 tỷ/năm)<\/b>, cao hơn ~69% giai đoạn trước; 9 tháng 2026 giải ngân 86.960 tỷ (70,4% kế hoạch).<\/li><li><b>Diễn đàn An ninh năng lượng 2026 (10/11):<\/b> Thứ trưởng Nguyễn Việt Sơn nhận định 2027 khó khăn, 2028 khó hơn; Pmax kỷ lục 57.537 MW (24/6); sản lượng cả năm ước 355–358 tỷ kWh.<\/li><li><b>EVNSPC (11/11):<\/b> 10 tháng khởi công 50 công trình 110 kV, đóng điện 69 công trình 220–110 kV; mục tiêu tiết kiệm ≥3% điện năng/năm và giảm ~5% phụ tải cao điểm ở khách hàng lớn.<\/li><li><b>EVNSPC đảm bảo điện APEC 2027 (09/11):<\/b> TBA 220 kV Phú Quốc + 2 ĐZ 110 kV (~2.165 tỷ) đã đóng điện 8/2026; 3 dự án trung/hạ thế ~368 tỷ hoàn thành 3/2027; rà soát SCADA, bảo vệ, an ninh mạng.<\/li><li><b>Giá bán lẻ điện bình quân giảm 2% từ 01/11/2026<\/b> còn 2.159,9037 đ/kWh (chưa VAT) theo QĐ 1305/QĐ-EVN.<\/li><li><b>TBA 110 kV Yên Bình 9 &amp; 10 (EVNNPC, Thái Nguyên):<\/b> 4 × 63 MVA, ~319 tỷ, phấn đấu đóng điện 01/2027 – phục vụ KCN.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>PV Power – giám sát MBA NMĐ Nhơn Trạch 1<\/b> và <b>giám sát khí MBA NMĐ Cà Mau 2<\/b>: xem bảng cơ hội #1–#2 (chưa xác định hạn).<\/li><li><b>EVNNPT gọi vốn:<\/b> 5 dự án 1.119 tỷ – hạn 17/11; 8 dự án ~200,9 triệu EUR – hạn 27/11/2026.<\/li><li><b>EVNHANOI – Gói 03 EPC Trung tâm điều khiển 2 (&gt;230 tỷ):<\/b> đã gia hạn đóng thầu 2 lần (đóng 13/10/2026); cần theo dõi kết quả LCNT – nhà thầu trúng có thể cần đối tác tích hợp hệ thống/SCADA.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>GE Vernova đầu tư 34,5 triệu USD mở rộng nhà máy MBA Shreveport (T&amp;D World, 10/11):<\/b> thêm 175 việc làm, đạt công suất đầy đủ năm 2028 – chuỗi cung MBA vẫn căng.<\/li><li><b>Thiếu thép kỹ thuật điện GOES (Fortune, 04/11):<\/b> chỉ một số ít nhà máy trên thế giới sản xuất, Mỹ có duy nhất một; MBA lực có thể mất hơn 3 năm để giao → lập luận mạnh cho kéo dài tuổi thọ MBA bằng giám sát online/DT.<\/li><li><b>The Illuminating Company (FirstEnergy, 10/11):<\/b> đóng điện MBA thứ 2 ~55 tấn tại TBA Lakewood sớm 4 tháng, chi phí ~1,85 triệu USD/máy.<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer/Substation DT)<\/h2>\n<ul><li><b>CIGRE A2‑11862 (Hydro‑Québec):<\/b> chương trình DT MBA đa ngành – khung chẩn đoán/tiên lượng đa trạng thái (cảm biến ảo), deep learning phát hiện bất thường OLTC qua rung–âm, DGA cho phần tác dụng/bushing/OLTC, mô hình nhiệt–ẩm–lão hóa, phương pháp suy giảm bushing → tham chiếu kiến trúc rất sát roadmap của Phòng.<\/li><li><b>CIGRE A2‑11984 (VUM/APG, Áo):<\/b> so sánh DGA cổ điển (IEC/IEEE/CIGRE) với ML trên ca sự cố thực – ML phát hiện sớm hơn, đề xuất khung lai (hybrid) → nên áp dụng cho module DGA: rule-based làm chuẩn, ML làm cảnh báo sớm.<\/li><li><b>CIGRE D1‑11225 (ĐH Năng lượng Kazan):<\/b> dữ liệu DGA online từ 40 MBA; MLP đạt &gt;99% offline nhưng chỉ PNN chạy ổn định khi streaming với tài nguyên hạn chế; kết hợp chuỗi thời gian + phân loại phát hiện lỗi sớm hơn.<\/li><li><b>arXiv 2605.05952 (TU Delft):<\/b> position paper \"Foundation Twins\" – kết hợp foundation AI models với reinforcement learning cho DT hệ thống điện; định hướng dài hạn cho Substation DT.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Dân trí – EVNNPT và EVNNPC bảo đảm đồng bộ lưới truyền tải và phân phối – <a href=\"https://dantri.com.vn/kinh-doanh/evnnpt-va-evnnpc-bao-dam-dong-bo-luoi-dien-truyen-tai-va-phan-phoi-20261110141539793.htm\" target=\"_blank\" rel=\"noopener\">https://dantri.com.vn/kinh-doanh/evnnpt-va-evnnpc-bao-dam-dong-bo-luoi-dien-truyen-tai-va-phan-phoi-20261110141539793.htm<\/a><\/li><li>Báo Công Thương – EVNNPT và EVNNPC tăng cường phối hợp đầu tư – <a href=\"https://congthuong.vn/evnnpt-va-evnnpc-tang-cuong-phoi-hop-dau-tu-bao-dam-dong-bo-luoi-dien-truyen-tai-va-phan-phoi-480686.html\" target=\"_blank\" rel=\"noopener\">https://congthuong.vn/evnnpt-va-evnnpc-tang-cuong-phoi-hop-dau-tu-bao-dam-dong-bo-luoi-dien-truyen-tai-va-phan-phoi-480686.html<\/a><\/li><li>Báo Công Thương – EVN bảo đảm cấp điện cho năm 2027 ra sao? – <a href=\"https://congthuong.vn/evn-bao-dam-cap-dien-cho-nam-2027-ra-sao-480659.html\" target=\"_blank\" rel=\"noopener\">https://congthuong.vn/evn-bao-dam-cap-dien-cho-nam-2027-ra-sao-480659.html<\/a><\/li><li>Dân trí – Thứ trưởng Công Thương: Trong mọi trường hợp phải cung ứng đủ điện – <a href=\"https://dantri.com.vn/kinh-doanh/thu-truong-cong-thuong-trong-moi-truong-hop-phai-cung-ung-du-dien-20261110160247553.htm\" target=\"_blank\" rel=\"noopener\">https://dantri.com.vn/kinh-doanh/thu-truong-cong-thuong-trong-moi-truong-hop-phai-cung-ung-du-dien-20261110160247553.htm<\/a><\/li><li>1Thế giới – EVN tính rót 166.000 tỉ đồng mỗi năm – <a href=\"https://1thegioi.vn/evn-tinh-rot-166-000-ti-dong-moi-nam-de-dau-tu-nguon-dien-261250.html\" target=\"_blank\" rel=\"noopener\">https://1thegioi.vn/evn-tinh-rot-166-000-ti-dong-moi-nam-de-dau-tu-nguon-dien-261250.html<\/a><\/li><li>Pháp luật VN – EVNSPC bảo đảm cung ứng điện 2027–2030 – <a href=\"https://baophapluat.vn/evnspc-chu-dong-cac-giai-phap-bao-dam-cung-ung-dien-giai-doan-2027-2030.html\" target=\"_blank\" rel=\"noopener\">https://baophapluat.vn/evnspc-chu-dong-cac-giai-phap-bao-dam-cung-ung-dien-giai-doan-2027-2030.html<\/a><\/li><li>Đại biểu Nhân dân – EVNSPC chủ động bảo đảm nguồn điện cho APEC 2027 – <a href=\"https://daibieunhandan.vn/evnspc-chu-dong-bao-dam-nguon-dien-cho-apec-2027-10442511.html\" target=\"_blank\" rel=\"noopener\">https://daibieunhandan.vn/evnspc-chu-dong-bao-dam-nguon-dien-cho-apec-2027-10442511.html<\/a><\/li><li>Đại biểu Nhân dân – EVNNPC khởi công hai dự án 110 kV tại Thái Nguyên – <a href=\"https://daibieunhandan.vn/evnnpc-khoi-cong-hai-du-an-110kv-phuc-vu-phat-trien-cong-nghiep-thai-nguyen-10431703.html\" target=\"_blank\" rel=\"noopener\">https://daibieunhandan.vn/evnnpc-khoi-cong-hai-du-an-110kv-phuc-vu-phat-trien-cong-nghiep-thai-nguyen-10431703.html<\/a><\/li><li>Tạp chí Công Thương – EVNSPC hướng tới doanh nghiệp số thông minh – <a href=\"https://tapchicongthuong.vn/thuc-hien-nghi-quyet-so-57-nq-tw--evnspc-huong-toi-doanh-nghiep-so-thong-minh-558214.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/thuc-hien-nghi-quyet-so-57-nq-tw--evnspc-huong-toi-doanh-nghiep-so-thong-minh-558214.htm<\/a><\/li><li>Báo Đấu thầu – Điều chỉnh giá bán lẻ điện bình quân từ 1/11 – <a href=\"https://baodauthau.vn/dieu-chinh-gia-ban-le-dien-binh-quan-tu-ngay-111-post211500.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/dieu-chinh-gia-ban-le-dien-binh-quan-tu-ngay-111-post211500.html<\/a><\/li><li>Báo Đấu thầu – EVNHANOI gia hạn đóng thầu EPC trung tâm điều khiển – <a href=\"https://baodauthau.vn/evnhanoi-tiep-tuc-gia-han-dong-thau-goi-epc-xay-dung-trung-tam-dieu-khien-hon-230-ty-dong-post209349.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnhanoi-tiep-tuc-gia-han-dong-thau-goi-epc-xay-dung-trung-tam-dieu-khien-hon-230-ty-dong-post209349.html<\/a><\/li><li>Báo Đấu thầu – EVNNPT mời ngân hàng thu xếp 1.119 tỷ – <a href=\"https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html<\/a><\/li><li>PV Power – Phạm vi gói giám sát MBA NMĐ Nhơn Trạch 1 – <a href=\"https://pvpower.vn/pow-media/uploads/2026/van-ban-gui-vptct-dang-tin-moi-chao-gia-goi-giam-sat-mba-nt1.pdf\" target=\"_blank\" rel=\"noopener\">https://pvpower.vn/pow-media/uploads/2026/van-ban-gui-vptct-dang-tin-moi-chao-gia-goi-giam-sat-mba-nt1.pdf<\/a><\/li><li>PV Power – Mời chào giá giám sát khí MBA NMĐ Cà Mau 2 – <a href=\"https://pvpower.vn/pow-media/uploads/2026/dinh-kem-moi-chao-gia-giam-sat-khi-mba-cm2.pdf\" target=\"_blank\" rel=\"noopener\">https://pvpower.vn/pow-media/uploads/2026/dinh-kem-moi-chao-gia-giam-sat-khi-mba-cm2.pdf<\/a><\/li><li>T&amp;D World – GE Vernova mở rộng nhà máy Shreveport – <a href=\"https://www.tdworld.com/grid-innovations/news/55417969/grid-equipment-crunch-ge-vernova-investing-345m-in-shreveport-facility-expansion-to-scale-transformer-production\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/grid-innovations/news/55417969/grid-equipment-crunch-ge-vernova-investing-345m-in-shreveport-facility-expansion-to-scale-transformer-production<\/a><\/li><li>T&amp;D World – Lakewood Substation upgrade – <a href=\"https://www.tdworld.com/substations/news/55417965/the-illuminating-company-completes-lakewood-substation-upgrade-ahead-of-schedule\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/substations/news/55417965/the-illuminating-company-completes-lakewood-substation-upgrade-ahead-of-schedule<\/a><\/li><li>Fortune – Power transformer shortage &amp; electrical steel – <a href=\"https://fortune.com/2026/11/04/power-transformer-shortage-grid-400-ton-electrical-steel-one-us-mill/\" target=\"_blank\" rel=\"noopener\">https://fortune.com/2026/11/04/power-transformer-shortage-grid-400-ton-electrical-steel-one-us-mill/<\/a><\/li><li>CIGRE A2‑11862 – <a href=\"https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html<\/a><\/li><li>CIGRE A2‑11984 – <a href=\"https://www.e-cigre.org/publications/detail/a2-11984-2026-artificial-intelligence-and-classical-methods-in-dga-interpretation-hybrid-approaches-for-practical-transformer-condition-assessment.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11984-2026-artificial-intelligence-and-classical-methods-in-dga-interpretation-hybrid-approaches-for-practical-transformer-condition-assessment.html<\/a><\/li><li>CIGRE D1‑11225 – <a href=\"https://www.e-cigre.org/publications/detail/d1-11225-2026-condition-diagnosis-of-oil-filled-transformers-based-on-online-dga-data-using-machine-learning.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/d1-11225-2026-condition-diagnosis-of-oil-filled-transformers-based-on-online-dga-data-using-machine-learning.html<\/a><\/li><li>arXiv 2605.05952 – Foundation Twins – <a href=\"https://arxiv.org/pdf/2605.05952\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/pdf/2605.05952<\/a><\/li><\/ul>"}, {"day": "2026-11-11", "title": "Bản tin năng lượng & Cơ hội VTI – 11/11/2026", "html": "<blockquote>Tổng hợp từ báo chí công khai (Báo Đấu thầu, Vietnam+, VNS, Cổng TTĐT Hà Tĩnh, Mekong ASEAN, T&amp;D World, Transformer Technology, CIGRE, arXiv); tin đã đưa ngày 10/11 chỉ nhắc lại khi có diễn biến mới. Cần kiểm tra HSMT/muasamcong trước khi quyết định dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>TBA 220 kV Vũng Áng 2 (Hà Tĩnh) – nhà đầu tư tư nhân VinEnergo<\/b>: 2 MBA 220/110/22 kV × 250 MVA, 8 ngăn lộ 220 kV, ~456 tỷ (chấp thuận 04/11/2026)<\/td><td>Chủ đầu tư tư nhân, quyết định nhanh, không bị ràng buộc khung thiết bị EVNNPT → cửa vào tốt cho <b>online monitoring MBA (DGA, bushing, nhiệt) + Transformer DT<\/b> ngay từ thiết kế<\/td><td>Liên hệ VinEnergo/tư vấn thiết kế trong 2 tuần; gửi hồ sơ năng lực + đề xuất \"MBA 250 MVA monitoring-ready\" (cảm biến lắp tại nhà máy)<\/td><td>Vận hành Q2/2027 → chốt cấu hình thiết bị Q4/2026–Q1/2027<\/td><\/tr><tr><td>2<\/td><td><b>EVNNPT gọi vốn 8 dự án (~200,9 triệu EUR) – nay có danh mục chi tiết<\/b>: TBA 220 kV Ứng Hòa, Tân Việt (+ĐZ Tân Việt–Gia Lộc–Phố Nối), TBA 220 kV đấu ĐZ Đông Anh–Vân Trì, Bến Cát 2, Thanh Hà, Lý Nhân; ĐZ 220 kV Bắc Ninh 500–Bắc Ninh 4; <b>TBA 500 kV Long An<\/b><\/td><td>6 TBA 220 kV + 1 TBA 500 kV mới → pipeline gói thiết bị/SCADA/monitoring 2027<\/td><td>Lập bảng theo dõi 7 TBA (ban QLDA, PTC vận hành); đưa vào CRM; chuẩn bị tài liệu Substation DT 220 kV<\/td><td>Hạn ngân hàng nộp đề xuất <b>27/11/2026<\/b><\/td><\/tr><tr><td>3<\/td><td><b>EVNNPT gọi vốn 5 dự án 1.119 tỷ<\/b> (Bắc Tân Uyên, MBA 63 MVA tại Chèm, nâng công suất Yên Bái…) – nhắc lại vì sắp đến hạn<\/td><td>MBA mới/nâng công suất → cơ hội monitoring MBA, thí nghiệm<\/td><td>Theo dõi KHLCNT sau khi chốt ngân hàng<\/td><td><b>17/11/2026<\/b> (còn 6 ngày)<\/td><\/tr><tr><td>4<\/td><td><b>TBA 220 kV Phước Đông (EVNNPT, TMĐT 451 tỷ)<\/b> – gói 12 xây lắp trạm đã có kết quả: Liên danh PC1 Miền Nam – PC1 Thăng Long trúng 111,155 tỷ<\/td><td>Phần xây lắp đã chốt → các gói thiết bị/điều khiển/thí nghiệm có thể còn mở<\/td><td>Tìm KHLCNT dự án trên muasamcong; tiếp cận PC1 (tổng thầu quen thuộc) để làm thầu phụ tích hợp SCADA/monitoring<\/td><td>Theo dõi tháng 11–12/2026<\/td><\/tr><tr><td>5<\/td><td><b>TBA 220 kV Móng Cái (NPMB, 250 MVA, chừa vị trí MBA2)<\/b> – đang thi công, có hệ điều khiển–bảo vệ–SCADA đồng bộ<\/td><td>TBA biên giới, sẽ vận hành không người trực → phù hợp gói giám sát online + DT nhẹ cho PTC1<\/td><td>Đề xuất với PTC1/NPMB bổ sung giám sát DGA/bushing cho MBA mới trong giai đoạn nghiệm thu<\/td><td>Hoàn thành Q2/2027<\/td><\/tr><tr><td>6<\/td><td><b>BESS thương mại–công nghiệp (GG Power, VinEnergo)<\/b> – vướng cơ chế doanh thu nhưng đang triển khai (GG Power nhà máy 5 GWh; VinEnergo đóng điện solar+BESS Vũng Áng 28/10)<\/td><td>Cần EMS, giám sát cell/nhiệt, tích hợp SCADA → phần mềm VTI<\/td><td>Đặt lịch làm việc với GG Power về hợp tác phần mềm giám sát/EMS<\/td><td>Chủ động Q4/2026<\/td><\/tr><\/table>\n<p><i>Nhận xét: hôm nay không có HSMT mới trực tiếp cho giám sát online; các cơ hội chủ yếu là pipeline dự án TBA 220 kV.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>10 tháng 2026 (EVN, 03/11):<\/b> sản lượng hệ thống 297,4 tỷ kWh (+9,8%); khởi công 150 và đóng điện 137 công trình 110–500 kV (5×500 kV, 16×220 kV, 116×110 kV), trong đó có MBA AT1 500 kV–900 MVA TBA 500 kV Di Linh.<\/li><li><b>Đóng điện ĐZ 220 kV đấu nối TBA 220 kV Bạc Liêu (03/11):<\/b> ~4,37 km mạch kép, mở rộng ngăn lộ, &gt;107 tỷ; EVNNPT/SPMB, PTC4 vận hành.<\/li><li><b>TBA 220 kV Vũng Áng 2 (04/11):<\/b> Hà Tĩnh chấp thuận VinEnergo làm nhà đầu tư – một trong số ít TBA 220 kV do tư nhân đầu tư theo cơ chế mới.<\/li><li><b>TBA 220 kV Móng Cái:<\/b> thi công từ 27/9, 270 ngày, TMĐT ~483 tỷ, gói xây lắp 130,5 tỷ (Công nghệ Việt – Sao Vàng).<\/li><li><b>BESS (Mekong ASEAN, 29/10):<\/b> rào cản lớn nhất là cơ chế ghi nhận và thanh toán doanh thu, chưa có giá riêng cho điện xả từ BESS; hoàn vốn C&amp;I ~4,5–6 năm nhờ chênh lệch giá cao/thấp điểm ~2.000 đ/kWh.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>Phú Mỹ 3 (EVNHCMC, 06/11):<\/b> Gói 1 xây dựng + vật tư thiết bị đấu nối TBA 220 kV Phú Mỹ 3 – Năng lượng Tam Sơn trúng 67,67 tỷ (giảm ~5%), 180 ngày.<\/li><li><b>Phước Đông (EVNNPT, 03/11):<\/b> Gói 12 xây lắp trạm (gồm PCCC), giá gói 121,996 tỷ → trúng 111,155 tỷ (PC1 Miền Nam – PC1 Thăng Long); 3 HSDT.<\/li><li><b>EVNNPT 8 dự án ~200,9 triệu EUR:<\/b> hạn nộp đề xuất 8h30 ngày 27/11/2026 (Ban Tài chính – Kế toán EVNNPT). Lưu ý: tổng các khoản báo nêu (~190,9 triệu EUR) lệch với con số tổng 200,9 triệu – cần đối chiếu văn bản gốc.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>T&amp;D World:<\/b> bài hướng dẫn ưu tiên giám sát MBA khi tải data center tăng nhanh – lập luận tương tự cho KCN/data center tại VN.<\/li><li><b>Transformer Technology (09/11):<\/b> báo cáo khoảng trống lớn về bảo vệ MBA tại các TBA Ukraine – nhấn mạnh nhu cầu giám sát/bảo vệ MBA trong điều kiện thiếu thiết bị thay thế.<\/li><li><b>SolidUltra gọi vốn 3,3 triệu USD (09/11)<\/b> cho MBA phục vụ AI data center; <b>Bitzero nhận 2 MBA 60 MVA (10/11)<\/b> cho data center tại Na Uy.<\/li><li><b>KONČAR (06/11)<\/b> thắng hợp đồng MBA tại Hà Lan – nhà sản xuất châu Âu tiếp tục hưởng lợi từ thiếu hụt MBA.<\/li><li><b>ComEd (03/11)<\/b> triển khai dự án truyền tải GRIT – xu hướng đầu tư lưới Mỹ tiếp tục tăng.<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer/Substation DT)<\/h2>\n<ul><li><b>arXiv 2601.03673 (Mondragon/EHU, Aizpurua):<\/b> Bayesian PINN dị phương sai tách bất định aleatoric/epistemic cho ước lượng nhiệt độ dầu, hot‑spot và lão hóa cách điện; RMSE giảm 57% so với PINN thường → gợi ý thêm dải tin cậy cho mô hình IEC 60076‑7 của Công cụ.<\/li><li><b>CIGRE A2‑10385 (IntellPower/Powercor, Úc):<\/b> DT quản lý độ ẩm MBA khép kín từ cảm biến đến thiết bị sấy sàng phân tử, có \"Moisture Cloud\" và vẫn ước lượng khi một kênh cảm biến hỏng.<\/li><li><b>CIGRE A2‑11489 (HD Hyundai Electric):<\/b> DT chẩn đoán PD trong MBA dùng dữ liệu thiết kế 3D mô phỏng lan truyền UHF; tối ưu vị trí cảm biến, định vị chỉ với 3 cảm biến (độ chính xác +20%). Cả hai bài 30 € → đề xuất mua cho library.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu – Tam Sơn trúng gói đấu nối TBA 220 kV Phú Mỹ 3 – <a href=\"https://baodauthau.vn/nang-luong-tam-son-trung-goi-thau-67-ty-dong-dau-noi-tram-bien-ap-220kv-phu-my-3-post212015.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/nang-luong-tam-son-trung-goi-thau-67-ty-dong-dau-noi-tram-bien-ap-220kv-phu-my-3-post212015.html<\/a><\/li><li>Báo Đấu thầu – PC1 Miền Nam – Thăng Long trúng gói xây lắp TBA 111 tỷ – <a href=\"https://baodauthau.vn/lien-danh-pc1-mien-nam-thang-long-trung-goi-thau-xay-lap-tram-bien-ap-111-ty-dong-post211666.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/lien-danh-pc1-mien-nam-thang-long-trung-goi-thau-xay-lap-tram-bien-ap-111-ty-dong-post211666.html<\/a><\/li><li>Báo Đấu thầu – Đóng điện ĐZ 220 kV đấu nối TBA Bạc Liêu – <a href=\"https://baodauthau.vn/dong-dien-cac-mach-duong-day-220kv-dau-noi-tba-220kv-bac-lieu-hon-107-ty-dong-post211714.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/dong-dien-cac-mach-duong-day-220kv-dau-noi-tba-220kv-bac-lieu-hon-107-ty-dong-post211714.html<\/a><\/li><li>Báo Đấu thầu – Thi công TBA 220 kV Móng Cái – <a href=\"https://baodauthau.vn/trien-khai-thi-cong-tram-bien-ap-220kv-mong-cai-gan-483-ty-dong-post208291.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/trien-khai-thi-cong-tram-bien-ap-220kv-mong-cai-gan-483-ty-dong-post208291.html<\/a><\/li><li>Vietnam+ – Sản lượng điện 10 tháng tăng 9,8% – <a href=\"https://www.vietnamplus.vn/san-luong-dien-10-thang-tang-98-evn-tap-trung-bao-dam-nguon-cung-cuoi-nam-post1145791.vnp\" target=\"_blank\" rel=\"noopener\">https://www.vietnamplus.vn/san-luong-dien-10-thang-tang-98-evn-tap-trung-bao-dam-nguon-cung-cuoi-nam-post1145791.vnp<\/a><\/li><li>Viet Nam News – EVNNPT seeks over $224 mln in bank loans – <a href=\"https://vietnamnews.vn/economy/1801912/evnnpt-seeks-over-224-mln-in-bank-loans-for-grid-expansion.html\" target=\"_blank\" rel=\"noopener\">https://vietnamnews.vn/economy/1801912/evnnpt-seeks-over-224-mln-in-bank-loans-for-grid-expansion.html<\/a><\/li><li>Cổng TTĐT Hà Tĩnh – TBA 220 kV Vũng Áng 2 – <a href=\"https://hatinh.gov.vn/bai-viet/ha-tinh-chap-thuan-nha-dau-tu-du-an-tram-bien-ap-220-kv-vung-ang-2-va-duong-day-dau-noi\" target=\"_blank\" rel=\"noopener\">https://hatinh.gov.vn/bai-viet/ha-tinh-chap-thuan-nha-dau-tu-du-an-tram-bien-ap-220-kv-vung-ang-2-va-duong-day-dau-noi<\/a><\/li><li>Mekong ASEAN – Bài toán dòng tiền của thị trường BESS – <a href=\"https://mekongasean.vn/bai-toan-dong-tien-cua-thi-truong-bess-61214.html\" target=\"_blank\" rel=\"noopener\">https://mekongasean.vn/bai-toan-dong-tien-cua-thi-truong-bess-61214.html<\/a><\/li><li>T&amp;D World – Substations – <a href=\"https://www.tdworld.com/substations\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/substations<\/a><\/li><li>Transformer Technology – Latest News – <a href=\"https://transformer-technology.com/\" target=\"_blank\" rel=\"noopener\">https://transformer-technology.com/<\/a><\/li><li>arXiv 2601.03673 – <a href=\"https://arxiv.org/pdf/2601.03673\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/pdf/2601.03673<\/a><\/li><li>CIGRE A2‑10385 – <a href=\"https://www.e-cigre.org/publications/detail/a2-10385-2026-digital-twin-for-transformer-moisture-management-closing-the-loop-from-sensing-to-action.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-10385-2026-digital-twin-for-transformer-moisture-management-closing-the-loop-from-sensing-to-action.html<\/a><\/li><li>CIGRE A2‑11489 – <a href=\"https://www.e-cigre.org/publications/detail/a2-11489-2026-development-of-a-digital-twin-based-transformer-partial-discharge-diagnostic-system.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11489-2026-development-of-a-digital-twin-based-transformer-partial-discharge-diagnostic-system.html<\/a><\/li><\/ul>"}, {"day": "2026-11-10", "title": "Bản tin năng lượng & Cơ hội VTI – 10/11/2026", "html": "<blockquote>Tổng hợp từ báo chí công khai (Báo Đấu thầu, Tạp chí Công Thương, EVN/EVNNPT, T&amp;D World, Transformers Magazine, CIGRE, IEEE PES). Số liệu ghi theo nguồn; cần kiểm tra lại trên HSMT/muasamcong trước khi ra quyết định dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVNNPT gọi vốn 5 dự án truyền tải (1.495 tỷ TMĐT, vay 1.119 tỷ)<\/b>: tụ bù ngang 110 kV miền Bắc (458 tỷ); TBA 220 kV Bắc Tân Uyên (610 tỷ); lắp MBA 110 kV‑63 MVA tại TBA 220 kV Chèm (133 tỷ); nâng công suất TBA 220 kV Yên Bái (130 tỷ); ĐZ 220 kV Đông Hà–Huế mạch 3 (164 tỷ)<\/td><td>MBA mới / nâng công suất → gói thiết bị có <b>online monitoring (DGA, bushing, nhiệt)<\/b>, SCADA/HMI, thí nghiệm hiệu chỉnh<\/td><td>Theo dõi KHLCNT trên muasamcong cho 3 dự án TBA; chuẩn bị hồ sơ năng lực monitoring + DT pilot cho MBA mới<\/td><td>Hạn ngân hàng nộp đề xuất 17/11/2026 → KHLCNT dự kiến sau đó<\/td><\/tr><tr><td>2<\/td><td><b>EVNNPT: 8 dự án truyền tải ~200,9 triệu EUR<\/b> (thu xếp vốn, hạn 27/11/2026)<\/td><td>Quy mô lớn, nhiều TBA 220/500 kV mới<\/td><td>Lấy danh mục 8 dự án, lọc dự án có TBA → lập pipeline<\/td><td>27/11/2026<\/td><\/tr><tr><td>3<\/td><td><b>Lộ trình EVNNPT: giám sát trực tuyến MBA theo mức độ quan trọng + chuyển sang TBA số<\/b><\/td><td>Đúng trọng tâm Transformer DT / Substation DT 110–220 kV<\/td><td>Đề xuất PoC \"Transformer DT mức Diagnostic→Predictive (CIGRE TB 995)\" cho 1 Công ty Truyền tải (PTC1/PTC2)<\/td><td>Chủ động tiếp cận Q4/2026<\/td><\/tr><tr><td>4<\/td><td><b>BESS lưới phân phối<\/b>: EVNNPC phấn đấu 805 MW; giai đoạn 2 tổng mức &gt;1.300 tỷ, 6 gói ~1.000 tỷ đang đánh giá HSDT; Ban QLDA điện 2 (550 MW) &amp; GENCO3 (300 MW) đang làm thủ tục<\/td><td>Cần EMS/giám sát pin, tích hợp SCADA, cảnh báo cháy/nhiệt – mảng phần mềm VTI làm được<\/td><td>Liên hệ các nhà thầu trúng BESS (Á Châu, VNAS…) để làm thầu phụ phần mềm giám sát/EMS<\/td><td>Liên tục<\/td><\/tr><tr><td>5<\/td><td><b>TBA 220 kV Chân Mây (Huế)<\/b> phấn đấu đóng điện 11/2026, phần trạm đạt ~95%, đang thí nghiệm hiệu chỉnh<\/td><td>Cơ hội dịch vụ thí nghiệm/commissioning, tích hợp hệ thống điều khiển máy tính<\/td><td>Liên hệ PTC2 / nhà thầu EPC<\/td><td>11/2026<\/td><\/tr><tr><td>6<\/td><td><b>Điện lực tỉnh chuyển TBA 110 kV không người trực<\/b> (Bắc Ninh 50/51 trạm; EVNSPC 100% + AI giám sát)<\/td><td>Dữ liệu SCADA sẵn → bài toán đánh giá tình trạng thiết bị, xếp hạng rủi ro (asset health index)<\/td><td>Chào giải pháp \"Health Index + DT nhẹ\" dùng dữ liệu SCADA sẵn có<\/td><td>Q4/2026–2027<\/td><\/tr><\/table>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN đốc thúc tiến độ (04/11/2026):<\/b> Quảng Trạch I phấn đấu phát điện thương mại cả 2 tổ máy trong 2026; LNG Quảng Trạch II hoàn thiện TKKT trình EVN Q4/2026; Quảng Trạch III phê duyệt FS Q4/2026; ĐZ 220 kV Nhơn Trạch 3 – TBA 500 kV Long Thành đóng điện toàn tuyến cuối 2026. Sản lượng tháng 11/2026 ước 28,9 tỷ kWh (+14,4%).<\/li><li><b>9 tháng 2026:<\/b> EVN khởi công 136 công trình (2×500 kV, 18×220 kV, 116×110 kV), đóng điện 131 công trình; BESS: EVNHANOI 50 MW, EVNNPC 155 MW.<\/li><li><b>Kế hoạch 2026–2030 của EVN/EVNNPT:<\/b> 292 công trình truyền tải (78×500 kV, 214×220 kV), ~16.665 km đường dây, &gt;91.263 MVA MBA → thị trường monitoring MBA rất lớn.<\/li><li><b>Chuyển đổi số EVNNPT:<\/b> chuyển TBA 220 kV sang không người trực, lắp giám sát DGA online; IMIS 2.0, nhật ký điện tử; TBA 220 kV Thủy Nguyên là TBA số đầu tiên.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>GE Vernova mua Trench Group (~9 tỷ USD, 28/10/2026)<\/b> – Trench sản xuất bushing/thiết bị đo lường cao áp; ảnh hưởng chuỗi cung ứng bushing &amp; cảm biến.<\/li><li><b>Hitachi Energy khởi công nhà máy MBA lực 457 triệu USD tại South Boston, Virginia<\/b> – thiếu hụt MBA lực toàn cầu tiếp tục, kéo dài lead time → tăng giá trị của giám sát/kéo dài tuổi thọ MBA hiện hữu.<\/li><li><b>National Grid (UK)<\/b> nâng cấp TBA 400 kV Imperial Park – bổ sung MBA để tăng kết nối.<\/li><li><b>T&amp;D World:<\/b> \"procurement-cycle delay\" được xem là rủi ro độ tin cậy lớn của lưới (28/10/2026).<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer DT)<\/h2>\n<ul><li><b>IEEE PES GM 2026 – Univ. of Queensland:<\/b> PINN cho mô hình nhiệt MBA (dự báo TOT → HST) hướng tới digital twin. → Đối chiếu với mô hình IEC 60076‑7 đang có trong Công cụ.<\/li><li><b>CIGRE A2‑11862 (Paris 2026, Canada):<\/b> \"Development of Digital Twin Technologies for Power Transformers – multi‑disciplinary initiative at a large utility\" (DGA cho phần tác dụng, sứ, OLTC). Giá 30 € → đề xuất mua đưa vào library.<\/li><li><b>Transformer Magazine Vol.13 Issue 1 (2026):<\/b> mô hình thermal‑hydraulic network động chi tiết cho MBA dầu (Radaković et al.).<\/li><li><b>J. Xi'an Jiaotong Univ. 2026:<\/b> PI‑DeepONet tính nhanh trường nhiệt‑dòng chảy cuộn dây cho DT.<\/li><li><b>Measurement 286 (2026):<\/b> dự báo khí hòa tan bằng Mamba tự giám sát + ràng buộc vật lý, dữ liệu 13 MBA (316k bản ghi).<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu: EVNNPT mời ngân hàng thu xếp 1.119 tỷ (05/11/2026) – <a href=\"https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html<\/a><\/li><li>Báo Đấu thầu: EVN đốc thúc nhà thầu (04/11/2026) – <a href=\"https://baodauthau.vn/evn-doc-thuc-nha-thau-tang-toc-thi-cong-cac-du-an-nguon-va-luoi-dien-post211722.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evn-doc-thuc-nha-thau-tang-toc-thi-cong-cac-du-an-nguon-va-luoi-dien-post211722.html<\/a><\/li><li>Báo Đấu thầu: 8 dự án 200 triệu EUR – <a href=\"https://baodauthau.vn/evnnpt-can-thu-xep-hon-200-trieu-eur-cho-8-du-an-truyen-tai-dien-post209398.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-can-thu-xep-hon-200-trieu-eur-cho-8-du-an-truyen-tai-dien-post209398.html<\/a><\/li><li>Báo Đấu thầu: 9 tháng 2026 EVN – <a href=\"https://baoda
