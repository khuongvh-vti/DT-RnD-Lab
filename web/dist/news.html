u-tu-5-du-an-truyen-tai-dien-post211884.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html<\/a><\/li><li>Tạp chí Công Thương – EVNSPC hướng tới doanh nghiệp số thông minh – <a href=\"https://tapchicongthuong.vn/thuc-hien-nghi-quyet-so-57-nq-tw--evnspc-huong-toi-doanh-nghiep-so-thong-minh-558214.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/thuc-hien-nghi-quyet-so-57-nq-tw--evnspc-huong-toi-doanh-nghiep-so-thong-minh-558214.htm<\/a><\/li><li>T&amp;D World – Doble Engineering, Megger Complete Merger Under ESCO Technologies – <a href=\"https://www.tdworld.com/test-and-measurement/news/55409547/doble-engineering-megger-complete-merger-under-esco-technologies\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/test-and-measurement/news/55409547/doble-engineering-megger-complete-merger-under-esco-technologies<\/a><\/li><li>T&amp;D World – Test and Measurement (danh sách bài, G&amp;W Electric 05/11) – <a href=\"https://www.tdworld.com/test-and-measurement\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/test-and-measurement<\/a><\/li><li>T&amp;D India – Sterlumiq and AP Sensing partner – <a href=\"https://www.tndindia.com/sterlumiq-and-ap-sensing-partner-to-advance-intelligent-monitoring-of-power-cable-networks/amp/\" target=\"_blank\" rel=\"noopener\">https://www.tndindia.com/sterlumiq-and-ap-sensing-partner-to-advance-intelligent-monitoring-of-power-cable-networks/amp/<\/a><\/li><li>e‑CIGRE – B1‑12634 Indirect fault location in cable lines using DTS – <a href=\"https://www.e-cigre.org/publications/detail/b1-12634-2026-indirect-fault-location-in-cable-lines-using-distributed-temperature-sensing.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/b1-12634-2026-indirect-fault-location-in-cable-lines-using-distributed-temperature-sensing.html<\/a><\/li><li>e‑CIGRE – A2‑10255 Predictive analysis using ML modelling of digital twin of a power transformer – <a href=\"https://www.e-cigre.org/publications/detail/a2-10255-2026-predictive-analysis-using-machine-learning-modelling-of-digital-twin-of-a-power-transformer.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-10255-2026-predictive-analysis-using-machine-learning-modelling-of-digital-twin-of-a-power-transformer.html<\/a><\/li><\/ul>"}, {"day": "2026-11-18", "title": "Bản tin năng lượng & Cơ hội VTI – 18/11/2026", "html": "<blockquote>Tổng hợp từ Bộ Công Thương, Báo Đấu thầu, Fortune/The Conversation, MarketScale, e‑CIGRE; sáng thứ Tư vẫn ít tin Việt Nam đăng trong 24–72 giờ nên có tin 5–11 ngày tuổi nhưng chưa đưa (ghi rõ ngày đăng); tin đã đưa 10–17/11 không lặp lại. Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>Bộ Công Thương yêu cầu đưa công nghệ Digital Twin vào vận hành chậm nhất quý I/2027<\/b> trong hội nghị cung ứng điện 2027–2028 (Bộ trưởng Lê Mạnh Hùng chủ trì, 07/11) – tín hiệu chính sách trực tiếp cho Transformer/Substation DT.<\/li><li><b>TBA 500 kV Bắc Ninh – Lô 9.3 \"hệ thống giám sát dầu online\" đã có chủ:<\/b> ENSO trúng 7,363 tỷ đồng (phê duyệt 05/08/2026) – là gói giám sát online MBA 500 kV thật, đối thủ/đối tác cần nắm.<\/li><li>Tiến độ TBA 500 kV Bắc Ninh có thể <b>lùi sang quý III/2027<\/b> do chọn thầu thiết bị kéo dài (Chủ tịch HĐTV EVNNPT, Báo Đấu thầu 11/11).<\/li><li>Gói 10 (thiết bị nhị thứ + thông tin) của TBA 500 kV Bắc Ninh: Công ty CP Hệ thống kỹ thuật ứng dụng trúng <b>98,393 tỷ<\/b> (Báo Đấu thầu, 13/11).<\/li><li>Mỹ vẫn thiếu MBA: Fortune/The Conversation (04/11) nêu thời gian giao MBA lực &gt;3 năm – lập luận kéo dài tuổi thọ MBA bằng monitoring.<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>Chỉ đạo Digital Twin vận hành chậm nhất Q1/2027<\/b> (Bộ Công Thương, 07/11)<\/td><td>Đây là mệnh lệnh chính sách đầu tiên em thấy nêu thẳng \"Digital Twin\" trong bối cảnh vận hành hệ thống điện; EVN/NSMO/EVNNPT sẽ phải có đề án và nhà cung cấp; Transformer DT/Substation DT của VTI đúng chủ đề<\/td><td>Đọc bản gốc kết luận hội nghị (nếu có trên moit.gov.vn); xác định phạm vi \"Digital Twin\" (hệ thống điện hay thiết bị); soạn 2 trang giới thiệu Transformer DT/Substation DT 110–220 kV gửi EVNNPT, NSMO, EVN ICT<\/td><td>Cao<\/td><td>Q1/2027<\/td><\/tr><tr><td>2<\/td><td><b>TBA 500 kV Bắc Ninh – Lô 9.3 giám sát dầu online (ENSO, 7,363 tỷ)<\/b> và Lô 9.1 MBA (TOJI liên danh, ~12,29 triệu USD + 15,35 tỷ đồng)<\/td><td>Mẫu giá thực tế cho gói online DGA/giám sát dầu 500 kV (~7,4 tỷ); nhà thầu đã có hợp đồng nên là đầu mối thầu phụ/tích hợp DT<\/td><td>Liên hệ ENSO/nhà cung cấp MBA để đề xuất lớp Transformer DT/Asset Health chạy trên dữ liệu DGA online; ghi nhận mức giá để định giá chào<\/td><td>Cao<\/td><td>Vận hành 2027 (có thể Q3/2027)<\/td><\/tr><tr><td>3<\/td><td><b>Chuỗi BESS EVNNPC &amp; BESS lưới (EVN mục tiêu 805 MW)<\/b> (nhắc lại có diễn biến: MOIT 07/11 nêu BESS phát triển theo quy mô và khung giá xác định)<\/td><td>Gói \"BESS + MBA 110 kV health\"<\/td><td>Tiếp tục kế hoạch đã nêu 17/11 (white paper, làm quen nhà tích hợp)<\/td><td>TB<\/td><td>GĐ2/GĐ3 2026–2027<\/td><\/tr><tr><td>4<\/td><td><b>EVNNPT gọi vốn 8 dự án ~200,9 triệu EUR<\/b> (nhắc lại)<\/td><td>Chốt vốn là bước trước KHLCNT thiết bị 2027<\/td><td>Theo dõi kết quả chọn ngân hàng; cập nhật datasheet DGA/bushing/nhiệt<\/td><td>TB<\/td><td><b>27/11/2026<\/b><\/td><\/tr><tr><td>5<\/td><td><b>Mua sắm theo yêu cầu \"đẩy nhanh TBA 500 kV cấp điện miền Bắc\"<\/b> (MOIT, 07/11)<\/td><td>Nhiều TBA 500 kV miền Bắc sẽ vào giai đoạn mua sắm thiết bị; cơ hội đưa online monitoring/DT vào YCKT<\/td><td>Lập danh sách TBA 500 kV miền Bắc đang chuẩn bị (Bắc Ninh, Nam Định, Điện Biên…) và đầu mối NPMB<\/td><td>TB<\/td><td>Q4/2026–2027<\/td><\/tr><\/table>\n<p><i>Nhận xét: #1 là tin chính sách có giá trị định vị nhất tuần; #2 cung cấp số liệu giá tham chiếu. Chưa thấy HSMT mới trực tiếp về giám sát online trong 72 giờ qua.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>Hội nghị cung ứng điện 2027–2028 (Bộ Công Thương, 07/11):<\/b> sản lượng + nhập khẩu 2026 ~356,2 tỷ kWh (+10,3%), phụ tải đỉnh 57.537 MW (06/2026); thủy điện 2026 thấp hơn 2025 khoảng 18,5 tỷ kWh do El Niño; 2027 nhu cầu dự kiến +~10%, 2028 khó khăn hơn; mục tiêu cắt giảm ≥~3.000 MW phụ tải đỉnh miền Bắc 2027; Quảng Trạch I (nhiệt điện) đang chạy thử, vận hành thương mại cuối 2026; hồ thủy điện tích nước đến hết 31/3/2027; đẩy nhanh TBA 500 kV cấp điện miền Bắc, đồng bộ nguồn – lưới.<\/li><li><b>TBA 500 kV Bắc Ninh (Báo Đấu thầu, 11/11):<\/b> tổng vốn 1.409,4 tỷ; EVNNPT là chủ đầu tư, tiến độ vận hành 2027 có thể lùi sang Q3/2027 vì chọn nhà thầu thiết bị kéo dài.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>TBA 500 kV Bắc Ninh – Gói 9 (Báo Đấu thầu, 11/11):<\/b> gói &gt;600 tỷ; Lô 9.1 (MBA) – liên danh TOJI trúng 12.290.850 USD + 15.351.201.000 đồng (phê duyệt 19/08); Lô 9.3 (giám sát dầu online) – ENSO trúng 7,363 tỷ (05/08); Lô 9.2 đã đưa ngày 14/11.<\/li><li><b>TBA 500 kV Bắc Ninh – Gói 10 nhị thứ &amp; thông tin (Báo Đấu thầu, 13/11):<\/b> Công ty CP Hệ thống kỹ thuật ứng dụng trúng 98,393 tỷ, là nhà thầu duy nhất chào dưới dự toán (bài không nêu giá gói); thông tin bảo vệ/điều khiển/đo lường là lớp tích hợp dữ liệu cho SCADA/IEC 61850.<\/li><li><b>EVNNPT mời thu xếp vốn:<\/b> 8 dự án ~200,9 triệu EUR – hạn <b>27/11/2026<\/b> (nhắc lại; hạn 17/11 đã qua).<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li><b>Hitachi Energy mở rộng danh mục digitalization (MarketScale, 12/07/2026):<\/b> TXpert Ecosystem cho MBA số, giám sát số thiết bị đóng cắt/MBA, nền tảng IoT Energy Connect, Lumada Asset and Work Management, dịch vụ RelCare và 5G công nghiệp; bài không nêu thời điểm ra mắt từng sản phẩm. Cho thấy hãng đóng gói monitoring + asset management + dịch vụ theo thuê bao – cần chuẩn bị mô hình chào tương tự.<\/li><li><b>Tín hiệu thị trường nội địa:<\/b> giá lô giám sát dầu online 500 kV ~7,4 tỷ (ENSO) là tham chiếu giá cho các đối thủ cạnh tranh tại Việt Nam.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>Thiếu MBA tại Mỹ (Fortune/The Conversation, 04/11):<\/b> MBA lực nặng ~400 tấn, nhiều thiết bị đã quá tuổi thiết kế, giao hàng &gt;3 năm; thép điện hạt định hướng chỉ có 1 nhà máy tại Mỹ; kết nối nhà máy điện mới chờ &gt;2 năm; công nghệ tăng cường lưới (grid-enhancing) có thể tăng 15–20% khả năng truyền tải (DOE). Ý nghĩa: kéo dài tuổi thọ MBA vận hành bằng monitoring và DT có giá trị kinh tế rõ.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li><b>CIGRE A2‑10207 (POWERGRID, Ấn Độ, 2026) – \"Digital Mirror\" cho MBA và kháng shunt:<\/b> kết hợp mô hình vật lý (điểm nóng, lão hóa cách điện, đường cong bathtub) với ML phát hiện bất thường, chia module Health/Ageing/Thermal/Failure Probability/Impact và tính Risk Index = PoF × Impact; abstract nêu độ sẵn sàng dự kiến tăng 99,80% → 99,91% và giảm 25% thời gian ngừng can thiệp (số liệu triển khai ban đầu). Ý nghĩa: khung ưu tiên bảo trì theo rủi ro có thể dùng làm mẫu cho báo cáo Asset Health gửi EVNNPT.<\/li><li><b>CIGRE B3‑12207 (HMV, Colombia, 2026) – DT tối ưu vận hành TBA cao áp:<\/b> mô hình số có cấu trúc nối SCADA, dữ liệu lịch sử và mô phỏng; thử trên biến thiên phụ tải, điều kiện nhiệt và thao tác thiết bị; hạn chế chính là tính sẵn có và độ tin cậy dữ liệu nên triển khai theo giai đoạn. Ý nghĩa: nhắc kỹ sư làm sạch/đánh giá chất lượng dữ liệu SCADA trước khi hứa hẹn DT cho Substation 110–220 kV.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Chưa tìm thấy tin Việt Nam đăng 17–18/11; hầu hết nguồn là 5–11 ngày tuổi.<\/li><li>Chưa mở được muasamcong.mpi.gov.vn nên không xác nhận được KHLCNT/HSMT mới; chưa có kết quả chọn ngân hàng của EVNNPT.<\/li><li>Nội dung Digital Twin của MOIT (07/11) chỉ là một dòng trong bản tin hội nghị; chưa rõ phạm vi (hệ thống điều độ hay thiết bị) và đơn vị được giao.<\/li><li>Số liệu hiệu quả CIGRE A2‑10207 là từ abstract (kết quả ban đầu); chưa đọc toàn văn. Tìm kiếm quốc tế 24–72 giờ chưa trả về bài mới kiểm chứng được ngoài Fortune (04/11).<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Bộ Công Thương – MOIT holds conference on power system operation and electricity supply for 2027–2028 – <a href=\"https://moit.gov.vn/en/news/moit-holds-conference-on-power-system-operation-and-electricity-supply-for-2027-2028.html\" target=\"_blank\" rel=\"noopener\">https://moit.gov.vn/en/news/moit-holds-conference-on-power-system-operation-and-electricity-supply-for-2027-2028.html<\/a><\/li><li>Báo Đấu thầu – Gói thầu 600 tỷ TBA 500kV Bắc Ninh – <a href=\"https://baodauthau.vn/goi-thau-600-ty-dong-thuoc-du-an-tram-bien-ap-500kv-bac-ninh-go-nut-that-chao-vuot-gia-hoan-tat-chon-nha-thau-post212385.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/goi-thau-600-ty-dong-thuoc-du-an-tram-bien-ap-500kv-bac-ninh-go-nut-that-chao-vuot-gia-hoan-tat-chon-nha-thau-post212385.html<\/a><\/li><li>Báo Đấu thầu – Công ty Hệ thống kỹ thuật ứng dụng trúng gói thầu 98 tỷ – <a href=\"https://baodauthau.vn/cong-ty-he-thong-ky-thuat-ung-dung-trung-goi-thau-vat-tu-thiet-bi-dien-98-ty-dong-post212696.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/cong-ty-he-thong-ky-thuat-ung-dung-trung-goi-thau-vat-tu-thiet-bi-dien-98-ty-dong-post212696.html<\/a><\/li><li>Fortune/The Conversation – Power transformer shortage – <a href=\"https://fortune.com/2026/11/04/power-transformer-shortage-grid-400-ton-electrical-steel-one-us-mill/\" target=\"_blank\" rel=\"noopener\">https://fortune.com/2026/11/04/power-transformer-shortage-grid-400-ton-electrical-steel-one-us-mill/<\/a><\/li><li>MarketScale – Hitachi Energy expands digitalization portfolio – <a href=\"https://www.marketscale.com/industries/energy/hitachi-energy-expands-digitalization-portfolio-to-manage-ai-driven-grid-complexity\" target=\"_blank\" rel=\"noopener\">https://www.marketscale.com/industries/energy/hitachi-energy-expands-digitalization-portfolio-to-manage-ai-driven-grid-complexity<\/a><\/li><li>e‑CIGRE – A2‑10207 Digital Mirror for power transformers and reactors – <a href=\"https://www.e-cigre.org/publications/detail/a2-10207-2026-development-of-a-digital-mirror-for-power-transformers-and-reactors.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-10207-2026-development-of-a-digital-mirror-for-power-transformers-and-reactors.html<\/a><\/li><li>e‑CIGRE – B3‑12207 Digital twin for operational optimization of HV substations – <a href=\"https://www.e-cigre.org/publications/detail/b3-12207-2026-digital-twin-for-operational-optimization-of-high-voltage-electrical-substations.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/b3-12207-2026-digital-twin-for-operational-optimization-of-high-voltage-electrical-substations.html<\/a><\/li><\/ul>"}, {"day": "2026-11-17", "title": "Bản tin năng lượng & Cơ hội VTI – 17/11/2026", "html": "<blockquote>Tổng hợp từ EVN, Báo Đầu tư, Báo Đấu thầu, Tạp chí Công Thương, T&amp;D World, EEPower, e‑CIGRE, arXiv, IEC webstore; sáng thứ Ba ít tin mới trong 24–72 giờ nên nhiều mục là tin cũ hơn nhưng chưa đưa (ghi rõ ngày đăng); tin đã đưa 10–16/11 chỉ nhắc lại khi có mốc hạn. Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>Hôm nay (17/11) là hạn<\/b> EVNNPT mời ngân hàng thu xếp vốn 5 dự án 1.119 tỷ; hạn tiếp theo 27/11 cho 8 dự án ~200,9 triệu EUR.<\/li><li>EVN đặt mục tiêu <b>mở rộng BESS lưới phân phối lên tổng 805 MW<\/b> trong tháng 11 và 137 công trình truyền tải 110–500 kV đã đóng điện sau 10 tháng (EVN, 03/11).<\/li><li>Hai TBA 220 kV <b>Yên Dũng (2×250 MVA, Bắc Ninh)<\/b> và <b>Chân Mây (1×125 MVA, Huế)<\/b> cùng nhắm đóng điện trong tháng 11/2026 – cơ hội có reference \"MBA mới + giám sát\" ngay đầu vận hành.<\/li><li>EVNNPC mở 6 gói BESS GĐ2 (~867 tỷ, 22/07) – nhóm nhà thầu dự thầu toàn thiết bị Trung Quốc/ liên danh nội địa, cho thấy ai sẽ là đối tác tích hợp ở các trạm 110 kV.<\/li><li><b>IEC 60076‑4:2026<\/b> (thử nghiệm xung sét/xung đóng cắt MBA và kháng điện, Edition 2) đã phát hành tháng 7/2026 – ảnh hưởng quy trình thí nghiệm xuất xưởng/nghiệm thu.<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVNNPT gọi vốn 5 dự án 1.119 tỷ + 8 dự án ~200,9 triệu EUR<\/b> (nhắc lại)<\/td><td>Chốt vốn là bước trước KHLCNT MBA/thiết bị 2027<\/td><td>Theo dõi kết quả chọn ngân hàng; đặt cảnh báo muasamcong theo tên dự án; hoàn thiện datasheet DGA/bushing/nhiệt \"EVNNPT‑ready\"<\/td><td>Cao<\/td><td><b>17/11/2026 (hôm nay)<\/b>; 27/11/2026<\/td><\/tr><tr><td>2<\/td><td><b>BESS lưới phân phối: EVN nhắm 805 MW<\/b> (EVN 03/11); EVNNPC 305 MW (GĐ1) mục tiêu tháng 10; Ban QLDA Điện 2 (550 MW) và EVNGENCO3 (300 MW) đang theo đuổi BESS miền Bắc (Báo Đấu thầu, 06/10)<\/td><td>Mỗi trạm BESS cần giám sát pin/PCS/làm mát và MBA 110 kV chịu chu kỳ nạp–xả → gói \"BESS + MBA health\" tích hợp SCADA, cộng hưởng chủ đề tiêu chuẩn an toàn BESS (bản tin 15/11)<\/td><td>Soạn white paper \"BESS + MBA monitoring\" gửi EVNNPC, Ban QLDA Điện 2, EVNGENCO3; làm quen các nhà tích hợp trúng thầu GĐ2 (Chint, CYG Sunri, Á Châu…) để làm thầu phụ giám sát<\/td><td>Cao<\/td><td>GĐ2 đang đánh giá HSDT; GĐ3 2026–2027<\/td><\/tr><tr><td>3<\/td><td><b>TBA 220 kV Yên Dũng (2×250 MVA) &amp; Chân Mây (125 MVA)<\/b> – đóng điện tháng 11/2026<\/td><td>MBA mới vào vận hành = thời điểm lý tưởng lắp thêm online monitoring (retrofit) hoặc làm baseline DGA/nhiệt cho Transformer DT; vướng mắc tiến độ cho thấy chủ đầu tư ưu tiên đóng điện hơn là bổ sung hạng mục<\/td><td>Liên hệ NPMB/PTC qua kênh kỹ thuật: đề xuất gói giám sát nhiệt/DGA nhỏ cho MBA mới; xin dữ liệu thí nghiệm xuất xưởng làm baseline<\/td><td>TB<\/td><td>Cuối tháng 11/2026<\/td><\/tr><tr><td>4<\/td><td><b>Kế hoạch 2027 của EVNNPT<\/b> (54 công trình đóng điện, 52 khởi công) – nhắc lại<\/td><td>Cửa sổ đưa online monitoring vào YCKT từ đầu<\/td><td>Lập danh sách công trình 2027 theo Ban QLDA; gửi YCKT mẫu cho PECC1–4<\/td><td>Cao<\/td><td>Chốt kế hoạch vốn cuối 2026<\/td><\/tr><tr><td>5<\/td><td><b>TBA 500 kV Nam Định – Gói 6 MBA 3×300 MVA (426,7 tỷ)<\/b> – nhắc lại<\/td><td>MBA 500 kV mới thường yêu cầu online DGA/bushing → thầu phụ cho hãng MBA<\/td><td>Kiểm tra muasamcong; liên hệ trước các hãng MBA<\/td><td>TB<\/td><td>Dự kiến mời thầu Q4/2026 – chưa thấy HSMT<\/td><\/tr><tr><td>6<\/td><td><b>Hydro‑Québec DT MBA (CIGRE A2‑11862)<\/b> – khung đa trạng thái, DGA theo phần hoạt động/bushing/OLTC<\/td><td>Mẫu kiến trúc để chào Transformer DT cho EVN/PTC: tách trạng thái vật lý theo nút, cảm biến ảo<\/td><td>Đưa vào tài liệu giới thiệu Transformer DT; đối chiếu với module hiện có của VTI<\/td><td>Thấp<\/td><td>Tài liệu tham khảo<\/td><\/tr><\/table>\n<p><i>Nhận xét: không có gói chào giá trực tiếp mới về giám sát online trong 72 giờ qua. #1 cần xử lý ngay hôm nay; #2 là cơ hội \"đi trước HSMT\" có khối lượng lớn nhất; #3 là cơ hội nhanh, quy mô nhỏ.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN tháng 10/2026 và nhiệm vụ tháng 11 (EVN, 03/11):<\/b> sản lượng+nhập khẩu tháng 10 đạt 31,58 tỷ kWh (+14,3%), lũy kế 10 tháng 297,4 tỷ kWh (+9,8%); 137 công trình truyền tải 110–500 kV đóng điện sau 10 tháng, gồm MBA 500 kV Di Linh và 3 công trình phục vụ APEC 2027 tại Phú Quốc; tháng 11 dự báo 28,9 tỷ kWh (+14,4%), mở rộng BESS phân phối lên 805 MW, tiếp tục Quảng Trạch II (LNG 1.612,8 MW) và Quảng Trạch I (than 1.403 MW).<\/li><li><b>EVN 9 tháng (Báo Đấu thầu, 06/10):<\/b> khởi công 136 công trình lưới (2×500 kV, 18×220 kV, 116×110 kV), đóng điện 131; EVNHANOI hoàn thành 50 MW và EVNNPC 155 MW BESS; Quý IV dự kiến 88,97 tỷ kWh (+11,3%) và EVN đang chuẩn bị kịch bản cấp điện 2027.<\/li><li><b>TBA 220 kV Yên Dũng (Báo Đầu tư, 21/10):<\/b> lắp 2 MBA 250 MVA (tổng 500 MVA) tại Bắc Ninh; MBA dự kiến về công trường 23–27/10; EVN yêu cầu đóng điện trong tháng 11, thi công 3 ca; khó khăn thiếu lao động, mương cáp chậm.<\/li><li><b>TBA 220 kV Chân Mây (Tạp chí Công Thương, 14/10):<\/b> 1 MBA 125 MVA giai đoạn đầu, TBA đạt ~95%, đường dây 5,13 km đạt ~63% (17/23 móng); mục tiêu đóng điện tháng 11 nhưng còn vướng mặt bằng, đổi thiết kế một số vị trí cột và mưa.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>EVNNPC – 6 gói BESS giai đoạn 2 (Báo Đấu thầu, 12/08):<\/b> mở thầu 22/07, tổng dự toán các gói G05–G10 ~867 tỷ (Bắc Ninh–Thái Nguyên 122,3 tỷ; Phú Thọ–Tuyên Quang 159,4 tỷ; Hà Tĩnh 175 tỷ; Thanh Hóa 97,2 tỷ; Nghệ An 2 gói ~156 tỷ); 3–5 nhà thầu mỗi gói, thường gặp Resource Electric Tianjin, CYG Sunri, Á Châu Industrial, Chint–ZonFa; bài báo không nêu hạn nộp. Kết quả LCNT là tín hiệu để tiếp cận đơn vị trúng thầu.<\/li><li><b>EVNNPT mời thu xếp vốn:<\/b> 5 dự án 1.119 tỷ – hạn <b>17/11 (hôm nay)<\/b>; 8 dự án ~200,9 triệu EUR – hạn <b>27/11/2026<\/b> (nhắc lại).<\/li><li><b>HSMT ngày 8–9/10 (Báo Đấu thầu, 14/10):<\/b> chỉ có 2 gói xây lắp cấp điện tại Điện lực Bình Chánh (EVNHCMC) – không liên quan giám sát online.<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li><b>Hitachi Energy HMAX Energy (EEPower, 24/04/2026):<\/b> bộ giải pháp AI (Predict/Prevent/Plan) trên nền digital twin, giám sát tài sản kết nối kết hợp dữ liệu môi trường; Hitachi tự công bố giảm 50% số lần hỏng MBA và giảm tới 75% chi phí sửa chữa (số liệu hãng, chưa kiểm chứng độc lập). Là đối chiếu trực tiếp cho định vị Transformer DT của VTI.<\/li><li><b>T&amp;D World (13/10) – ưu tiên giám sát MBA khi tải data center tăng:<\/b> bài của Vaisala và Delta‑X (có tính quảng bá) khuyến nghị xếp ưu tiên theo rủi ro, kết hợp DGA phòng thí nghiệm với DGA online; ví dụ KAMO Electric giảm lấy mẫu phòng thí nghiệm còn 2 lần/năm sau khi lắp giám sát H₂ và ẩm cố định; Delta‑X đánh giá trên 15.239 MBA/307 ca hỏng với mô hình dựa trên độ tin cậy. Lập luận \"reliability‑based DGA\" có thể mượn cho chào hàng Asset Health.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>Siemens Energy – Camlin<\/b> và <b>Hitachi Energy – nhà máy vật liệu cách điện Canada<\/b> đã đưa 15/11, chưa có diễn biến mới trong 48 giờ qua.<\/li><li><b>Tìm kiếm tin quốc tế 24–72 giờ<\/b> (Utility Dive, Energy Storage News, pv magazine, Reuters) không trả về bài mới có thể kiểm chứng ngày đăng – xem mục Giới hạn.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li><b>arXiv 2608.13260 (13/08/2026, ĐH Oslo/SINTEF, dữ liệu Statnett) – \"Virtual Temperature Sensors … Neural ODE\":<\/b> mạng nơron học đạo hàm nhiệt độ theo phương trình truyền nhiệt đơn giản (cuộn dây–dầu–môi trường), so với LSTM 3 tầng trên 15 MBA lưới truyền tải Na Uy; ở chế độ ổn định R² trung vị 0,591 so với 0,493, MAE 2,04 °C so với 2,45 °C; không ổn định khi dữ liệu huấn luyện dưới ~1 tháng, khuyến nghị ~1 năm dữ liệu. Ý nghĩa: cảm biến ảo nhiệt độ khả thi nhưng độ chính xác khiêm tốn – cần ít nhất vài tháng dữ liệu tải/nhiệt mới nên chào module dự báo nhiệt.<\/li><li><b>CIGRE A2‑11862 (Hydro‑Québec, 2026):<\/b> khung chẩn đoán–tiên lượng đa trạng thái cho DT MBA, deep learning phát hiện bất thường OLTC qua rung âm, diễn giải DGA riêng cho phần hoạt động/bushing/OLTC, mô hình nhiệt – ẩm – lão hóa cách điện, phương pháp đánh giá suy giảm bushing. Ý nghĩa: tham chiếu thực tế của một utility lớn, đáng đối chiếu với các module DGA/bushing của VTI (mới đọc abstract).<\/li><li><b>IEC 60076‑4:2026 Ed.2 (07/2026):<\/b> thử nghiệm xung sét/xung đóng cắt MBA và kháng điện (mạch thử, phát hiện sự cố, diễn giải kết quả); bản mô tả không liệt kê chi tiết thay đổi kỹ thuật, nhãn \"corrected version 2026‑09\" – kỹ sư thí nghiệm cần đọc bản chính thức khi cập nhật quy trình.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Chưa tìm thấy bài đăng nào có ngày 16–17/11 từ nguồn Việt Nam; phần lớn tin trong bản tin là 2–6 tuần tuổi.<\/li><li>Một truy vấn Energy Storage News/pv magazine/Reuters bị proxy từ chối; chưa có tin quốc tế 24–72 giờ kiểm chứng được.<\/li><li>Chưa mở được muasamcong.mpi.gov.vn (cổng đấu thầu) nên không xác nhận được KHLCNT/HSMT mới; kết quả chọn ngân hàng của EVNNPT chưa xuất hiện.<\/li><li>Số liệu hiệu quả của Hitachi HMAX là do hãng công bố; bài T&amp;D World có yếu tố quảng bá.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>EVN – Tình hình hoạt động tháng 10/2026 – <a href=\"https://www.evn.com.vn/d/vi-VN/news/Tinh-hinh-hoat-dong-thang-10-nam-2026-muc-tieu-nhiem-vu-cong-tac-thang-11-nam-2026-60-142-510184\" target=\"_blank\" rel=\"noopener\">https://www.evn.com.vn/d/vi-VN/news/Tinh-hinh-hoat-dong-thang-10-nam-2026-muc-tieu-nhiem-vu-cong-tac-thang-11-nam-2026-60-142-510184<\/a><\/li><li>Báo Đấu thầu – 9 tháng 2026 EVN khởi công 136 công trình lưới điện – <a href=\"https://baodauthau.vn/9-thang-nam-2026-evn-khoi-cong-136-cong-trinh-luoi-dien-day-manh-dau-tu-bess-post209156.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/9-thang-nam-2026-evn-khoi-cong-136-cong-trinh-luoi-dien-day-manh-dau-tu-bess-post209156.html<\/a><\/li><li>Báo Đầu tư – TBA 220 kV Yên Dũng phấn đấu đóng điện trong tháng 11/2026 – <a href=\"https://baodautu.vn/tram-bien-ap-220-kv-yen-dung-phan-dau-dong-dien-trong-thang-112026-d728436.html\" target=\"_blank\" rel=\"noopener\">https://baodautu.vn/tram-bien-ap-220-kv-yen-dung-phan-dau-dong-dien-trong-thang-112026-d728436.html<\/a><\/li><li>Tạp chí Công Thương – TBA 220kV Chân Mây – <a href=\"https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm<\/a><\/li><li>Báo Đấu thầu – EVNNPC chọn thầu BESS giai đoạn 2 – <a href=\"https://baodauthau.vn/evnnpc-chon-thau-lap-dat-he-thong-bess-giai-doan-2-co-hoi-lon-canh-tranh-cao-post204851.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpc-chon-thau-lap-dat-he-thong-bess-giai-doan-2-co-hoi-lon-canh-tranh-cao-post204851.html<\/a><\/li><li>Báo Đấu thầu – Cùng đọc hồ sơ mời thầu ngày 14/10/2026 – <a href=\"https://baodauthau.vn/cung-doc-ho-so-moi-thau-ngay-14102026-post209900.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/cung-doc-ho-so-moi-thau-ngay-14102026-post209900.html<\/a><\/li><li>EEPower – Hitachi Energy launches AI-powered suite – <a href=\"https://eepower.com/new-industry-products/hitachi-energy-launches-ai-powered-suite-for-infrastructure/\" target=\"_blank\" rel=\"noopener\">https://eepower.com/new-industry-products/hitachi-energy-launches-ai-powered-suite-for-infrastructure/<\/a><\/li><li>T&amp;D World – How to Prioritize Transformer Monitoring as Data Center Loads Grow – <a href=\"https://www.tdworld.com/test-and-measurement/article/55411249/how-to-prioritize-transformer-monitoring-as-data-center-loads-grow\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/test-and-measurement/article/55411249/how-to-prioritize-transformer-monitoring-as-data-center-loads-grow<\/a><\/li><li>arXiv – Virtual Temperature Sensors in Power Transformers Using Neural ODEs – <a href=\"https://arxiv.org/abs/2608.13260\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2608.13260<\/a><\/li><li>e‑CIGRE – A2‑11862 Digital twin technologies for power transformers (Hydro‑Québec) – <a href=\"https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html<\/a><\/li><li>IEC – IEC 60076‑4:2026 (qua online.standard.no) – <a href=\"https://online.standard.no/en/iec-60076-4-2026\" target=\"_blank\" rel=\"noopener\">https://online.standard.no/en/iec-60076-4-2026<\/a><\/li><\/ul>"}, {"day": "2026-11-16", "title": "Bản tin năng lượng & Cơ hội VTI – 16/11/2026", "html": "<blockquote>Tổng hợp từ Năng lượng Việt Nam, Báo Đầu tư, Đại biểu Nhân dân, Điện tử &amp; Ứng dụng, Vietnam News, The Investor, GreenTechLead, T&amp;D World, e‑CIGRE; sau cuối tuần rất ít tin mới trong 24–72 giờ nên một số mục là tin cũ hơn nhưng chưa đưa (đã ghi rõ ngày), tin đã đưa 10–15/11 chỉ nhắc lại khi sắp đến hạn. Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVNNPT gọi vốn 5 dự án 1.119 tỷ<\/b> (Bắc Tân Uyên, MBA 63 MVA tại Chèm, nâng công suất Yên Bái…) và <b>8 dự án ~200,9 triệu EUR<\/b> (nhắc lại)<\/td><td>Chốt vốn xong là bước trước KHLCNT thiết bị/MBA 2027<\/td><td>Theo dõi kết quả chọn ngân hàng; đặt cảnh báo muasamcong theo tên dự án; hoàn thiện datasheet DGA/bushing/nhiệt \"EVNNPT‑ready\"<\/td><td><b>17/11/2026 (ngày mai)<\/b>; 27/11/2026<\/td><\/tr><tr><td>2<\/td><td><b>Kế hoạch 2027 của EVNNPT<\/b> (EVN họp 09/11): vốn &gt;33.782 tỷ; khởi công 52 công trình, <b>đóng điện 54 (8×500 kV, 42×220 kV)<\/b>; 505 dự án theo QHĐ VIII điều chỉnh giai đoạn 2025–2030<\/td><td>Khối lượng TBA 220–500 kV mới năm 2027 lớn nhất từ trước tới nay → cửa sổ để đưa online monitoring/asset health vào thiết kế và YCKT ngay từ đầu<\/td><td>Lập danh sách 54 công trình 2027 theo NPMB/CPMB/SPMB; gặp các Ban QLDA và đơn vị tư vấn (PECC1–4) giới thiệu YCKT mẫu \"MBA 220/500 kV có DGA + bushing + nhiệt + IEC 61850\"<\/td><td>Kế hoạch vốn 2027 chốt cuối 2026<\/td><\/tr><tr><td>3<\/td><td><b>BESS EVNNPC: 530 MW tại 83 TBA 110 kV, 3 giai đoạn<\/b> – GĐ2 140 MW/23 trạm đang hoàn tất thủ tục, GĐ3 ~85 MW/13 trạm<\/td><td>Mỗi trạm BESS cần giám sát pin/PCS/làm mát/PCCC và MBA 110 kV vận hành chu kỳ nạp–xả → gói \"BESS + MBA 110 kV health\" tích hợp SCADA; cộng hưởng với việc EVN đang chọn tiêu chuẩn an toàn BESS (bản tin 15/11)<\/td><td>Đề xuất PoC giám sát tại 1–2 trạm GĐ1 đã vận hành (Phúc Sơn – Ninh Bình, Bắc Ninh) để có reference trước khi GĐ2/GĐ3 ra HSMT<\/td><td>GĐ2 triển khai 2026–2027<\/td><\/tr><tr><td>4<\/td><td><b>Cụm Điện Biên<\/b>: TBA 220 kV Điện Biên 2×125 MVA (đóng điện Q4/2026); <b>TBA 500 kV Điện Biên 900 MVA<\/b> (khởi công Q4/2026, đóng điện cuối 2027) + ĐZ 500 kV Điện Biên – Lai Châu ~58,5 km<\/td><td>TBA 500 kV mới, xa trung tâm, khó tiếp cận → ứng viên điển hình cho TBA không người trực + giám sát online MBA/kháng điện<\/td><td>Theo dõi KHLCNT gói MBA 500 kV khi chấp thuận nhà đầu tư xong; tiếp cận NPMB qua hồ sơ năng lực<\/td><td>Khởi công Q4/2026 (đang vướng thủ tục chấp thuận nhà đầu tư)<\/td><\/tr><tr><td>5<\/td><td><b>TBA 500 kV Nam Định – Gói 6 MBA 3×300 MVA (426,7 tỷ)<\/b> (nhắc lại)<\/td><td>MBA 500 kV mới thường yêu cầu online DGA/bushing → VTI làm thầu phụ cho hãng MBA<\/td><td>Kiểm tra muasamcong sáng nay; liên hệ trước các hãng MBA có khả năng dự thầu<\/td><td>Dự kiến mời thầu Q4/2026 – chưa thấy HSMT<\/td><\/tr><\/table>\n<p><i>Nhận xét: không có gói chào giá trực tiếp mới về giám sát online trong 72 giờ qua. #1 cần theo dõi ngay ngày mai; #2 và #3 là các cơ hội \"đi trước HSMT\" quan trọng nhất cho kế hoạch kinh doanh 2027.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN rà soát đầu tư truyền tải (Năng lượng Việt Nam, 10/11):<\/b> EVNNPT có 505 dự án theo QHĐ VIII điều chỉnh (450 đang chuẩn bị/thực hiện); 10 tháng 2026 khởi công 23 và đóng điện 23 công trình, giải ngân &gt;11.500/27.273 tỷ. EVN yêu cầu phân nhóm ưu tiên, phân cấp cho các Ban QLDA, tập trung ĐZ 500 kV Vũng Áng – Hòa Bình 2 và Hòa Bình 2 – Tây Hà Nội, giải tỏa công suất Quảng Trị, Tây Bắc, Nam Trung Bộ, Tây Nguyên, cùng tụ bù và nâng công suất lưới phục vụ cấp điện 2027.<\/li><li><b>Kế hoạch 2027 của EVNNPT (cùng nguồn):<\/b> vốn &gt;33.782 tỷ (đầu tư thuần &gt;24.392 tỷ); khởi công 52 công trình (9×500 kV, 41×220 kV, 2×110 kV), đóng điện 54 (8×500 kV, 42×220 kV, 4×110 kV).<\/li><li><b>Cụm truyền tải Điện Biên (Báo Đầu tư, 24/07 – chưa đưa tin):<\/b> ĐZ 220 kV Sơn La – Điện Biên đã bàn giao 147/150 vị trí móng, cùng TBA 220 kV Điện Biên (2×125 MVA) mục tiêu đóng điện Q4/2026; TBA 500 kV Điện Biên 900 MVA tại Si Pa Phìn và ĐZ 500 kV Điện Biên – Lai Châu đang vướng thủ tục chấp thuận nhà đầu tư.<\/li><li><b>BESS lưới phân phối miền Bắc (Đại biểu Nhân dân, 26/09 – chi tiết chưa đưa):<\/b> EVNNPC triển khai 530 MW tại 83 TBA theo 3 giai đoạn (GĐ1 305 MW/47 trạm); hệ đầu tiên ở Ninh Bình tại TBA 110 kV Phúc Sơn 5 MW/10 MWh vận hành 21/8; Bắc Ninh huy động ~30 MW BESS khi phụ tải đỉnh ~3.229 MW tháng 8. Bài viết không nêu nhà cung cấp hay SCADA – chỉ có EMS.<\/li><li><b>Khuôn khổ BESS tại TBA (Vietnam News, cuối 2026):<\/b> Thông tư 62 của Bộ Công Thương hướng dẫn đầu tư BESS đặt tại TBA 110 kV và 220 kV; EVN công bố kế hoạch ~1.200 MW BESS toàn quốc (tính đến 8/2026); QHĐ VIII điều chỉnh đặt mục tiêu 10–16,3 GW lưu trữ đến 2030.<\/li><li><b>Điện gió ngoài khơi (The Investor, 15/10):<\/b> Pacifico Energy và PTSC Marine GS khởi động khảo sát địa vật lý, khí tượng‑hải văn cho 2 dự án tổng 1,8 GW (500 MW ngoài khơi TP.HCM, 1.300 MW ngoài khơi Lâm Đồng), có thể thu hút &gt;6 tỷ USD ở các giai đoạn sau.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>EVNNPT mời thu xếp vốn:<\/b> 5 dự án 1.119 tỷ – hạn <b>17/11 (ngày mai)<\/b>; 8 dự án ~200,9 triệu EUR – hạn <b>27/11/2026<\/b> (nhắc lại).<\/li><li><b>TBA 500 kV Nam Định:<\/b> Gói 6 MBA 426,7 tỷ và Gói 8 thiết bị nhất thứ 214,7 tỷ dự kiến mời thầu Q4/2026 – chưa thấy HSMT (nhắc lại).<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>Đơn hàng MBA 765 kV tại Ấn Độ (GreenTechLead, 14/10):<\/b> POWERGRID trao cho GE Vernova T&amp;D India 30 MBA một pha 500 MVA 765/400 kV (~₹701 crore) và Hitachi Energy gói tương tự (~₹647 crore); HD Hyundai Electric ký thỏa thuận khung tới 1.121 tỷ KRW cung cấp thiết bị cho data center Mỹ đến 2028.<\/li><li><b>Thiếu hụt thiết bị lưới Mỹ (cùng nguồn):<\/b> Wood Mackenzie ước tính Mỹ thiếu ~15% MBA lực và ~8% TBA trong năm 2026 – càng thiếu MBA mới, giá trị của việc kéo dài tuổi thọ MBA đang vận hành bằng monitoring càng tăng.<\/li><li><b>Avangrid (T&amp;D World, 21/10):<\/b> hiện đại hóa hơn 40 TBA tại Maine, Connecticut, New York (xây lại, thay MBA, chống ngập, tự động hóa) trong chương trình gia cố hạ tầng 18,5 tỷ USD đến 2028.<\/li><li><b>Doble Spark P2 (ESE News, 30/03/2026):<\/b> thiết bị đo PD cầm tay tích hợp cảm biến UHF, HF, âm học và charge detector, phân tích PRPD/phổ/thời gian, kết nối phần mềm Doble Pulse – đối thủ trực tiếp ở mảng khảo sát PD tại TBA.<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer/Substation DT)<\/h2>\n<ul><li><b>CIGRE A3‑10816 (POWERGRID, 2026) – DT + IoT + AI cho quản lý tài sản T&amp;D cao áp:<\/b> kiến trúc 4 lớp (cảm biến DGA/PD/rung/nhiệt/SF₆ → truyền thông IEC 61850‑90‑3 với đồng bộ IEEE 1588 PTP → DT nhúng PINN → AI tiên lượng RF/LSTM), chuyển từ ngưỡng cảnh báo tĩnh sang Health Index xác suất và RUL; tổng hợp DT MBA cloud‑edge đạt F1 &gt;0,92 – kiến trúc tham chiếu rất sát roadmap Substation DT của VTI.<\/li><li><b>CIGRE A2‑11893 (SEPCO, Jordan, 2026):<\/b> hai ca nghiên cứu chẩn đoán và phòng ngừa sự cố MBA – từ thông tản (magnetic flux leakage) và suy giảm cách điện cellulose; tài liệu tham khảo hữu ích cho thư viện case study chẩn đoán (mới đọc được tiêu đề, chưa truy cập toàn văn).<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Năng lượng Việt Nam – Rà soát nguồn lực, xác định thứ tự ưu tiên trong đầu tư điện truyền tải đến 2030 – <a href=\"https://nangluongvietnam.vn/ra-soat-nguon-luc-xac-dinh-thu-tu-uu-tien-trong-dau-tu-dien-truyen-tai-den-nam-2030-36892.html\" target=\"_blank\" rel=\"noopener\">https://nangluongvietnam.vn/ra-soat-nguon-luc-xac-dinh-thu-tu-uu-tien-trong-dau-tu-dien-truyen-tai-den-nam-2030-36892.html<\/a><\/li><li>Báo Đầu tư – EVNNPT kiến nghị Điện Biên gỡ vướng mắc cho các dự án truyền tải trọng điểm – <a href=\"https://baodautu.vn/evnnpt-kien-nghi-dien-bien-go-vuong-mac-cho-cac-du-an-truyen-tai-trong-diem-d651708.html\" target=\"_blank\" rel=\"noopener\">https://baodautu.vn/evnnpt-kien-nghi-dien-bien-go-vuong-mac-cho-cac-du-an-truyen-tai-trong-diem-d651708.html<\/a><\/li><li>Đại biểu Nhân dân – EVNNPC từng bước làm chủ công nghệ pin lưu trữ BESS – <a href=\"https://daibieunhandan.vn/evnnpc-tung-buoc-lam-chu-cong-nghe-pin-luu-tru-nang-luong-bess-tren-luoi-dien-mien-bac-10431830.html\" target=\"_blank\" rel=\"noopener\">https://daibieunhandan.vn/evnnpc-tung-buoc-lam-chu-cong-nghe-pin-luu-tru-nang-luong-bess-tren-luoi-dien-mien-bac-10431830.html<\/a><\/li><li>Vietnam News – Clean energy hinges on tech and market conditions – <a href=\"https://vietnamnews.vn/economy/1803644/clean-energy-hinges-on-tech-and-market-conditions.html\" target=\"_blank\" rel=\"noopener\">https://vietnamnews.vn/economy/1803644/clean-energy-hinges-on-tech-and-market-conditions.html<\/a><\/li><li>The Investor – PTSC Marine GS, Pacifico Energy launch surveys for 1.8 GW offshore wind projects – <a href=\"https://theinvestor.vn/ptsc-marine-gs-pacifico-energy-launch-surveys-for-18-gw-offshore-wind-projects-d20228.html\" target=\"_blank\" rel=\"noopener\">https://theinvestor.vn/ptsc-marine-gs-pacifico-energy-launch-surveys-for-18-gw-offshore-wind-projects-d20228.html<\/a><\/li><li>Báo Đấu thầu – EVNNPT mời ngân hàng thu xếp 1.119 tỷ – <a href=\"https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html<\/a><\/li><li>GreenTechLead – Transformer Orders in 2026: GE Vernova, Hitachi Energy and HD Hyundai Electric – <a href=\"https://greentechlead.com/?p=55939\" target=\"_blank\" rel=\"noopener\">https://greentechlead.com/?p=55939<\/a><\/li><li>T&amp;D World – Avangrid advances grid modernization for 40+ US substation facilities – <a href=\"https://www.tdworld.com/substations/news/55413602/avangrid-advances-grid-modernization-investment-for-40-us-substation-facilities\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/substations/news/55413602/avangrid-advances-grid-modernization-investment-for-40-us-substation-facilities<\/a><\/li><li>Rallies/ESE News – Doble launches Spark P2 handheld PD detector – <a href=\"https://rallies.ai/news/doble-launches-spark-p2-handheld-pd-detector-with-uhf-hf-and-acoustic-sensors\" target=\"_blank\" rel=\"noopener\">https://rallies.ai/news/doble-launches-spark-p2-handheld-pd-detector-with-uhf-hf-and-acoustic-sensors<\/a><\/li><li>e‑CIGRE – A3‑10816 Digital twins, IoT and AI for predictive management of HV T&amp;D assets – <a href=\"https://www.e-cigre.org/publications/detail/a3-10816-2026-a-data-driven-paradigm-digital-twins-iot-and-ai-for-predictive-management-of-high-voltage-td-assets.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a3-10816-2026-a-data-driven-paradigm-digital-twins-iot-and-ai-for-predictive-management-of-high-voltage-td-assets.html<\/a><\/li><li>e‑CIGRE – A2‑11893 Advanced diagnostics and failure prevention in power transformers (SEPCO Jordan) – <a href=\"https://www.e-cigre.org/publications/detail/a2-11893-2026-advanced-diagnostics-and-failure-prevention-in-power-transformers-dual-case-study-investigations-of-magnetic-flux-leakage-and-cellulose-insulation-degradation-at-samra-electric-power-company-sepco-jordan.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11893-2026-advanced-diagnostics-and-failure-prevention-in-power-transformers-dual-case-study-investigations-of-magnetic-flux-leakage-and-cellulose-insulation-degradation-at-samra-electric-power-company-sepco-jordan.html<\/a><\/li><\/ul>"}, {"day": "2026-11-15", "title": "Bản tin năng lượng & Cơ hội VTI – 15/11/2026", "html": "<blockquote>Tổng hợp từ EVN, Vietnam Energy, Tạp chí Công Thương, Đại biểu Nhân dân, Báo Đấu thầu, Utility Dive, Hitachi Energy, e‑CIGRE, arXiv, MDPI; tin đã đưa 10–14/11 chỉ nhắc lại khi sắp đến hạn. Cuối tuần nên ít tin mới trong 24 giờ, một số mục là tin cũ hơn nhưng chưa đưa. Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVN – ULSE hội thảo tiêu chuẩn an toàn BESS (12/11)<\/b>: EVN giao các đơn vị (EVNNPC, EVNHANOI, Ban QLDA Điện 2, 4 công ty tư vấn) nghiên cứu, đánh giá, lựa chọn tiêu chuẩn an toàn cho dự án BESS; trọng tâm UL 9540A (lan truyền thermal runaway)<\/td><td>Đang ở giai đoạn <b>chọn tiêu chuẩn<\/b> → cơ hội đưa yêu cầu giám sát online (nhiệt cell, off‑gas H₂/CO, MBA tăng áp, PCS) vào YCKT trước khi ra HSMT; khớp kế hoạch ~930 MW BESS miền Bắc 2027 (bản tin 11/11)<\/td><td>Soạn white paper ngắn \"BESS safety monitoring theo UL 9540A / NFPA 855 / IEC 62933‑5‑2\" + kiến trúc tích hợp SCADA IEC 61850; gửi Ban KT‑SX EVN, EVNNPC, EVNHANOI, các công ty tư vấn PECC<\/td><td>Ngay trong Q4/2026 – trước khi chốt YCKT BESS 2027<\/td><\/tr><tr><td>2<\/td><td><b>EVNNPT gọi vốn<\/b>: 5 dự án 1.119 tỷ (Bắc Tân Uyên, MBA 63 MVA tại Chèm, nâng công suất Yên Bái…) và 8 dự án ~200,9 triệu EUR (nhắc lại vì sắp hạn)<\/td><td>Chốt vốn xong sẽ ra KHLCNT thiết bị/MBA trong 2027<\/td><td>Đặt cảnh báo muasamcong theo tên dự án; chuẩn bị bộ datasheet DGA/bushing/nhiệt \"EVNNPT‑ready\"<\/td><td><b>17/11/2026 (còn 2 ngày)<\/b>; 27/11/2026<\/td><\/tr><tr><td>3<\/td><td><b>Khung giá điện LNG 2026 (QĐ 2972/QĐ‑BCT, 09/11)<\/b>: trần 3.453,72 đ/kWh (chưa VAT), tính cho nhà máy ~1.528 MW<\/td><td>Khung giá rõ giúp đẩy đàm phán PPA các dự án LNG → nhu cầu giám sát online MBA tăng áp (GSU) và MBA tự dùng ở nhà máy mới; PV Power đã có tiền lệ mời chào giá DGA online (bản tin 11/11)<\/td><td>Lập danh sách dự án LNG đang đàm phán PPA/EPC (Quảng Trạch II, Cà Ná, Nhơn Trạch 3–4…); chào gói \"GSU monitoring + Transformer DT\" cho EPC và chủ đầu tư<\/td><td>Đàm phán PPA/EPC 2026–2027<\/td><\/tr><tr><td>4<\/td><td><b>TBA 500 kV Nam Định – Gói 6 MBA 3×300 MVA (426,7 tỷ)<\/b>: dự kiến mời thầu Q4/2026 (nhắc lại, chưa thấy HSMT)<\/td><td>MBA 500 kV mới thường yêu cầu online DGA/bushing → VTI làm thầu phụ cho hãng MBA trúng thầu<\/td><td>Kiểm tra muasamcong đầu tuần; liên hệ trước các hãng MBA có khả năng dự thầu<\/td><td>Q4/2026<\/td><\/tr><tr><td>5<\/td><td><b>Thủy điện tích năng Bác Ái 1.200 MW – gói 01TB‑BA ký 26/10<\/b> (LD Voith Hydro Shanghai – PowerChina Zhongnan, 4.462,6 tỷ, 51 tháng)<\/td><td>Dài hạn: MBA tăng áp và hệ giám sát tổ máy thường là thầu phụ của nhà cung cấp thiết bị cơ điện → kênh tiếp cận Voith<\/td><td>Đưa Voith Hydro vào danh sách đối tác tiềm năng; tìm hiểu phạm vi MBA/giám sát trong gói<\/td><td>Tổ máy 1 phát điện 12/2029 (dài hạn)<\/td><\/tr><\/table>\n<p><i>Nhận xét: không có gói chào giá trực tiếp mới mở trong 24–72 giờ. #1 là cơ hội \"đi trước HSMT\" đáng làm nhất tuần tới; #2 chỉ còn 2 ngày.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN – ULSE hội thảo an toàn BESS (EVN, 12/11):<\/b> hội thảo trực tiếp + trực tuyến tại trụ sở EVN do Phó TGĐ Nguyễn Tài Anh chủ trì, tiếp nối cuộc họp 09/09 với ULSE; chuyên gia ULSE, IFE Singapore, UL Solutions Đài Loan trình bày UL 9540A làm cơ sở xác định khoảng cách an toàn và biện pháp chống cháy nổ.<\/li><li><b>Khung giá phát điện LNG 2026 (Vietnam Energy, 12/11):<\/b> QĐ 2972/QĐ‑BCT hiệu lực 09/11, khung 0 – 3.453,72 đ/kWh; thông số tính toán gồm giá LNG nhập khẩu 13,41 USD/MMBtu, chi phí vận chuyển–tái hóa khí 1,83 USD/MMBtu, suất hao nhiệt 6.253 BTU/kWh ở 85% tải.<\/li><li><b>Thủy điện tích năng Bác Ái (Tạp chí Công Thương, 26/10):<\/b> EVN ký gói 01TB‑BA cung cấp thiết bị cơ điện qua đấu thầu quốc tế rộng rãi; 4 tổ máy phát điện lần lượt 12/2029 – 12/2030, hoàn thành 5/2031; vốn vay KfW, EIB (AFD tham dự).<\/li><li><b>Luật Điện lực sửa đổi (Đại biểu Nhân dân, 03/11):<\/b> Quốc hội thảo luận trọng tâm giá điện: tách chính sách giá khỏi an sinh xã hội (hướng tới hỗ trợ trực tiếp thay bù chéo), làm rõ cơ chế bù đắp chi phí, trách nhiệm khi điện bị hạn chế huy động trong PPA, tăng kiểm toán độc lập chi phí.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>EVNNPT mời thu xếp vốn:<\/b> 5 dự án 1.119 tỷ – hạn <b>17/11<\/b>; 8 dự án ~200,9 triệu EUR – hạn <b>27/11/2026<\/b> (nhắc lại).<\/li><li><b>TBA 500 kV Nam Định:<\/b> Gói 6 MBA 426,7 tỷ và Gói 8 thiết bị nhất thứ 214,7 tỷ dự kiến mời thầu Q4/2026 – chưa thấy HSMT phát hành (nhắc lại).<\/li><li><b>Bác Ái 01TB‑BA:<\/b> hợp đồng 4.462,6 tỷ, 51 tháng, nhà thầu LD Voith Hydro Shanghai – PowerChina Zhongnan.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>Utility Dive (13/11) – BNEF Houston Summit:<\/b> đại diện Google ước tính hệ số sử dụng lưới Mỹ chỉ 40–60%; dư địa nằm ở dịch vụ truyền tải non‑firm và AI giúp \"nhìn thấy\" công suất còn trống – lập luận tương tự cho dynamic rating MBA.<\/li><li><b>Utility Dive (11/11):<\/b> Ủy viên FERC David LaCerte cho rằng xây thêm hạ tầng là lời giải chính cho vấn đề giá điện, bình luận về PJM và độc quyền utility sau bầu cử giữa kỳ.<\/li><li><b>Hitachi Energy (16/10):<\/b> đầu tư 479 triệu CAD xây nhà máy vật liệu cách điện MBA (pressboard, laminate) tại London, Ontario – dây chuyền pressboard đầu tiên của hãng ở châu Mỹ, hoàn thành 2028; cho thấy nút cổ chai chuỗi cung MBA lan sang cả vật liệu cách điện.<\/li><li><b>Siemens Energy mua Camlin Group (pv magazine/pulse, 6/2026):<\/b> thương vụ phần mềm giám sát sức khỏe MBA, chờ phê duyệt trước cuối năm, Camlin vận hành độc lập sau khi hoàn tất – xu hướng hãng MBA lớn gộp phần mềm monitoring vào sản phẩm, thu hẹp chỗ cho nhà cung cấp độc lập.<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer/Substation DT)<\/h2>\n<ul><li><b>CIGRE A2‑10207 (POWERGRID, Ấn Độ) – \"Digital Mirror\" cho MBA và kháng điện:<\/b> gộp hồ sơ tài sản, SCADA, cảm biến online và kết quả thí nghiệm định kỳ; các mô hình song song Health/Ageing/Thermal/PoF/Impact cho ra risk index; báo cáo khả dụng tăng từ 99,80% lên 99,91%, giảm ~25% thời gian cắt điện can thiệp – kiến trúc tham chiếu sát với asset health của VTI.<\/li><li><b>CIGRE A2‑10255 (POWERGRID):<\/b> DT MBA dùng ML kết hợp DGA với dữ liệu thời gian thực và thí nghiệm định kỳ, kiểm chứng trên dữ liệu MBA đã hỏng để chọn thuật toán dự báo phù hợp nhất.<\/li><li><b>arXiv 2601.09287 (01/2026):<\/b> autoencoder đa góc nhìn, không giám sát, phát hiện bất thường trong lưu lượng GOOSE IEC 61850 có giải thích theo từng đặc trưng; &gt;99% tấn công được phát hiện, false positive &lt;5% – hữu ích cho module an ninh mạng Substation DT.<\/li><li><b>MDPI Energies 19(12):2806 (11/06/2026, ĐH Johannesburg):<\/b> so sánh PCA và autoencoder giảm chiều 15 đặc trưng trên 595 mẫu DGA gán nhãn IEC 60599; PCA đạt 68,9% (ổn định hơn), autoencoder tốt hơn ở 2 lớp phóng điện – nhắc rằng dữ liệu DGA công khai còn nhỏ và độ chính xác thực tế khiêm tốn.<\/li><li><b>IJEEPS (De Gruyter, 2026) – dự báo nhiệt độ dầu MBA:<\/b> tách tín hiệu VMD‑CEEMDAN + mô hình lai Transformer–BiGRU trên bộ dữ liệu ETTh2, R² 0,998, giảm RMSE 24% so với BiGRU – ứng viên baseline cho module dự báo nhiệt của Transformer DT.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>EVN – Workshop on safety standards for BESS – <a href=\"https://en.evn.com.vn/d/en-US/news/EVN-holds-workshop-on-safety-standards-for-battery-energy-storage-systems-60-163-501785\" f=\"https://www.utilitydive.com/news/utility-tech-officials-see-opportunities-to-increase-grid-utilization/874644/\" target=\"_blank\" rel=\"noopener\">https://www.utilitydive.com/news/utility-tech-officials-see-opportunities-to-increase-grid-utilization/874644/<\/a><\/li><li>Utility Dive – Transmission &amp; Distribution – <a href=\"https://www.utilitydive.com/topic/transmission-distribution/\" target=\"_blank\" rel=\"noopener\">https://www.utilitydive.com/topic/transmission-distribution/<\/a><\/li><li>Hitachi Energy – Invests 479 million CAD in Canada – <a href=\"https://www.hitachienergy.com/news-and-events/press-releases/2026/10/hitachi-energy-invests-479-million-cad-to-bring-critical-transformer-manufacturing-capability-to-canada\" target=\"_blank\" rel=\"noopener\">https://www.hitachienergy.com/news-and-events/press-releases/2026/10/hitachi-energy-invests-479-million-cad-to-bring-critical-transformer-manufacturing-capability-to-canada<\/a><\/li><li>Pulse – Siemens Energy buys Camlin Group – <a href=\"https://www.pulse.bot/energy/news/siemens-energy-buys-camlin-group-maker-of-transformer-monitoring-software-e67fab98-3cea-4a83-9aa8-7486c1621f05/\" target=\"_blank\" rel=\"noopener\">https://www.pulse.bot/energy/news/siemens-energy-buys-camlin-group-maker-of-transformer-monitoring-software-e67fab98-3cea-4a83-9aa8-7486c1621f05/<\/a><\/li><li>e‑CIGRE – A2‑10207 Digital mirror for power transformers and reactors – <a href=\"https://www.e-cigre.org/publications/detail/a2-10207-2026-development-of-a-digital-mirror-for-power-transformers-and-reactors.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-10207-2026-development-of-a-digital-mirror-for-power-transformers-and-reactors.html<\/a><\/li><li>e‑CIGRE – A2‑10255 ML modelling of digital twin of a power transformer – <a href=\"https://www.e-cigre.org/publications/detail/a2-10255-2026-predictive-analysis-using-machine-learning-modelling-of-digital-twin-of-a-power-transformer.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-10255-2026-predictive-analysis-using-machine-learning-modelling-of-digital-twin-of-a-power-transformer.html<\/a><\/li><li>arXiv 2601.09287 – Explainable Autoencoder-Based Anomaly Detection in IEC 61850 GOOSE Networks – <a href=\"https://arxiv.org/abs/2601.09287\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2601.09287<\/a><\/li><li>MDPI Energies – PCA and Autoencoder-Based ANN Models for DGA – <a href=\"https://www.mdpi.com/1996-1073/19/12/2806\" target=\"_blank\" rel=\"noopener\">https://www.mdpi.com/1996-1073/19/12/2806<\/a><\/li><li>CiteDrive – Transformer oil temperature prediction (IJEEPS 2026) – <a href=\"https://www.citedrive.com/en/discovery/online-monitoring-oriented-prediction-of-transformer-oil-temperature-using-vmd-ceemdan-and-hybrid-temporal-learning/\" target=\"_blank\" rel=\"noopener\">https://www.citedrive.com/en/discovery/online-monitoring-oriented-prediction-of-transformer-oil-temperature-using-vmd-ceemdan-and-hybrid-temporal-learning/<\/a><\/li><\/ul>"}, {"day": "2026-11-14", "title": "Bản tin năng lượng & Cơ hội VTI – 14/11/2026", "html": "<blockquote>Tổng hợp từ báo chí và tài liệu công khai (Báo Đấu thầu, Bộ Công Thương, Tạp chí Công Thương, The Star/ANN, Vietnam News, pv magazine, Utility Dive, T&amp;D World, e‑CIGRE, arXiv); tin đã đưa 10–13/11 chỉ nhắc lại khi có diễn biến mới. Hôm nay ít tin mới trong 24 giờ (cuối tuần), nhiều mục là tin 07–12/11 chưa đưa. Luôn tải và đọc kỹ HSMT/YCKT, xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>TBA 500 kV Nam Định (EVNNPT, TMĐT 1.653 tỷ)<\/b>: Gói 6 cung cấp MBA 500 kV <b>3×300 MVA – 426,7 tỷ<\/b>, Gói 8 thiết bị nhất thứ 214,7 tỷ, dự kiến mời thầu trong Q4/2026<\/td><td>MBA 500 kV mới thường yêu cầu online DGA/bushing monitoring trong YCKT → VTI làm thầu phụ cho nhà sản xuất MBA trúng thầu, hoặc chào phần mềm asset health tích hợp SCADA<\/td><td>Tra muasamcong xem Gói 6/8 đã phát hành HSMT chưa; đọc chương YCKT về monitoring; liên hệ trước các hãng MBA có khả năng dự thầu (TBD, EEMC, Hyosung, Hitachi Energy…) chào gói DGA + bushing + phần mềm<\/td><td>Mời thầu Q4/2026 – <b>kiểm tra ngay tuần tới<\/b><\/td><\/tr><tr><td>2<\/td><td><b>EVNHANOI dùng AI giám sát nhiệt độ thiết bị tại 68 TBA cao áp / 159 MBA<\/b> (cảnh báo nhiệt bất thường, lưu dữ liệu phục vụ bảo dưỡng)<\/td><td>Đã có hạ tầng dữ liệu nhiệt → bước tiếp theo tự nhiên là <b>asset health index<\/b> gộp nhiệt + DGA + bushing cho cả đội 159 MBA; cộng hưởng với cơ hội TBA số Phùng Xá/Nhật Tân (bản tin 13/11)<\/td><td>Gửi đề xuất PoC \"Transformer DT/asset health\" cho 3–5 MBA 110 kV của EVNHANOI, dùng dữ liệu nhiệt sẵn có + lắp thêm DGA/bushing; gói chung với dịch vụ TBA số<\/td><td>Tiếp cận trong Q4/2026, trước kế hoạch vốn 2027<\/td><\/tr><tr><td>3<\/td><td><b>Bộ Công Thương cảnh báo cung ứng điện 2027–2028<\/b>: nhu cầu tăng ~10%/năm, phải cắt giảm ≥ ~3.000 MW đỉnh miền Bắc; bảo dưỡng nhiệt điện dồn vào cuối 2027<\/td><td>MBA 110–500 kV sẽ vận hành sát/quá tải → nhu cầu <b>dynamic rating, hot‑spot (IEC 60076‑7), cảnh báo sớm<\/b> để tránh sự cố đúng lúc thiếu nguồn<\/td><td>Soạn one‑pager \"Vận hành MBA an toàn mùa khô 2027: dynamic loading + hot‑spot DT\" gửi PTC1, EVNNPC, EVNHANOI; đề xuất triển khai thí điểm trước 03/2027<\/td><td>Mùa khô 2027 (lắp đặt trước Q1/2027)<\/td><\/tr><tr><td>4<\/td><td><b>EVNNPT gọi vốn 5 dự án 1.119 tỷ<\/b> (Bắc Tân Uyên, MBA 63 MVA tại Chèm, nâng công suất Yên Bái…) và 8 dự án ~200,9 triệu EUR<\/td><td>Chốt vốn xong sẽ ra KHLCNT thiết bị/MBA<\/td><td>Hoàn thiện hồ sơ năng lực + datasheet monitoring \"EVNNPT‑ready\"; đặt cảnh báo muasamcong theo tên dự án<\/td><td><b>17/11/2026 (còn 3 ngày)<\/b>; 27/11/2026<\/td><\/tr><tr><td>5<\/td><td><b>Khung giá điện mặt trời 2026 (hiệu lực 05/11)<\/b>: ĐMT mặt đất có lưu trữ tối đa 1.813,48 đ/kWh (miền Bắc), nổi có lưu trữ 2.120,31 đ/kWh; lưu trữ ≥10% công suất, 2 giờ<\/td><td>Dự án ĐMT + BESS mới cần giám sát MBA tăng áp, PCS/BESS và tích hợp SCADA nhà máy → thêm đầu mối ngoài khung giá BESS (bản tin 13/11)<\/td><td>Liệt kê các chủ đầu tư ĐMT đang đàm phán PPA với EVN; chào gói \"monitoring MBA tăng áp + BESS health\" cho EPC<\/td><td>Đàm phán PPA 2026–2027<\/td><\/tr><\/table>\n<p><i>Nhận xét: không có gói chào giá trực tiếp mới mở trong 24 giờ; #1 (MBA 500 kV Nam Định) là cơ hội cụ thể nhất, #2–#3 là hướng chiến lược để bán Transformer DT trước mùa khô 2027.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>Báo cáo An ninh năng lượng Việt Nam 2026 (Diễn đàn 10/11 – bổ sung chi tiết so với bản tin 12/11):<\/b> Việt Nam nằm trong 13/177 nước giữ ổn định cung ứng năng lượng năm 2026 dù eo Hormuz bị phong tỏa nhiều tháng; báo cáo cảnh báo áp lực lớn hơn trong 2027–2028.<\/li><li><b>Báo Đấu thầu (11/11) – cảnh báo 2027–2028:<\/b> nước về hồ thủy điện chỉ ~80% trung bình nhiều năm, sản lượng thủy điện 2026 thấp hơn 2025 khoảng 18,5 tỷ kWh; Pmax miền Bắc 2026 đạt 30.248 MW; thách thức lớn nhất là điều độ khi bảo dưỡng nhiệt điện dồn vào cuối 2027.<\/li><li><b>Hội nghị Bộ Công Thương về vận hành HTĐ 2027–2028 (MOIT, 07/11):<\/b> phụ tải Q4/2026 dự kiến tăng 13%, 2027 tăng ~10%; ưu tiên đẩy nhanh các TBA 500 kV cấp điện miền Bắc, đấu nối kho LNG Cái Mép – Thị Vải, giảm ít nhất ~3.000 MW đỉnh miền Bắc.<\/li><li><b>Khung giá điện mặt trời 2026 (pv magazine, 12/11):<\/b> Bộ Công Thương ban hành trần giá theo vùng, hiệu lực 05/11; ĐMT mặt đất không lưu trữ 1.104,32–1.591,02 đ/kWh, cao hơn 2025 ở mọi vùng; vẫn giữ mức cộng thêm cho dự án có lưu trữ.<\/li><li><b>ĐZ 500 kV Bình Dương 1 – Chơn Thành (Báo Đấu thầu, 08/11):<\/b> 16,5 km, 37 cột qua TP.HCM và Đồng Nai, SPMB đại diện EVNNPT; phải bàn giao mặt bằng trước 15/11 để đóng điện trong năm 2026, còn 4 vị trí móng có nguy cơ chậm.<\/li><li><b>EVNNPT – EVNHANOI đồng bộ lưới Thủ đô 2026–2030 (Tạp chí Công Thương, 10/10):<\/b> 61 công trình truyền tải (11 dự án 500 kV, 50 dự án 220 kV), đang triển khai TBA 220 kV Văn Điển, Ứng Hòa và MBA thứ 3 Vân Trì; năm 2026 có 46 ngăn lộ 110–220 kV cần phối hợp.<\/li><li><b>EVNHANOI ứng dụng AI giám sát nhiệt (Vietnam News):<\/b> hệ thống theo dõi nhiệt độ thiết bị theo thời gian thực tại 68 TBA cao áp với 159 MBA, cảnh báo nhiệt bất thường và lưu dữ liệu cho phân tích bảo dưỡng (bài không ghi ngày đăng).<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>TBA 500 kV Bắc Ninh – Gói 9, Lô 9.2 (Báo Đấu thầu, 11/11):<\/b> sau vướng mắc chào vượt giá, EVNNPT phê duyệt Yotek trúng lô 9.2 (dây dẫn, dây chống sét, cách điện, cáp quang, chống sét van) ~277,88 tỷ (8,65 triệu USD + 51,1 tỷ đồng), 210 ngày, trọn gói; cả Gói 9 (gồm MBA) hơn 600 tỷ.<\/li><li><b>TBA 500 kV Nam Định (Báo Đấu thầu, 25/09 – chưa đưa tin):<\/b> TMĐT 1.653,1 tỷ; Gói 13 xây lắp trạm 466,7 tỷ (mở thầu 13/10), Gói 6 MBA 3×300 MVA 426,7 tỷ, Gói 8 thiết bị nhất thứ 214,7 tỷ, Gói 14 ĐZ đấu nối 76,2 tỷ.<\/li><li><b>EVNNPT gọi vốn:<\/b> 5 dự án 1.119 tỷ – hạn <b>17/11<\/b>; 8 dự án ~200,9 triệu EUR – hạn 27/11/2026 (nhắc lại vì sắp đến hạn).<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>Utility Dive (10/11):<\/b> dự luật cấp phép năng lượng được Thượng viện Mỹ thông qua bước đầu nhưng tương lai bất định sau bầu cử giữa kỳ; điều khoản \"public interest\" có thể cho FERC quyền vượt bang khi phê duyệt đường dây truyền tải.<\/li><li><b>Utility Dive (12/11):<\/b> ConEd cùng các utility khác vận động nới quy định New York để được sở hữu nguồn phát, viện dẫn yêu cầu đủ công suất (resource adequacy) – xu hướng utility Mỹ mở rộng vai trò khi tải tăng nhanh.<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer/Substation DT)<\/h2>\n<ul><li><b>CIGRE A2‑11865 (Prolec‑GE):<\/b> \"Smart Transformers\" – nền tảng tích hợp sẵn từ nhà máy gồm cảm biến, analytics on‑board, truyền thông bảo mật cho MBA phân phối phục vụ NLTT và data center; phát hiện lỗi sớm, phân tích dòng công suất ngược, chất lượng điện năng, bảo dưỡng theo tình trạng. Gợi ý mô hình hợp tác \"MBA monitoring‑ready\" với nhà sản xuất trong nước.<\/li><li><b>CIGRE A2‑10762 (Chubu Electric Power Grid &amp; Aichi Electric, Nhật):<\/b> thiết bị IoT giám sát MBA giá rẻ, lắp lên MBA đang vận hành không cần cải tạo hay cắt điện; đo H₂ online tương quan với DGA offline, camera giám sát OLTC/rò dầu, dynamic rating thời gian thực – mẫu tham chiếu tốt cho gói retrofit đội MBA 110 kV ở Việt Nam.<\/li><li><b>arXiv 2512.22190 (J. I. Aizpurua, UPV/EHU):<\/b> tutorial \"Physics‑Informed Machine Learning for Transformer Condition Monitoring – Part I\": nền tảng mạng nơ‑ron, CNN cho phổ âm OLTC, RL điều khiển đóng điện giảm dòng xung kích; Part II đi vào PINN và Bayesian UQ – tài liệu nhập môn cho nhóm R&amp;D làm hot‑spot PINN.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu – Gói thầu 600 tỷ TBA 500 kV Bắc Ninh – <a href=\"https://baodauthau.vn/goi-thau-600-ty-dong-thuoc-du-an-tram-bien-ap-500kv-bac-ninh-go-nut-that-chao-vuot-gia-hoan-tat-chon-nha-thau-post212385.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/goi-thau-600-ty-dong-thuoc-du-an-tram-bien-ap-500kv-bac-ninh-go-nut-that-chao-vuot-gia-hoan-tat-chon-nha-thau-post212385.html<\/a><\/li><li>Báo Đấu thầu – EVNNPT 1.653 tỷ TBA 500 kV Nam Định – <a href=\"https://baodauthau.vn/evnnpt-1653-ty-dong-dau-tu-tram-bien-ap-500-kv-nam-dinh-va-duong-day-dau-noi-post208195.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-1653-ty-dong-dau-tu-tram-bien-ap-500-kv-nam-dinh-va-duong-day-dau-noi-post208195.html<\/a><\/li><li>Báo Đấu thầu – EVNNPT mời ngân hàng thu xếp 1.119 tỷ – <a href=\"https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html<\/a><\/li><li>Báo Đấu thầu – Cảnh báo thách thức cung ứng năng lượng 2027–2028 – <a href=\"https://baodauthau.vn/canh-bao-thach-thuc-cung-ung-nang-luong-giai-doan-2027-2028-post212375.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/canh-bao-thach-thuc-cung-ung-nang-luong-giai-doan-2027-2028-post212375.html<\/a><\/li><li>Báo Đấu thầu – ĐZ 500 kV Bình Dương 1 – Chơn Thành – <a href=\"https://baodauthau.vn/don-luc-hoan-thanh-duong-day-500kv-binh-duong-1-chon-thanh-trong-nam-2026-post212112.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/don-luc-hoan-thanh-duong-day-500kv-binh-duong-1-chon-thanh-trong-nam-2026-post212112.html<\/a><\/li><li>Bộ Công Thương – Hội nghị vận hành HTĐ và cung ứng điện 2027–2028 – <a href=\"https://moit.gov.vn/en/news/moit-holds-conference-on-power-system-operation-and-electricity-supply-for-2027-2028.html\" target=\"_blank\" rel=\"noopener\">https://moit.gov.vn/en/news/moit-holds-conference-on-power-system-operation-and-electricity-supply-for-2027-2028.html<\/a><\/li><li>The Star/ANN – Vietnam among 13 countries maintaining energy stability – <a href=\"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/10/vietnam-among-13-countries-maintaining-energy-stability-amid-unprecedented-energy-shocks-report\" target=\"_blank\" rel=\"noopener\">https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/10/vietnam-among-13-countries-maintaining-energy-stability-amid-unprecedented-energy-shocks-report<\/a><\/li><li>pv magazine (qua now.solar) – Vietnam increases solar tariffs for 2026 – <a href=\"https://now.solar/2026/11/12/vietnam-increases-solar-tariffs-for-2026-maintains-storage-premiums-pv-magazine-global/\" target=\"_blank\" rel=\"noopener\">https://now.solar/2026/11/12/vietnam-increases-solar-tariffs-for-2026-maintains-storage-premiums-pv-magazine-global/<\/a><\/li><li>Tạp chí Công Thương – EVNNPT và EVNHANOI phối hợp đầu tư lưới Thủ đô – <a href=\"https://tapchicongthuong.vn/evnnpt-va-evnhanoi-tang-cuong-phoi-hop--dong-bo-dau-tu-de-dam-bao-cung-cap-dien-cho-thu-do-556577.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/evnnpt-va-evnhanoi-tang-cuong-phoi-hop--dong-bo-dau-tu-de-dam-bao-cung-cap-dien-cho-thu-do-556577.htm<\/a><\/li><li>Vietnam News – AI cameras help Hà Nội power grid detect faults early – <a href=\"https://vietnamnews.vn/economy/1803693/ai-cameras-help-ha-noi-power-grid-detect-faults-early.html\" target=\"_blank\" rel=\"noopener\">https://vietnamnews.vn/economy/1803693/ai-cameras-help-ha-noi-power-grid-detect-faults-early.html<\/a><\/li><li>Utility Dive – Permitting bill advances in Senate – <a href=\"https://www.utilitydive.com/news/permitting-bill-advances-in-senate-but-its-future-is-uncertain-after-democ/874250/\" target=\"_blank\" rel=\"noopener\">https://www.utilitydive.com/news/permitting-bill-advances-in-senate-but-its-future-is-uncertain-after-democ/874250/<\/a><\/li><li>Utility Dive – Transmission &amp; Distribution feed (ConEd, 12/11) – <a href=\"https://www.utilitydive.com/topic/transmission-distribution/\" target=\"_blank\" rel=\"noopener\">https://www.utilitydive.com/topic/transmission-distribution/<\/a><\/li><li>e‑CIGRE – A2‑11865 Smart Transformers (Prolec‑GE) – <a href=\"https://www.e-cigre.org/publications/detail/a2-11865-2026-smart-transformers-an-integrated-solution-for-grid-visibility-and-asset-management-in-renewable-energy-and-data-center-applications.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11865-2026-smart-transformers-an-integrated-solution-for-grid-visibility-and-asset-management-in-renewable-energy-and-data-center-applications.html<\/a><\/li><li>e‑CIGRE – A2‑10762 Transformer monitoring device using IoT (Chubu) – <a href=\"https://www.e-cigre.org/publications/detail/a2-10762-2026-development-of-transformer-monitoring-device-using-iot-technology-for-condition-based-maintenance.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-10762-2026-development-of-transformer-monitoring-device-using-iot-technology-for-condition-based-maintenance.html<\/a><\/li><li>arXiv 2512.22190 – Physics‑Informed ML for Transformer Condition Monitoring, Part I – <a href=\"https://arxiv.org/pdf/2512.22190\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/pdf/2512.22190<\/a><\/li><\/ul>"}, {"day": "2026-11-13", "title": "Bản tin năng lượng & Cơ hội VTI – 13/11/2026", "html": "<blockquote>Tổng hợp từ báo chí và tài liệu công khai (CafeF, Năng lượng Việt Nam, Báo Đấu thầu, Công Luận, Dân trí, VTV, Bnews, Điện tử &amp; Ứng dụng, pvpower.vn, Siemens Energy, T&amp;D World, Transformer Magazine, Utility Dive, CIGRE, arXiv, Frontiers); tin đã đưa 10–12/11 chỉ nhắc lại khi có diễn biến mới. <b>Đính chính:<\/b> gói giám sát MBA NMĐ Nhơn Trạch 1 (bản tin 12/11) thực tế đã hết hạn báo giá từ 29/08/2026. Luôn tải và đọc kỹ YCKT/HSMT, xác nhận hạn trên trang bên mời trước khi quyết định chào giá/dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVN kiểm tra 2 TBA số thí điểm của EVNHANOI (05/11)<\/b>: 110 kV Phùng Xá (Process Bus toàn trạm) và 110 kV Nhật Tân (merging unit tại MC 112). EVNHANOI vận hành và lấy dữ liệu được, nhưng cấu hình, tích hợp thiết bị và xử lý sự cố phức tạp vẫn phụ thuộc nhà thầu/nhà sản xuất; EVN yêu cầu rà soát đồng bộ thời gian, hoàn thiện tài liệu, đào tạo, đánh giá trước khi nhân rộng<\/td><td>Đúng năng lực <b>IEC 61850 (SCL, 9‑2 SV, PTP time sync) + Substation DT<\/b>: khoảng trống \"năng lực nội bộ\" là chỗ VTI chen vào bằng dịch vụ kỹ thuật + công cụ<\/td><td>Đề xuất EVNHANOI gói <b>dịch vụ hỗ trợ kỹ thuật/đào tạo TBA số<\/b> + công cụ kiểm tra cấu hình SCD, giám sát PTP/GOOSE/SV; dùng Phùng Xá làm PoC Substation DT 110 kV<\/td><td>Trước khi EVN chốt giải pháp nhân rộng (đang đánh giá – nên tiếp cận trong Q4/2026)<\/td><\/tr><tr><td>2<\/td><td><b>PV Power – giám sát khí MBA chính NMĐ Cà Mau 2 (2026)<\/b> – vẫn là cơ hội mở; <b>gói NT1 đã hết hạn (29/08/2026)<\/b><\/td><td>Gói nhỏ H₂ + ẩm + phần mềm; PV Power mua theo chu kỳ (Cà Mau 1 năm 2025 → NT1 tháng 8/2026 → Cà Mau 2)<\/td><td>Gọi Ban Thương mại PV Power xác nhận hạn CM2 và hỏi kết quả gói NT1 (ai trúng, cấu hình) để định vị; xin đăng ký vào danh sách nhà cung cấp cho các nhà máy còn lại (Vũng Áng 1, Hủa Na, Đakđrinh…)<\/td><td>Xác nhận ngay trong tuần<\/td><\/tr><tr><td>3<\/td><td><b>EVNNPT gọi vốn 5 dự án 1.119 tỷ<\/b> (Bắc Tân Uyên, MBA 63 MVA tại Chèm, nâng công suất Yên Bái…) và <b>8 dự án ~200,9 triệu EUR<\/b><\/td><td>Sau khi chốt vốn sẽ ra KHLCNT thiết bị/MBA → cửa cho monitoring MBA<\/td><td>Đặt cảnh báo muasamcong theo tên dự án; chuẩn bị hồ sơ năng lực + datasheet monitoring \"EVNNPT-ready\"<\/td><td><b>17/11/2026<\/b> (còn 4 ngày); <b>27/11/2026<\/b><\/td><\/tr><tr><td>4<\/td><td><b>TBA 110 kV Lập Thạch 4 (Stavian ED, 2×63 MVA, ~197 tỷ) khởi công 12/11<\/b> – nhà phân phối điện tư nhân cấp điện KCN<\/td><td>Chủ đầu tư tư nhân ít ràng buộc khung thiết bị, quyết định nhanh; KCN cần độ tin cậy cao<\/td><td>Liên hệ Stavian ED/nhà thầu EPC chào <b>gói monitoring MBA 63 MVA + SCADA/asset health<\/b> ngay từ giai đoạn mua sắm thiết bị<\/td><td>Đang khởi công → mua sắm thiết bị trong 1–3 tháng tới<\/td><\/tr><tr><td>5<\/td><td><b>Khung giá phát điện BESS 2026: tối đa 3.209,98 đ/kWh (QĐ Bộ Công Thương 11/11)<\/b> + EVNNPC đã đóng điện BESS tại <b>37 TBA<\/b><\/td><td>Lần đầu có khung giá cho BESS → nhà đầu tư tư nhân sẽ triển khai BESS độc lập; cần EMS, giám sát nhiệt/SoH, tích hợp SCADA<\/td><td>Soạn one-pager \"BESS monitoring &amp; health analytics\"; tiếp cận nhà đầu tư/EPC BESS (GG Power, VinEnergo, Á Châu) làm thầu phụ phần mềm<\/td><td>Dự án BESS độc lập dự kiến khởi động 2027<\/td><\/tr><tr><td>6<\/td><td><b>ĐZ 220 kV Thanh Hóa – Sầm Sơn đóng điện 11/11<\/b>; TBA 220 kV Sầm Sơn đang thi công<\/td><td>TBA mới của EVNNPT/PTC1 → cơ hội monitoring MBA/SCADA nếu còn hạng mục chưa mua<\/td><td>Kiểm tra trên muasamcong các gói thiết bị TBA 220 kV Sầm Sơn còn mở; liên hệ CPMB<\/td><td>Đóng điện TBA dự kiến sắp tới<\/td><\/tr><\/table>\n<p><i>Nhận xét: hôm nay không có gói chào giá trực tiếp mới; cơ hội #1 (dịch vụ TBA số EVNHANOI) là hướng chiến lược đáng đầu tư nhất.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN kiểm tra TBA số EVNHANOI (Điện tử &amp; Ứng dụng, 07/11):<\/b> 2 TBA 110 kV Phùng Xá (Process Bus) và Nhật Tân (merging unit) vận hành ổn định nhưng cấu hình/xử lý sự cố phức tạp còn cần nhà sản xuất; EVN yêu cầu đánh giá kỹ trước khi chọn giải pháp cho dự án tiếp theo.<\/li><li><b>Đóng điện ĐZ 220 kV Thanh Hóa – Sầm Sơn (CafeF, 12/11):<\/b> 2 mạch, 40,1 km, đấu nối TBA 500 kV Thanh Hóa – TBA 220 kV Sầm Sơn; đóng điện chiều 11/11, PTC1 tiếp nhận vận hành.<\/li><li><b>ĐZ 220 kV Hiệp Hòa – Phú Bình 2 (Năng lượng VN, 12/11):<\/b> Bắc Ninh chấp thuận EVNNPT làm nhà đầu tư (QĐ 3034/QĐ-UBND ngày 11/11); 18,9 km (0,4 km cáp ngầm) + 2 ngăn lộ 220 kV tại TBA 500 kV Hiệp Hòa; vận hành chậm nhất Q2/2029.<\/li><li><b>EVNNPC 10 tháng 2026 (Công Luận, 12/11):<\/b> sản lượng tháng 10 tăng 19,45%; khởi công 51 và đóng điện 49 công trình 110 kV; BESS đã đóng điện tại 37 TBA; SAIDI giảm &gt;50%.<\/li><li><b>EVNSPC kịch bản cấp điện 2027 (Dân trí, 12/11):<\/b> Pmax 10 tháng 11.115 MW (+6,7%); giai đoạn 2026–2030 khoảng 400 dự án 110 kV, tổng vốn ~85.000 tỷ; Cần Thơ bố trí &gt;1.791 tỷ cho 50 công trình năm 2027.<\/li><li><b>TBA 110 kV Lập Thạch 4 khởi công (VTV, 12/11):<\/b> Stavian ED, 2×63 MVA + 1,43 km ĐZ mạch kép, ~197 tỷ, cấp điện KCN Stavian Vĩnh Phúc.<\/li><li><b>Ký hợp đồng BOT NĐ Nam Định I 1.200 MW (Bnews, 12/11):<\/b> 2×600 MW, phấn đấu vận hành năm 2030.<\/li><li><b>TBD (Thiết bị điện Đông Anh) thay đổi thành viên HĐQT (CafeF, 12/11):<\/b> ĐHCĐ bất thường 07/11 miễn nhiệm và bầu mới 1 thành viên nhiệm kỳ 2026–2031 – theo dõi vì TBD là nhà sản xuất MBA lớn trong nước, đối tác tiềm năng cho MBA \"monitoring-ready\".<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>Khung giá BESS 2026 (Báo Đấu thầu, 12/11):<\/b> tối đa 3.209,98 đ/kWh (chưa VAT), giả định 2 giờ xả, ≥8.000 chu kỳ, suy giảm 2%/năm, hiệu suất 85%, tuổi thọ 15 năm.<\/li><li><b>Gói 1 đấu nối TBA 220 kV Phú Mỹ 3 (EVNHCMC, 06/11):<\/b> Năng lượng Tam Sơn trúng 67,67 tỷ (giảm &gt;5%), 180 ngày.<\/li><li><b>PV Power:<\/b> gói giám sát MBA Nhơn Trạch 1 đã đóng nhận báo giá 29/08/2026; gói giám sát khí MBA Cà Mau 2 cần xác nhận hạn.<\/li><li><b>EVNNPT gọi vốn:<\/b> 5 dự án 1.119 tỷ – hạn 17/11; 8 dự án ~200,9 triệu EUR – hạn 27/11/2026.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>Siemens Energy FY2026 (11/11):<\/b> đơn hàng €68,1 tỷ, doanh thu €44,2 tỷ, backlog kỷ lục €164 tỷ; mảng Grid Technologies tăng doanh thu 26,2%, biên lợi nhuận 18,9% – nhu cầu thiết bị lưới vẫn rất nóng.<\/li><li><b>DTE Energy (Utility Dive, 06/11):<\/b> kế hoạch đầu tư 5 năm 2027–2031 tăng lên $44,2 tỷ, trong đó $12 tỷ cho lưới phân phối.<\/li><li><b>Mỹ dừng xem xét 3 hành lang truyền tải NIETC cuối cùng (Transformer Magazine, 10/11)<\/b> – mất một kênh cấp phép nhanh trong khi tải data center tăng → áp lực khai thác tối đa tài sản hiện hữu (lợi thế cho monitoring/DT).<\/li><li><b>T&amp;D World (04/11) – \"The Missing Layer of Transformer Protection\":<\/b> hệ ATRIS dùng dòng nitơ và mức dầu để tự cô lập phân đoạn bộ tản nhiệt bị rò, giữ MBA tiếp tục vận hành – ý tưởng \"monitoring → hành động\" cho DT.<\/li><li><b>Transformer Magazine số tháng 11/2026:<\/b> chủ đề MBA thông minh và dữ liệu tình trạng hỗ trợ quyết định bảo dưỡng/đầu tư.<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer/Substation DT)<\/h2>\n<ul><li><b>arXiv 2609.20214 (ĐH Bách khoa – ĐH Đà Nẵng):<\/b> bộ phân loại lượng tử biến phân 2 qubit mã hóa tọa độ Duval triangle/pentagon từ DGA; đạt 99,15% trên tập IEC TC10 (118 mẫu), 95,76% khi có nhiễu 10% → nhóm nghiên cứu trong nước có thể hợp tác về dữ liệu DGA.<\/li><li><b>Frontiers in Smart Grids (06/2026):<\/b> DT MBA kết hợp mô hình 3D từ quét laser + Random Forest tối ưu bằng Snake Optimization trên 5 khí DGA; độ chính xác 93,8% nhưng yếu với quá nhiệt trung bình (F1 68%) → minh chứng cần thêm mô hình nhiệt vật lý.<\/li><li><b>CIGRE TB 995 + ELECTRA 347 (08/2026):<\/b> \"Digital twins for modern power utilities\" tổng kết lợi ích DT cho asset management, TBA số và tích hợp NLTT – tài liệu tham chiếu khi thuyết trình với EVN.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Điện tử &amp; Ứng dụng – EVNHANOI vẫn cần nhà sản xuất hỗ trợ tại TBA số – <a href=\"https://dientuungdung.vn/evnhanoi-van-can-nha-san-xuat-ho-tro-xu-ly-su-co-tai-tram-bien-ap-so-19495.html\" target=\"_blank\" rel=\"noopener\">https://dientuungdung.vn/evnhanoi-van-can-nha-san-xuat-ho-tro-xu-ly-su-co-tai-tram-bien-ap-so-19495.html<\/a><\/li><li>CafeF – Đóng điện ĐZ 220 kV Thanh Hóa–Sầm Sơn – <a href=\"https://cafef.vn/dong-dien-thanh-cong-duong-day-220-kv-thanh-hoa-sam-son-188261111231721935.chn\" target=\"_blank\" rel=\"noopener\">https://cafef.vn/dong-dien-thanh-cong-duong-day-220-kv-thanh-hoa-sam-son-188261111231721935.chn<\/a><\/li><li>Năng lượng Việt Nam – Chấp thuận nhà đầu tư ĐZ 220 kV Hiệp Hòa–Phú Bình 2 – <a href=\"https://nangluongvietnam.vn/chap-thuan-nha-dau-tu-du-an-duong-day-220kv-hiep-hoa-bac-ninh-phu-binh-2-thai-nguyen-36905.html\" target=\"_blank\" rel=\"noopener\">https://nangluongvietnam.vn/chap-thuan-nha-dau-tu-du-an-duong-day-220kv-hiep-hoa-bac-ninh-phu-binh-2-thai-nguyen-36905.html<\/a><\/li><li>Công Luận – EVNNPC đẩy mạnh đầu tư lưới điện 10 tháng 2026 – <a href=\"https://congluan.vn/evnnpc-day-manh-dau-tu-luoi-dien-trong-10-thang-nam-2026-dap-ung-nhu-cau-tang-truong-kinh-te-post367218.html\" target=\"_blank\" rel=\"noopener\">https://congluan.vn/evnnpc-day-manh-dau-tu-luoi-dien-trong-10-thang-nam-2026-dap-ung-nhu-cau-tang-truong-kinh-te-post367218.html<\/a><\/li><li>Dân trí – EVNSPC chủ độn
