const NEWS=[{"day": "2026-11-26", "title": "Bản tin năng lượng & Cơ hội VTI – 26/11/2026", "html": "<blockquote>Tổng hợp từ Vietnam News, Bnews, Báo Công Lý, T&amp;D World, Transformer Magazine, MDPI Energies; sáng thứ Năm ít tin mới trong 72 giờ qua nên bản tin ngắn, tin cũ chỉ nhắc khi có mốc mới (ghi ngày đăng). Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>EVNNPT – hạn ngân hàng nộp hồ sơ thu xếp vốn là 8h30 ngày 27/11/2026 (ngày mai):<\/b> đã đọc bài gốc Vietnam News, xác minh hạn và danh sách 8 dự án (tối đa 200,9 triệu EUR), gồm 6 TBA 220 kV mới, 1 đường dây 220 kV và TBA 500 kV Long An.<\/li><li><b>MDPI Energies (24/11/2026) – review phê phán AI &amp; Digital Twin cho bảo trì dự đoán trạm cao áp:<\/b> các DT hiện có mới ở mức mô hình số/\"digital shadow\", chưa có DT vòng kín kiểm chứng hiện trường.<\/li><li><b>EVN kế hoạch tháng 11 (Bnews, 03/11):<\/b> đóng điện toàn tuyến 220 kV Nhơn Trạch 3 – TBA 500 kV Long Thành; EVNNPC hoàn thành lắp BESS tổng 805 MW.<\/li><li><b>EVNNPC (Báo Công Lý, 13/11):<\/b> 10 tháng đóng điện 49/51 dự án 110 kV, BESS đã đóng điện tại 37 TBA, SAIDI giảm hơn 50% (số liệu đơn vị tự công bố).<\/li><li><b>BrightAI huy động 97 triệu USD (T&amp;D World, 18/11):<\/b> GE Vernova tham gia đầu tư và là khách hàng; hướng \"physical AI\" cho giám sát tài sản.<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>8 dự án EVNNPT đang thu xếp vốn: TBA 220 kV Ứng Hòa, Tân Việt, Bến Cát 2, Thanh Hà, Lý Nhân, TBA 220 kV đấu vào Đông Anh – Vân Trì, TBA 500 kV Long An, ĐZ 220 kV Bắc Ninh 500 – Bắc Ninh 4<\/b><\/td><td>Chốt vốn là bước trước KHLCNT thiết bị; mỗi TBA mới có MBA cần DGA/bushing/nhiệt online<\/td><td>Lập danh sách theo chủ đầu tư/Ban QLDA, gửi bộ datasheet cho PTC/NPMB/SPMB phụ trách Long An, Bến Cát 2<\/td><td>TB<\/td><td>Hạn ngân hàng 27/11/2026 8h30; KHLCNT thiết bị chưa rõ<\/td><\/tr><tr><td>2<\/td><td><b>BESS EVNNPC: 37 TBA đã đóng điện, mục tiêu 805 MW<\/b><\/td><td>Container BESS và TBA đấu nối cần giám sát nhiệt, khí off-gas, tích hợp SCADA<\/td><td>Chuẩn bị tài liệu giám sát nhiệt + phát hiện khí cho BESS; hẹn Ban QLDA điện 2<\/td><td>TB<\/td><td>Theo dõi, hoàn thành mục tiêu cuối 2026<\/td><\/tr><tr><td>3<\/td><td><b>Phú Quốc phục vụ APEC 2027: TBA 220 kV Phú Quốc đã đóng điện<\/b><\/td><td>MBA/GIS mới = thời điểm baseline DGA/PD/nhiệt; hạ tầng đảo cần vận hành không người trực<\/td><td>Hỏi EVNSPC/PTC về nhu cầu giám sát bổ sung<\/td><td>Thấp<\/td><td>Trước APEC 2027<\/td><\/tr><tr><td>4<\/td><td><b>Khung DT/HI/độ bất định theo review MDPI 24/11<\/b><\/td><td>Cho luận điểm chào hàng: HI cần dữ liệu cảm biến sạch, khuyến nghị kèm độ bất định, kỹ sư giữ vai trò quyết định<\/td><td>Thêm 1 slide \"Asset Health có kiểm soát chất lượng dữ liệu và độ bất định\" vào tài liệu Transformer DT<\/td><td>Thấp<\/td><td>Nội bộ, 12/2026<\/td><\/tr><\/table>\n<p><i>Không có cơ hội \"Cao\" thật sự hôm nay; không nâng ưu tiên cho đẹp bảng. Không thấy HSMT mới về giám sát online.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN 10 tháng và kế hoạch cuối năm (Bnews, 03/11):<\/b> đóng điện 137 công trình 110–500 kV (5 dự án 500 kV, 16 dự án 220 kV, 116 dự án 110 kV), khởi công 150 công trình; đóng điện AT1 900 MVA TBA 500 kV Di Linh và 3 công trình Phú Quốc (TBA 220 kV Phú Quốc, 2 đường dây 110 kV). Tháng 11 kế hoạch đóng điện toàn tuyến 220 kV Nhơn Trạch 3 – Long Thành; Quảng Trạch I (1.403 MW) vận hành thương mại cả 2 tổ máy trong 2026. Sản lượng tháng 10 là 31,58 tỷ kWh (+14,3%), dự báo tháng 11 là 28,9 tỷ kWh (+14,4%). Ý nghĩa: phụ tải tăng hai con số, MBA chạy sát tải, nhu cầu giám sát nhiệt/DGA tăng.<\/li><li><b>EVNNPC (Báo Công Lý, 13/11):<\/b> thương phẩm 10 tháng 100,36 tỷ kWh (+12,39%); điện mặt trời mái nhà phát triển mới hơn 18.600 khách hàng (~813 MW); SAIDI giảm hơn 50%. Bài không nêu tên công trình 110 kV cụ thể.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>EVNNPT mời ngân hàng thu xếp tối đa 200,9 triệu EUR (~224,9 triệu USD) cho 8 dự án (Vietnam News; bài không ghi ngày đăng):<\/b> hồ sơ nộp Ban Tài chính – Kế toán EVNNPT trước 8h30 27/11/2026. Vốn từng dự án (triệu EUR): Ứng Hòa 3,3; Tân Việt 18,6; Đông Anh – Vân Trì 35,3; Bến Cát 2 31,6; Thanh Hà 20,1; Lý Nhân 13,5; Bắc Ninh 500 – Bắc Ninh 4 29,5; Long An 500 kV 39. Lưu ý: cộng các khoản ra 190,9 triệu EUR, lệch so với tổng 200,9 trong bài; cần đối chiếu nguồn chính thức.<\/li><li>Chưa mở được muasamcong.mpi.gov.vn nên không có KHLCNT/HSMT mới.<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li><b>BrightAI (T&amp;D World, 18/11):<\/b> huy động 97 triệu USD (Smith Point Capital dẫn đầu; GE Vernova tham gia), tổng vốn 184 triệu USD; nền tảng cảm biến + edge + AI + drone/robot, công ty nói chạy tại hơn 50.000 địa điểm và khoảng 60% thị trường tiềm năng ngoài Bắc Mỹ. Bài tập trung tài sản điểm rải rác, không nói về MBA/TBA. Ý nghĩa: dòng vốn vào giám sát tài sản có AI; GE Vernova mở rộng hệ sinh thái giám sát, VTI nên nhấn mạnh độc lập hãng và chuyên sâu MBA/GIS/cáp.<\/li><li><b>EG.D (E.ON) thí điểm LiDAR 3D + digital twin tại TBA cao áp ở Séc (Transformer Magazine, 29/06/2026; tin cũ):<\/b> quét liên tục, camera tự hướng theo đối tượng, vùng an toàn 3D cảnh báo thời gian thực; bài không có số liệu kết quả. Chỉ nêu làm use case DT trạm không người trực.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li>Không tìm được tin quốc tế mới có ngày kiểm chứng trong 72 giờ qua ngoài BrightAI ở mục trên; không độn tin cũ.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li><b>MDPI Energies 19(23):5693 (online 24/11/2026; Bulăcel, Costinaș, Opriș – ĐH POLITEHNICA Bucharest và Rețele Electrice România) – Review AI &amp; Digital Twin cho bảo trì dự đoán trạm cao áp:<\/b> review tường thuật phê phán (không meta-analysis) bài 2020–2026. Kết luận: thực tiễn vẫn dựa vào chẩn đoán offline (nhất là DGA), giám sát online cho tài sản quan trọng và health index; mô hình AI chính xác cao nhưng chủ yếu kiểm chứng ở phòng thí nghiệm/dữ liệu một đơn vị, hiếm khi lượng hóa độ bất định; các DT được xét mới là digital shadow; chưa thấy DT kiểm chứng hiện trường cho máy cắt cao áp. Khuyến nghị: dữ liệu benchmark mở, thử nghiệm hiện trường nhiều năm, giao diện DT chuẩn hóa. Ý nghĩa thực tế: kiểm tra chất lượng dữ liệu DGA/cảm biến trước khi tin HI, thận trọng với trọng số HI do chuyên gia đặt, giữ kỹ sư trong vòng quyết định. (Em chỉ đọc được phần đầu bài; phần kết luận một phần dựa trên bản tóm tắt tự động.)<\/li><li><b>CIGRE A2 11862-2026 – Phát triển công nghệ DT cho MBA tại một utility lớn:<\/b> chỉ thấy tiêu đề trên e-cigre, chưa đọc nội dung; nên lấy toàn văn.<\/li><li>Không tìm thấy tiêu chuẩn IEC/IEEE mới hoặc sửa đổi có ngày công bố trong 72 giờ qua.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Chỉ ~13 tin, dưới mức 15–25 vì ít tin mới có ngày xác minh; nhiều kết quả tìm kiếm chỉ là trang thẻ/chuyên mục không ngày. Không độn tin cũ.<\/li><li>Không mở được muasamcong.mpi.gov.vn, npt.com.vn; không thấy tin sản phẩm có ngày của Hitachi/Siemens/Qualitrol/Doble/Megger.<\/li><li>Bài Vietnam News về EVNNPT không ghi ngày đăng; tổng các khoản từng dự án lệch với tổng nêu trong bài. Số liệu EVN/EVNNPC là tự công bố. Review MDPI chỉ đọc một phần. Chưa có tin xác nhận Yên Dũng/Chân Mây đã đóng điện.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Vietnam News – EVNNPT seeks over $224 mln in bank loans for grid expansion – <a href=\"https://vietnamnews.vn/economy/1801912/evnnpt-seeks-over-224-mln-in-bank-loans-for-grid-expansion.html\" target=\"_blank\" rel=\"noopener\">https://vietnamnews.vn/economy/1801912/evnnpt-seeks-over-224-mln-in-bank-loans-for-grid-expansion.html<\/a><\/li><li>Bnews – EVN hoàn thành đóng điện gần 140 công trình lưới – <a href=\"https://bnews.vn/evn-hoan-thanh-dong-dien-gan-140-cong-trinh-luoi/442893.html\" target=\"_blank\" rel=\"noopener\">https://bnews.vn/evn-hoan-thanh-dong-dien-gan-140-cong-trinh-luoi/442893.html<\/a><\/li><li>Báo Công Lý – EVNNPC hoàn thành đóng điện 49 dự án trong 10 tháng – <a href=\"https://congly.vn/evnnpc-hoan-thanh-dong-dien-49-du-an-trong-10-thang-547502.html\" target=\"_blank\" rel=\"noopener\">https://congly.vn/evnnpc-hoan-thanh-dong-dien-49-du-an-trong-10-thang-547502.html<\/a><\/li><li>T&amp;D World – BrightAI raises $97 million – <a href=\"https://tdworld.com/utility-business/news/55419892/brightai-raises-97-million-to-expand-ai-technology-for-infrastructure-monitoring\" target=\"_blank\" rel=\"noopener\">https://tdworld.com/utility-business/news/55419892/brightai-raises-97-million-to-expand-ai-technology-for-infrastructure-monitoring<\/a><\/li><li>Transformer Magazine – EG.D brings 3D awareness to substations – <a href=\"https://transformer-magazine.com/news/eg-d-brings-3d-awareness-to-substations/\" target=\"_blank\" rel=\"noopener\">https://transformer-magazine.com/news/eg-d-brings-3d-awareness-to-substations/<\/a><\/li><li>MDPI Energies – Analysis and Critical Review of AI and Digital Twin Approaches for Predictive Maintenance in High-Voltage Substations – <a href=\"https://mdpi.com/1996-1073/19/23/5693\" target=\"_blank\" rel=\"noopener\">https://mdpi.com/1996-1073/19/23/5693<\/a><\/li><li>e-CIGRE – A2 11862 2026 Digital twin technologies for power transformers – <a href=\"https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html<\/a><\/li><\/ul>"}, {"day": "2026-11-25", "title": "Bản tin năng lượng & Cơ hội VTI – 25/11/2026", "html": "<blockquote>Tổng hợp từ Báo Đấu thầu, VietnamPlus, EVN (bản tiếng Anh), Verdantix, Energy-Storage.news, PHM Society/arXiv; sáng thứ Tư ít tin mới trong 72 giờ qua nên bản tin ngắn, tin cũ chỉ nhắc khi có mốc mới (ghi ngày đăng). Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>EVNNPT – hạn thu xếp vốn 8 dự án ~200 triệu EUR là 27/11/2026 (còn 2 ngày):<\/b> nhắc lại, tin gốc Báo Đấu thầu 08/10 (\"cần thu xếp hơn 200 triệu EUR cho 8 dự án\"); chưa xác minh lại hạn chính xác.<\/li><li><b>GE Vernova mua Trench Group (bushing, CT/VT cao áp) giá 9,0 tỷ USD (Verdantix, 18/11; công bố 28/10):<\/b> dự kiến hoàn tất cuối 2027, cần phê duyệt pháp lý; bushing chỉ 5–8% giá MBA nhưng thiếu là không giao được MBA.<\/li><li><b>EVN dự kiến đầu tư ~830.000 tỷ đồng giai đoạn 2026–2030, mục tiêu 15 dự án nguồn 6.066 MW (Báo Đấu thầu, 19/11):<\/b> nhiều dự án khởi công trong tháng 11 (Đông Phù Yên 1.200 MW, điện gió/điện mặt trời Gia Lai, Nam Định I BOT).<\/li><li><b>EVNNPT mời ngân hàng thu xếp 1.119 tỷ đồng cho 5 dự án truyền tải (Báo Đấu thầu, 05/11):<\/b> mới đọc được tiêu đề, chưa đọc nội dung.<\/li><li><b>TBA 500 kV Di Linh: đóng điện MBA AT1 900 MVA (EVN công bố 03/11, VietnamPlus):<\/b> cùng kỳ đóng điện 137 công trình 110–500 kV trong 10 tháng.<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVNNPT gọi vốn 8 dự án ~200 triệu EUR + 5 dự án 1.119 tỷ đồng<\/b><\/td><td>Chốt vốn là bước trước KHLCNT thiết bị; dự án mới là chỗ chen vào hạng mục giám sát<\/td><td>Hoàn thiện datasheet DGA/bushing/nhiệt \"EVNNPT-ready\"; xin danh sách 8 dự án từ PTC/NPMB<\/td><td>TB<\/td><td>27/11/2026 (cần kiểm tra)<\/td><\/tr><tr><td>2<\/td><td><b>Chuỗi cung ứng bushing/MBA siết chặt (GE Vernova–Trench)<\/b><\/td><td>Lead time MBA/bushing dài làm tăng giá trị kéo dài tuổi thọ thiết bị đang chạy bằng bushing monitoring, DGA online, RTTR<\/td><td>Làm 1 trang chào hàng \"bushing monitoring cho MBA hiện hữu\" dựa trên luận điểm này<\/td><td>TB<\/td><td>Nội bộ, 12/2026<\/td><\/tr><tr><td>3<\/td><td><b>BESS EVNNPC/EVNHANOI (155 MW đã hoàn thành, mục tiêu 305 MW miền Bắc; 550 MW + 300 MW đang làm thủ tục)<\/b><\/td><td>Container BESS cần giám sát nhiệt/khí off-gas, tích hợp SCADA<\/td><td>Chuẩn bị giải pháp giám sát nhiệt + phát hiện khí cho BESS; hỏi Ban QLDA điện 2, PC3<\/td><td>TB<\/td><td>Theo dõi (số liệu tại 06/10)<\/td><\/tr><tr><td>4<\/td><td><b>TBA mới đóng điện: Di Linh AT1 500 kV 900 MVA; Yên Dũng/Chân Mây 220 kV (chưa xác nhận)<\/b><\/td><td>MBA mới = thời điểm baseline DGA/nhiệt<\/td><td>Hỏi PTC4/NPMB về nhu cầu giám sát nghiệm thu<\/td><td>Thấp<\/td><td>12/2026<\/td><\/tr><tr><td>5<\/td><td><b>Cảm biến ảo nhiệt MBA (Neural ODE, Statnett)<\/b> (nhắc lại)<\/td><td>Hướng DT nhiệt để kiểm tra chéo hot-spot, cần ≥ 3 tháng dữ liệu online<\/td><td>Đưa vào lộ trình Transformer DT, thử với dữ liệu khách<\/td><td>Thấp<\/td><td>Theo dõi<\/td><\/tr><\/table>\n<p><i>Không có cơ hội \"Cao\" thật sự hôm nay; không nâng ưu tiên cho đẹp bảng. Không thấy HSMT mới về giám sát online.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN đầu tư 2026–2030 (Báo Đấu thầu, 19/11):<\/b> khoảng 830.000 tỷ đồng (bình quân 166.000 tỷ/năm); 15 dự án nguồn 6.066 MW, riêng công ty mẹ 7 dự án 4.673 MW. Khởi công: điện gió Tây Hồ – Chư Prông 49,5 MW (&gt;1.569 tỷ) và điện mặt trời nổi Bàu Cạn 35 MW (&gt;612 tỷ) tại Gia Lai (18/11, vận hành 2028); thủy điện tích năng Đông Phù Yên 1.200 MW (~27.871 tỷ, 14/11); Nam Định I 1.200 MW ký BOT 12/11; Vân Canh 2 180 MW (7/11); Buôn Hồ 3 (15/11, vận hành quý III/2027). Ý nghĩa: nguồn mới kéo theo TBA tăng áp và đấu nối, nhu cầu giám sát MBA tăng áp ở giai đoạn 2027–2028.<\/li><li><b>EVN 10 tháng (VietnamPlus, 03/11):<\/b> sản lượng 297,4 tỷ kWh (+9,8%), tháng 11 dự kiến 28,9 tỷ kWh (+14,4%); khởi công 150 công trình, đóng điện 137 công trình 110–500 kV; đóng điện AT1 500 kV Di Linh 900 MVA và 3 công trình phục vụ APEC 2027 tại Phú Quốc (TBA 220 kV Phú Quốc, 2 đường dây 110 kV); Quảng Trạch I 1.403 MW cơ bản hoàn thành, Quảng Trạch II LNG 1.612,8 MW đã khởi công, Bác Ái tích năng 1.200 MW đã ký hợp đồng thiết bị. Ý nghĩa: phụ tải tăng hai con số làm MBA vận hành sát tải, tăng nhu cầu giám sát nhiệt/DGA.<\/li><li><b>EVNNPT – tiến độ truyền tải (Báo Đấu thầu, 08/11):<\/b> hai bài về đường dây 500 kV Bình Dương 1 – Chơn Thành (hoàn thành trong 2026) và chạy đua tiến độ trước áp lực cung ứng 2027; em chỉ đọc được tiêu đề, chưa đọc nội dung.<\/li><li><b>Đồng Nai – KCN Nhơn Trạch 220 kV (EVN, 31/08):<\/b> bản tin cũ, chỉ nêu làm mốc: đóng điện AT2 250 MVA (tổng 500 MVA), nhà máy Nhơn Trạch 3 đấu nối.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>EVNNPT mời ngân hàng thu xếp 1.119 tỷ đồng cho 5 dự án truyền tải (Báo Đấu thầu, 05/11):<\/b> chỉ đọc được tiêu đề; cần xem hạn nộp hồ sơ trên bài gốc.<\/li><li><b>Đường dây 220 kV Mỏ Cày – Mỹ Tho, hơn 923 tỷ đồng (Báo Đấu thầu, 26/10):<\/b> chỉ đọc tiêu đề; dự án đường dây, liên quan DTS/cáp ngầm ở mức thấp.<\/li><li><b>Trạm cắt 500 kV Hòa Bình 2 gần 1.876 tỷ đồng (Báo Đấu thầu, 27/08) và chấp thuận đường dây 500 kV Hòa Bình 2 – Tây Hà Nội (18/09):<\/b> chỉ đọc tiêu đề; dự án GIS 500 kV tiềm năng cho PD/giám sát, theo dõi KHLCNT.<\/li><li><b>TOJI trúng Gói 9 thiết bị TBA 220 kV Yên Dũng (Báo Đấu thầu, 09/09):<\/b> 1,92 triệu USD + 18,13 tỷ đồng (~68,83 tỷ), 180 ngày, trọn gói. Chưa có tin xác nhận Yên Dũng đã đóng điện.<\/li><li>Chưa mở được muasamcong.mpi.gov.vn nên không có KHLCNT/HSMT mới.<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li><b>GE Vernova mua Trench (Verdantix, 18/11):<\/b> giá 9,0 tỷ USD (~13 lần EBITDA kỳ vọng 2028), Trench có hơn 800 khách và khoảng 5 tỷ USD đơn hàng; năm 02/2026 GE Vernova còn trả 5,3 tỷ USD mua nốt 50% Prolec GE. Ý nghĩa: các hãng lớn mua mảng bushing/MBA để giữ chuỗi cung ứng, đối thủ monitoring tích hợp được hãng MBA kéo theo; VTI cần nhấn mạnh tính độc lập hãng và Seiko Electric.<\/li><li><b>Hitachi Energy HMAX Energy (EEPower, 24/04/2026):<\/b> nền tảng digital twin Plan–Predict–Prevent; hãng tự công bố giảm tới 50% sự cố MBA và 75% chi phí sửa chữa (số liệu hãng, chưa kiểm chứng độc lập). Là tin cũ, chỉ đưa để so sánh định vị đối thủ.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>Phát hiện khí off-gas cho BESS (Energy-Storage.news, trích PV Tech Power, tác giả Honeywell; không thấy ngày đăng):<\/b> nghiên cứu DNV cho biết cảm biến off-gas phản hồi dưới 10 giây và báo trước thermal runaway khoảng 6 phút 11 giây; cảm biến LEL và điện áp chỉ báo sau khi runaway bắt đầu; cách ly điện ngay khi phát hiện khí giúp chặn lan sang cell kế bên. Ý nghĩa: luận điểm kỹ thuật cho BESS ở Việt Nam, nhưng đây là bài của nhà cung cấp, cần kiểm chứng.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li><b>PHM Europe 2026 / arXiv 2608.13260 – Virtual Temperature Sensors bằng Neural ODE (Oslo, SINTEF; dữ liệu 15 MBA Statnett, lấy mẫu 900 s):<\/b> ở chế độ ổn định (huấn luyện ≥ 3 tháng, dự báo 30–365 ngày) NODE đạt R² trung vị 0,591 và MAE trung vị 2,04 °C so với LSTM 0,493 và 2,45 °C; NODE thắng R² ở 61,7% (508/823) trường hợp, LSTM thắng khi huấn luyện 2 năm (R² 0,52 so với 0,38). Hạn chế theo tác giả: dự báo 1–7 ngày có R² âm, cần ≥ ~3 tháng dữ liệu. Ý nghĩa: cảm biến ảo trung–dài hạn, cần dữ liệu tải/nhiệt online ≥ 3 tháng, chưa thay được thử nghiệm.<\/li><li>Không tìm thấy tiêu chuẩn IEC/IEEE mới hoặc sửa đổi có ngày công bố trong 72 giờ qua.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Chỉ ~17 tin, nhiều tin chỉ đọc tiêu đề (08/11, 05/11, 26/10, 27/08, 18/09 của Báo Đấu thầu); ít tin mới 72 giờ qua.<\/li><li>Không mở được muasamcong.mpi.gov.vn, npt.com.vn; trang nhà Hitachi/Siemens/Qualitrol/Megger không có tin có ngày. Bài Energy-Storage.news không hiển thị ngày đăng.<\/li><li>Hạn 27/11 lấy từ bản trước, chưa tái xác minh. Yên Dũng/Chân Mây chưa có tin xác nhận đóng điện.<\/li><li>Số liệu Hitachi, Honeywell là do nhà cung cấp công bố.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu – Sôi động đầu tư dự án điện, bổ sung nguồn điện mới – <a href=\"https://baodauthau.vn/soi-dong-dau-tu-du-an-dien-bo-sung-nguon-dien-moi-post213255.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/soi-dong-dau-tu-du-an-dien-bo-sung-nguon-dien-moi-post213255.html<\/a><\/li><li>Báo Đấu thầu – Thẻ EVNNPT – <a href=\"https://baodauthau.vn/tu-khoa/evnnpt-tag19414.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/tu-khoa/evnnpt-tag19414.html<\/a><\/li><li>Báo Đấu thầu – Thẻ TBA 220kV Yên Dũng – <a href=\"https://baodauthau.vn/tu-khoa/tram-bien-ap-220kv-yen-dung-tag59296.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/tu-khoa/tram-bien-ap-220kv-yen-dung-tag59296.html<\/a><\/li><li>Báo Đấu thầu – 9 tháng 2026 EVN khởi công 136 công trình lưới điện – <a href=\"https://baodauthau.vn/9-thang-nam-2026-evn-khoi-cong-136-cong-trinh-luoi-dien-day-manh-dau-tu-bess-post209156.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/9-thang-nam-2026-evn-khoi-cong-136-cong-trinh-luoi-dien-day-manh-dau-tu-bess-post209156.html<\/a><\/li><li>VietnamPlus – Sản lượng điện 10 tháng tăng 9,8% – <a href=\"https://www.vietnamplus.vn/san-luong-dien-10-thang-tang-98-evn-tap-trung-bao-dam-nguon-cung-cuoi-nam-post1145791.amp\" target=\"_blank\" rel=\"noopener\">https://www.vietnamplus.vn/san-luong-dien-10-thang-tang-98-evn-tap-trung-bao-dam-nguon-cung-cuoi-nam-post1145791.amp<\/a><\/li><li>EVN – EVNNPT energizes two key facilities in Dong Nai – <a href=\"https://en.evn.com.vn/d/en-US/news/EVNNPT-energizes-two-key-power-transmission-facilities-in-Dong-Nai-60-202-501649\" target=\"_blank\" rel=\"noopener\">https://en.evn.com.vn/d/en-US/news/EVNNPT-energizes-two-key-power-transmission-facilities-in-Dong-Nai-60-202-501649<\/a><\/li><li>Verdantix – GE Vernova's Trench Deal – <a href=\"https://www.verdantix.com/insights/blog/ge-vernova-s-trench-deal-is-a-bet-on-grid-equipment-shortages---why-that-matters-for-digital-grid-vendors\" target=\"_blank\" rel=\"noopener\">https://www.verdantix.com/insights/blog/ge-vernova-s-trench-deal-is-a-bet-on-grid-equipment-shortages---why-that-matters-for-digital-grid-vendors<\/a><\/li><li>EEPower – Hitachi Energy launches AI-powered suite – <a href=\"https://eepower.com/new-industry-products/hitachi-energy-launches-ai-powered-suite-for-infrastructure/\" target=\"_blank\" rel=\"noopener\">https://eepower.com/new-industry-products/hitachi-energy-launches-ai-powered-suite-for-infrastructure/<\/a><\/li><li>Energy-Storage.news – Stopping thermal runaway six minutes before it starts – <a href=\"https://www.energy-storage.news/stopping-thermal-runaway-six-minutes-before-it-starts\" target=\"_blank\" rel=\"noopener\">https://www.energy-storage.news/stopping-thermal-runaway-six-minutes-before-it-starts<\/a><\/li><li>PHM Society – Virtual Temperature Sensors using Neural ODEs – <a href=\"https://papers.phmsociety.org/index.php/phme/article/download/4991/2879\" target=\"_blank\" rel=\"noopener\">https://papers.phmsociety.org/index.php/phme/article/download/4991/2879<\/a><\/li><li>arXiv – 2608.13260 – <a href=\"https://arxiv.org/pdf/2608.13260\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/pdf/2608.13260<\/a><\/li><\/ul>"}, {"day": "2026-11-24", "title": "Bản tin năng lượng & Cơ hội VTI – 24/11/2026", "html": "<blockquote>Tổng hợp từ Báo Đấu thầu, Tạp chí Công Thương, EVN, arXiv, Fortune/The Conversation, ELECTRA; sáng thứ Ba ít tin mới trong 72 giờ qua nên bản tin ngắn, tin cũ chỉ nhắc khi có mốc mới (ghi ngày đăng). Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>TBA 500 kV Bắc Ninh đã chọn xong nhà thầu Gói 9 (Báo Đấu thầu, 11/11):<\/b> Lô 9.3 – hệ thống giám sát dầu online cho MBA do ENSO trúng 7,363 tỷ đồng (phê duyệt 05/08/2026); Lô 9.1 (MBA) liên danh TOJI; Lô 9.2 Yotek trúng ~277,88 tỷ (phê duyệt 03/11).<\/li><li><b>EVNSPC báo cáo 100% (245) TBA 110 kV vận hành không người trực<\/b> và đã nhân rộng 2 đề tài AI phân tích DGA và PD cho MBA 110 kV (Tạp chí Công Thương, 15/10; số liệu đơn vị tự công bố).<\/li><li><b>EVNNPT – hạn thu xếp vốn 8 dự án ~200,9 triệu EUR là 27/11/2026<\/b> (còn 3 ngày; nhắc lại từ bản trước, chưa xác minh lại được).<\/li><li><b>arXiv 2608.13260 (13/08/2026):<\/b> cảm biến nhiệt ảo cho MBA bằng Neural ODE, thử trên 15 MBA của Statnett.<\/li><li><b>Yên Dũng và Chân Mây (220 kV) vẫn nhắm đóng điện trong tháng 11<\/b>; chưa thấy tin xác nhận đóng điện.<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>Bắc Ninh 500 kV – ENSO trúng giám sát dầu online (Lô 9.3)<\/b><\/td><td>Cho biết EVNNPT đã mua online oil monitoring cho TBA 500 kV mới, giá thấp (~7,4 tỷ cho cả lô); ENSO có thể cần lớp phân tích/Asset Health phía trên<\/td><td>Tìm hiểu ENSO dùng thiết bị hãng nào; đề xuất hợp tác lớp DT/asset health cho dữ liệu DGA online<\/td><td>TB<\/td><td>Dự án vận hành 2027, có thể lùi Q3/2027<\/td><\/tr><tr><td>2<\/td><td><b>EVNSPC: AI DGA/PD cho MBA 110 kV, CBM 100%<\/b><\/td><td>EVNSPC đã có đề tài AI nội bộ; cần dữ liệu online thật cho MBA 110 kV để chạy CBM<\/td><td>Chuẩn bị tài liệu giải pháp DGA/PD online 110 kV tích hợp PMIS/SCADA; hẹn làm việc với EVNSPC<\/td><td>TB<\/td><td>Chưa có hạn; làm trong 12/2026<\/td><\/tr><tr><td>3<\/td><td><b>EVNNPT gọi vốn 8 dự án ~200,9 triệu EUR<\/b> (nhắc lại)<\/td><td>Chốt vốn là bước trước KHLCNT thiết bị<\/td><td>Hoàn thiện datasheet DGA/bushing/nhiệt \"EVNNPT‑ready\"<\/td><td>TB<\/td><td>27/11/2026 (cần kiểm tra)<\/td><\/tr><tr><td>4<\/td><td><b>Yên Dũng, Chân Mây 220 kV; Sầm Sơn GĐ1 (12/2026)<\/b> (nhắc lại)<\/td><td>MBA mới đóng điện = thời điểm baseline DGA/nhiệt<\/td><td>Hỏi NPTPMB/CPMB/PTC1 về nhu cầu giám sát khi nghiệm thu<\/td><td>Thấp<\/td><td>30/11 và 12/2026<\/td><\/tr><tr><td>5<\/td><td><b>DTS cho cáp ngầm – CIGRE TB 984<\/b> (nhắc lại)<\/td><td>Checklist SAT cho DTS/DAS khi chào DTS nhúng trong cáp<\/td><td>Đưa vào slide DTS/RTTR<\/td><td>Thấp<\/td><td>Theo dõi<\/td><\/tr><\/table>\n<p><i>Không có cơ hội \"Cao\" thật sự hôm nay; không nâng ưu tiên cho đẹp bảng. Không thấy HSMT mới về giám sát online.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>TBA 500 kV Bắc Ninh và đường dây đấu nối (Báo Đấu thầu, 11/11):<\/b> tổng vốn 1.409,404 tỷ, tại xã Chi Lăng; Ban QLDA công trình điện miền Bắc đại diện chủ đầu tư. Lô 9.1 MBA: liên danh TOJI trúng 12,29 triệu USD + 15,35 tỷ đồng (phê duyệt 19/08). Lô 9.2 gặp hiện tượng cả hai nhà thầu chào vượt giá nên dự toán điều chỉnh từ 249,9 lên 281,5 tỷ (16/10) rồi mới chọn Yotek. Bài nêu dự án dự kiến vận hành 2027, có thể lùi sang quý III/2027 do gói vật tư kéo dài. Ý nghĩa: tiến độ cung cấp thiết bị là điểm nghẽn, nhà thầu giám sát/DT chen vào được ở giai đoạn nghiệm thu.<\/li><li><b>EVNSPC chuyển đổi số (Tạp chí Công Thương, 15/10):<\/b> 245 TBA 110 kV không người trực; bảo dưỡng theo tình trạng áp dụng 100%, giai đoạn 2024–2025 phát hiện và xử lý 862 bất thường tiềm ẩn; dữ liệu lý lịch thiết bị số hóa trên PMIS; UAV + AI giảm 59% thời gian kiểm tra. Toàn bộ là số liệu đơn vị tự báo cáo, chưa có kiểm chứng độc lập, nhưng cho thấy khách hàng miền Nam đã sẵn sàng với dữ liệu online và CBM.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>EVNNPT – Gói 10 nhị thứ + thông tin, TBA 500 kV Bắc Ninh (Báo Đấu thầu, 13/11):<\/b> Công ty CP Hệ thống kỹ thuật ứng dụng trúng 98,393 tỷ, 180 ngày, trọn gói; đóng thầu 02/03/2026, cả 4 nhà thầu chào vượt giá, chào lại giá 16/10. Bài không nêu dự toán gói. Ý nghĩa: các gói EVNNPT hay phải chào lại giá, chu kỳ chọn thầu kéo dài ~8 tháng.<\/li><li><b>Gói 9 Bắc Ninh – Lô 9.3 giám sát dầu online MBA (Báo Đấu thầu, 11/11):<\/b> ENSO 7,363 tỷ, phê duyệt 05/08/2026 (đã nêu ở mục Cơ hội). Bài học: EVNNPT đưa hệ thống giám sát dầu online thành lô riêng trong gói MBA, VTI nên theo dõi các gói tương tự cho TBA 500 kV khác.<\/li><li>Chưa mở được muasamcong.mpi.gov.vn nên không có KHLCNT/HSMT mới.<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li>Không tìm được thông báo sản phẩm DT/monitoring/DTS mới có ngày đăng kiểm chứng của Hitachi Energy, Siemens Energy, GE Vernova, Qualitrol, Camlin, Doble, Megger, Omicron trong 72 giờ qua (kết quả chỉ là trang tin chung, trang sự kiện, brochure); không độn tin cũ.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>Fortune/The Conversation (04/11/2026, tác giả Jasmine Garland, Đại học Colorado Boulder):<\/b> MBA lực ~400 tấn là điểm nghẽn nâng cấp lưới Mỹ; 2019–2025 nhu cầu MBA tăng áp cho nhà máy điện gần gấp ba, MBA hạ áp hơn gấp đôi với chi phí tăng khoảng 80%; thời gian giao có thể trên 3 năm; thép điện hạt định hướng chỉ còn một nhà máy ở Mỹ. Bài nêu khuyến nghị công nghệ tăng cường lưới (đo đường dây thời gian thực) có thể tăng khoảng 15–20% khả năng truyền tải. Ý nghĩa: số liệu Mỹ, chỉ dùng làm luận điểm \"kéo dài tuổi thọ MBA hiện hữu bằng giám sát và RTTR\"; cần kiểm chứng khi áp dụng cho Việt Nam.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li><b>arXiv 2608.13260 (13/08/2026; Hadzhamolla, Stasik, Riemer‑Sørensen – Oslo/SINTEF; PHME 2026) – Virtual Temperature Sensors bằng Neural ODE:<\/b> mạng 3 lớp học đạo hàm của 5 nhiệt độ (dầu, cuộn HV/LV, hot‑spot HV/LV) từ công suất HV/LV và nhiệt độ môi trường, dữ liệu 15 MBA của Statnett, lấy mẫu 15 phút; so với LSTM. Ở vùng ổn định (huấn luyện ≥ 3 tháng, dự báo ≥ 30 ngày) NODE đạt MAE trung vị 2,04 °C, R² 0,591, LSTM 2,45 °C và 0,493. Hạn chế theo chính bài: dự báo 1–7 ngày kém (R² âm), cần ≥ ~3 tháng dữ liệu, chưa so với mô hình IEC 60076‑7, không công bố mã nguồn, không có khoảng tin cậy. Ý nghĩa cho kỹ sư: hướng \"cảm biến ảo\" có thể thay cảm biến hot‑spot hỏng hoặc kiểm tra chéo, nhưng cần dữ liệu tải/nhiệt ≥ 3 tháng từ hệ thống online trước; chưa thay được thử nghiệm.<\/li><li><b>ELECTRA 347 (08/2026) – Technical Brochure \"Digital Twins for Power Transformers: concept and future perspectives\":<\/b> chỉ đọc tiêu đề trên trang ELECTRA, chưa đọc nội dung; nên mua/đọc toàn văn để lấy khung khái niệm DT cho MBA.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Chỉ ~13 tin, dưới mức 15–25 vì ít tin mới trong 72 giờ qua; nhiều tin gốc đã đưa ở bản 11–23/11, chỉ giữ khi có mốc mới.<\/li><li>Không mở được muasamcong.mpi.gov.vn, npt.com.vn; trang nhà Hitachi/Siemens/Qualitrol/Megger chỉ thấy trang chung, không có tin có ngày.<\/li><li>Số liệu EVNSPC là tự báo cáo, không kiểm chứng độc lập. Hạn 27/11 lấy từ bản tin trước, chưa tái xác minh. Yên Dũng/Chân Mây chưa có tin xác nhận đóng điện.<\/li><li>ENSO: chưa xác định hãng thiết bị đằng sau; chưa đọc toàn văn TB ELECTRA 347.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu – Gói thầu 600 tỷ TBA 500 kV Bắc Ninh – <a href=\"https://baodauthau.vn/goi-thau-600-ty-dong-thuoc-du-an-tram-bien-ap-500kv-bac-ninh-go-nut-that-chao-vuot-gia-hoan-tat-chon-nha-thau-post212385.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/goi-thau-600-ty-dong-thuoc-du-an-tram-bien-ap-500kv-bac-ninh-go-nut-that-chao-vuot-gia-hoan-tat-chon-nha-thau-post212385.html<\/a><\/li><li>Báo Đấu thầu – Hệ thống kỹ thuật ứng dụng trúng gói 98 tỷ – <a href=\"https://baodauthau.vn/cong-ty-he-thong-ky-thuat-ung-dung-trung-goi-thau-vat-tu-thiet-bi-dien-98-ty-dong-post212696.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/cong-ty-he-thong-ky-thuat-ung-dung-trung-goi-thau-vat-tu-thiet-bi-dien-98-ty-dong-post212696.html<\/a><\/li><li>Tạp chí Công Thương – EVNSPC hướng tới doanh nghiệp số thông minh – <a href=\"https://tapchicongthuong.vn/thuc-hien-nghi-quyet-so-57-nq-tw--evnspc-huong-toi-doanh-nghiep-so-thong-minh-558214.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/thuc-hien-nghi-quyet-so-57-nq-tw--evnspc-huong-toi-doanh-nghiep-so-thong-minh-558214.htm<\/a><\/li><li>Fortune – America's grid upgrade hinges on a 400-ton machine – <a href=\"https://fortune.com/2026/11/04/power-transformer-shortage-grid-400-ton-electrical-steel-one-us-mill/\" target=\"_blank\" rel=\"noopener\">https://fortune.com/2026/11/04/power-transformer-shortage-grid-400-ton-electrical-steel-one-us-mill/<\/a><\/li><li>arXiv – Virtual Temperature Sensors in Power Transformers Using Neural ODEs – <a href=\"https://arxiv.org/abs/2608.13260\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2608.13260<\/a><\/li><li>ELECTRA 347 – Digital Twins for Power Transformers (TB) – <a href=\"https://electra.cigre.org/347-august-2026/technical-brochures/digital-twins-for-power-transformers-concept-and-future-perspectives\" target=\"_blank\" rel=\"noopener\">https://electra.cigre.org/347-august-2026/technical-brochures/digital-twins-for-power-transformers-concept-and-future-perspectives<\/a><\/li><li>ELECTRA 346 – Guidelines for SAT of DTS and DAS systems – <a href=\"https://electra.cigre.org/346-june-2026/technical-brochures/guidelines-for-site-acceptance-testing-of-dts-and-das-systems\" target=\"_blank\" rel=\"noopener\">https://electra.cigre.org/346-june-2026/technical-brochures/guidelines-for-site-acceptance-testing-of-dts-and-das-systems<\/a><\/li><\/ul>"}, {"day": "2026-11-23", "title": "Bản tin năng lượng & Cơ hội VTI – 23/11/2026", "html": "<blockquote>Tổng hợp từ SGGP, BNEWS/TTXVN, Báo Đầu tư, Năng lượng Việt Nam, Báo Đấu thầu, POWER Magazine, arXiv, e‑CIGRE/ELECTRA; sáng thứ Hai nhưng ít tin mới trong 72 giờ qua nên bản tin ngắn, tin cũ chỉ nhắc khi có mốc mới (ghi ngày đăng). Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>TBA 220 kV Lai Uyên (TP.HCM) đã đóng điện tối 21/11<\/b> (SGGP, 22/11): EVNNPT là chủ đầu tư, SPMB quản lý, TMĐT gần 367 tỷ đồng.<\/li><li><b>EVNNPT – hạn thu xếp vốn 8 dự án ~200,9 triệu EUR là 27/11/2026<\/b> (còn 4 ngày; nhắc lại, chưa xác minh lại được).<\/li><li><b>TBA 220 kV Sầm Sơn (Thanh Hóa):<\/b> đóng điện giai đoạn 1 tháng 12/2026, hoàn thành toàn dự án 03/2027; MBA AT1 lắp ~50%, nhà điều khiển ~95% (BNEWS, 17/11).<\/li><li><b>Yên Dũng (2×250 MVA) và Chân Mây (125 MVA)<\/b> vẫn nhắm đóng điện trong tháng 11; chưa thấy tin đóng điện (tin gốc 21/10 và 14/10).<\/li><li><b>TBA 500 kV Quỳnh Lưu (Nghệ An):<\/b> 1×900 MVA + 2×450 MVA, hoàn thành quý IV/2027, còn vướng GPMB (BNEWS, 17/11).<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVNNPT gọi vốn 8 dự án ~200,9 triệu EUR<\/b> (nhắc lại)<\/td><td>Chốt vốn là bước trước KHLCNT thiết bị<\/td><td>Hoàn thiện datasheet DGA/bushing/nhiệt \"EVNNPT‑ready\"<\/td><td>TB<\/td><td>27/11/2026 (cần kiểm tra)<\/td><\/tr><tr><td>2<\/td><td><b>Lai Uyên 220 kV vừa đóng điện (21/11)<\/b><\/td><td>MBA mới vận hành = thời điểm baseline DGA/nhiệt; EVNHCMC khai thác tải phía Bắc TP.HCM<\/td><td>Hỏi SPMB/EVNHCMC có hạng mục giám sát retrofit hoặc dịch vụ baseline 3–6 tháng đầu<\/td><td>TB<\/td><td>Ngay (giai đoạn vận hành thử)<\/td><\/tr><tr><td>3<\/td><td><b>Yên Dũng 220 kV (2×250 MVA) và Chân Mây 220 kV<\/b><\/td><td>Cùng lý do baseline; thời điểm đóng điện sát<\/td><td>Xác nhận với NPMB/NPTPMB đã đóng điện chưa, đề xuất gói giám sát nhỏ<\/td><td>TB<\/td><td>30/11/2026 (mục tiêu)<\/td><\/tr><tr><td>4<\/td><td><b>Sầm Sơn 220 kV (2×250 MVA) – đóng điện GĐ1 tháng 12<\/b><\/td><td>MBA 250 MVA mới của CPMB/PTC1; còn chuẩn bị thí nghiệm hiệu chỉnh<\/td><td>Hỏi PTC1 về yêu cầu giám sát online khi nghiệm thu<\/td><td>Thấp<\/td><td>12/2026<\/td><\/tr><tr><td>5<\/td><td><b>DTS/FBG cho cáp ngầm (B1‑11812, TB 984)<\/b> (nhắc lại)<\/td><td>Tài liệu kỹ thuật cho chào DTS nhúng trong cáp<\/td><td>Đưa vào slide DTS/RTTR<\/td><td>Thấp<\/td><td>Theo dõi<\/td><\/tr><\/table>\n<p><i>Không có cơ hội \"Cao\" thật sự hôm nay; em không nâng ưu tiên cho đẹp bảng. Không thấy HSMT mới trực tiếp về giám sát online.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>Lai Uyên 220 kV (SGGP, 22/11):<\/b> đóng điện tối 21/11 tại xã Bàu Bàng, TP.HCM (5,42 ha), TMĐT gần 367 tỷ theo QĐ 1057/QĐ‑EVNNPT (25/08/2021). Bài không nêu công suất MBA. Ý nghĩa: giảm tải cho MBA 220/110 kV và đường dây 110 kV hiện hữu khu vực phía Bắc TP.HCM.<\/li><li><b>Sầm Sơn, Nghi Sơn, Quỳnh Lưu (BNEWS, 17/11, Quyền TGĐ EVNNPT kiểm tra):<\/b> Sầm Sơn 2×250 MVA (đường dây Thanh Hóa – Sầm Sơn đã đóng điện 11/11); lắp MBA thứ 3 TBA 220 kV KKT Nghi Sơn trước 30/04/2027; TBA 500 kV Quỳnh Lưu khởi công 28/03/2026, còn 2 hộ chưa đồng thuận ở đường dây 220 kV Quỳnh Văn.<\/li><li><b>TBA 220 kV Thống Nhất (Đồng Nai) (Năng lượng Việt Nam, 04/11):<\/b> UBND TP Đồng Nai chấp thuận EVNNPT làm chủ đầu tư (QĐ 3764, 01/11); 2×250 MVA 220 kV + 2×63 MVA 110 kV (giai đoạn này 2×250 + 1×63), kiểu nửa trong nhà, dự kiến vận hành quý III/2028. Ý nghĩa: GIS/trạm nửa trong nhà là mục tiêu tốt cho PD/giám sát nhiệt, nhưng còn xa.<\/li><li><b>Quảng Trạch I (Tạp chí Công Thương, 08/10):<\/b> tổ máy 1 phấn đấu thương mại cuối 11/2026, tổ máy 2 cuối 12/2026; 9 tháng EVN đóng điện 131 công trình lưới 110–500 kV (bối cảnh, đã đưa ở bản trước).<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>EVNHANOI – Gói 10 đường dây 220/110 kV cấp điện TBA 220/110 kV Hòa Lạc (Báo Đấu thầu, 13/11):<\/b> Việt Á trúng 284,814 tỷ (dự toán 297,864 tỷ), 300 ngày, lần mời thầu thứ 2 sau khi lần 1 hủy 27/07/2026; Sông Đà 5 bị loại do bảo lãnh dự thầu ghi sai bên thụ hưởng. Ý nghĩa cho VTI: đây là bài học HSMT (bảo lãnh dự thầu) khi dự thầu gói nhị thứ.<\/li><li><b>BESS (Báo Đấu thầu, 12/11):<\/b> khung giá phát điện BESS 2026 tối đa 3.209,98 đ/kWh (đã đưa ở bản 12/11), nhắc lại vì kích hoạt nhu cầu giám sát nhiệt/SCADA cho container BESS.<\/li><li>Chưa mở được muasamcong.mpi.gov.vn nên không có KHLCNT/HSMT mới.<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li>Không tìm được thông báo sản phẩm DT/monitoring/DTS mới có ngày đăng kiểm chứng của Hitachi Energy, Siemens Energy, GE Vernova, Qualitrol, Camlin, Doble, Megger, Omicron trong 72 giờ qua (kết quả tìm kiếm chỉ ra trang tin chung và báo cáo thị trường); không độn tin cũ.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>Thiếu MBA toàn cầu (POWER Magazine, 02/01/2026, số liệu Wood Mackenzie 2025 cho Mỹ):<\/b> thiếu ~30% MBA công suất, lead time trung bình 128 tuần, giá MBA công suất tăng 77% từ 2019; một nguồn phản biện nói \"không thiếu\" với phụ phí 12–15%. Ý nghĩa: bối cảnh lead time dài làm tăng giá trị chẩn đoán, kéo dài tuổi thọ MBA hiện hữu; số liệu Mỹ, cần kiểm chứng khi áp dụng cho Việt Nam. Đây là bài cũ, chỉ đưa làm luận điểm chào hàng.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li><b>arXiv 2512.22189 (Aizpurua, UPV/EHU) – PINN + Bayesian cho nhiệt MBA:<\/b> dùng mạng nơ‑ron ràng buộc phương trình truyền nhiệt 1D để ước lượng nhiệt độ dầu rồi suy ra lão hóa cách điện theo Arrhenius; Bayesian PINN cho thêm bất định epistemic. Trang đọc được chỉ mô tả định tính (không có bảng sai số), nhược điểm là tốn tính toán. Ý nghĩa: khoảng tin cậy kèm dự báo hot‑spot, vùng bất định cao gợi ý nơi cần thêm cảm biến; còn là hướng nghiên cứu.<\/li><li><b>ELECTRA 347 (08/2026) – \"Digital Twins for Modern Power Utilities\":<\/b> chỉ đọc được mô tả (toàn văn dành cho hội viên CIGRE): DT kết hợp mô hình kỹ thuật với dữ liệu thời gian thực cho bảo trì dự đoán, TBA số, tích hợp NLTT. Chưa có số liệu để dẫn.<\/li><li><b>CIGRE A2‑11862 (Hydro‑Québec, 2026)<\/b> (nhắc lại): khung DT cho MBA gồm cảm biến ảo, phát hiện bất thường OLTC bằng rung‑âm, diễn giải DGA, thấm ướt/lão hóa, đánh giá bushing; chỉ đọc tóm tắt, PDF trả phí.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Chỉ ~14 tin mới/nhắc lại, dưới mức 15–25 vì ít tin mới 72 giờ qua; nhiều tin đã đưa ở các bản 11–22/11, chỉ giữ khi có mốc mới.<\/li><li>Không mở được muasamcong.mpi.gov.vn, evn.com.vn, npt.com.vn; pv‑magazine‑usa không đọc được.<\/li><li>Hạn 27/11 của đợt vay 8 dự án lấy từ bản tin trước, chưa tái xác minh. Yên Dũng/Chân Mây chưa có tin xác nhận đóng điện.<\/li><li>Các bài ELECTRA 347, A2‑11862 chỉ đọc tóm tắt; arXiv 2512.22189 không có số liệu định lượng đọc được.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>SGGP – Chính thức đóng điện TBA 220kV Lai Uyên – <a href=\"https://www.sggp.org.vn/chinh-thuc-dong-dien-tram-bien-ap-220kv-lai-uyen-tphcm-post883099.html\" target=\"_blank\" rel=\"noopener\">https://www.sggp.org.vn/chinh-thuc-dong-dien-tram-bien-ap-220kv-lai-uyen-tphcm-post883099.html<\/a><\/li><li>BNEWS – EVNNPT đẩy nhanh tiến độ 3 dự án tại Thanh Hóa và Nghệ An – <a href=\"https://bnews.vn/evnnpt-day-nhanh-tien-do-3-du-an-truyen-tai-dien-tai-thanh-hoa-va-nghe-an/444756.html\" target=\"_blank\" rel=\"noopener\">https://bnews.vn/evnnpt-day-nhanh-tien-do-3-du-an-truyen-tai-dien-tai-thanh-hoa-va-nghe-an/444756.html<\/a><\/li><li>Năng lượng Việt Nam – Chấp thuận nhà đầu tư TBA 220kV Thống Nhất – <a href=\"https://nangluongvietnam.vn/chap-thuan-nha-dau-tu-du-an-tram-bien-ap-220kv-thong-nhat-dong-nai-va-duong-day-dau-noi-36863.html\" target=\"_blank\" rel=\"noopener\">https://nangluongvietnam.vn/chap-thuan-nha-dau-tu-du-an-tram-bien-ap-220kv-thong-nhat-dong-nai-va-duong-day-dau-noi-36863.html<\/a><\/li><li>Báo Đầu tư – TBA 220 kV Yên Dũng phấn đấu đóng điện trong tháng 11/2026 – <a href=\"https://baodautu.vn/tram-bien-ap-220-kv-yen-dung-phan-dau-dong-dien-trong-thang-112026-d728436.html\" target=\"_blank\" rel=\"noopener\">https://baodautu.vn/tram-bien-ap-220-kv-yen-dung-phan-dau-dong-dien-trong-thang-112026-d728436.html<\/a><\/li><li>Tạp chí Công Thương – Đẩy nhanh TBA 220kV Chân Mây – <a href=\"https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm<\/a><\/li><li>Tạp chí Công Thương – EVN bảo đảm cung ứng điện, đẩy tiến độ dự án cuối năm 2026 – <a href=\"https://tapchicongthuong.vn/tap-doan-dien-luc-viet-nam-bao-dam-cung-ung-dien--day-tien-do-du-an-cuoi-nam-2026-556059.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/tap-doan-dien-luc-viet-nam-bao-dam-cung-ung-dien--day-tien-do-du-an-cuoi-nam-2026-556059.htm<\/a><\/li><li>Báo Đấu thầu – Gói thầu gần 300 tỷ xây lắp đường dây tại Hà Nội – <a href=\"https://baodauthau.vn/goi-thau-gan-300-ty-dong-xay-lap-duong-day-dien-tai-ha-noi-vuot-3-doi-thu-viet-a-duoc-chon-post212677.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/goi-thau-gan-300-ty-dong-xay-lap-duong-day-dien-tai-ha-noi-vuot-3-doi-thu-viet-a-duoc-chon-post212677.html<\/a><\/li><li>Báo Đấu thầu – Khung giá phát điện BESS 2026 – <a href=\"https://baodauthau.vn/khung-gia-phat-dien-bess-nam-2026-toi-da-320998-dongkwh-post212487.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/khung-gia-phat-dien-bess-nam-2026-toi-da-320998-dongkwh-post212487.html<\/a><\/li><li>POWER Magazine – Transformers in 2026 – <a href=\"https://powermag.com/transformers-in-2026-shortage-scramble-or-self-inflicted-crisis/\" target=\"_blank\" rel=\"noopener\">https://powermag.com/transformers-in-2026-shortage-scramble-or-self-inflicted-crisis/<\/a><\/li><li>arXiv – Physics-Informed ML for Transformer Condition Monitoring Part II – <a href=\"https://arxiv.org/abs/2512.22189\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2512.22189<\/a><\/li><li>ELECTRA 347 – Digital Twins for Modern Power Utilities – <a href=\"https://electra.cigre.org/347-august-2026/one-grid/digital-twins-for-modern-power-utilities-from-asset-monitoring-to-intelligent-grid-operations\" target=\"_blank\" rel=\"noopener\">https://electra.cigre.org/347-august-2026/one-grid/digital-twins-for-modern-power-utilities-from-asset-monitoring-to-intelligent-grid-operations<\/a><\/li><li>e‑CIGRE – A2‑11862‑2026 – <a href=\"https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html<\/a><\/li><\/ul>"}, {"day": "2026-11-22", "title": "Bản tin năng lượng & Cơ hội VTI – 22/11/2026", "html": "<blockquote>Tổng hợp từ Báo Đấu thầu, Hitachi Energy, EEPower, Verdantix, e‑CIGRE/ELECTRA; sáng Chủ nhật ít tin mới nên chỉ giữ tin chưa đưa hoặc có diễn biến mới (ghi ngày đăng). Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>GE Vernova mua Trench Group (bushing, biến dòng/áp cao thế) giá 9,0 tỷ USD<\/b> – công bố 28/10, Verdantix phân tích 18/11; dự kiến đóng deal cuối 2027.<\/li><li><b>EVNNPT mời ngân hàng thu xếp 1.119 tỷ đồng cho 5 dự án truyền tải<\/b> (Báo Đấu thầu, 05/11) – gồm TBA 220 kV Bắc Tân Uyên, nâng công suất 220 kV Chèm và Yên Bái; hạn nộp 17/11 đã qua.<\/li><li><b>EVNNPC chốt 6/7 gói BESS giai đoạn 2 tại TBA 110 kV<\/b> (Báo Đấu thầu, 21/10): ACIT trúng 4 gói, tổng 722,3 tỷ; giai đoạn 3 mở thầu 24/10.<\/li><li><b>Phú Thọ đấu giá 184 MBA chứa chất thải nguy hại<\/b> – 14:00 01/12, hạn đăng ký/đặt cọc 26/11 (Báo Đấu thầu, 18/11).<\/li><li><b>CIGRE TB 984 (ELECTRA 346, 06/2026):<\/b> hướng dẫn nghiệm thu SAT cho hệ DTS/DAS – đúng mảng DTS của VTI.<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVNNPT gọi vốn 8 dự án ~200,9 triệu EUR<\/b> (nhắc lại; mốc 27/11 theo bản tin trước, chưa xác minh lại được)<\/td><td>Chốt vốn là bước trước KHLCNT thiết bị<\/td><td>Hoàn thiện datasheet DGA/bushing/nhiệt \"EVNNPT‑ready\"<\/td><td>TB<\/td><td>27/11/2026 (cần kiểm tra)<\/td><\/tr><tr><td>2<\/td><td><b>5 dự án 1.119 tỷ: Bắc Tân Uyên 220 kV, nâng công suất Chèm, Yên Bái<\/b><\/td><td>MBA/TBA 220 kV mới hoặc nâng công suất = điểm đặt DGA/nhiệt/bushing baseline<\/td><td>Theo dõi KHLCNT sau khi chốt ngân hàng; hỏi NPTPMB/PTC1<\/td><td>TB<\/td><td>Sau 17/11 – chờ kết quả<\/td><\/tr><tr><td>3<\/td><td><b>Giai đoạn 3 BESS EVNNPC (G05 274,9 tỷ; G06 314,1 tỷ)<\/b><\/td><td>BESS 110 kV cần giám sát nhiệt/SCADA cho container và MBA đấu nối<\/td><td>Kiểm tra kết quả mở thầu 24/10; làm gói giám sát nhiệt + DGA nhẹ cho nhà thầu BESS (ACIT, ENTEC)<\/td><td>TB<\/td><td>Chờ kết quả<\/td><\/tr><tr><td>4<\/td><td><b>Bắc Ninh 500 kV Gói 10 nhị thứ (98,4 tỷ)<\/b> (nhắc lại)<\/td><td>Tích hợp dữ liệu DGA online vào lớp Asset Health<\/td><td>Tìm đầu mối nhà thầu trúng<\/td><td>Thấp<\/td><td>Hợp đồng 180 ngày<\/td><\/tr><tr><td>5<\/td><td><b>DTS + FBG cho cáp ngầm (CIGRE B1‑11812) và TB 984<\/b><\/td><td>Làm tài liệu kỹ thuật cho chào DTS nhúng trong cáp<\/td><td>Mua/đọc toàn văn, đưa vào slide DTS/RTTR<\/td><td>TB<\/td><td>Theo dõi<\/td><\/tr><\/table>\n<p><i>Không có cơ hội \"Cao\" thật sự hôm nay; em không nâng ưu tiên cho đẹp bảng.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN tháng 11/2026 (Giáo dục &amp; Thời đại, Nhân Dân):<\/b> sản lượng điện 10 tháng tăng 9,8%, EVN tập trung bảo đảm nguồn cung cuối năm và đẩy tiến độ dự án (tiêu đề đã đọc, chưa mở toàn văn). Ý nghĩa: tải cao kéo dài làm MBA 220/500 kV càng cần giám sát nhiệt/DGA.<\/li><li><b>EVNNPT – EVNNPC phối hợp đẩy nhanh nhiều dự án lưới miền Bắc (EVN, bản tiếng Anh):<\/b> chỉ nắm tiêu đề, chưa có số liệu.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>EVNNPT – 5 dự án (Báo Đấu thầu, 05/11):<\/b> tổng vốn vay cần 1.119 tỷ; tụ bù 110 kV lưới miền Bắc 2026 (458/343 tỷ), TBA 220 kV Bắc Tân Uyên (610/457), nâng MBA 63 MVA + thanh cái 110 kV Chèm (133/99), nâng công suất 220 kV Yên Bái (130/97), đường dây 220 kV Đông Hà – Huế mạch 3 (164/123); hạn nộp 8:30 ngày 17/11/2026. Cùng bài nhắc đợt đầu tháng 10 cho 8 dự án 200,9 triệu EUR (~6.159 tỷ).<\/li><li><b>EVNNPC – BESS giai đoạn 2 (Báo Đấu thầu, 21/10):<\/b> 6/7 gói, 120 ngày, đơn giá cố định; ACIT 4 gói 722,257 tỷ, ENTEC G05 138,16 tỷ, CYG Sunri G08 97,01 tỷ; thiết bị BESS 10 MW/20 MWh xuất xứ Việt Nam.<\/li><li><b>Đấu giá thanh lý MBA – Điện lực Phú Thọ (Báo Đấu thầu, 18/11):<\/b> 184 MBA chứa chất thải nguy hại, giá khởi điểm 2,78 tỷ, cọc 556 triệu; yêu cầu giấy phép xử lý chất thải nguy hại; không thuộc mảng VTI, chỉ cho thấy nhu cầu thay MBA cũ ở EVNNPC.<\/li><li>Chưa mở được muasamcong.mpi.gov.vn nên không có KHLCNT/HSMT mới.<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li><b>GE Vernova – Trench ($9,0 tỷ, 28/10; Verdantix 18/11):<\/b> Trench sản xuất bushing, biến dòng/áp cao thế, bán cho hơn 800 utility; Verdantix cho rằng thiếu thiết bị làm tăng giá trị giám sát/DLR nhưng phần mềm OEM đóng gói kèm có thể ép nhà cung cấp độc lập. Ý nghĩa: bushing monitoring của VTI nên định vị là lớp đa hãng, dễ gắn lên cả bushing OEM.<\/li><li><b>Hitachi Energy HMAX Energy (EEPower, 24/04):<\/b> bộ AI + digital twin cho tài sản lưới già; theo Hitachi tự công bố giảm 50% hỏng MBA, chi phí sửa chữa giảm tới 75% (số liệu hãng). Ý nghĩa: đối thủ đang chào DT như dịch vụ vòng đời, cần chuẩn bị số liệu tham chiếu tương đương.<\/li><li><b>Hitachi Energy + NVIDIA Omniverse (21/10):<\/b> mô phỏng hệ nguồn 800 VDC cho trung tâm dữ liệu AI; không liên quan trực tiếp MBA nhưng cho thấy hướng DT sang nhu cầu data center.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li>Energy Storage News (tìm kiếm 22/11): có bài tổng kết lắp đặt BESS toàn cầu tháng 11 (~14 GWh, có dự án natri‑ion 1 GWh), chỉ đọc tiêu đề; chưa kiểm chứng ngày đăng nên không đưa số liệu.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li><b>CIGRE B1‑11812‑2026 (Synaptec &amp; Vattenfall):<\/b> cáp ngầm xuất 66 kV dài 4,1 km, đo 1 năm bằng DTS kết hợp cảm biến điểm FBG; điểm nóng nhất dịch chuyển theo mùa, đầu cáp nóng hơn từ giữa tháng 6 đến tháng 10; FBG cho đo nhiệt đầu cáp nhanh và chính xác hơn. Ý nghĩa: nên kết hợp DTS với cảm biến điểm tại đầu cáp/hộp nối để dùng RTTR đáng tin.<\/li><li><b>CIGRE TB 984 (WG B1.80, ELECTRA 346, 06/2026):<\/b> quy trình SAT cho DTS/DAS – kiểm độ chính xác nhiệt/âm, độ phân giải không gian, tích hợp trung tâm điều khiển, kiểm chứng RTTR; hướng tới tiêu chuẩn IEEE/IEC. Ý nghĩa: dùng làm checklist nghiệm thu khi chào DTS.<\/li><li><b>IEEE C57.91 (bản 2025) / C57.12.91‑2026:<\/b> chỉ thấy trang bán tiêu chuẩn, chưa đọc nội dung sửa đổi.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Chỉ ~14 tin, dưới mức 15–25, vì ít tin mới đăng trong 72 giờ qua; một số tin là bối cảnh 10/2026–11/2026.<\/li><li>Không mở được muasamcong.mpi.gov.vn, evn.com.vn, npt.com.vn; một số bài chỉ đọc tiêu đề.<\/li><li>Số liệu Hitachi là do hãng công bố; bài B1‑11812 và TB 984 chỉ đọc abstract, toàn văn trả phí/hội viên.<\/li><li>Mốc 27/11 của đợt vay 8 dự án lấy từ bản tin trước, chưa tái xác minh.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu – EVNNPT mời ngân hàng thu xếp 1.119 tỷ đồng – <a href=\"https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html<\/a><\/li><li>Báo Đấu thầu – Nhà thầu nội chiếm ưu thế tại các gói thầu BESS – <a href=\"https://baodauthau.vn/nha-thau-noi-chiem-uu-the-tai-cac-goi-thau-bess-post210524.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/nha-thau-noi-chiem-uu-the-tai-cac-goi-thau-bess-post210524.html<\/a><\/li><li>Báo Đấu thầu – Đấu giá thanh xử lý tài sản Điện lực Phú Thọ – <a href=\"https://baodauthau.vn/ngay-1122026-dau-gia-thanh-xu-ly-tai-san-dot-8-nam-2026-cua-cong-ty-dien-luc-phu-tho-post213219.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/ngay-1122026-dau-gia-thanh-xu-ly-tai-san-dot-8-nam-2026-cua-cong-ty-dien-luc-phu-tho-post213219.html<\/a><\/li><li>Verdantix – GE Vernova's Trench deal – <a href=\"https://www.verdantix.com/insights/blog/ge-vernova-s-trench-deal-is-a-bet-on-grid-equipment-shortages---why-that-matters-for-digital-grid-vendors\" target=\"_blank\" rel=\"noopener\">https://www.verdantix.com/insights/blog/ge-vernova-s-trench-deal-is-a-bet-on-grid-equipment-shortages---why-that-matters-for-digital-grid-vendors<\/a><\/li><li>EEPower – Hitachi Energy launches AI-powered suite – <a href=\"https://eepower.com/new-industry-products/hitachi-energy-launches-ai-powered-suite-for-infrastructure/\" target=\"_blank\" rel=\"noopener\">https://eepower.com/new-industry-products/hitachi-energy-launches-ai-powered-suite-for-infrastructure/<\/a><\/li><li>Hitachi Energy – NVIDIA Omniverse simulation – <a href=\"https://www.hitachienergy.com/news-and-events/press-releases/2026/10/hitachi-energy-develops-power-system-simulation-with-nvidia-omniverse-libraries-to-help-accelerate-ai-factory-deployment\" target=\"_blank\" rel=\"noopener\">https://www.hitachienergy.com/news-and-events/press-releases/2026/10/hitachi-energy-develops-power-system-simulation-with-nvidia-omniverse-libraries-to-help-accelerate-ai-factory-deployment<\/a><\/li><li>e‑CIGRE – B1‑11812‑2026 – <a href=\"https://www.e-cigre.org/publications/detail/b1-11812-2026-improved-cable-rttr-and-early-failure-detection-by-combining-dts-monitoring-with-distributed-point-sensing.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/b1-11812-2026-improved-cable-rttr-and-early-failure-detection-by-combining-dts-monitoring-with-distributed-point-sensing.html<\/a><\/li><li>ELECTRA 346 – Guidelines for SAT of DTS and DAS – <a href=\"https://electra.cigre.org/346-june-2026/technical-brochures/guidelines-for-site-acceptance-testing-of-dts-and-das-systems\" target=\"_blank\" rel=\"noopener\">https://electra.cigre.org/346-june-2026/technical-brochures/guidelines-for-site-acceptance-testing-of-dts-and-das-systems<\/a><\/li><li>Giáo dục &amp; Thời đại – Hoạt động kinh doanh tháng 10, nhiệm vụ tháng 11/2026 của EVN – <a href=\"https://giaoduc.net.vn/hoat-dong-kinh-doanh-thang-10-va-muc-tieu-nhiem-vu-cong-tac-thang-112026-cua-tap-doan-dien-luc-vn-post263797.gd\" target=\"_blank\" rel=\"noopener\">https://giaoduc.net.vn/hoat-dong-kinh-doanh-thang-10-va-muc-tieu-nhiem-vu-cong-tac-thang-112026-cua-tap-doan-dien-luc-vn-post263797.gd<\/a><\/li><li>Energy Storage News – Global BESS installs hit 14GWh in November – <a href=\"https://www.energy-storage.news/global-bess-installs-hit-14gwh-in-november-including-1gwh-sodium-ion-project-china-slows/\" target=\"_blank\" rel=\"noopener\">https://www.energy-storage.news/global-bess-installs-hit-14gwh-in-november-including-1gwh-sodium-ion-project-china-slows/<\/a><\/li><\/ul>"}, {"day": "2026-11-21", "title": "Bản tin năng lượng & Cơ hội VTI – 21/11/2026", "html": "<blockquote>Tổng hợp từ Báo Đấu thầu, VCCI (lại đăng Báo Chính phủ), Tạp chí Công Thương, arXiv, e‑CIGRE; sáng thứ Bảy gần như không có tin mới trong 72 giờ qua nên bản tin ngắn, chỉ giữ tin chưa đưa hoặc có mốc hạn (ghi rõ ngày đăng). Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>EVNNPT mời thu xếp vốn 8 dự án ~200,9 triệu EUR – hạn 27/11/2026<\/b> (còn 6 ngày; nhắc lại).<\/li><li><b>EVNNPT – EVNCPC thống nhất tiến độ đồng bộ lưới miền Trung – Tây Nguyên (VCCI, đăng 30/10, cập nhật 20/11):<\/b> danh mục 61 ngăn lộ 110 kV (24 đã đóng điện, 8 dự kiến 2026, 17 vào 2028, 12 sau 2028); EVNNPT đề nghị EVNCPC nhận 11 dự án TBA 220 kV và đường dây đấu nối mang tính phân phối.<\/li><li><b>Chân Mây 220 kV:<\/b> năm 2026 EVNNPT hoàn thành 8 ngăn lộ 110 kV tại TBA này; mục tiêu đóng điện tháng 11 vẫn chưa thấy tin xác nhận.<\/li><li><b>Bắc Ninh 500 kV, Gói 10 (nhị thứ + thông tin):<\/b> Công ty CP Hệ thống kỹ thuật ứng dụng trúng 98,393 tỷ, 180 ngày, sau chào lại giá 16/10 (Báo Đấu thầu, 13/11).<\/li><li><b>Quy hoạch điện VIII điều chỉnh:<\/b> chưa thấy diễn biến mới trong 72 giờ; tái cơ cấu EVNNPT và LNG Hải Phòng vẫn chờ quyết định (bản tin 20/11).<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVNNPT gọi vốn 8 dự án ~200,9 triệu EUR<\/b> (nhắc lại)<\/td><td>Chốt vốn là bước trước KHLCNT thiết bị<\/td><td>Hoàn thiện datasheet DGA/bushing/nhiệt \"EVNNPT‑ready\"<\/td><td>TB<\/td><td><b>27/11/2026<\/b><\/td><\/tr><tr><td>2<\/td><td><b>Đồng bộ EVNNPT–EVNCPC (61 ngăn lộ 110 kV, 11 TBA 220 kV có thể chuyển EVNCPC)<\/b><\/td><td>Tài sản 110 kV/220 kV có thể đổi chủ vận hành giữa EVNNPT và EVNCPC; mỗi bên có tiêu chí giám sát khác nhau<\/td><td>Làm bảng đầu mối PTC2/PTC3 và EVNCPC; chuẩn bị 1 bộ chào cho TBA 110 kV (nhiệt + DGA nhẹ)<\/td><td>TB<\/td><td>Cập nhật tiến độ hằng quý<\/td><\/tr><tr><td>3<\/td><td><b>Bắc Ninh 500 kV – Gói 10 nhị thứ/thông tin (98,4 tỷ)<\/b><\/td><td>Gói nhị thứ là nơi tích hợp SCADA/IEC 61850 và cổng dữ liệu giám sát; nhà thầu trúng đã biết<\/td><td>Tìm đầu mối nhà thầu để đề xuất tích hợp dữ liệu DGA online (ENSO, Lô 9.3) vào lớp Asset Health/DT<\/td><td>TB<\/td><td>Hợp đồng 180 ngày<\/td><\/tr><tr><td>4<\/td><td><b>Chân Mây 220 kV đóng điện<\/b><\/td><td>MBA mới = baseline DGA/nhiệt<\/td><td>Hỏi NPTPMB/PTC1 có gói giám sát nhỏ<\/td><td>Thấp<\/td><td>30/11/2026<\/td><\/tr><\/table>\n<p><i>Nhận xét: không có HSMT mới trực tiếp về giám sát online trong 72 giờ qua; không có cơ hội \"Cao\" thật sự nên em không nâng ưu tiên cho đẹp bảng.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVNNPT – EVNCPC (VCCI, 30/10, cập nhật 20/11):<\/b> hai bên ký thỏa thuận phối hợp tiến độ đầu tư truyền tải – phân phối khu vực miền Trung – Tây Nguyên, cập nhật hằng quý và gắn với thi đua hằng năm. Ý nghĩa: thời gian giữa đóng điện 220 kV và ngăn lộ 110 kV thường là điểm nghẽn, cơ hội cho giám sát baseline khi bàn giao.<\/li><li><b>Bắc Ninh 500 kV (Báo Đấu thầu, 11/11 và 13/11):<\/b> tổng vốn 1.409,4 tỷ; tiến độ vận hành có thể lùi sang quý III/2027; Gói 9 gồm MBA, thiết bị nhất thứ và đường dây đấu nối (chi tiết Lô 9.1–9.3 đã đưa ở bản 14/11 và 18/11).<\/li><li><b>Số liệu quy mô lưới truyền tải (VCCI lại đăng Báo Đầu tư, bài gốc 26/09/2025):<\/b> 81 TBA (18 trạm 500 kV, 63 trạm 220 kV), 99 dự án đang triển khai, một số MBA 500/220 kV đã mang trên 80% định mức. Ý nghĩa: MBA tải cao là đối tượng điển hình cho DGA/nhiệt online (số liệu của năm 2025, không phải 2026).<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>Bắc Ninh 500 kV – Gói 10 (Báo Đấu thầu, 13/11):<\/b> cung cấp vật tư nhị thứ và thông tin, EVNNPT công bố kết quả; 4 nhà thầu đều chào vượt giá lúc đóng thầu 02/03/2026, chào lại 16/10 chỉ một đơn vị dưới dự toán; trúng 98,393 tỷ, trọn gói 180 ngày.<\/li><li><b>EVNNPT – 8 dự án ~200,9 triệu EUR:<\/b> hạn <b>27/11/2026<\/b> (nhắc lại).<\/li><li>Chưa mở được muasamcong.mpi.gov.vn nên không có KHLCNT/HSMT mới để báo.<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li><b>EVNSPC (Tạp chí Công Thương, 15/10; số liệu do EVNSPC tự công bố):<\/b> 862 trường hợp bất thường phát hiện sớm bằng bảo trì theo tình trạng (CBM) giai đoạn 2024–2025; UAV giảm 59% thời gian kiểm tra. Ý nghĩa: có số liệu CBM trong nước để dẫn khi chào lớp DT; bản tin 19/11 chỉ nhắc 245 TBA không người trực.<\/li><li>Không tìm được thông báo sản phẩm DT/monitoring/DTS mới có ngày đăng kiểm chứng của Hitachi Energy, Siemens Energy, GE Vernova, Qualitrol, Camlin, Doble/Megger trong 72 giờ qua; không độn tin cũ.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li>Tìm kiếm Utility Dive, Energy Storage News chỉ trả về trang danh mục và bài cũ, không có bài mới kiểm chứng được ngày đăng; không đưa để độn.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li>Không có bài mới ngoài các bài đã đưa (arXiv 2608.13260 ở bản 17/11, e‑CIGRE A2‑11862 và TB 995 ở bản 20/11). Chỉ ghi diễn biến: bài 2608.13260 cho thấy cảm biến ảo nhiệt cần tối thiểu ~3 tháng dữ liệu huấn luyện (R² 0,39 ở 3 tháng so với 0,52 ở 1 năm) và R² âm khi dự báo 1–7 ngày; nên chào dưới dạng công cụ xu hướng trung – dài hạn, không thay cảm biến thật cho cảnh báo tức thời.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Chỉ ~9 tin, thấp hơn mức 15–25, vì tìm kiếm không trả về bài mới 72 giờ qua và nhiều tin đã đưa ở các bản trước.<\/li><li>Không mở được muasamcong.mpi.gov.vn; không truy cập trực tiếp được evn.com.vn, npt.com.vn.<\/li><li>Bài VCCI về EVNNPT–EVNSPC là bài gốc năm 2025 (Báo Đầu tư), chỉ dùng làm bối cảnh.<\/li><li>Nội dung bài arXiv lấy từ bản PDF; số liệu EVNSPC do đơn vị tự công bố, chưa kiểm chứng độc lập.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>VCCI – EVNNPT và EVNCPC thống nhất tiến độ đầu tư đồng bộ lưới điện miền Trung – Tây Nguyên – <a href=\"https://www.vcci.com.vn/news/evnnpt-va-evncpc-thong-nhat-tien-do-dau-tu-dong-bo-luoi-dien-mien-trung-tay-nguyen\" target=\"_blank\" rel=\"noopener\">https://www.vcci.com.vn/news/evnnpt-va-evncpc-thong-nhat-tien-do-dau-tu-dong-bo-luoi-dien-mien-trung-tay-nguyen<\/a><\/li><li>VCCI – EVNNPT và EVNSPC tăng cường phối hợp trong đầu tư lưới điện truyền tải – <a href=\"https://www.vcci.com.vn/news/evnnpt-va-evnspc-tang-cuong-phoi-hop-trong-dau-tu-luoi-dien-truyen-tai\" target=\"_blank\" rel=\"noopener\">https://www.vcci.com.vn/news/evnnpt-va-evnspc-tang-cuong-phoi-hop-trong-dau-tu-luoi-dien-truyen-tai<\/a><\/li><li>Báo Đấu thầu – Công ty Hệ thống kỹ thuật ứng dụng trúng gói thầu vật tư thiết bị điện 98 tỷ đồng – <a href=\"https://baodauthau.vn/cong-ty-he-thong-ky-thuat-ung-dung-trung-goi-thau-vat-tu-thiet-bi-dien-98-ty-dong-post212696.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/cong-ty-he-thong-ky-thuat-ung-dung-trung-goi-thau-vat-tu-thiet-bi-dien-98-ty-dong-post212696.html<\/a><\/li><li>Báo Đấu thầu – Gói thầu 600 tỷ đồng thuộc Dự án TBA 500kV Bắc Ninh – <a href=\"https://baodauthau.vn/goi-thau-600-ty-dong-thuoc-du-an-tram-bien-ap-500kv-bac-ninh-go-nut-that-chao-vuot-gia-hoan-tat-chon-nha-thau-post212385.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/goi-thau-600-ty-dong-thuoc-du-an-tram-bien-ap-500kv-bac-ninh-go-nut-that-chao-vuot-gia-hoan-tat-chon-nha-thau-post212385.html<\/a><\/li><li>Tạp chí Công Thương – EVNSPC hướng tới doanh nghiệp số thông minh – <a href=\"https://tapchicongthuong.vn/thuc-hien-nghi-quyet-so-57-nq-tw--evnspc-huong-toi-doanh-nghiep-so-thong-minh-558214.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/thuc-hien-nghi-quyet-so-57-nq-tw--evnspc-huong-toi-doanh-nghiep-so-thong-minh-558214.htm<\/a><\/li><li>arXiv – Virtual Temperature Sensors in Power Transformers Using Neural ODEs – <a href=\"https://arxiv.org/abs/2608.13260\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/abs/2608.13260<\/a><\/li><\/ul>"}, {"day": "2026-11-20", "title": "Bản tin năng lượng & Cơ hội VTI – 20/11/2026", "html": "<blockquote>Tổng hợp từ Báo Đấu thầu, Tạp chí Công Thương, VCCI, EVN (bản tiếng Anh), e‑CIGRE; sáng thứ Sáu gần như không có tin Việt Nam đăng trong 72 giờ qua nên bản tin ngắn, chỉ giữ tin chưa đưa hoặc có mốc hạn (ghi rõ ngày đăng); tin đã đưa 10–19/11 không lặp lại. Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>EVNNPT mời thu xếp vốn 8 dự án ~200,9 triệu EUR – hạn 27/11/2026<\/b> (còn 7 ngày; nhắc lại).<\/li><li><b>Hai phương án tái cơ cấu ngành điện đã trình Chính phủ ngày 15/09/2026:<\/b> tách EVNNPT khỏi EVN, chuyển về bộ chuyên ngành; tách phân phối – bán lẻ trong 5 tổng công ty điện lực (Tạp chí Công Thương, 10/10).<\/li><li><b>TBA 500 kV Lao Bảo (Quảng Trị), tổng vốn 1.451 tỷ:<\/b> gói MBA 500 kV (2 máy một pha, nhóm 3×300 MVA, 451,2 tỷ, đấu thầu quốc tế) và gói thiết bị + xây lắp 758,6 tỷ nằm trong KHLCNT đợt 4 của EVN (Báo Đấu thầu, 03/04).<\/li><li><b>Giá điện bán lẻ bình quân 2.159,9 đ/kWh từ 01/11/2026<\/b> (QĐ 2892/QĐ-BCT), giảm 2% so với 05/2025; bậc sinh hoạt rút còn 5 (Mekong ASEAN, 04/11).<\/li><li><b>Chân Mây 220 kV:<\/b> trạm ~95%, đường dây ~63%, vẫn nhắm đóng điện tháng 11 nhưng còn vướng đền bù một số khoảng cột (Tạp chí Công Thương, 14/10).<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>TBA 500 kV Lao Bảo – MBA 500 kV 3×300 MVA (451 tỷ) + thiết bị/xây lắp (758,6 tỷ)<\/b><\/td><td>Gói MBA quốc tế: hãng MBA trúng sẽ cần giám sát DGA/bushing/nhiệt; gói thiết bị cũng là nơi đưa giám sát online vào YCKT<\/td><td>Kiểm tra trạng thái KHLCNT/HSMT trên muasamcong (em chưa mở được); chuẩn bị tài liệu chào lớp online monitoring cho nhà thầu MBA/EPC<\/td><td>TB<\/td><td>Chưa rõ – theo dõi HSMT<\/td><\/tr><tr><td>2<\/td><td><b>EVNNPT gọi vốn 8 dự án ~200,9 triệu EUR<\/b> (nhắc lại)<\/td><td>Chốt vốn là bước trước KHLCNT thiết bị<\/td><td>Hoàn thiện datasheet DGA/bushing/nhiệt \"EVNNPT‑ready\"<\/td><td>TB<\/td><td><b>27/11/2026<\/b><\/td><\/tr><tr><td>3<\/td><td><b>Tái cơ cấu: EVNNPT có thể tách khỏi EVN<\/b><\/td><td>Nếu EVNNPT độc lập, quy trình mua sắm và quản lý tài sản có thể đổi; ai nắm đầu mối asset health sớm sẽ có lợi thế<\/td><td>Theo dõi quyết định của Chính phủ; cập nhật bản đồ đầu mối (PTC1–4, NPMB/CPMB/SPMB)<\/td><td>Thấp<\/td><td>Chưa có mốc<\/td><\/tr><tr><td>4<\/td><td><b>Hydro‑Québec A2‑11862: DT cho MBA gồm AI âm‑rung OLTC, DGA, bushing, ẩm<\/b><\/td><td>Bộ chức năng này gần như trùng danh mục Transformer DT của VTI; làm tham chiếu hạng mục cho đề xuất<\/td><td>Đưa vào slide \"DT scope\" so sánh với TB 995; lấy toàn văn PDF<\/td><td>TB<\/td><td>Theo dõi<\/td><\/tr><tr><td>5<\/td><td><b>TBA 220 kV Chân Mây (1×125 MVA, Huế) đóng điện tháng 11<\/b> (nhắc lại có chi tiết mới)<\/td><td>MBA mới = baseline DGA/nhiệt ngay khi đóng điện<\/td><td>Hỏi NPTPMB/PTC xem có gói giám sát nhỏ<\/td><td>Thấp<\/td><td>30/11/2026<\/td><\/tr><\/table>\n<p><i>Nhận xét: chưa có HSMT mới trực tiếp về giám sát online trong 72 giờ qua; không có cơ hội \"Cao\" thật sự nên em không nâng ưu tiên cho đẹp bảng.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>Chân Mây 220/110/22 kV (Huế, Tạp chí Công Thương, 14/10):<\/b> thiết kế 2×125 MVA, giai đoạn này lắp 1 máy; đường dây đấu nối ~5,13 km vào đường dây Hòa Khánh – Huế, đã dựng 14/23 cột, chủ đầu tư EVNNPT, NPTPMB quản lý.<\/li><li><b>Đường dây 500/220 kV Nho Quan – Phủ Lý – Thường Tín (VCCI, 27/07):<\/b> dài khoảng 80 km qua Ninh Bình, Phú Thọ, Hà Nội, đóng điện toàn tuyến 26/07; khó khăn chính là giải phóng mặt bằng và đổi hướng tuyến. Ý nghĩa: tuyến mới nối 3 trạm cao áp – nhóm tài sản mới cần baseline giám sát.<\/li><li><b>Nhơn Trạch KCN 220 kV (EVN, 31/08):<\/b> đóng điện MBA AT2 250 MVA, nâng công suất lên 500 MVA, cùng đường dây kép từ Nhà máy Nhơn Trạch 3 (~14 km mới đóng điện); PTC4 vận hành.<\/li><li><b>Chính sách (Tạp chí Công Thương, 10/10):<\/b> dự án nhiệt điện LNG Hải Phòng vẫn theo Quy hoạch điện VIII điều chỉnh (QĐ 768/QĐ‑TTg), phương án thay bằng năng lượng tái tạo + BESS đang chờ Thủ tướng; sửa Luật Điện lực dự kiến trình Quốc hội tháng 10/2026; giờ cao điểm 17:30–22:30 thứ Hai–thứ Bảy (QĐ 963/QĐ‑BCT), chưa áp dụng cho hộ gia đình.<\/li><li><b>Giá điện (Mekong ASEAN, 04/11):<\/b> 5 bậc sinh hoạt 1.901 / 2.289 / 2.894 / 3.456 / 3.844 đ/kWh; giá kinh doanh cao nhất 5.313 đ/kWh (hạ áp, giờ cao điểm). Ý nghĩa: giá cao điểm cao thúc đẩy nhà máy công nghiệp quan tâm tối ưu tải và giám sát năng lượng.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>TBA 500 kV Lao Bảo (EVN, Ban QLDA Điện 1, Báo Đấu thầu 03/04):<\/b> 2MS‑TBA500LB cung cấp và vận chuyển MBA, 451,177 tỷ, đấu thầu rộng rãi quốc tế; 1HH‑TBA500LB cung cấp thiết bị và xây lắp, 758,594 tỷ, đấu thầu qua mạng trong nước; bài ghi dự kiến đấu thầu từ quý II/2026 và chưa phát hành HSMT tại thời điểm đăng – cần kiểm tra trạng thái hiện tại.<\/li><li><b>EVNNPT – 8 dự án ~200,9 triệu EUR:<\/b> hạn <b>27/11/2026<\/b> (nhắc lại).<\/li><li>Chưa mở được muasamcong.mpi.gov.vn nên không có KHLCNT/HSMT mới để báo.<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li><b>Đối thủ theo dõi:<\/b> trong 72 giờ qua em không tìm được thông báo sản phẩm DT/monitoring/DTS mới có ngày đăng kiểm chứng của Hitachi Energy, Siemens Energy, GE Vernova, Qualitrol, Camlin, Doble/Megger; không độn tin cũ (Doble–Megger, Hitachi HMAX đã đưa 17–19/11).<\/li><li><b>Thị trường BESS nội địa (Báo Đấu thầu, 29/05):<\/b> EVNNPC chọn nhà thầu BESS cho TBA 110 kV (Giao Thủy, Kim Bảng, Thạch Tổ, Trực Ninh…), các gói ~206–248 tỷ do Kỹ thuật Công nghiệp Á Châu trúng (đã nhắc ở các bản tin trước); chưa thấy thêm gói mới.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li>Tìm kiếm quốc tế (Energy Storage News, Utility Dive, T&amp;D World) không trả về bài mới trong 72 giờ có ngày đăng kiểm chứng được; không đưa tin cũ để độn.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li><b>e‑CIGRE A2‑11862 (Hydro‑Québec, 2026) – DT cho MBA ở quy mô tập đoàn lớn:<\/b> theo abstract gồm mô hình chẩn đoán/tiên lượng đa trạng thái có virtual sensing, học sâu phát hiện bất thường OLTC bằng tín hiệu âm‑rung, công cụ diễn giải DGA, giám sát hiệu năng làm mát, ẩm và lão hóa cách điện, đánh giá bushing; trang không có số liệu. Ý nghĩa: khung chức năng thực tế để chia module cho Transformer DT; muốn số liệu cần toàn văn PDF.<\/li><li><b>CIGRE TB 995 (JWG A2/D2.65, ELECTRA 347, 08/2026)<\/b> – đã nhắc ở bản tin 10 và 13/11; chi tiết khảo sát (~60% tổ chức đã khởi động dự án DT, đa số ở mức pilot; &gt;90% kỳ vọng tác động đáng kể trong 10 năm) lấy từ abstract công khai, không đọc được toàn văn.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Chỉ có ~10 tin, thấp hơn mức 15–25, vì tìm kiếm gần như không trả về bài Việt Nam hay quốc tế đăng 17–20/11 chưa từng đưa.<\/li><li>Không mở được muasamcong.mpi.gov.vn; chưa kiểm tra được HSMT Lao Bảo hiện ở trạng thái nào. Bài Lao Bảo đăng 03/04 nên số liệu và tiến độ có thể đã đổi.<\/li><li>Không đọc được toàn văn A2‑11862 và TB 995 (chỉ abstract); không mở được bản tin Doble Calisto R9 (trang chuyển hướng sang tên miền khác, không theo).<\/li><li>Bài Tạp chí Công Thương 10/10 còn ghi hộ sinh hoạt 6 bậc, mâu thuẫn QĐ 2892 áp dụng từ 01/11 – dùng số liệu bậc giá từ Mekong ASEAN 04/11.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Tạp chí Công Thương – Đẩy nhanh Dự án TBA 220kV Chân Mây – <a href=\"https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm<\/a><\/li><li>Báo Đấu thầu – Cơ hội cho nhà thầu cung cấp thiết bị điện tại 2 gói thầu hơn 1.200 tỷ (TBA 500kV Lao Bảo) – <a href=\"https://baodauthau.vn/co-hoi-cho-nha-thau-cung-cap-thiet-bi-dien-tai-2-goi-thau-hon-1200-ty-dong-tai-evn-post196452.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/co-hoi-cho-nha-thau-cung-cap-thiet-bi-dien-tai-2-goi-thau-hon-1200-ty-dong-tai-evn-post196452.html<\/a><\/li><li>Báo Đấu thầu – Loạt gói thầu BESS nâng cao độ tin cậy cung cấp điện – <a href=\"https://baodauthau.vn/loat-goi-thau-bess-nang-cao-do-tin-cay-cung-cap-dien-ky-thuat-cong-nghiep-a-chau-trung-lon-post199665.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/loat-goi-thau-bess-nang-cao-do-tin-cay-cung-cap-dien-ky-thuat-cong-nghiep-a-chau-trung-lon-post199665.html<\/a><\/li><li>VCCI – Hoàn thành đóng điện toàn tuyến đường dây 500/220 kV Nho Quan – Phủ Lý – Thường Tín – <a href=\"https://www.vcci.com.vn/tin-tuc/hoan-thanh-dong-dien-toan-tuyen-duong-day-500-220-kv-nho-quan-phu-ly-thuong-tin\" target=\"_blank\" rel=\"noopener\">https://www.vcci.com.vn/tin-tuc/hoan-thanh-dong-dien-toan-tuyen-duong-day-500-220-kv-nho-quan-phu-ly-thuong-tin<\/a><\/li><li>Tạp chí Công Thương – Bộ Công Thương thông tin loạt vấn đề về cung ứng điện và tái cơ cấu ngành điện – <a href=\"https://tapchicongthuong.vn/bo-cong-thuong-thong-tin-loat-van-de-ve-cung-ung-dien-va-tai-co-cau-nganh-dien-556743.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/bo-cong-thuong-thong-tin-loat-van-de-ve-cung-ung-dien-va-tai-co-cau-nganh-dien-556743.htm<\/a><\/li><li>Mekong ASEAN – Giá điện sinh hoạt rút xuống còn 5 bậc – <a href=\"https://mekongasean.vn/gia-dien-sinh-hoat-rut-xuong-con-5-bac-thap-nhat-1901-dongkwh-61476.html\" target=\"_blank\" rel=\"noopener\">https://mekongasean.vn/gia-dien-sinh-hoat-rut-xuong-con-5-bac-thap-nhat-1901-dongkwh-61476.html<\/a><\/li><li>EVN – EVNNPT energizes two key power transmission facilities in Dong Nai – <a href=\"https://en.evn.com.vn/d/en-US/news/EVNNPT-energizes-two-key-power-transmission-facilities-in-Dong-Nai-60-202-501649\" target=\"_blank\" rel=\"noopener\">https://en.evn.com.vn/d/en-US/news/EVNNPT-energizes-two-key-power-transmission-facilities-in-Dong-Nai-60-202-501649<\/a><\/li><li>e‑CIGRE – A2‑11862 Digital twin technologies for power transformers (Hydro‑Québec) – <a href=\"https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html<\/a><\/li><li>ELECTRA 347 – Digital twins for power transformers (TB 995) – <a href=\"https://electra.cigre.org/347-august-2026/technical-brochures/digital-twins-for-power-transformers-concept-and-future-perspectives\" target=\"_blank\" rel=\"noopener\">https://electra.cigre.org/347-august-2026/technical-brochures/digital-twins-for-power-transformers-concept-and-future-perspectives<\/a><\/li><\/ul>"}, {"day": "2026-11-19", "title": "Bản tin năng lượng & Cơ hội VTI – 19/11/2026", "html": "<blockquote>Tổng hợp từ Báo Đấu thầu, Tạp chí Công Thương, T&amp;D World, T&amp;D India, e‑CIGRE; sáng thứ Năm gần như không có tin Việt Nam mới đăng trong 72 giờ qua nên bản tin ngắn, chỉ giữ tin chưa đưa hoặc có mốc hạn (ghi rõ ngày đăng). Luôn đọc kỹ HSMT/YCKT và xác nhận hạn trên muasamcong.mpi.gov.vn trước khi quyết định dự thầu.<\/blockquote>\n<h2>⚡ 5 điểm nóng hôm nay<\/h2>\n<ol><li><b>EVNNPT mời thu xếp vốn 8 dự án ~200,9 triệu EUR – hạn 27/11/2026<\/b> (còn 8 ngày); đợt 5 dự án 1.119 tỷ đã hết hạn 17/11, chưa có kết quả chọn ngân hàng.<\/li><li><b>Danh sách 5 dự án đợt vay 1.119 tỷ<\/b> (Báo Đấu thầu, 05/11) gồm lắp mới MBA 110 kV‑63 MVA tại TBA 220 kV Chèm, nâng công suất TBA 220 kV Yên Bái và TBA 220 kV Bắc Tân Uyên – nguồn MBA mới cho 2027.<\/li><li><b>Doble và Megger hoàn tất sáp nhập dưới ESCO Technologies<\/b> (T&amp;D World, 05/10): gộp thử nghiệm, giám sát, chẩn đoán và phần mềm trong một hãng.<\/li><li><b>Sterlumiq (Sterlite Electric + RDT Lumiker) bắt tay AP Sensing<\/b> (T&amp;D India, 26/06) bán chung giải pháp DTS/DAS cho cáp điện và đường dây trên không.<\/li><li><b>CIGRE B1‑12634 (Rosseti Lenenergo, Nga):<\/b> DTS sợi quang trong cáp 35–220 kV, sau 2 năm lập hồ sơ nhiệt tuyến dài tới 40 km, độ phân giải 1 m.<\/li><\/ol>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Ưu tiên<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>MBA mới trong 5 dự án EVNNPT vay 1.119 tỷ<\/b> (Chèm 110 kV‑63 MVA, Yên Bái nâng công suất, Bắc Tân Uyên 220 kV)<\/td><td>MBA mới = thời điểm đưa online DGA/nhiệt vào YCKT ngay từ đầu; tổng mức đầu tư nhỏ (130–610 tỷ) nên dễ chốt thông số<\/td><td>Liên hệ PTC1/PTC2/PTC4 qua đầu mối kỹ thuật, gửi YCKT mẫu giám sát MBA; theo dõi KHLCNT trên muasamcong<\/td><td>TB<\/td><td>Chọn ngân hàng sau 17/11; KHLCNT dự kiến 2027<\/td><\/tr><tr><td>2<\/td><td><b>EVNNPT gọi vốn 8 dự án ~200,9 triệu EUR<\/b> (nhắc lại)<\/td><td>Chốt vốn là bước trước KHLCNT thiết bị<\/td><td>Hoàn thiện datasheet DGA/bushing/nhiệt \"EVNNPT‑ready\"<\/td><td>TB<\/td><td><b>27/11/2026<\/b><\/td><\/tr><tr><td>3<\/td><td><b>TBA 220 kV Yên Dũng &amp; Chân Mây vẫn nhắm đóng điện trong tháng 11<\/b> (nhắc lại, chưa thấy tin đóng điện)<\/td><td>Baseline DGA/nhiệt cho MBA mới đóng điện<\/td><td>Hỏi NPMB/PTC xem đã đóng điện chưa; đề xuất gói giám sát nhỏ<\/td><td>TB<\/td><td>30/11/2026<\/td><\/tr><tr><td>4<\/td><td><b>Hợp tác Sterlumiq–AP Sensing (DTS/DAS cho cáp)<\/b><\/td><td>Đối chiếu cho đề xuất DTS sợi quang nhúng trong cáp ngầm 110–220 kV của VTI; hãng đang gói DTS + đo dòng + phân tích dữ liệu<\/td><td>Cập nhật bảng so sánh đối thủ DTS; chuẩn bị điểm khác biệt (tích hợp Asset Health, giá, hỗ trợ tại chỗ)<\/td><td>TB<\/td><td>Theo dõi<\/td><\/tr><tr><td>5<\/td><td><b>Doble + Megger dưới ESCO<\/b><\/td><td>Đối thủ có cả thử nghiệm ngoại tuyến lẫn monitoring/phần mềm; Megger mạnh ở châu Á/Trung Đông nên có thể xuất hiện tại thị trường VN<\/td><td>Cập nhật battlecard VTI; xác định đại lý Megger/Doble tại VN<\/td><td>Thấp<\/td><td>Theo dõi<\/td><\/tr><\/table>\n<p><i>Nhận xét: không có HSMT mới trực tiếp về giám sát online trong 72 giờ qua; chưa có cơ hội \"Cao\" thật sự mới, nên bảng chỉ có 5 dòng.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>Chân Mây và Yên Dũng:<\/b> không thấy tin đóng điện mới; hạn mục tiêu vẫn là tháng 11/2026 (xem bản tin 17/11).<\/li><li><b>EVNSPC chuyển đổi số (Tạp chí Công Thương, 15/10):<\/b> bài nêu 245 TBA 110 kV vận hành không người trực, Trung tâm Điều hành SCADA, 99 bảng báo cáo thông minh, AI hỗ trợ chẩn đoán sớm sự cố MBA; bài không nhắc Digital Twin – nhấn mạnh chỗ trống để chào lớp DT bổ trợ (đã nêu bản tin 16/11).<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>EVNNPT mời ngân hàng thu xếp 1.119 tỷ cho 5 dự án (Báo Đấu thầu, 05/11):<\/b> tụ bù ngang 110 kV lưới miền Bắc 2026 (TMĐT 458 tỷ, vay 343 tỷ); TBA 220 kV Bắc Tân Uyên + đường dây (610/457 tỷ); MBA 110 kV‑63 MVA và thanh cái 110 kV tại TBA 220 kV Chèm (133/99 tỷ); nâng công suất TBA 220 kV Yên Bái (130/97 tỷ); ĐZ 220 kV Đông Hà – Huế mạch 3 (164/123 tỷ). Hạn nộp hồ sơ đề xuất 8h30 ngày 17/11/2026 – đã qua.<\/li><li><b>EVNNPT – 8 dự án ~200,9 triệu EUR:<\/b> hạn <b>27/11/2026<\/b> (nhắc lại).<\/li><li>Chưa mở được muasamcong.mpi.gov.vn nên không có KHLCNT/HSMT mới để báo.<\/li><\/ul>\n<h2>🛰️ Thị trường giám sát, đối thủ &amp; công nghệ<\/h2>\n<ul><li><b>Doble – Megger (T&amp;D World, 05/10):<\/b> sáp nhập hoàn tất dưới ESCO Technologies, đang vào giai đoạn tích hợp; Megger mạnh ở châu Âu, Trung Đông, châu Phi, châu Á còn Doble mạnh ở Bắc Mỹ; bài không nêu giá trị thương vụ hay doanh thu. Ý nghĩa: đối thủ thử nghiệm–giám sát–phần mềm hợp nhất, có thể chào gói \"thử nghiệm + online monitoring\" cho EVN.<\/li><li><b>Sterlumiq + AP Sensing (T&amp;D India, 26/06):<\/b> bán chéo theo khu vực, cùng phát triển sản phẩm cho cáp trung/cao áp và đường dây trên không; AP Sensing đóng góp DAS/DTS/DTSS, Sterlumiq đóng góp CAMOS và đo dòng điện. Ý nghĩa: DTS đang đi cùng đo dòng + phân tích để chuyển sang bảo trì theo tình trạng.<\/li><li><b>G&amp;W Electric (T&amp;D World, 05/11):<\/b> bộ cảm biến giám sát thời gian thực cho lưới phân phối (bài chỉ có tiêu đề/chú thích, chưa đọc chi tiết).<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li>Tìm kiếm quốc tế 24–72 giờ (Utility Dive, Energy Storage News, pv magazine, Reuters, Transformers Magazine) không trả về bài mới kiểm chứng được ngày đăng; không đưa tin cũ để độn.<\/li><\/ul>\n<h2>🔬 Nghiên cứu, bài báo &amp; tiêu chuẩn<\/h2>\n<ul><li><b>CIGRE B1‑12634 (Rosseti Lenenergo, Nga, 2026) – định vị sự cố gián tiếp bằng DTS:<\/b> dùng sợi quang tích hợp sẵn trong cáp, đo tán xạ Raman (tỷ lệ anti‑Stokes/Stokes); sau hai năm triển khai lập được hồ sơ nhiệt cho tuyến cáp cao áp dài tới 40 km, độ phân giải không gian 1 m, độ chính xác 0,1 °C; phát hiện điểm quá nhiệt tại giao cắt với đường ống nhiệt và hạ tầng đô thị. Ý nghĩa: số liệu tham chiếu thực tế cho chào DTS cáp ngầm đô thị (đối chiếu hạn chế khi cáp song song đường ống hơi/nóng).<\/li><li><b>CIGRE A2‑10255 (POWERGRID, Ấn Độ, 2026) – DT MBA với học máy:<\/b> kết hợp DGA (theo tiêu chuẩn IEEE), dữ liệu thời gian thực và thử nghiệm định kỳ, kiểm thử trên dữ liệu lịch sử MBA đã hỏng; trang abstract không nêu độ chính xác hay thời gian báo trước. Ý nghĩa: đi cùng A2‑10207 (bản tin 18/11) cho thấy POWERGRID là tham chiếu khu vực; cần đọc toàn văn trước khi trích số liệu.<\/li><\/ul>\n<h2>⚠️ Giới hạn hôm nay<\/h2>\n<ul><li>Công cụ tìm kiếm gần như không trả về bài Việt Nam đăng 17–19/11; vì thế bản tin chỉ có ~10 tin, thấp hơn mức 15–25 và không độn tin cũ.<\/li><li>Không truy cập được baodauthau.vn (trang chủ), en.evn.com.vn, transformers-magazine.com, powerline.net.in, vietnamnews.vn (yêu cầu quyền truy cập không được duyệt trong phiên không người theo dõi) và muasamcong.mpi.gov.vn.<\/li><li>Tin Doble–Megger (05/10) và Sterlumiq–AP Sensing (26/06) là tin cũ hơn 72 giờ nhưng chưa từng đưa trong các bản tin trước; bài G&amp;W Electric chỉ đọc được tiêu đề.<\/li><li>A2‑10255 chỉ đọc abstract, không có số liệu hiệu quả.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu – EVNNPT mời ngân hàng thu xếp 1.119 tỷ đồng đầu tư 5 dự án truyền tải điện – <a href=\"https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-da
