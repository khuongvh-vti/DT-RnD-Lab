<script>
const NEWS=[{"day": "2026-11-10", "title": "Bản tin năng lượng & Cơ hội VTI – 10/11/2026", "html": "<blockquote>Tổng hợp từ báo chí công khai (Báo Đấu thầu, Tạp chí Công Thương, EVN/EVNNPT, T&amp;D World, Transformers Magazine, CIGRE, IEEE PES). Số liệu ghi theo nguồn; cần kiểm tra lại trên HSMT/muasamcong trước khi ra quyết định dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVNNPT gọi vốn 5 dự án truyền tải (1.495 tỷ TMĐT, vay 1.119 tỷ)<\/b>: tụ bù ngang 110 kV miền Bắc (458 tỷ); TBA 220 kV Bắc Tân Uyên (610 tỷ); lắp MBA 110 kV‑63 MVA tại TBA 220 kV Chèm (133 tỷ); nâng công suất TBA 220 kV Yên Bái (130 tỷ); ĐZ 220 kV Đông Hà–Huế mạch 3 (164 tỷ)<\/td><td>MBA mới / nâng công suất → gói thiết bị có <b>online monitoring (DGA, bushing, nhiệt)<\/b>, SCADA/HMI, thí nghiệm hiệu chỉnh<\/td><td>Theo dõi KHLCNT trên muasamcong cho 3 dự án TBA; chuẩn bị hồ sơ năng lực monitoring + DT pilot cho MBA mới<\/td><td>Hạn ngân hàng nộp đề xuất 17/11/2026 → KHLCNT dự kiến sau đó<\/td><\/tr><tr><td>2<\/td><td><b>EVNNPT: 8 dự án truyền tải ~200,9 triệu EUR<\/b> (thu xếp vốn, hạn 27/11/2026)<\/td><td>Quy mô lớn, nhiều TBA 220/500 kV mới<\/td><td>Lấy danh mục 8 dự án, lọc dự án có TBA → lập pipeline<\/td><td>27/11/2026<\/td><\/tr><tr><td>3<\/td><td><b>Lộ trình EVNNPT: giám sát trực tuyến MBA theo mức độ quan trọng + chuyển sang TBA số<\/b><\/td><td>Đúng trọng tâm Transformer DT / Substation DT 110–220 kV<\/td><td>Đề xuất PoC \"Transformer DT mức Diagnostic→Predictive (CIGRE TB 995)\" cho 1 Công ty Truyền tải (PTC1/PTC2)<\/td><td>Chủ động tiếp cận Q4/2026<\/td><\/tr><tr><td>4<\/td><td><b>BESS lưới phân phối<\/b>: EVNNPC phấn đấu 805 MW; giai đoạn 2 tổng mức &gt;1.300 tỷ, 6 gói ~1.000 tỷ đang đánh giá HSDT; Ban QLDA điện 2 (550 MW) &amp; GENCO3 (300 MW) đang làm thủ tục<\/td><td>Cần EMS/giám sát pin, tích hợp SCADA, cảnh báo cháy/nhiệt – mảng phần mềm VTI làm được<\/td><td>Liên hệ các nhà thầu trúng BESS (Á Châu, VNAS…) để làm thầu phụ phần mềm giám sát/EMS<\/td><td>Liên tục<\/td><\/tr><tr><td>5<\/td><td><b>TBA 220 kV Chân Mây (Huế)<\/b> phấn đấu đóng điện 11/2026, phần trạm đạt ~95%, đang thí nghiệm hiệu chỉnh<\/td><td>Cơ hội dịch vụ thí nghiệm/commissioning, tích hợp hệ thống điều khiển máy tính<\/td><td>Liên hệ PTC2 / nhà thầu EPC<\/td><td>11/2026<\/td><\/tr><tr><td>6<\/td><td><b>Điện lực tỉnh chuyển TBA 110 kV không người trực<\/b> (Bắc Ninh 50/51 trạm; EVNSPC 100% + AI giám sát)<\/td><td>Dữ liệu SCADA sẵn → bài toán đánh giá tình trạng thiết bị, xếp hạng rủi ro (asset health index)<\/td><td>Chào giải pháp \"Health Index + DT nhẹ\" dùng dữ liệu SCADA sẵn có<\/td><td>Q4/2026–2027<\/td><\/tr><\/table>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN đốc thúc tiến độ (04/11/2026):<\/b> Quảng Trạch I phấn đấu phát điện thương mại cả 2 tổ máy trong 2026; LNG Quảng Trạch II hoàn thiện TKKT trình EVN Q4/2026; Quảng Trạch III phê duyệt FS Q4/2026; ĐZ 220 kV Nhơn Trạch 3 – TBA 500 kV Long Thành đóng điện toàn tuyến cuối 2026. Sản lượng tháng 11/2026 ước 28,9 tỷ kWh (+14,4%).<\/li><li><b>9 tháng 2026:<\/b> EVN khởi công 136 công trình (2×500 kV, 18×220 kV, 116×110 kV), đóng điện 131 công trình; BESS: EVNHANOI 50 MW, EVNNPC 155 MW.<\/li><li><b>Kế hoạch 2026–2030 của EVN/EVNNPT:<\/b> 292 công trình truyền tải (78×500 kV, 214×220 kV), ~16.665 km đường dây, &gt;91.263 MVA MBA → thị trường monitoring MBA rất lớn.<\/li><li><b>Chuyển đổi số EVNNPT:<\/b> chuyển TBA 220 kV sang không người trực, lắp giám sát DGA online; IMIS 2.0, nhật ký điện tử; TBA 220 kV Thủy Nguyên là TBA số đầu tiên.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>GE Vernova mua Trench Group (~9 tỷ USD, 28/10/2026)<\/b> – Trench sản xuất bushing/thiết bị đo lường cao áp; ảnh hưởng chuỗi cung ứng bushing &amp; cảm biến.<\/li><li><b>Hitachi Energy khởi công nhà máy MBA lực 457 triệu USD tại South Boston, Virginia<\/b> – thiếu hụt MBA lực toàn cầu tiếp tục, kéo dài lead time → tăng giá trị của giám sát/kéo dài tuổi thọ MBA hiện hữu.<\/li><li><b>National Grid (UK)<\/b> nâng cấp TBA 400 kV Imperial Park – bổ sung MBA để tăng kết nối.<\/li><li><b>T&amp;D World:<\/b> \"procurement-cycle delay\" được xem là rủi ro độ tin cậy lớn của lưới (28/10/2026).<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer DT)<\/h2>\n<ul><li><b>IEEE PES GM 2026 – Univ. of Queensland:<\/b> PINN cho mô hình nhiệt MBA (dự báo TOT → HST) hướng tới digital twin. → Đối chiếu với mô hình IEC 60076‑7 đang có trong Công cụ.<\/li><li><b>CIGRE A2‑11862 (Paris 2026, Canada):<\/b> \"Development of Digital Twin Technologies for Power Transformers – multi‑disciplinary initiative at a large utility\" (DGA cho phần tác dụng, sứ, OLTC). Giá 30 € → đề xuất mua đưa vào library.<\/li><li><b>Transformer Magazine Vol.13 Issue 1 (2026):<\/b> mô hình thermal‑hydraulic network động chi tiết cho MBA dầu (Radaković et al.).<\/li><li><b>J. Xi'an Jiaotong Univ. 2026:<\/b> PI‑DeepONet tính nhanh trường nhiệt‑dòng chảy cuộn dây cho DT.<\/li><li><b>Measurement 286 (2026):<\/b> dự báo khí hòa tan bằng Mamba tự giám sát + ràng buộc vật lý, dữ liệu 13 MBA (316k bản ghi).<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu: EVNNPT mời ngân hàng thu xếp 1.119 tỷ (05/11/2026) – <a href=\"https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html<\/a><\/li><li>Báo Đấu thầu: EVN đốc thúc nhà thầu (04/11/2026) – <a href=\"https://baodauthau.vn/evn-doc-thuc-nha-thau-tang-toc-thi-cong-cac-du-an-nguon-va-luoi-dien-post211722.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evn-doc-thuc-nha-thau-tang-toc-thi-cong-cac-du-an-nguon-va-luoi-dien-post211722.html<\/a><\/li><li>Báo Đấu thầu: 8 dự án 200 triệu EUR – <a href=\"https://baodauthau.vn/evnnpt-can-thu-xep-hon-200-trieu-eur-cho-8-du-an-truyen-tai-dien-post209398.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-can-thu-xep-hon-200-trieu-eur-cho-8-du-an-truyen-tai-dien-post209398.html<\/a><\/li><li>Báo Đấu thầu: 9 tháng 2026 EVN – <a href=\"https://baodauthau.vn/9-thang-nam-2026-evn-khoi-cong-136-cong-trinh-luoi-dien-day-manh-dau-tu-bess-post209156.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/9-thang-nam-2026-evn-khoi-cong-136-cong-trinh-luoi-dien-day-manh-dau-tu-bess-post209156.html<\/a><\/li><li>Báo Đấu thầu: BESS EVNNPC GĐ2 – <a href=\"https://baodauthau.vn/evnnpc-chon-thau-lap-dat-he-thong-bess-giai-doan-2-co-hoi-lon-canh-tranh-cao-post204851.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpc-chon-thau-lap-dat-he-thong-bess-giai-doan-2-co-hoi-lon-canh-tranh-cao-post204851.html<\/a><\/li><li>Tạp chí Công Thương: TBA 220 kV Chân Mây – <a href=\"https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm<\/a><\/li><li>Tạp chí Công Thương: 292 công trình 2026–2030 – <a href=\"https://tapchicongthuong.vn/day-nhanh-cac-du-an-luoi-dien-truyen-tai-de-bao-dam-an-ninh-nang-luong-quoc-gia-533569.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/day-nhanh-cac-du-an-luoi-dien-truyen-tai-de-bao-dam-an-ninh-nang-luong-quoc-gia-533569.htm<\/a><\/li><li>Tạp chí Công Thương: EVNNPT 7 nhiệm vụ CĐS – <a href=\"https://tapchicongthuong.vn/evnnpt-hoan-thanh-truoc-tien-do-7-nhiem-vu-chuyen-doi-so-86794.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/evnnpt-hoan-thanh-truoc-tien-do-7-nhiem-vu-chuyen-doi-so-86794.htm<\/a><\/li><li>Nhân Dân: EVNNPT chuyển đổi số – <a href=\"https://nhandan.vn/evnnpt-tan-dung-thoi-co-tao-buoc-dot-pha-chuyen-doi-so-post784540.html\" target=\"_blank\" rel=\"noopener\">https://nhandan.vn/evnnpt-tan-dung-thoi-co-tao-buoc-dot-pha-chuyen-doi-so-post784540.html<\/a><\/li><li>Điện lực Bắc Ninh – <a href=\"https://thuonghieucongluan.com.vn/cong-ty-dien-luc-bac-ninh-chuyen-doi-so-nang-tam-quan-tri-luoi-dien-thong-minh-a339072.html\" target=\"_blank\" rel=\"noopener\">https://thuonghieucongluan.com.vn/cong-ty-dien-luc-bac-ninh-chuyen-doi-so-nang-tam-quan-tri-luoi-dien-thong-minh-a339072.html<\/a><\/li><li>T&amp;D World Utility Business – <a href=\"https://www.tdworld.com/utility-business?infscr=1&amp;page=10\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/utility-business?infscr=1&amp;page=10<\/a><\/li><li>Hitachi Energy Virginia – <a href=\"https://ground.news/article/hitachi-energy-breaks-ground-on-457-million-virginia-transformer-plant\" target=\"_blank\" rel=\"noopener\">https://ground.news/article/hitachi-energy-breaks-ground-on-457-million-virginia-transformer-plant<\/a><\/li><li>National Grid Imperial Park – <a href=\"https://transformer-technology.com/national-grid-prepares-transformer-delivery-for-newport-substation-upgrade/\" target=\"_blank\" rel=\"noopener\">https://transformer-technology.com/national-grid-prepares-transformer-delivery-for-newport-substation-upgrade/<\/a><\/li><li>PESGM 2026 PINN – <a href=\"https://index.mirasmart.com/PESGM2026/PDFfiles/PESGM2026-001074.pdf\" target=\"_blank\" rel=\"noopener\">https://index.mirasmart.com/PESGM2026/PDFfiles/PESGM2026-001074.pdf<\/a><\/li><li>CIGRE A2‑11862 – <a href=\"https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html<\/a><\/li><li>Transformer Magazine 13(1) – <a href=\"https://hrcak.srce.hr/file/495631\" target=\"_blank\" rel=\"noopener\">https://hrcak.srce.hr/file/495631<\/a><\/li><li>XJTU PI‑DeepONet – <a href=\"https://zkxb.xjtu.edu.cn/zh/article/doi/10.7652/xjtuxb202607021/\" target=\"_blank\" rel=\"noopener\">https://zkxb.xjtu.edu.cn/zh/article/doi/10.7652/xjtuxb202607021/<\/a><\/li><li>Measurement 286 – <a href=\"https://ir.psgitech.ac.in/id/eprint/1907/\" target=\"_blank\" rel=\"noopener\">https://ir.psgitech.ac.in/id/eprint/1907/<\/a><\/li><\/ul>"}];
const days=document.getElementById('days'),doc=document.getElementById('doc');
function show(i){[...days.children].forEach((b,j)=>b.classList.toggle('on',i===j));
 const n=NEWS[i];doc.innerHTML='<h2 style="border:0">'+n.title+'</h2>'+n.html;
 doc.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)});

if(NEWS.length)show(0);else doc.textContent='Chưa có bản tin.';
</script></body></html>
