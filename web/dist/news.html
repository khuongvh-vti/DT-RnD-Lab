<script>
const NEWS=[{"day": "2026-11-11", "title": "Bản tin năng lượng & Cơ hội VTI – 11/11/2026", "html": "<blockquote>Tổng hợp từ báo chí công khai (Báo Đấu thầu, Vietnam+, VNS, Cổng TTĐT Hà Tĩnh, Mekong ASEAN, T&amp;D World, Transformer Technology, CIGRE, arXiv); tin đã đưa ngày 10/11 chỉ nhắc lại khi có diễn biến mới. Cần kiểm tra HSMT/muasamcong trước khi quyết định dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>TBA 220 kV Vũng Áng 2 (Hà Tĩnh) – nhà đầu tư tư nhân VinEnergo<\/b>: 2 MBA 220/110/22 kV × 250 MVA, 8 ngăn lộ 220 kV, ~456 tỷ (chấp thuận 04/11/2026)<\/td><td>Chủ đầu tư tư nhân, quyết định nhanh, không bị ràng buộc khung thiết bị EVNNPT → cửa vào tốt cho <b>online monitoring MBA (DGA, bushing, nhiệt) + Transformer DT<\/b> ngay từ thiết kế<\/td><td>Liên hệ VinEnergo/tư vấn thiết kế trong 2 tuần; gửi hồ sơ năng lực + đề xuất \"MBA 250 MVA monitoring-ready\" (cảm biến lắp tại nhà máy)<\/td><td>Vận hành Q2/2027 → chốt cấu hình thiết bị Q4/2026–Q1/2027<\/td><\/tr><tr><td>2<\/td><td><b>EVNNPT gọi vốn 8 dự án (~200,9 triệu EUR) – nay có danh mục chi tiết<\/b>: TBA 220 kV Ứng Hòa, Tân Việt (+ĐZ Tân Việt–Gia Lộc–Phố Nối), TBA 220 kV đấu ĐZ Đông Anh–Vân Trì, Bến Cát 2, Thanh Hà, Lý Nhân; ĐZ 220 kV Bắc Ninh 500–Bắc Ninh 4; <b>TBA 500 kV Long An<\/b><\/td><td>6 TBA 220 kV + 1 TBA 500 kV mới → pipeline gói thiết bị/SCADA/monitoring 2027<\/td><td>Lập bảng theo dõi 7 TBA (ban QLDA, PTC vận hành); đưa vào CRM; chuẩn bị tài liệu Substation DT 220 kV<\/td><td>Hạn ngân hàng nộp đề xuất <b>27/11/2026<\/b><\/td><\/tr><tr><td>3<\/td><td><b>EVNNPT gọi vốn 5 dự án 1.119 tỷ<\/b> (Bắc Tân Uyên, MBA 63 MVA tại Chèm, nâng công suất Yên Bái…) – nhắc lại vì sắp đến hạn<\/td><td>MBA mới/nâng công suất → cơ hội monitoring MBA, thí nghiệm<\/td><td>Theo dõi KHLCNT sau khi chốt ngân hàng<\/td><td><b>17/11/2026<\/b> (còn 6 ngày)<\/td><\/tr><tr><td>4<\/td><td><b>TBA 220 kV Phước Đông (EVNNPT, TMĐT 451 tỷ)<\/b> – gói 12 xây lắp trạm đã có kết quả: Liên danh PC1 Miền Nam – PC1 Thăng Long trúng 111,155 tỷ<\/td><td>Phần xây lắp đã chốt → các gói thiết bị/điều khiển/thí nghiệm có thể còn mở<\/td><td>Tìm KHLCNT dự án trên muasamcong; tiếp cận PC1 (tổng thầu quen thuộc) để làm thầu phụ tích hợp SCADA/monitoring<\/td><td>Theo dõi tháng 11–12/2026<\/td><\/tr><tr><td>5<\/td><td><b>TBA 220 kV Móng Cái (NPMB, 250 MVA, chừa vị trí MBA2)<\/b> – đang thi công, có hệ điều khiển–bảo vệ–SCADA đồng bộ<\/td><td>TBA biên giới, sẽ vận hành không người trực → phù hợp gói giám sát online + DT nhẹ cho PTC1<\/td><td>Đề xuất với PTC1/NPMB bổ sung giám sát DGA/bushing cho MBA mới trong giai đoạn nghiệm thu<\/td><td>Hoàn thành Q2/2027<\/td><\/tr><tr><td>6<\/td><td><b>BESS thương mại–công nghiệp (GG Power, VinEnergo)<\/b> – vướng cơ chế doanh thu nhưng đang triển khai (GG Power nhà máy 5 GWh; VinEnergo đóng điện solar+BESS Vũng Áng 28/10)<\/td><td>Cần EMS, giám sát cell/nhiệt, tích hợp SCADA → phần mềm VTI<\/td><td>Đặt lịch làm việc với GG Power về hợp tác phần mềm giám sát/EMS<\/td><td>Chủ động Q4/2026<\/td><\/tr><\/table>\n<p><i>Nhận xét: hôm nay không có HSMT mới trực tiếp cho giám sát online; các cơ hội chủ yếu là pipeline dự án TBA 220 kV.<\/i><\/p>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>10 tháng 2026 (EVN, 03/11):<\/b> sản lượng hệ thống 297,4 tỷ kWh (+9,8%); khởi công 150 và đóng điện 137 công trình 110–500 kV (5×500 kV, 16×220 kV, 116×110 kV), trong đó có MBA AT1 500 kV–900 MVA TBA 500 kV Di Linh.<\/li><li><b>Đóng điện ĐZ 220 kV đấu nối TBA 220 kV Bạc Liêu (03/11):<\/b> ~4,37 km mạch kép, mở rộng ngăn lộ, &gt;107 tỷ; EVNNPT/SPMB, PTC4 vận hành.<\/li><li><b>TBA 220 kV Vũng Áng 2 (04/11):<\/b> Hà Tĩnh chấp thuận VinEnergo làm nhà đầu tư – một trong số ít TBA 220 kV do tư nhân đầu tư theo cơ chế mới.<\/li><li><b>TBA 220 kV Móng Cái:<\/b> thi công từ 27/9, 270 ngày, TMĐT ~483 tỷ, gói xây lắp 130,5 tỷ (Công nghệ Việt – Sao Vàng).<\/li><li><b>BESS (Mekong ASEAN, 29/10):<\/b> rào cản lớn nhất là cơ chế ghi nhận và thanh toán doanh thu, chưa có giá riêng cho điện xả từ BESS; hoàn vốn C&amp;I ~4,5–6 năm nhờ chênh lệch giá cao/thấp điểm ~2.000 đ/kWh.<\/li><\/ul>\n<h2>📑 Đấu thầu &amp; gọi vốn<\/h2>\n<ul><li><b>Phú Mỹ 3 (EVNHCMC, 06/11):<\/b> Gói 1 xây dựng + vật tư thiết bị đấu nối TBA 220 kV Phú Mỹ 3 – Năng lượng Tam Sơn trúng 67,67 tỷ (giảm ~5%), 180 ngày.<\/li><li><b>Phước Đông (EVNNPT, 03/11):<\/b> Gói 12 xây lắp trạm (gồm PCCC), giá gói 121,996 tỷ → trúng 111,155 tỷ (PC1 Miền Nam – PC1 Thăng Long); 3 HSDT.<\/li><li><b>EVNNPT 8 dự án ~200,9 triệu EUR:<\/b> hạn nộp đề xuất 8h30 ngày 27/11/2026 (Ban Tài chính – Kế toán EVNNPT). Lưu ý: tổng các khoản báo nêu (~190,9 triệu EUR) lệch với con số tổng 200,9 triệu – cần đối chiếu văn bản gốc.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>T&amp;D World:<\/b> bài hướng dẫn ưu tiên giám sát MBA khi tải data center tăng nhanh – lập luận tương tự cho KCN/data center tại VN.<\/li><li><b>Transformer Technology (09/11):<\/b> báo cáo khoảng trống lớn về bảo vệ MBA tại các TBA Ukraine – nhấn mạnh nhu cầu giám sát/bảo vệ MBA trong điều kiện thiếu thiết bị thay thế.<\/li><li><b>SolidUltra gọi vốn 3,3 triệu USD (09/11)<\/b> cho MBA phục vụ AI data center; <b>Bitzero nhận 2 MBA 60 MVA (10/11)<\/b> cho data center tại Na Uy.<\/li><li><b>KONČAR (06/11)<\/b> thắng hợp đồng MBA tại Hà Lan – nhà sản xuất châu Âu tiếp tục hưởng lợi từ thiếu hụt MBA.<\/li><li><b>ComEd (03/11)<\/b> triển khai dự án truyền tải GRIT – xu hướng đầu tư lưới Mỹ tiếp tục tăng.<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer/Substation DT)<\/h2>\n<ul><li><b>arXiv 2601.03673 (Mondragon/EHU, Aizpurua):<\/b> Bayesian PINN dị phương sai tách bất định aleatoric/epistemic cho ước lượng nhiệt độ dầu, hot‑spot và lão hóa cách điện; RMSE giảm 57% so với PINN thường → gợi ý thêm dải tin cậy cho mô hình IEC 60076‑7 của Công cụ.<\/li><li><b>CIGRE A2‑10385 (IntellPower/Powercor, Úc):<\/b> DT quản lý độ ẩm MBA khép kín từ cảm biến đến thiết bị sấy sàng phân tử, có \"Moisture Cloud\" và vẫn ước lượng khi một kênh cảm biến hỏng.<\/li><li><b>CIGRE A2‑11489 (HD Hyundai Electric):<\/b> DT chẩn đoán PD trong MBA dùng dữ liệu thiết kế 3D mô phỏng lan truyền UHF; tối ưu vị trí cảm biến, định vị chỉ với 3 cảm biến (độ chính xác +20%). Cả hai bài 30 € → đề xuất mua cho library.<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu – Tam Sơn trúng gói đấu nối TBA 220 kV Phú Mỹ 3 – <a href=\"https://baodauthau.vn/nang-luong-tam-son-trung-goi-thau-67-ty-dong-dau-noi-tram-bien-ap-220kv-phu-my-3-post212015.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/nang-luong-tam-son-trung-goi-thau-67-ty-dong-dau-noi-tram-bien-ap-220kv-phu-my-3-post212015.html<\/a><\/li><li>Báo Đấu thầu – PC1 Miền Nam – Thăng Long trúng gói xây lắp TBA 111 tỷ – <a href=\"https://baodauthau.vn/lien-danh-pc1-mien-nam-thang-long-trung-goi-thau-xay-lap-tram-bien-ap-111-ty-dong-post211666.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/lien-danh-pc1-mien-nam-thang-long-trung-goi-thau-xay-lap-tram-bien-ap-111-ty-dong-post211666.html<\/a><\/li><li>Báo Đấu thầu – Đóng điện ĐZ 220 kV đấu nối TBA Bạc Liêu – <a href=\"https://baodauthau.vn/dong-dien-cac-mach-duong-day-220kv-dau-noi-tba-220kv-bac-lieu-hon-107-ty-dong-post211714.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/dong-dien-cac-mach-duong-day-220kv-dau-noi-tba-220kv-bac-lieu-hon-107-ty-dong-post211714.html<\/a><\/li><li>Báo Đấu thầu – Thi công TBA 220 kV Móng Cái – <a href=\"https://baodauthau.vn/trien-khai-thi-cong-tram-bien-ap-220kv-mong-cai-gan-483-ty-dong-post208291.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/trien-khai-thi-cong-tram-bien-ap-220kv-mong-cai-gan-483-ty-dong-post208291.html<\/a><\/li><li>Vietnam+ – Sản lượng điện 10 tháng tăng 9,8% – <a href=\"https://www.vietnamplus.vn/san-luong-dien-10-thang-tang-98-evn-tap-trung-bao-dam-nguon-cung-cuoi-nam-post1145791.vnp\" target=\"_blank\" rel=\"noopener\">https://www.vietnamplus.vn/san-luong-dien-10-thang-tang-98-evn-tap-trung-bao-dam-nguon-cung-cuoi-nam-post1145791.vnp<\/a><\/li><li>Viet Nam News – EVNNPT seeks over $224 mln in bank loans – <a href=\"https://vietnamnews.vn/economy/1801912/evnnpt-seeks-over-224-mln-in-bank-loans-for-grid-expansion.html\" target=\"_blank\" rel=\"noopener\">https://vietnamnews.vn/economy/1801912/evnnpt-seeks-over-224-mln-in-bank-loans-for-grid-expansion.html<\/a><\/li><li>Cổng TTĐT Hà Tĩnh – TBA 220 kV Vũng Áng 2 – <a href=\"https://hatinh.gov.vn/bai-viet/ha-tinh-chap-thuan-nha-dau-tu-du-an-tram-bien-ap-220-kv-vung-ang-2-va-duong-day-dau-noi\" target=\"_blank\" rel=\"noopener\">https://hatinh.gov.vn/bai-viet/ha-tinh-chap-thuan-nha-dau-tu-du-an-tram-bien-ap-220-kv-vung-ang-2-va-duong-day-dau-noi<\/a><\/li><li>Mekong ASEAN – Bài toán dòng tiền của thị trường BESS – <a href=\"https://mekongasean.vn/bai-toan-dong-tien-cua-thi-truong-bess-61214.html\" target=\"_blank\" rel=\"noopener\">https://mekongasean.vn/bai-toan-dong-tien-cua-thi-truong-bess-61214.html<\/a><\/li><li>T&amp;D World – Substations – <a href=\"https://www.tdworld.com/substations\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/substations<\/a><\/li><li>Transformer Technology – Latest News – <a href=\"https://transformer-technology.com/\" target=\"_blank\" rel=\"noopener\">https://transformer-technology.com/<\/a><\/li><li>arXiv 2601.03673 – <a href=\"https://arxiv.org/pdf/2601.03673\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/pdf/2601.03673<\/a><\/li><li>CIGRE A2‑10385 – <a href=\"https://www.e-cigre.org/publications/detail/a2-10385-2026-digital-twin-for-transformer-moisture-management-closing-the-loop-from-sensing-to-action.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-10385-2026-digital-twin-for-transformer-moisture-management-closing-the-loop-from-sensing-to-action.html<\/a><\/li><li>CIGRE A2‑11489 – <a href=\"https://www.e-cigre.org/publications/detail/a2-11489-2026-development-of-a-digital-twin-based-transformer-partial-discharge-diagnostic-system.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11489-2026-development-of-a-digital-twin-based-transformer-partial-discharge-diagnostic-system.html<\/a><\/li><\/ul>"}, {"day": "2026-11-10", "title": "Bản tin năng lượng & Cơ hội VTI – 10/11/2026", "html": "<blockquote>Tổng hợp từ báo chí công khai (Báo Đấu thầu, Tạp chí Công Thương, EVN/EVNNPT, T&amp;D World, Transformers Magazine, CIGRE, IEEE PES). Số liệu ghi theo nguồn; cần kiểm tra lại trên HSMT/muasamcong trước khi ra quyết định dự thầu.<\/blockquote>\n<h2>🎯 Cơ hội hợp tác cho VTI (ưu tiên)<\/h2>\n<table><tr><th>#<\/th><th>Cơ hội<\/th><th>Vì sao liên quan VTI<\/th><th>Hành động đề xuất<\/th><th>Hạn / mốc<\/th><\/tr><tr><td>1<\/td><td><b>EVNNPT gọi vốn 5 dự án truyền tải (1.495 tỷ TMĐT, vay 1.119 tỷ)<\/b>: tụ bù ngang 110 kV miền Bắc (458 tỷ); TBA 220 kV Bắc Tân Uyên (610 tỷ); lắp MBA 110 kV‑63 MVA tại TBA 220 kV Chèm (133 tỷ); nâng công suất TBA 220 kV Yên Bái (130 tỷ); ĐZ 220 kV Đông Hà–Huế mạch 3 (164 tỷ)<\/td><td>MBA mới / nâng công suất → gói thiết bị có <b>online monitoring (DGA, bushing, nhiệt)<\/b>, SCADA/HMI, thí nghiệm hiệu chỉnh<\/td><td>Theo dõi KHLCNT trên muasamcong cho 3 dự án TBA; chuẩn bị hồ sơ năng lực monitoring + DT pilot cho MBA mới<\/td><td>Hạn ngân hàng nộp đề xuất 17/11/2026 → KHLCNT dự kiến sau đó<\/td><\/tr><tr><td>2<\/td><td><b>EVNNPT: 8 dự án truyền tải ~200,9 triệu EUR<\/b> (thu xếp vốn, hạn 27/11/2026)<\/td><td>Quy mô lớn, nhiều TBA 220/500 kV mới<\/td><td>Lấy danh mục 8 dự án, lọc dự án có TBA → lập pipeline<\/td><td>27/11/2026<\/td><\/tr><tr><td>3<\/td><td><b>Lộ trình EVNNPT: giám sát trực tuyến MBA theo mức độ quan trọng + chuyển sang TBA số<\/b><\/td><td>Đúng trọng tâm Transformer DT / Substation DT 110–220 kV<\/td><td>Đề xuất PoC \"Transformer DT mức Diagnostic→Predictive (CIGRE TB 995)\" cho 1 Công ty Truyền tải (PTC1/PTC2)<\/td><td>Chủ động tiếp cận Q4/2026<\/td><\/tr><tr><td>4<\/td><td><b>BESS lưới phân phối<\/b>: EVNNPC phấn đấu 805 MW; giai đoạn 2 tổng mức &gt;1.300 tỷ, 6 gói ~1.000 tỷ đang đánh giá HSDT; Ban QLDA điện 2 (550 MW) &amp; GENCO3 (300 MW) đang làm thủ tục<\/td><td>Cần EMS/giám sát pin, tích hợp SCADA, cảnh báo cháy/nhiệt – mảng phần mềm VTI làm được<\/td><td>Liên hệ các nhà thầu trúng BESS (Á Châu, VNAS…) để làm thầu phụ phần mềm giám sát/EMS<\/td><td>Liên tục<\/td><\/tr><tr><td>5<\/td><td><b>TBA 220 kV Chân Mây (Huế)<\/b> phấn đấu đóng điện 11/2026, phần trạm đạt ~95%, đang thí nghiệm hiệu chỉnh<\/td><td>Cơ hội dịch vụ thí nghiệm/commissioning, tích hợp hệ thống điều khiển máy tính<\/td><td>Liên hệ PTC2 / nhà thầu EPC<\/td><td>11/2026<\/td><\/tr><tr><td>6<\/td><td><b>Điện lực tỉnh chuyển TBA 110 kV không người trực<\/b> (Bắc Ninh 50/51 trạm; EVNSPC 100% + AI giám sát)<\/td><td>Dữ liệu SCADA sẵn → bài toán đánh giá tình trạng thiết bị, xếp hạng rủi ro (asset health index)<\/td><td>Chào giải pháp \"Health Index + DT nhẹ\" dùng dữ liệu SCADA sẵn có<\/td><td>Q4/2026–2027<\/td><\/tr><\/table>\n<h2>🇻🇳 Dự án &amp; kế hoạch triển khai trong nước<\/h2>\n<ul><li><b>EVN đốc thúc tiến độ (04/11/2026):<\/b> Quảng Trạch I phấn đấu phát điện thương mại cả 2 tổ máy trong 2026; LNG Quảng Trạch II hoàn thiện TKKT trình EVN Q4/2026; Quảng Trạch III phê duyệt FS Q4/2026; ĐZ 220 kV Nhơn Trạch 3 – TBA 500 kV Long Thành đóng điện toàn tuyến cuối 2026. Sản lượng tháng 11/2026 ước 28,9 tỷ kWh (+14,4%).<\/li><li><b>9 tháng 2026:<\/b> EVN khởi công 136 công trình (2×500 kV, 18×220 kV, 116×110 kV), đóng điện 131 công trình; BESS: EVNHANOI 50 MW, EVNNPC 155 MW.<\/li><li><b>Kế hoạch 2026–2030 của EVN/EVNNPT:<\/b> 292 công trình truyền tải (78×500 kV, 214×220 kV), ~16.665 km đường dây, &gt;91.263 MVA MBA → thị trường monitoring MBA rất lớn.<\/li><li><b>Chuyển đổi số EVNNPT:<\/b> chuyển TBA 220 kV sang không người trực, lắp giám sát DGA online; IMIS 2.0, nhật ký điện tử; TBA 220 kV Thủy Nguyên là TBA số đầu tiên.<\/li><\/ul>\n<h2>🌍 Quốc tế<\/h2>\n<ul><li><b>GE Vernova mua Trench Group (~9 tỷ USD, 28/10/2026)<\/b> – Trench sản xuất bushing/thiết bị đo lường cao áp; ảnh hưởng chuỗi cung ứng bushing &amp; cảm biến.<\/li><li><b>Hitachi Energy khởi công nhà máy MBA lực 457 triệu USD tại South Boston, Virginia<\/b> – thiếu hụt MBA lực toàn cầu tiếp tục, kéo dài lead time → tăng giá trị của giám sát/kéo dài tuổi thọ MBA hiện hữu.<\/li><li><b>National Grid (UK)<\/b> nâng cấp TBA 400 kV Imperial Park – bổ sung MBA để tăng kết nối.<\/li><li><b>T&amp;D World:<\/b> \"procurement-cycle delay\" được xem là rủi ro độ tin cậy lớn của lưới (28/10/2026).<\/li><\/ul>\n<h2>🔬 Nghiên cứu &amp; bài báo (liên quan Transformer DT)<\/h2>\n<ul><li><b>IEEE PES GM 2026 – Univ. of Queensland:<\/b> PINN cho mô hình nhiệt MBA (dự báo TOT → HST) hướng tới digital twin. → Đối chiếu với mô hình IEC 60076‑7 đang có trong Công cụ.<\/li><li><b>CIGRE A2‑11862 (Paris 2026, Canada):<\/b> \"Development of Digital Twin Technologies for Power Transformers – multi‑disciplinary initiative at a large utility\" (DGA cho phần tác dụng, sứ, OLTC). Giá 30 € → đề xuất mua đưa vào library.<\/li><li><b>Transformer Magazine Vol.13 Issue 1 (2026):<\/b> mô hình thermal‑hydraulic network động chi tiết cho MBA dầu (Radaković et al.).<\/li><li><b>J. Xi'an Jiaotong Univ. 2026:<\/b> PI‑DeepONet tính nhanh trường nhiệt‑dòng chảy cuộn dây cho DT.<\/li><li><b>Measurement 286 (2026):<\/b> dự báo khí hòa tan bằng Mamba tự giám sát + ràng buộc vật lý, dữ liệu 13 MBA (316k bản ghi).<\/li><\/ul>\n<h2>Nguồn<\/h2>\n<ul><li>Báo Đấu thầu: EVNNPT mời ngân hàng thu xếp 1.119 tỷ (05/11/2026) – <a href=\"https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-moi-ngan-hang-thu-xep-1119-ty-dong-dau-tu-5-du-an-truyen-tai-dien-post211884.html<\/a><\/li><li>Báo Đấu thầu: EVN đốc thúc nhà thầu (04/11/2026) – <a href=\"https://baodauthau.vn/evn-doc-thuc-nha-thau-tang-toc-thi-cong-cac-du-an-nguon-va-luoi-dien-post211722.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evn-doc-thuc-nha-thau-tang-toc-thi-cong-cac-du-an-nguon-va-luoi-dien-post211722.html<\/a><\/li><li>Báo Đấu thầu: 8 dự án 200 triệu EUR – <a href=\"https://baodauthau.vn/evnnpt-can-thu-xep-hon-200-trieu-eur-cho-8-du-an-truyen-tai-dien-post209398.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpt-can-thu-xep-hon-200-trieu-eur-cho-8-du-an-truyen-tai-dien-post209398.html<\/a><\/li><li>Báo Đấu thầu: 9 tháng 2026 EVN – <a href=\"https://baodauthau.vn/9-thang-nam-2026-evn-khoi-cong-136-cong-trinh-luoi-dien-day-manh-dau-tu-bess-post209156.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/9-thang-nam-2026-evn-khoi-cong-136-cong-trinh-luoi-dien-day-manh-dau-tu-bess-post209156.html<\/a><\/li><li>Báo Đấu thầu: BESS EVNNPC GĐ2 – <a href=\"https://baodauthau.vn/evnnpc-chon-thau-lap-dat-he-thong-bess-giai-doan-2-co-hoi-lon-canh-tranh-cao-post204851.html\" target=\"_blank\" rel=\"noopener\">https://baodauthau.vn/evnnpc-chon-thau-lap-dat-he-thong-bess-giai-doan-2-co-hoi-lon-canh-tranh-cao-post204851.html<\/a><\/li><li>Tạp chí Công Thương: TBA 220 kV Chân Mây – <a href=\"https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/day-nhanh-du-an-tram-bien-ap-220kv-chan-may--phan-dau-dong-dien-trong-thang-11-2026-557949.htm<\/a><\/li><li>Tạp chí Công Thương: 292 công trình 2026–2030 – <a href=\"https://tapchicongthuong.vn/day-nhanh-cac-du-an-luoi-dien-truyen-tai-de-bao-dam-an-ninh-nang-luong-quoc-gia-533569.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/day-nhanh-cac-du-an-luoi-dien-truyen-tai-de-bao-dam-an-ninh-nang-luong-quoc-gia-533569.htm<\/a><\/li><li>Tạp chí Công Thương: EVNNPT 7 nhiệm vụ CĐS – <a href=\"https://tapchicongthuong.vn/evnnpt-hoan-thanh-truoc-tien-do-7-nhiem-vu-chuyen-doi-so-86794.htm\" target=\"_blank\" rel=\"noopener\">https://tapchicongthuong.vn/evnnpt-hoan-thanh-truoc-tien-do-7-nhiem-vu-chuyen-doi-so-86794.htm<\/a><\/li><li>Nhân Dân: EVNNPT chuyển đổi số – <a href=\"https://nhandan.vn/evnnpt-tan-dung-thoi-co-tao-buoc-dot-pha-chuyen-doi-so-post784540.html\" target=\"_blank\" rel=\"noopener\">https://nhandan.vn/evnnpt-tan-dung-thoi-co-tao-buoc-dot-pha-chuyen-doi-so-post784540.html<\/a><\/li><li>Điện lực Bắc Ninh – <a href=\"https://thuonghieucongluan.com.vn/cong-ty-dien-luc-bac-ninh-chuyen-doi-so-nang-tam-quan-tri-luoi-dien-thong-minh-a339072.html\" target=\"_blank\" rel=\"noopener\">https://thuonghieucongluan.com.vn/cong-ty-dien-luc-bac-ninh-chuyen-doi-so-nang-tam-quan-tri-luoi-dien-thong-minh-a339072.html<\/a><\/li><li>T&amp;D World Utility Business – <a href=\"https://www.tdworld.com/utility-business?infscr=1&amp;page=10\" target=\"_blank\" rel=\"noopener\">https://www.tdworld.com/utility-business?infscr=1&amp;page=10<\/a><\/li><li>Hitachi Energy Virginia – <a href=\"https://ground.news/article/hitachi-energy-breaks-ground-on-457-million-virginia-transformer-plant\" target=\"_blank\" rel=\"noopener\">https://ground.news/article/hitachi-energy-breaks-ground-on-457-million-virginia-transformer-plant<\/a><\/li><li>National Grid Imperial Park – <a href=\"https://transformer-technology.com/national-grid-prepares-transformer-delivery-for-newport-substation-upgrade/\" target=\"_blank\" rel=\"noopener\">https://transformer-technology.com/national-grid-prepares-transformer-delivery-for-newport-substation-upgrade/<\/a><\/li><li>PESGM 2026 PINN – <a href=\"https://index.mirasmart.com/PESGM2026/PDFfiles/PESGM2026-001074.pdf\" target=\"_blank\" rel=\"noopener\">https://index.mirasmart.com/PESGM2026/PDFfiles/PESGM2026-001074.pdf<\/a><\/li><li>CIGRE A2‑11862 – <a href=\"https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html\" target=\"_blank\" rel=\"noopener\">https://www.e-cigre.org/publications/detail/a2-11862-2026-development-of-digital-twin-technologies-for-power-transformers-a-multi-disciplinary-initiative-at-a-large-utility.html<\/a><\/li><li>Transformer Magazine 13(1) – <a href=\"https://hrcak.srce.hr/file/495631\" target=\"_blank\" rel=\"noopener\">https://hrcak.srce.hr/file/495631<\/a><\/li><li>XJTU PI‑DeepONet – <a href=\"https://zkxb.xjtu.edu.cn/zh/article/doi/10.7652/xjtuxb202607021/\" target=\"_blank\" rel=\"noopener\">https://zkxb.xjtu.edu.cn/zh/article/doi/10.7652/xjtuxb202607021/<\/a><\/li><li>Measurement 286 – <a href=\"https://ir.psgitech.ac.in/id/eprint/1907/\" target=\"_blank\" rel=\"noopener\">https://ir.psgitech.ac.in/id/eprint/1907/<\/a><\/li><\/ul>"}];
const days=document.getElementById('days'),doc=document.getElementById('doc');
function show(i){[...days.children].forEach((b,j)=>b.classList.toggle('on',i===j));
 const n=NEWS[i];doc.innerHTML='<h2 style="border:0">'+n.title+'</h2>'+n.html;
 doc.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tw';t.replaceWith(w);w.appendChild(t)});
 doc.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener'});scrollTo(0,0)}
NEWS.forEach((n,i)=>{const b=document.createElement('button');const d=n.day.split('-');b.textContent=d[2]+'/'+d[1];b.onclick=()=>show(i);days.appendChild(b)});
if(NEWS.length)show(0);else doc.textContent='Chưa có bản tin.';
