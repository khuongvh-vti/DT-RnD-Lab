<script>
const D={"reports": [{"title": "Báo cáo #3 – Tổng hợp kiến thức Digital Twin máy biến áp từ tài liệu gốc & kiến trúc tham chiếu cho VTI", "sub": "2026-W46", "html": "<p>Ngày 10/11/2026 · Phòng R&amp;D Digital Twin · GĐ1 – Nền tảng tri thức · Căn cứ: 26 tài liệu gốc anh Khương đã đưa vào thư mục library, cộng tra cứu web cho phần còn thiếu.<\/p>\n<h4>1. Tóm tắt điều hành<\/h4>\n<ul><li><b>Định nghĩa chuẩn để dùng với khách hàng<\/b> (CIGRE TB 995): DT là biểu diễn ảo của MBA, được cập nhật động bằng dữ liệu thật, có khả năng dự báo, hỗ trợ ra quyết định, tương tác hai chiều. Một hệ giám sát online chỉ hiển thị số liệu mới đạt <b>cấp 1 (Descriptive)<\/b> trong 5 cấp, chưa phải DT đầy đủ.<\/li><li><b>Thực trạng thế giới<\/b>: trong 70 chuyên gia khảo sát (2024–2025), 60 % tổ chức có dự án DT nhưng chỉ khoảng 24 % số dự án đã vận hành. 64 % đạt cấp 1, đa số đặt mục tiêu cấp 2 trong 3 năm. Rào cản số 1 là chất lượng dữ liệu (hơn 84 %), số 2 là tích hợp hệ thống (khoảng 71 %). → <b>Thị trường còn sớm, VTI chưa bị bỏ xa.<\/b><\/li><li><b>Với lưới 110 kV Việt Nam<\/b> (TB 642, nhóm 100–200 kV): suất sự cố 0,43 %/năm. Vị trí sự cố: cuộn dây 43,5 %, <b>OLTC 34,2 %<\/b>, sứ 13 %. → DT 110 kV nên ưu tiên OLTC, cuộn dây (DGA + nhiệt) và sứ.<\/li><li><b>Lõi kỹ thuật có thể tự làm ngay<\/b>: mô hình nhiệt và lão hóa IEC 60076-7 (đủ bảng thông số), quy trình DGA IEC 60599 Điều 9 (giá trị điển hình, tỷ số, CO2/CO), mô hình dữ liệu IEC 61850-90-3 (SIML, SPDC, SPTR, SIMS, SSTP, SBSH, SCGR, SLTC), cùng checklist VVUQ của TB 995 làm tiêu chí nghiệm thu.<\/li><li><b>Lợi thế pháp lý cho giải pháp xử lý tại Việt Nam<\/b>:<\/li><li>Luật Dữ liệu 60/2024/QH15, Điều 23, coi việc <i>dùng nền tảng đặt ngoài lãnh thổ để xử lý<\/i> dữ liệu quan trọng/cốt lõi là chuyển dữ liệu xuyên biên giới.<\/li><li>Nghị định 165/2025/NĐ-CP yêu cầu lập báo cáo đánh giá tác động trước khi chuyển.<\/li><li>Cần xác minh dữ liệu vận hành lưới điện có nằm trong danh mục \"dữ liệu quan trọng\" hay không.<\/li><\/ul>\n<h4>2. Tài liệu đã đọc và mức sử dụng<\/h4>\n<table><tr><th>Nhóm<\/th><th>Tài liệu gốc trong kho<\/th><th>Dùng cho<\/th><\/tr><tr><td>Khung DT<\/td><td>CIGRE TB 995 (2026)<\/td><td>Định nghĩa, 5 cấp năng lực, khảo sát, VVUQ, khuyến nghị → Fact sheet 03<\/td><\/tr><tr><td>Nhiệt &amp; lão hóa<\/td><td>IEC 60076-7:2018<\/td><td>Công thức V, L; Bảng 2–4 (giới hạn nhiệt, giới hạn dòng, thông số nhiệt)<\/td><\/tr><tr><td>DGA<\/td><td>IEC 60599:2022; CIGRE TB 771, TB 783<\/td><td>Bảng 1, A.2, A.3; tiểu loại lỗi S/O/C/T3-H; phân loại monitor M1–M9, độ chính xác<\/td><\/tr><tr><td>Mô hình dữ liệu<\/td><td>IEC TR 61850-90-3:2016 + Cor.1; IEC 61850-7-4 Ed 2.1; đặc tả AAS của IDTA<\/td><td>LN cho MBA/LTC; \"hộ chiếu số\" AAS<\/td><\/tr><tr><td>Đánh giá tình trạng<\/td><td>CIGRE TB 761, 630, 343, 298, 445<\/td><td>Chỉ số đánh giá MBA (TAI) 5 bước; kiến trúc TICM; dữ liệu vòng đời<\/td><\/tr><tr><td>Độ tin cậy<\/td><td>CIGRE TB 642<\/td><td>Suất sự cố và vị trí sự cố theo cấp điện áp<\/td><\/tr><tr><td>Thị trường<\/td><td>Brochure GE (DGA 900 PLUS, TAPTRANS, Perception Fleet), doblePRIME, Siemens PR 2019; bài Sensformer (Sherekar &amp; Pandya)<\/td><td>Đối chiếu tính năng hãng<\/td><\/tr><tr><td>Bài báo<\/td><td>Das &amp; Grisaru 2026 (cảnh báo DGA online); Das (APM Edge); Sparling (đánh giá tài sản dựa trên bằng chứng); arXiv 1909.02451 (Dominion)<\/td><td>Thực hành vận hành<\/td><\/tr><tr><td>Pháp lý<\/td><td>Luật Dữ liệu (bản tiếng Anh)<\/td><td>Điều 23 xuyên biên giới, phân loại dữ liệu<\/td><\/tr><\/table>\n<p><b>Phần còn thiếu đã bù bằng tra cứu web (mức tin cậy thấp hơn bản gốc)<\/b>:<\/p>\n<ul><li>IEEE C57.104-2019, C57.143-2024, C57.91-2025: phạm vi, phiên bản, cách phân trạng thái DGA;<\/li><li>CIGRE TB 962 và TB 659;<\/li><li>Nghị định 165/2025/NĐ-CP, Luật BVDLCN 91/2025;<\/li><li>tính năng Hitachi, MR, Qualitrol, OMICRON, Camlin, Schneider (từ trang hãng).<\/li><\/ul>\n<h4>3. Đính chính sau khi đọc bản gốc<\/h4>\n<table><tr><th>Trước đây<\/th><th>Đúng theo bản gốc / nguồn mới<\/th><\/tr><tr><td>\"TB 783: DGA online lệch ±20–30 % so với phòng thí nghiệm\"<\/td><td>TB 783 kết luận: đa số khoảng 20 monitor thử nghiệm đạt ±15 % (yêu cầu IEC), một số không đạt. Dưới 10 ppm sai số thường trên 50 %, chẩn đoán vô nghĩa. Con số ±20–30 % là của bài báo Das &amp; Grisaru (2026).<\/td><\/tr><tr><td>IEEE C57.91-2011<\/td><td>Bản hiện hành <b>C57.91-2025<\/b> (phát hành 05/03/2026, có mã nguồn mở)<\/td><\/tr><tr><td>CIGRE TB 445 (bảo dưỡng)<\/td><td>Đã được thay bằng <b>TB 962 (2025)<\/b><\/td><\/tr><tr><td>Tên các cấp TB 995 \"CẦN KIỂM CHỨNG\"<\/td><td>Đã xác nhận: Descriptive → Diagnostic → Predictive → Prescriptive → Autonomous<\/td><\/tr><tr><td>TB 642 chỉ có số liệu chung<\/td><td>Có số liệu riêng nhóm 100–200 kV: suất sự cố 0,43 %, OLTC 34,2 %<\/td><\/tr><tr><td>Công cụ nhiệt trong app có lựa chọn \"OFAF/ODAF\" (gây lỗi)<\/td><td>Sửa thành ONAN/ONAF/OF/OD đúng như Bảng 4 IEC 60076-7<\/td><\/tr><\/table>\n<h4>4. Kiến trúc tham chiếu Transformer DT 110 kV (đề xuất của Phòng, bám TB 995)<\/h4>\n<table><tr><th>Cấp TB 995<\/th><th>Chức năng cho MBA 110 kV<\/th><th>Căn cứ tiêu chuẩn<\/th><th>Dữ liệu cần<\/th><\/tr><tr><td>1 Descriptive<\/td><td>Hiển thị thời gian thực tải, θo, θh (đo hoặc tính), DGA, trạng thái làm mát, nấc OLTC<\/td><td>IEC 61850-90-3 (SIML, SPTR, SCGR, SLTC, TTMP…); IEC 61850-7-4<\/td><td>SCADA/IED, monitor DGA, cảm biến nhiệt<\/td><\/tr><tr><td>2 Diagnostic<\/td><td>Kiểm tra DGA theo giá trị điển hình và tốc độ tăng → tỷ số/Duval (gồm Duval 2 cho OLTC); CO2/CO; so sánh θ đo với θ mô hình để phát hiện lỗi làm mát<\/td><td>IEC 60599 Điều 9, Bảng A.2/A.3; TB 771; TB 783 (biết giới hạn của loại monitor M1–M9)<\/td><td>DGA online + phòng thí nghiệm, lịch sử bảo dưỡng<\/td><\/tr><tr><td>3 Predictive<\/td><td>Mô hình nhiệt IEC 60076-7 hiệu chỉnh theo heat-run/dữ liệu vận hành (grey-box); lão hóa V, L; dự báo θh 24 h theo dự báo tải; xu hướng khí; chỉ số TAI<\/td><td>IEC 60076-7 (Bảng 2–4); TB 995 mục 5.3; TB 761<\/td><td>Biên bản heat-run test, nameplate, dự báo tải, thời tiết<\/td><\/tr><tr><td>4 Prescriptive<\/td><td>Gợi ý giới hạn tải theo kịch bản what-if (có khoảng bất định); thời điểm lọc dầu/bảo dưỡng OLTC<\/td><td>IEC 60076-7 Bảng 2–3; TB 962; TB 995 mục 7<\/td><td>Kế hoạch vận hành, chi phí<\/td><\/tr><tr><td>5 Autonomous<\/td><td>(Chưa đặt mục tiêu: 52 % ngành không định làm)<\/td><td>–<\/td><td>–<\/td><\/tr><\/table>\n<p><b>Tiêu chí nghiệm thu đề xuất<\/b> (từ TB 995 mục 7.12 và 8.5):<\/p>\n<ul><li>Sai số θo/θh của mô hình theo MAE (ngưỡng thỏa thuận với khách hàng);<\/li><li>Kiểm chứng monitor DGA bằng mẫu chuẩn gas-in-oil và đối chiếu phòng thí nghiệm;<\/li><li>Audit trail mọi lần hiệu chỉnh mô hình;<\/li><li>Chạy song song DT offline trước khi đưa vào dùng;<\/li><li>DT vẫn chạy ở chế độ suy giảm khi mất cảm biến;<\/li><li>Kết quả trình bày dạng khoảng, không chỉ một con số.<\/li><\/ul>\n<h4>5. Định vị thị trường theo 5 cấp (cập nhật từ brochure gốc)<\/h4>\n<ul><li><b>GE Vernova<\/b>:<\/li><li>DGA 900 PLUS/TAPTRANS có add-on mô hình nhiệt (thermal models), giám sát làm mát, OLTC, sứ (tới 9 sứ), PD.<\/li><li>Chuẩn: Modbus RS485/TCP và DNP3 TCP/IP; IEC 61850 Ed 2 là tùy chọn; có webserver https.<\/li><li>Perception Fleet tính Risk Index 1–5 dựa trên các tiêu chuẩn IEC, IEEE, ASTM, ISO, DIN, CIGRE, EPRI; tốc độ khí tính theo từng đoạn tuyến tính (piecewise linear).<\/li><li>Mức: cấp 2–3 ở cấp đội máy.<\/li><li>Tại Việt Nam: EVNNPT đã có MS 3000 + Perception Server ở 4 trạm 500 kV.<\/li><li><b>Siemens Energy Sensformer Advanced<\/b>: DT nhiệt dựng từ dữ liệu thiết kế (multi-mass), quá tải chủ động, tuổi thọ. Gateway IoT gửi dữ liệu lên cloud qua GSM/LAN, bảo mật theo ISO/IEC 27001. Mức: cấp 3 về nhiệt. Phụ thuộc cloud → vướng Điều 23 Luật Dữ liệu nếu dữ liệu thuộc loại quan trọng.<\/li><li><b>Doble doblePRIME<\/b>: gói Essential → Advanced+ (DGA Calisto, sứ IDD, PD, GIC, dữ liệu vận hành); hợp đồng trọn gói dobleASSURANCE. Mức: cấp 2–3.<\/li><li><b>Hitachi Energy, Reinhausen, Qualitrol, OMICRON, Camlin, Schneider<\/b>: xem Báo cáo #2 (nguồn web). Cần brochure đầy đủ để đánh giá sâu hơn.<\/li><li><b>Khoảng trống cho VTI<\/b> (khớp với khuyến nghị TB 995 về tiêu chuẩn mở và grey-box cho MBA cũ):<\/li><li>lớp DT độc lập hãng, đọc dữ liệu từ thiết bị có sẵn qua IEC 61850/Modbus/DNP3;<\/li><li>mô hình nhiệt grey-box hiệu chỉnh theo từng máy;<\/li><li>DGA theo IEC 60599 và TB 771/783 có kiểm soát độ chính xác thiết bị;<\/li><li>xử lý dữ liệu tại Việt Nam;<\/li><li>giao diện tiếng Việt.<\/li><\/ul>\n<h4>6. Hàm ý cho lộ trình nghiên cứu<\/h4>\n<ul><li><b>GĐ2 (12/2026–01/2027)<\/b>: lập bảng đánh giá 10 hãng theo 5 cấp TB 995 và checklist VVUQ. Cần brochure/datasheet đầy đủ của Hitachi, MR, Qualitrol, Camlin.<\/li><li><b>GĐ3 (01–04/2027)<\/b>:<\/li><li>hoàn thiện cấp 1–3 trên DT-RnD-Lab với dữ liệu 1 MBA thật (heat-run + DGA + SCD);<\/li><li>hiệu chỉnh mô hình nhiệt và đo MAE;<\/li><li>xây ma trận TAI theo TB 761;<\/li><li>thêm Duval 2 cho OLTC và Duval 4/5/Pentagon theo TB 771.<\/li><li><b>GĐ4<\/b>: hồ sơ thuyết phục khách hàng dựa trên TB 995 (định nghĩa, cấp năng lực, VVUQ), TB 642 (số liệu 110 kV) và Luật Dữ liệu (lợi thế xử lý tại Việt Nam).<\/li><\/ul>\n<h4>7. Tài liệu còn thiếu – ưu tiên tải tiếp<\/h4>\n<table><tr><th>Ưu tiên<\/th><th>Tài liệu<\/th><th>Lý do<\/th><th>Cách có<\/th><\/tr><tr><td>1<\/td><td><b>CIGRE TB 659<\/b> – Transformer thermal modelling (2016)<\/td><td>TB 995 dẫn chiếu cho mô hình nhiệt; THNM<\/td><td><b>Miễn phí<\/b> (trên 3 năm) – e-cigre.org<\/td><\/tr><tr><td>1<\/td><td><b>CIGRE TB 962<\/b> – Guide for transformer maintenance (2025)<\/td><td>Thay TB 445<\/td><td>Hội viên CIGRE hoặc mua<\/td><\/tr><tr><td>1<\/td><td><b>IEEE C57.104-2019<\/b><\/td><td>Bảng phân vị 90/95, trạng thái DGA 1/2/3<\/td><td>IEEE Xplore (khoảng 114 USD)<\/td><\/tr><tr><td>2<\/td><td>IEEE C57.91-2025, C57.143-2024<\/td><td>Mô hình nhiệt IEEE, hướng dẫn chọn thiết bị giám sát<\/td><td>IEEE<\/td><\/tr><tr><td>2<\/td><td>IEC 60076-2:2011 (độ tăng nhiệt)<\/td><td>TB 995 lưu ý hệ số mũ khác 60076-7<\/td><td>IEC Webstore<\/td><\/tr><tr><td>2<\/td><td>CIGRE TB 443, 676, 755, 939<\/td><td>DGA OLTC/dầu este; PD; độ tin cậy sứ; độ tin cậy MBA AC mới<\/td><td>e-cigre.org (phần lớn miễn phí)<\/td><\/tr><tr><td>2<\/td><td>Brochure đầy đủ: Hitachi TXpert Hub/APM Edge, MR ETOS/TESSA, Qualitrol QTMS, Camlin TOTUS, OMICRON MONTRANO<\/td><td>Đánh giá cấp năng lực<\/td><td>Đăng ký trên web hãng<\/td><\/tr><tr><td>3<\/td><td>Nghị định 165/2025/NĐ-CP; Quyết định danh mục dữ liệu quan trọng/cốt lõi<\/td><td>Xác định dữ liệu lưới điện có thuộc diện không<\/td><td>thuvienphapluat.vn / Công báo<\/td><\/tr><tr><td>3<\/td><td>Dữ liệu 1 MBA 110 kV thật (nameplate, heat-run, DGA nhiều năm, SCD)<\/td><td>Hiệu chỉnh mô hình (cấp 3)<\/td><td>Dự án VTI / khách hàng → thư mục 06_vti_data<\/td><\/tr><\/table>\n<h4>8. Cải tiến đã làm trên DT-RnD-Lab trong đợt này<\/h4>\n<ul><li>Kho tri thức: thêm Fact sheet 03 (TB 995). Viết lại Fact sheet 01, 02 và 20 theo bản gốc, đánh dấu ✅ (đã đọc bản gốc) hoặc 🌐 (nguồn web).<\/li><li>Hỏi đáp: Trưởng phòng sinh thêm từ khóa tiếng Anh để tìm trong tài liệu gốc tiếng Anh; mỗi câu lấy 12 đoạn tham khảo; tăng tốc tìm kiếm cho kho lớn (khoảng 3.600 đoạn).<\/li><li>Công cụ DGA: thêm bước kiểm tra giá trị điển hình (IEC 60599 Bảng A.2), nhập CO/CO2 để xét CO2/CO, tùy chọn OLTC thông dầu; cập nhật lưu ý độ chính xác theo TB 783.<\/li><li>Công cụ nhiệt: sửa lỗi kiểu làm mát (OF/OD).<\/li><\/ul>"}, {"title": "Danh mục link tải tài liệu (thư mục 02 → 05 và IEC 63278)", "sub": "2026-W46", "html": "<p>Ngày 10/11/2026. Chỉ gồm link chính thức hoặc hợp pháp. Tải về xong, anh bỏ file vào đúng thư mục trong <code>~/Documents/DT-RnD-Lab/library/<\/code>.<\/p>\n<p>&gt; <b>Mẹo quan trọng về CIGRE<\/b>: e-cigre.org cho người <b>không phải hội viên tải MIỄN PHÍ các ấn phẩm đã phát hành trên 3 năm<\/b>. Anh chỉ cần đăng ký tài khoản miễn phí. Hội viên CIGRE thì tải miễn phí tất cả, kể cả ấn phẩm mới. Vì vậy TB 630, 642, 761, 771, /file/433172\" target=\"_blank\" rel=\"noopener\">https://hrcak.srce.hr/file/433172<\/a><\/td><\/tr><tr><td>Danh mục CIGRE TB ngành MBA<\/td><td><a href=\"https://hrcak.srce.hr/file/358145\" target=\"_blank\" rel=\"noopener\">https://hrcak.srce.hr/file/358145<\/a><\/td><\/tr><tr><td>Online DGA Monitoring System (Dominion Energy, arXiv)<\/td><td><a href=\"https://arxiv.org/pdf/1909.02451\" target=\"_blank\" rel=\"noopener\">https://arxiv.org/pdf/1909.02451<\/a><\/td><\/tr><tr><td>Review thiết bị DGA online (MDPI Sensors 2019)<\/td><td><a href=\"https://doi.org/10.3390/s19194057\" target=\"_blank\" rel=\"noopener\">https://doi.org/10.3390/s19194057<\/a><\/td><\/tr><tr><td>Review kỹ thuật DGA online 2019–2025 (Frontiers 2025)<\/td><td><a href=\"https://www.frontiersin.org/journals/chemistry/articles/10.3389/fchem.2025.1721893/full\" target=\"_blank\" rel=\"noopener\">https://www.frontiersin.org/journals/chemistry/articles/10.3389/fchem.2025.1721893/full<\/a><\/td><\/tr><tr><td>Bằng sáng chế mô hình nhiệt tự hiệu chỉnh (Dynamic Ratings)<\/td><td><a href=\"https://patents.google.com/patent/US9419430\" target=\"_blank\" rel=\"noopener\">https://patents.google.com/patent/US9419430<\/a><\/td><\/tr><\/table>\n<h4>IEC 63278 – Asset Administration Shell (01_standards)<\/h4>\n<table><tr><th>Tài liệu<\/th><th>Link<\/th><th>Chi phí<\/th><\/tr><tr><td>IEC 63278-1:2023 – AAS structure (bản chuẩn)<\/td><td><a href=\"https://webstore.iec.ch/en/publication/65628\" target=\"_blank\" rel=\"noopener\">https://webstore.iec.ch/en/publication/65628<\/a><\/td><td>Mua<\/td><\/tr><tr><td><b>Bản tương đương miễn phí<\/b>: IDTA \"Specification of the AAS Part 1: Metamodel\" (IDTA-01001-3-0)<\/td><td><a href=\"https://industrialdigitaltwin.org/wp-content/uploads/2023/06/IDTA-01001-3-0_SpecificationAssetAdministrationShell_Part1_Metamodel.pdf\" target=\"_blank\" rel=\"noopener\">https://industrialdigitaltwin.org/wp-content/uploads/2023/06/IDTA-01001-3-0_SpecificationAssetAdministrationShell_Part1_Metamodel.pdf<\/a><\/td><td>Miễn phí<\/td><\/tr><tr><td>Kho các phần AAS (Part 1 metamodel, Part 2 API, Part 3a IEC 61360, Part 4 security, Part 5 AASX)<\/td><td><a href=\"https://industrialdigitaltwin.org/en/content-hub/downloads/download-archiv\" target=\"_blank\" rel=\"noopener\">https://industrialdigitaltwin.org/en/content-hub/downloads/download-archiv<\/a><\/td><td>Miễn phí<\/td><\/tr><tr><td>Schema JSON/XML của AAS (GitHub)<\/td><td><a href=\"https://github.com/admin-shell-io/aas-specs\" target=\"_blank\" rel=\"noopener\">https://github.com/admin-shell-io/aas-specs<\/a><\/td><td>Miễn phí<\/td><\/tr><\/table>\n<p>Ghi chú: IEC 63278-1 và đặc tả AAS của IDTA (Plattform Industrie 4.0) mô tả cùng một khái niệm AAS. CẦN KIỂM CHỨNG mức độ tương ứng giữa từng phiên bản. Bộ IDTA miễn phí đủ để nghiên cứu. Khi đưa vào hồ sơ khách hàng thì trích dẫn IEC 63278-1:2023.<\/p>"}, {"title": "Báo cáo #2 – Đánh giá sản phẩm thị trường từ nguồn chính hãng, kiểm chứng tiêu chuẩn & danh mục tài liệu cần bổ sung", "sub": "2026-W46", "html": "<p>Ngày 10/11/2026 · Phòng R&amp;D Digital Twin · Giai đoạn GĐ1 – Nền tảng tri thức<\/p>\n<h4>1. Vì sao các câu trả lời trước chưa chuẩn – và đã sửa gì<\/h4>\n<table><tr><th>Nguyên nhân<\/th><th>Hậu quả<\/th><th>Đã sửa<\/th><\/tr><tr><td>Kho tài liệu <code>library/<\/code> trên máy anh <b>trống<\/b> (0 tài liệu)<\/td><td>Qwen không có căn cứ, trả lời chung chung, tự ghi \"GIẢ ĐỊNH\"<\/td><td>Viết 9 fact sheet có nguồn (tiêu chuẩn, CIGRE/IEEE, 10 hãng, Việt Nam) đưa vào kho; server tự nạp khi khởi động<\/td><\/tr><tr><td>Trưởng phòng trả lời mọi câu hỏi theo <b>khuôn báo cáo tuần<\/b><\/td><td>Câu hỏi \"so sánh Siemens – Hitachi\" lại nhận về \"Báo cáo tuần…\"<\/td><td>Viết lại chức năng hỏi đáp: trả lời thẳng, cấu trúc Trả lời ngắn → Chi tiết → Độ tin cậy → Tài liệu còn thiếu, bắt buộc trích [S#]<\/td><\/tr><tr><td>Một số thông tin cũ trong Báo cáo #1<\/td><td>Trích dẫn lỗi thời<\/td><td>Đính chính ở mục 2<\/td><\/tr><\/table>\n<h4>2. Đính chính &amp; cập nhật so với Báo cáo #1 (đã kiểm chứng trên nguồn chính thức)<\/h4>\n<ul><li><b>IEEE C57.143<\/b>: bản hiện hành là <b>C57.143-2024<\/b> (phát hành 20/05/2025, 177 trang), thay bản 2012. Có phụ lục mới về PD, đo trực tiếp nhiệt độ cuộn dây, phân tích dữ liệu DGA online.<\/li><li><b>CIGRE TB 995<\/b> (JWG A2/D2.65, 108 trang, tóm tắt trên Electra 08/2026): xác nhận đúng là tài liệu \"Digital twins for power transformers\". Có khung năng lực từ Descriptive tới Autonomous và <b>checklist VVUQ<\/b> cho dự án Transformer DT. Đây là tham chiếu chính để thuyết phục khách hàng.<\/li><li><b>IEC 60599<\/b>: bản hiện hành <b>Ed 4.0 (2022)<\/b>. <b>IEC 60076-7<\/b>: <b>Ed 2.0 (2018)<\/b>, IEC Webstore ghi stability date 2026 → có thể sắp được rà soát.<\/li><li><b>IEC 61850<\/b>: 7-4 bản hợp nhất <b>Ed 2.1 (2020)<\/b>. TR 61850-90-3:2016 đang được nâng thành <b>PAS 61850-90-3<\/b>, theo blog chuyên gia IEC 61850 (08/2026); bản nháp bổ sung các LN cho MBA: SLTC, SVAM, SDBR, SPRD.<\/li><li><b>CIGRE TB 642<\/b>: suất sự cố MBA trạm 0,53 %/năm, GSU 0,95 %/năm (964 sự cố, 167.459 MBA-năm, 58 công ty, 21 nước). Đã kiểm chứng.<\/li><li><b>CIGRE TB 783<\/b>: sai lệch DGA online so với phòng thí nghiệm có thể vượt ±20–30 % mỗi khí. CIGRE WG A2/D1.67 đang soạn hướng dẫn DGA online.<\/li><\/ul>\n<h4>3. So sánh sản phẩm thị trường (đọc từ trang/brochure chính hãng)<\/h4>\n<table><tr><th>Hãng<\/th><th>Sản phẩm chủ lực<\/th><th>Đo / chức năng<\/th><th>Mô hình &amp; phân tích<\/th><th>Mức TB 995 (đánh giá của Phòng)<\/th><th>Tính mở<\/th><th>Hiện diện tại VN<\/th><\/tr><tr><td>Hitachi Energy<\/td><td>TXpert Hub (CoreTec 5), APM Edge, Lumada/Hitachi Energy APM<\/td><td>Cảm biến TXpert Ready nhiều hãng: nhiệt, DGA, sứ…<\/td><td>Hơn 175 mô hình dựng sẵn; xác suất hư hỏng; APM + EAM + FSM; IDC Leader 2025–26<\/td><td>Diagnostic → Predictive (đội máy), một phần Prescriptive<\/td><td>Mở với cảm biến bên thứ 3; IEC 62443-4-2<\/td><td>CẦN KHẢO SÁT<\/td><\/tr><tr><td>Siemens Energy<\/td><td>Sensformer / Sensformer Advanced<\/td><td>IoT gateway: mức dầu, nhiệt dầu đỉnh, dòng hạ áp, GPS (+ DGA tùy chọn)<\/td><td>DT riêng từng máy từ dữ liệu thiết kế, thermo-hydraulic multi-mass; mô phỏng tải 24 h; quá tải chủ động; tuổi thọ<\/td><td>Descriptive + Predictive (nhiệt) rất mạnh<\/td><td>Gắn với MBA Siemens Energy; cloud<\/td><td>CẦN KHẢO SÁT<\/td><\/tr><tr><td>GE Vernova<\/td><td>Kelman DGA 900 / PLUS / TAPTRANS, MS 3000, Perception Fleet<\/td><td>9 khí + ẩm (PAS); sứ, PD, OLTC, làm mát, camera nhiệt<\/td><td>Risk Index 1–5, xếp hạng đội máy, tốc độ khí theo đoạn<\/td><td>Diagnostic + Predictive (đội máy)<\/td><td>Modbus, DNP3, IEC 61850, SCADA<\/td><td><b>Có<\/b>: EVNNPT 4 trạm 500 kV + Perception Server; Thủy điện Sông Bung 4<\/td><\/tr><tr><td>Reinhausen (MR)<\/td><td>ETOS, ETOS ED, MSENSE, TESSA<\/td><td>DGA, sứ, rung–âm OLTC, sợi quang, ẩm<\/td><td>Thuật toán MR hoặc của khách; có <b>điều khiển<\/b> OLTC &amp; làm mát<\/td><td>Diagnostic + điều khiển cục bộ (gần vòng kín)<\/td><td>Mở cảm biến bên thứ 3<\/td><td>OLTC MR phổ biến (CẦN KHẢO SÁT số lượng)<\/td><\/tr><tr><td>Qualitrol<\/td><td>QTMS, Serveron TM8<\/td><td>Module tới 196 DI; TM8 sắc ký khí (GC) 8 khí<\/td><td>Dựa luật (Duval 1/4/5, Pentagon, Rogers)<\/td><td>Descriptive + Diagnostic<\/td><td>IEC 61850 Ed 2 có chứng nhận, DNP3, Modbus, 104<\/td><td>CẦN KHẢO SÁT<\/td><\/tr><tr><td>OMICRON<\/td><td>MONTRANO, MONTESTO 200, OMS 605<\/td><td>Điện dung/tanδ sứ, PD, quá điện áp<\/td><td>Tách nhiễu, nhận dạng nguồn PD<\/td><td>Diagnostic chuyên sâu (điện môi)<\/td><td>Dùng được cảm biến hãng khác<\/td><td>Thiết bị thử nghiệm phổ biến (CẦN KHẢO SÁT phần monitoring)<\/td><\/tr><tr><td>Doble<\/td><td>Calisto R9, Calisto T1 / doblePRIME, INSIDEVIEW<\/td><td>DGA DIPAS, tự hiệu chuẩn bằng hơi nước; sứ IDD; PD<\/td><td>Health index đội máy (dữ liệu dầu, thí nghiệm)<\/td><td>Diagnostic + Predictive (đội máy)<\/td><td>Không cần cloud độc quyền (tuyên bố của hãng)<\/td><td>CẦN KHẢO SÁT<\/td><\/tr><tr><td>Camlin<\/td><td>TOTUS<\/td><td>DGA, PD, sứ, dòng sự cố xuyên qua<\/td><td>Phân tích nhúng tại thiết bị; Connected Insights<\/td><td>Diagnostic<\/td><td>Nhận dữ liệu online/offline<\/td><td>CẦN KHẢO SÁT<\/td><\/tr><tr><td>Dynamic Ratings<\/td><td>C50, E3, B100, DTM<\/td><td>Nhiệt, sứ, OLTC, làm mát, DGA, ẩm, PD<\/td><td><b>Dynamic rating<\/b>: mô hình nhiệt tự hiệu chỉnh (bằng sáng chế)<\/td><td>Predictive (nhiệt/tải)<\/td><td>—<\/td><td>Có đại lý (TTECH)<\/td><\/tr><tr><td>Schneider Electric<\/td><td>EcoStruxure Transformer Expert<\/td><td>Đầu dò van dầu: ẩm, nhiệt, PD, rung, H2<\/td><td>Cloud; thuật toán theo IEEE/IEC/CIGRE; thuê bao<\/td><td>Descriptive + Diagnostic<\/td><td>3G/4G → cloud Schneider<\/td><td>CẦN KHẢO SÁT<\/td><\/tr><\/table>\n<p>Ghi chú: cột \"Mức TB 995\" là đánh giá của Phòng dựa trên mô tả công khai của hãng, chưa đối chiếu bản đầy đủ TB 995.<\/p>\n<h4>4. Nhận định cạnh tranh<\/h4>\n<ol><li><b>Thị trường chia hai lớp<\/b>: (a) phần cứng giám sát chất lượng cao (GE, Qualitrol, Doble, MR, OMICRON, Camlin) và (b) phần mềm APM/DT đội máy (Hitachi Energy, GE Perception, Doble). Chỉ Siemens Energy có DT vật lý đúng nghĩa từ dữ liệu thiết kế, nhưng chủ yếu cho MBA của chính hãng.<\/li><li><b>Chưa hãng nào vừa độc lập thiết bị, vừa có mô hình vật lý hiệu chỉnh theo dữ liệu từng máy, vừa lưu dữ liệu tại Việt Nam.<\/b> Đây là khoảng trống VTI có thể nhắm tới. Đánh giá này cần kiểm chứng thêm với khách hàng.<\/li><li><b>Ngưỡng hồ sơ thầu<\/b> mà sản phẩm VTI phải đạt nếu cạnh tranh:<\/li><li>IEC 61850 Ed 2 có chứng nhận (như Qualitrol QTMS);<\/li><li>an ninh mạng IEC 62443-4-2 (như Hitachi TXpert Hub);<\/li><li>mô hình nhiệt theo IEC 60076-7, có khả năng hiệu chỉnh.<\/li><li><b>GE đã có hạ tầng tại EVNNPT cấp 500 kV.<\/b> Chiến lược hợp lý là không thay thiết bị mà đọc dữ liệu từ thiết bị sẵn có để làm lớp DT phía trên. Hướng này cần xác minh xem EVNNPT có cho phép truy cập dữ liệu Perception Server không và qua giao thức nào.<\/li><li><b>Bài học mô hình kinh doanh<\/b>: Doble bán hợp đồng giám sát trọn gói 10 năm, Schneider bán sensor-as-a-service. VTI có thể bán dịch vụ DT theo năm thay vì chỉ bán thiết bị.<\/li><\/ol>\n<h4>5. Danh mục tài liệu anh cần upload bổ sung (theo mức ưu tiên)<\/h4>\n<p>Cách upload: tab <b>📚 Kho tài liệu<\/b> → chọn thư mục → kéo thả PDF → bấm <b>Nạp vào kho<\/b>. PDF bản quyền chỉ nằm trên máy anh, không lên GitHub.<\/p>\n<table><tr><th>Ưu tiên<\/th><th>Tài liệu<\/th><th>Thư mục<\/th><th>Vì sao cần<\/th><th>Cách có<\/th><\/tr><tr><td>1<\/td><td><b>CIGRE TB 995<\/b> – Digital twins for power transformers (2026)<\/td><td>02_cigre_ieee<\/td><td>Tham chiếu chính về DT MBA; khung năng lực; checklist VVUQ<\/td><td>Miễn phí cho hội viên CIGRE (VTI/EVN có thể có tài khoản); không phải hội viên mua tại e-cigre.org<\/td><\/tr><tr><td>1<\/td><td><b>IEC 60076-7:2018<\/b><\/td><td>01_standards<\/td><td>Công thức mô hình nhiệt, lão hóa, giới hạn nhiệt độ<\/td><td>IEC Webstore hoặc Tổng cục TCĐLCL; EVN thường có bản<\/td><\/tr><tr><td>1<\/td><td><b>IEC 60599:2022<\/b><\/td><td>01_standards<\/td><td>Bảng tỷ số, giới hạn điển hình, Duval<\/td><td>IEC Webstore<\/td><\/tr><tr><td>1<\/td><td><b>IEEE C57.104-2019<\/b> và <b>C57.143-2024<\/b><\/td><td>02_cigre_ieee<\/td><td>Giới hạn DGA theo phân vị 90/95; hướng dẫn chọn thiết bị giám sát<\/td><td>IEEE Xplore<\/td><\/tr><tr><td>2<\/td><td>CIGRE <b>TB 630, 761, 771, 783, 642<\/b><\/td><td>02_cigre_ieee<\/td><td>Kiến trúc giám sát thông minh, health index, DGA online, thống kê sự cố<\/td><td>e-cigre.org (miễn phí cho hội viên)<\/td><\/tr><tr><td>2<\/td><td><b>IEC 61850-7-4 Ed 2.1<\/b> + <b>TR 61850-90-3<\/b> (+ bản nháp PAS nếu có)<\/td><td>01_standards<\/td><td>Tên LN/DO chuẩn cho Substation DT<\/td><td>IEC Webstore<\/td><\/tr><tr><td>2<\/td><td>Brochure/datasheet chi tiết: TXpert Hub, APM Edge, Sensformer Advanced, ETOS/TESSA, QTMS, Calisto T1, TOTUS, MONTRANO<\/td><td>03_vendor<\/td><td>Thông số kỹ thuật, giao thức, giới hạn – bản đầy đủ thường phải đăng ký mới tải được<\/td><td>Anh đăng ký trên web hãng, hoặc xin qua đại lý/đối tác<\/td><\/tr><tr><td>2<\/td><td>Bài Transformers Magazine: \"Sensformer: Powering the future…\" (2023), bài DT Sensformer Advanced (2022)<\/td><td>05_papers<\/td><td>Chi tiết mô hình DT Siemens<\/td><td>Bản PDF 2023 tải được miễn phí tại hrcak.srce.hr<\/td><\/tr><tr><td>3<\/td><td><b>ISO/IEC 30173:2023<\/b>, <b>IEC 63278-1:2023<\/b><\/td><td>01_standards<\/td><td>Định nghĩa DT chuẩn quốc tế; AAS<\/td><td>ISO/IEC store<\/td><\/tr><tr><td>3<\/td><td>Quy định EVN/EVNNPT về TBA không người trực, giám sát online; HSMT có hạng mục giám sát MBA<\/td><td>04_vietnam<\/td><td>Tiêu chí kỹ thuật &amp; thương mại thực tế tại VN<\/td><td>Anh có sẵn từ các gói thầu (ví dụ E1.20 Thanh Xuân)<\/td><\/tr><tr><td>3<\/td><td>Dữ liệu 1 MBA thật: nameplate, biên bản heat-run test, lịch sử DGA, file SCD<\/td><td>06_vti_data (chỉ local)<\/td><td>Hiệu chỉnh mô hình nhiệt, thử Health Index<\/td><td>Khách hàng / dự án VTI<\/td><\/tr><\/table>\n<h4>6. Việc tiếp theo của Phòng<\/h4>\n<ul><li>Khi anh upload nhóm Ưu tiên 1: chạy lại các câu hỏi cũ để so sánh chất lượng trả lời trước và sau.<\/li><li>Lập bảng đánh giá chi tiết theo checklist VVUQ của TB 995. Việc này cần bản gốc TB 995.<\/li><li>Khảo sát thực tế tại Việt Nam: hãng nào đang có thiết bị trên MBA 110–220 kV của các Tổng công ty Điện lực; anh cung cấp thông tin từ thực tế thầu.<\/li><\/ul>\n<h4>Nguồn chính (đã truy cập 10/11/2026)<\/h4>\n<ul><li>IEC Webstore: 60076-7 (pub 34351), 60599 (pub 76192/66491), 61850-7-4 CSV (pub 66551), TR 61850-90-3 (pub 24777), 63278-1 (pub 65628)<\/li><li>e-cigre.org: TB 995, 642, 783; Electra 347 (08/2026); CIGRE ToR JWG A2/D2.65 &amp; A2/D1.67<\/li><li>IEEE C57.143-2024: IEEE PES Transformers Committee F2025 tutorial; standards.ie; en-standard.eu<\/li><li>Trang hãng: hitachienergy.com (TXpert Hub, APM Edge), siemens-energy.com, gevernova.com (brochure DGA 900/PLUS/TAPTRANS, Perception Fleet), reinhausen.com, qualitrolcorp.com, doble.com, camlingroup.com, se.com, dynamicratings (electricityforum), OMICRON (TDWorld)<\/li><li>Việt Nam: tapchicongthuong.vn (EVNNPT MS 3000; Thủy điện Sông Bung 4)<\/li><\/ul>"}, {"title": "Báo cáo tổng quát kế hoạch – Phòng R&D Digital Twin (W46/2026, 10/11/2026)", "sub": "2026-W46", "html": "<p>Bản đầy đủ có sơ đồ và để bình luận: <a href=\"https://claude.ai/artifact/Bsmd2mNe1rweDP3o3yU7bA\" target=\"_blank\" rel=\"noopener\">https://claude.ai/artifact/Bsmd2mNe1rweDP3o3yU7bA<\/a><\/p>\n<h4>1. Quyết định đã chốt<\/h4>\n<ul><li>Chạy <b>song song 2 luồng<\/b>: Transformer DT và Substation DT cho trạm 110 kV không người trực. Pilot triển khai và nghiệm thu tại khách hàng <b>trước 31/03/2027<\/b>.<\/li><li>Phòng có 8 AI agent: Trưởng phòng và 7 chuyên viên <code>standards<\/code>, <code>physics<\/code>, <code>data_ai<\/code>, <code>ot_cyber<\/code>, <code>substation<\/code>, <code>benchmark<\/code>, <code>vn_market<\/code>.<\/li><li>Model local <code>qwen3.5:9b<\/code> (MacBook 16 GB) và embedding <code>qwen3-embedding:0.6b<\/code>. Chế độ <b>hybrid<\/b> dùng <code>qwen3-max<\/code> cloud (Alibaba Model Studio) cho 5 vai trò cần suy luận sâu. Dữ liệu khách hàng luôn chạy local. Trần chi phí 10 USD/tháng.<\/li><\/ul>\n<h4>2. Lộ trình &amp; cổng<\/h4>\n<table><tr><th>Cổng<\/th><th>Ngày<\/th><th>Tiêu chí<\/th><\/tr><tr><td>G0<\/td><td>22/11/2026<\/td><td>Khách hàng ký URS; chốt trạm và MBA pilot; có file SCD, biên bản heat-run test, lịch sử DGA<\/td><\/tr><tr><td>G1<\/td><td>27/12/2026<\/td><td>Demo trên dữ liệu thật: θh mô hình sai ±3 K (đề xuất); Health Index v1; sơ đồ một sợi từ SCD có trạng thái thật<\/td><\/tr><tr><td>G2<\/td><td>22/01/2027<\/td><td>FAT đạt; hồ sơ an ninh mạng IEC 62443 được duyệt; chốt danh mục tín hiệu<\/td><\/tr><tr><td>(Tết)<\/td><td>01–14/02/2027<\/td><td>Nghỉ<\/td><\/tr><tr><td>G3<\/td><td>07/03/2027<\/td><td>SAT đạt, dữ liệu chạy liên tục, đẩy được lên SCADA<\/td><\/tr><tr><td>Nghiệm thu<\/td><td>31/03/2027<\/td><td>Vận hành thử ≥ 3 tuần; xuất tự động báo cáo tình trạng MBA và rủi ro toàn trạm<\/td><\/tr><\/table>\n<h4>3. Kiến trúc 5 lớp<\/h4>\n<p>Thiết bị/cảm biến → Kết nối &amp; Edge (IEC 61850, IEC 60870-5-104, MQTT) → Nền tảng dữ liệu (time-series, CIM/AAS) → <b>Mô hình DT<\/b> (IEC 60076-7, IEC 60599/Duval, PD, SCL topology) → Ứng dụng (Health Index, cảnh báo, quá tải động, sơ đồ một sợi số, báo cáo tự động). An ninh mạng theo IEC 62443/62351 áp dụng xuyên suốt các lớp.<\/p>\n<h4>4. Việc tuần W47 (11–22/11)<\/h4>\n<ul><li>☐ <code>vn_market<\/code>: chốt khách hàng và trạm pilot (ứng viên: TBA 110 kV E1.20 Thanh Xuân); soạn URS.<\/li><li>☐ <code>substation<\/code>: nhận file SCD, dựng mô hình trạm bằng <code>dtlab.py scl<\/code>.<\/li><li>☐ <code>physics<\/code>: lấy biên bản heat-run test, hiệu chỉnh tham số IEC 60076-7.<\/li><li>☐ <code>ot_cyber<\/code>: danh mục tín hiệu tối thiểu, sơ đồ phân vùng OT/IT.<\/li><li>☐ <code>data_ai<\/code>: thiết kế Health Index v1 (CIGRE TB 761).<\/li><li>☐ <code>benchmark<\/code>: so sánh sản phẩm Transformer/Substation DT thương mại.<\/li><li>☐ Anh Khương: chuyển repo sang private; nạp tiêu chuẩn vào <code>library/<\/code>; tạo API key Model Studio (nếu dùng cloud).<\/li><\/ul>\n<h4>Nguồn chính<\/h4>\n<ul><li>CIGRE TB 995 (2026): <a href=\"https://electra.cigre.org/347-august-2026/technical-brochures/digital-twins-for-power-transformers-concept-and-future-perspectives\" target=\"_blank\" rel=\"noopener\">https://electra.cigre.org/347-august-2026/technical-brochures/digital-twins-for-power-transformers-concept-and-future-perspectives<\/a><\/li><li>TwinEU: <a href=\"https://www.enlit.world/library/revolutionising-the-european-energy-landscape-twineu-s-digital-twin-ambition\" target=\"_blank\" rel=\"noopener\">https://www.enlit.world/library/revolutionising-the-european-energy-landscape-twineu-s-digital-twin-ambition<\/a><\/li><li>EVNNPC chuyển đổi số: <a href=\"https://daibieunhandan.vn/evnnpc-day-manh-ung-dung-khoa-hoc-cong-nghe-doi-moi-sang-tao-va-chuyen-doi-so-trong-quan-ly-van-hanh-he-thong-dien-10384040.html\" target=\"_blank\" rel=\"noopener\">https://daibieunhandan.vn/evnnpc-day-manh-ung-dung-khoa-hoc-cong-nghe-doi-moi-sang-tao-va-chuyen-doi-so-trong-quan-ly-van-hanh-he-thong-dien-10384040.html<\/a><\/li><li>ISO/IEC DT standards: <a href=\"https://sirris.be/en/inspiration/look-latest-standardisation-projects-field-digital-twins\" target=\"_blank\" rel=\"noopener\">https://sirris.be/en/inspiration/look-latest-standardisation-projects-field-digital-twins<\/a><\/li><li>GMI Digital Twin in Energy &amp; Power: <a href=\"https://www.gminsights.com/industry-analysis/digital-twin-in-energy-and-power-market\" target=\"_blank\" rel=\"noopener\">https://www.gminsights.com/industry-analysis/digital-twin-in-energy-and-power-market<\/a><\/li><li>Qwen pricing: <a href=\"https://eesel.ai/blog/qwen-pricing\" target=\"_blank\" rel=\"noopener\">https://eesel.ai/blog/qwen-pricing<\/a><\/li><\/ul>"}], "facts": [{"title": "Fact sheet 01 – Tiêu chuẩn IEC/ISO cho Transformer DT & Substation DT (đã đối chiếu bản gốc)", "sub": "01_standards", "html": "<p>Cập nhật 10/11/2026. ✅ = đã đọc bản gốc trong library/01_standards. 🌐 = tra cứu web. Tóm tắt bằng lời của Phòng R&amp;D; số liệu bảng ghi kèm số hiệu bảng/mục để tra lại.<\/p>\n<h4>✅ IEC 60076-7:2018 (Ed 2.0) – Loading guide for mineral-oil-immersed power transformers<\/h4>\n<ul><li>Phát hành 12/01/2018, TC 14, thay bản 2005. Áp dụng cho MBA dầu khoáng; MBA dùng vật liệu cách điện cấp nhiệt cao hơn thì theo IEC 60076-14.<\/li><li><b>Tốc độ lão hóa tương đối V<\/b> (mục 6.3), chỉ phụ thuộc nhiệt độ điểm nóng θh:<\/li><li>Giấy thường: V = 2^((θh − 98)/6), nên V = 1 tại 98 °C.<\/li><li>Giấy nâng cấp nhiệt: V = exp(15000/(110+273) − 15000/(θh+273)), nên V = 1 tại 110 °C.<\/li><li>Bảng 1: ở 140 °C, V = 128 với giấy thường và 17,2 với giấy nâng cấp; ở 80 °C, V = 0,125 và 0,036.<\/li><li><b>Hao mòn tuổi thọ<\/b>: L = Σ Vn·tn (mục 6.4). Bước thời gian phải nhỏ hơn một nửa hằng số thời gian cuộn dây τw. Annex A trình bày cách tính đồng thời ẩm, oxy và axit (Hình 4–5: tuổi thọ kỳ vọng theo độ ẩm 0,5–3,5 % và oxy, tiêu chí kết thúc là DP còn 200).<\/li><li><b>Bảng 2 – Giới hạn nhiệt độ khi mang tải vượt định mức<\/b> (MBA cỡ trung và lớn):<\/li><\/ul>\n<table><tr><th>Chế độ<\/th><th>Điểm nóng cuộn dây<\/th><th>Kim loại khác<\/th><th>Lõi<\/th><th>Dầu đỉnh<\/th><\/tr><tr><td>Chu kỳ bình thường<\/td><td>120 °C<\/td><td>140 °C<\/td><td>130 °C<\/td><td>105 °C<\/td><\/tr><tr><td>Sự cố dài hạn<\/td><td>140 °C<\/td><td>160 °C<\/td><td>140 °C<\/td><td>115 °C<\/td><\/tr><tr><td>Sự cố ngắn hạn<\/td><td>160 °C<\/td><td>180 °C<\/td><td>160 °C<\/td><td>115 °C<\/td><\/tr><\/table>\n<ul><li><b>Bảng 3 – Giới hạn dòng (pu)<\/b>:<\/li><\/ul>\n<table><tr><th>Chế độ<\/th><th>MBA nhỏ<\/th><th>MBA cỡ trung<\/th><th>MBA lớn<\/th><\/tr><tr><td>Chu kỳ bình thường<\/td><td>1,5<\/td><td>1,5<\/td><td>1,3<\/td><\/tr><tr><td>Sự cố dài hạn<\/td><td>1,8<\/td><td>1,5<\/td><td>1,3<\/td><\/tr><tr><td>Sự cố ngắn hạn<\/td><td>2,0<\/td><td>1,8<\/td><td>1,5<\/td><\/tr><\/table>\n<p>  Ghi chú: khả năng cắt của bộ điều áp giới hạn ở 2 lần dòng định mức (theo IEC 60214-1).<\/p>\n<ul><li><b>Bảng 4 – Đặc tính nhiệt khuyến nghị<\/b> (MBA cỡ trung/lớn, loại không hạn chế lưu thông dầu):<\/li><\/ul>\n<table><tr><th>Làm mát<\/th><th>x<\/th><th>y<\/th><th>k11<\/th><th>k21<\/th><th>k22<\/th><th>τo (phút)<\/th><th>τw (phút)<\/th><\/tr><tr><td>ONAN<\/td><td>0,8<\/td><td>1,3<\/td><td>0,5<\/td><td>2,0<\/td><td>2,0<\/td><td>210<\/td><td>10<\/td><\/tr><tr><td>ONAF<\/td><td>0,8<\/td><td>1,3<\/td><td>0,5<\/td><td>2,0<\/td><td>2,0<\/td><td>150<\/td><td>7<\/td><\/tr><tr><td>OF<\/td><td>1,0<\/td><td>1,3<\/td><td>1,0<\/td><td>1,3<\/td><td>1,0<\/td><td>90<\/td><td>7<\/td><\/tr><tr><td>OD<\/td><td>1,0<\/td><td>2,0<\/td><td>1,0<\/td><td>1,0<\/td><td>1,0<\/td><td>90<\/td><td>7<\/td><\/tr><\/table>\n<p>  Với cuộn dây làm mát kiểu zigzag bị hạn chế lưu thông dầu: k21 = 3,0 (ONAN/ONAF) và 1,45 (OF). Công cụ nhiệt độ trong DT-RnD-Lab đang dùng đúng các giá trị trên.<\/p>\n<ul><li>Thay đổi so với bản 2005: cập nhật tuổi thọ cách điện; khuyến nghị nhiệt độ lõi tối đa; số cảm biến sợi quang khi thử phát nóng; hệ số Q, S, H; viết lại mô hình nhiệt dạng toán học tổng quát; bàn về GIC.<\/li><li>TB 995 nhận xét: mô hình này dễ áp dụng (chỉ cần tải và nhiệt độ môi trường), nhưng chỉ cho 1 cuộn dây, 1 pha, nấc cố định, 1 cấp làm mát. Nên hiệu chỉnh thông số bằng thử phát nóng mở rộng hoặc dữ liệu vận hành.<\/li><\/ul>\n<h4>✅ IEC 60599:2022 (Ed 4.0) – Interpretation of dissolved and free gases analysis<\/h4>\n<ul><li><b>Bảng 1 – tỷ số khí<\/b> (C2H2/C2H4; CH4/H2; C2H4/C2H6), NS = không có ý nghĩa:<\/li><\/ul>\n<table><tr><th>Lỗi<\/th><th>C2H2/C2H4<\/th><th>CH4/H2<\/th><th>C2H4/C2H6<\/th><\/tr><tr><td>PD<\/td><td>NS<\/td><td>&lt; 0,1<\/td><td>&lt; 0,2<\/td><\/tr><tr><td>D1<\/td><td>&gt; 1<\/td><td>0,1–0,5<\/td><td>&gt; 1<\/td><\/tr><tr><td>D2<\/td><td>0,6–2,5<\/td><td>0,1–1<\/td><td>&gt; 2<\/td><\/tr><tr><td>T1 (&lt; 300 °C)<\/td><td>NS<\/td><td>&gt; 1<\/td><td>&lt; 1<\/td><\/tr><tr><td>T2 (300–700 °C)<\/td><td>&lt; 0,1<\/td><td>&gt; 1<\/td><td>1–4<\/td><\/tr><tr><td>T3 (&gt; 700 °C)<\/td><td>&lt; 0,2<\/td><td>&gt; 1<\/td><td>&gt; 4<\/td><\/tr><\/table>\n<p>  Bảng 2 (sơ đồ giản lược): C2H2/C2H4 &lt; 0,2 thì là PD hoặc T, &gt; 0,2 thì là D. Annex B có biểu diễn đồ họa (tam giác Duval).<\/p>\n<ul><li><b>CO2/CO<\/b> (mục 5.5): CO cao (ví dụ 1000 ppm) kèm CO2/CO &lt; 3 cho thấy có thể có giấy tham gia sự cố. CO2 &gt; 10 000 ppm kèm CO2/CO &gt; 10 cho thấy có thể quá nhiệt nhẹ giấy (&lt; 160 °C) hoặc oxy hóa dầu. Không kết luận giấy bị ảnh hưởng chỉ dựa vào CO/CO2.<\/li><li><b>Quy trình (Điều 9)<\/b>:<\/li><\/ul>\n<p>  a) Loại bỏ giá trị bất thường, tính tốc độ tăng. Nếu mọi khí dưới giá trị điển hình thì kết luận \"DGA bình thường\". Nếu có khí vượt thì tính tỷ số theo Bảng 1. b) Kiểm tra ngưỡng báo động, xem lỗi có tiến triển không, giấy có tham gia không. c) Hành động: tăng tần suất lấy mẫu, thử nghiệm bổ sung (âm học, điện, hồng ngoại), giảm tải, xem xét đưa máy ra kiểm tra.<\/p>\n<ul><li><b>Bảng A.2 – dải giá trị điển hình 90 % trên MBA lực<\/b> (µl/l): H2 50–150; CH4 30–130; C2H4 60–280; C2H6 20–90; CO 400–600; CO2 3800–14000; C2H2 là 2–20 (không có OLTC thông dầu) hoặc 60–280 (có OLTC thông dầu).<\/li><li><b>Bảng A.3 – tốc độ tăng điển hình 90 %<\/b> (µl/l/năm, MBA dầu &gt; 5000 l): H2 35–132; CH4 10–120; C2H4 32–146; C2H6 5–90; CO 260–1060; CO2 1700–10000; C2H2 0–4 (không OLTC) hoặc 21–37 (có OLTC thông dầu).<\/li><li>Khuyến nghị mỗi công ty điện tự tính giá trị điển hình của đội máy mình. Công cụ DGA của DT-RnD-Lab dùng cận trên Bảng A.2 để kiểm tra bước a).<\/li><\/ul>\n<h4>✅ IEC TR 61850-90-3:2016 (+ Cor.1:2020) – Using IEC 61850 for condition monitoring diagnosis and analysis<\/h4>\n<ul><li>Use case giám sát–chẩn đoán (CMD) cho GIS, MBA, bộ điều áp (LTC), cáp ngầm, đường dây, hệ thống điện tự dùng; kèm yêu cầu truyền thông và liên kết với hệ quản lý tài sản.<\/li><li><b>LN cho MBA<\/b> (mục 6.4):<\/li><li>SIML: khí và ẩm trong dầu;<\/li><li>SPDC: phóng điện cục bộ;<\/li><li>SPTR: giám sát tổng thể MBA;<\/li><li>SIMS: lão hóa cách điện rắn;<\/li><li>SSTP: nhiệt độ bão hòa/sinh bọt, thay SBTP;<\/li><li>SBSH: sứ;<\/li><li>SCGR: nhóm làm mát;<\/li><li>cảm biến phụ: TFLW (lưu lượng), TLVL (mức), TPRS (áp suất), TTMP (nhiệt độ), TGSN (cảm biến chung).<\/li><li><b>LTC<\/b> (chương 7): đặc tính thao tác, số lần chuyển nấc, mòn tiếp điểm, nhiệt độ dầu LTC, bộ lọc dầu → SLTC.<\/li><li>🌐 Diễn biến 2026: TC 57 đang soạn PAS 61850-90-3 ED1, bổ sung SVAM (rung–âm OLTC), SDBR (bình thở), SPRD (van áp suất).<\/li><li>Ý nghĩa: đây là \"từ điển dữ liệu\" để Substation DT đọc tín hiệu giám sát theo cách không phụ thuộc hãng.<\/li><\/ul>\n<h4>✅ IEC 61850-7-4:2010+AMD1:2020 (Ed 2.1) – Compatible logical node classes and data object classes<\/h4>\n<p>Bản hợp nhất 490 trang. Nhóm LN \"S\" (supervision): SARC, SCBR, SIMG, SIML, SLTC, SOPM, SPDC, SPTR, SSWI, STMP, SVBR… Amendment 1 bổ sung LN giám sát theo IEC 62271, power quality, dữ liệu thống kê/lịch sử.<\/p>\n<h4>✅ Đặc tả AAS của IDTA – \"Specification of the Asset Administration Shell Part 1: Metamodel\" (IDTA-01001-3-0)<\/h4>\n<ul><li>Bộ đặc tả miễn phí của Industrial Digital Twin Association, nội dung tương ứng IEC 63278-1:2023 (bản IEC phải mua).<\/li><li>Định nghĩa metamodel của AAS và các submodel, định danh, kiểm soát truy cập, ánh xạ sang XML, JSON, RDF, AutomationML, OPC UA. Phần 2 (API), phần 3a (IEC 61360), phần 4 (bảo mật), phần 5 (gói AASX) tải tại industrialdigitaltwin.org.<\/li><li>Ứng dụng tiềm năng: \"hộ chiếu số\" của MBA (nameplate, FAT, heat-run, SCD, lịch sử DGA) để trao đổi giữa nhà chế tạo, công ty điện và VTI. Khớp với khuyến nghị dùng tiêu chuẩn mở của TB 995.<\/li><\/ul>\n<h4>🌐 IEC 63278-1:2023 – AAS structure (Ed 1.0, 14/12/2023, TC 65, 149 trang)<\/h4>\n<h4>🌐 ISO/IEC 30173:2023 – Digital twin: Concepts and terminology (11/2023, 28 trang, JTC 1/SC 41)<\/h4>\n<h4>🌐 ISO/IEC 30188 – Digital twin reference architecture (đang soạn tại JTC 1/SC 41/WG 6)<\/h4>\n<h4>🌐 IEC 62443-4-1 / 4-2 – An ninh mạng cho quy trình phát triển và thành phần<\/h4>\n<p>Hitachi Energy TXpert Hub có chứng nhận IEC 62443-4-2.<\/p>\n<h4>🌐 IEC 61850-6 – SCL (SCD/ICD/CID)<\/h4>\n<p>Bản Ed 2.1 (2009+AMD1:2018), CẦN KIỂM CHỨNG trước khi trích dẫn cho khách hàng.<\/p>"}, {"title": "Fact sheet 02 – CIGRE Technical Brochures & IEEE Guides cho giám sát và DT máy biến áp (đã đối chiếu bản gốc)", "sub": "02_cigre_ieee", "html": "<p>Cập nhật 10/11/2026. Các mục đánh dấu ✅ là đã đọc bản gốc trong library/02_cigre_ieee. Các mục đánh dấu 🌐 là tra cứu web, chưa có bản gốc. Toàn bộ là tóm tắt bằng lời của Phòng R&amp;D. Tóm tắt chi tiết TB 995 xem Fact sheet 03.<\/p>\n<h4>✅ CIGRE TB 995 (2026) – Digital twins for power transformers<\/h4>\n<p>JWG A2/D2.65, 108 trang. Định nghĩa DT, 5 cấp năng lực (Descriptive → Diagnostic → Predictive → Prescriptive → Autonomous), khảo sát 70 chuyên gia, mô hình đa trạng thái, checklist VVUQ, khuyến nghị. → Xem FS03.<\/p>\n<h4>✅ CIGRE TB 642 (2015) – Transformer reliability survey (WG A2.37)<\/h4>\n<ul><li>964 sự cố lớn giai đoạn 1996–2010, tổng 167.459 MBA-năm, 56 công ty điện (bảng số liệu ghi 58), 21 nước.<\/li><li>Suất sự cố MBA trạm theo cấp điện áp: 69–100 kV 0,94 %; <b>100–200 kV (nhóm 110 kV VN) 0,43 %<\/b>; 200–300 kV 0,50 %; 300–500 kV 0,60 %; 500–700 kV 0,57 %; ≥ 700 kV 0,33 %; chung 0,53 %/năm. MBA tăng áp (GSU) chung 0,95 %; riêng GSU 300–500 kV là 1,32 %, nhóm duy nhất vượt 1 %.<\/li><li>Vị trí khởi phát sự cố, MBA nhóm 100–200 kV: cuộn dây 43,5 %, <b>bộ điều áp dưới tải 34,2 %<\/b>, sứ 13,0 %, lõi 2,9 %, đầu ra dây 2,9 %. Toàn bộ mẫu (không tính loại \"không rõ\"): cuộn dây 47,4 %, OLTC 23,2 %, sứ 14,4 %, đầu ra dây 6,3 %, lõi 3,8 %. Với U ≥ 100 kV, hơn 50 % sự cố cuộn dây xuất phát từ cuộn cao áp.<\/li><li>Tỷ trọng sứ và đầu ra dây tăng theo cấp điện áp; tỷ trọng OLTC giảm theo cấp điện áp. 95 % MBA trạm bị sự cố có OLTC.<\/li><li>Sự cố bắt nguồn từ sứ thường gây cháy/nổ. Sự cố cuộn dây thường dẫn tới loại bỏ MBA. Sự cố OLTC và sứ thường sửa được.<\/li><li>Đường cong nguy cơ không có dạng \"bồn tắm\" rõ ràng; với 2 nhóm, nguy cơ tăng lên khoảng 1 % sau 30–40 năm rồi đi ngang. <b>Kết luận của WG: bảo dưỡng theo thời gian không hiệu quả với MBA trạm, nên bảo dưỡng theo tình trạng.<\/b><\/li><li>Ý nghĩa cho VTI (110 kV): ưu tiên giám sát OLTC (34 %) và cuộn dây (44 %) → DGA (gồm DGA ngăn OLTC), rung–âm OLTC, giám sát sứ.<\/li><\/ul>\n<h4>✅ CIGRE TB 783 (2019) – DGA monitoring systems (JWG D1/A2.47)<\/h4>\n<ul><li>Phân loại monitor theo khí đo:<\/li><li>M1/M1* (chỉ H2 hoặc tín hiệu tổng hợp), M2 (H2, CO): chỉ phát hiện lỗi, không nhận diện được loại lỗi nào; có thể bỏ sót D1/D2 ở giai đoạn sớm.<\/li><li>M3 (CH4, C2H4, C2H2), M5 (H2, CH4, C2H4, C2H2, CO): nhận diện được 6 lỗi cơ bản.<\/li><li>M6/M7 và M8/M9 (đủ khí, có CO2, O2, N2): nhận diện được cả 10 loại lỗi/ứng suất, gồm các tiểu loại S, O, C, T3-H.<\/li><li>Công nghệ: GC (giống phòng thí nghiệm, cần khí mang và bình hiệu chuẩn); hồng ngoại/quang âm (không cần khí tiêu hao, nhưng một số mẫu bị nhiễm hơi dầu/chất gây nhiễu → trôi); cảm biến chất rắn H2/CO.<\/li><li><b>Độ chính xác (kết luận chương 7)<\/b>: khoảng 20 monitor được CIGRE thử từ 2003. Đa số đạt yêu cầu độ chính xác ±15 % của IEC, một số ít không đạt. Ở nồng độ thấp (&lt; 10 ppm) sai số trên 50 % là phổ biến (dưới 5 ppm có thể ≥ 75 %), khi đó chẩn đoán bằng tam giác Duval là không thể. Ở nồng độ thường gặp (&gt; 10 ppm), sai số khoảng 30 % vẫn hay gặp, nhất là phương pháp head-space, kể cả ở phòng thí nghiệm.<\/li><li>Sai số hệ thống của monitor làm <b>sai cả tốc độ tăng khí<\/b> (ví dụ +50 % thì tốc độ cũng lệch +50 %) → báo động giả hoặc bỏ sót.<\/li><li>Khuyến nghị: kiểm chứng độ chính xác monitor và phòng thí nghiệm bằng mẫu chuẩn gas-in-oil (Phụ lục F); yêu cầu phòng thí nghiệm theo ISO 17025/17034 và đưa yêu cầu độ chính xác vào hợp đồng.<\/li><li>ĐÍNH CHÍNH: con số \"sai lệch ±20–30 %\" mà Phòng trích trước đây lấy từ bài báo của B. Das &amp; M. Grisaru (Transformers Magazine 2026), không phải nguyên văn TB 783.<\/li><\/ul>\n<h4>✅ CIGRE TB 771 (2019) – Advances in DGA interpretation (JWG D1/A2.47)<\/h4>\n<ul><li>Ngoài 6 lỗi cơ bản (PD, D1, D2, T1, T2, T3), phân biệt các tiểu loại:<\/li><li>S: stray gassing, sinh khí tự nhiên của dầu &lt; 200 °C;<\/li><li>O: quá nhiệt &lt; 250 °C;<\/li><li>C: có thể cacbon hóa giấy &gt; 300 °C;<\/li><li>T3-H: T3 chỉ trong dầu.<\/li><\/ul>\n<p>  Các tiểu loại này nhận diện bằng Duval Triangles 4, 5 và Pentagon 2.<\/p>\n<ul><li>Lỗi ít đáng lo: S, T3-H. Lỗi nguy hiểm hơn: C (giấy cacbon hóa ở dây dẫn ra, trên cuộn dây, giữa các vòng), D1 trong giấy, D2 trong cuộn dây.<\/li><li>Cung cấp giá trị điển hình theo loại lỗi; DGA cho OLTC bằng Duval Triangle 2.<\/li><\/ul>\n<h4>✅ CIGRE TB 761 (2019) – Condition assessment of power transformers (WG A2.49)<\/h4>\n<ul><li>Chỉ số đánh giá MBA (Transformer Assessment Index – TAI), xây dựng theo 5 bước:<\/li><li>Xác định mục đích (sàng lọc đội máy hay đánh giá chi tiết; chỉ số thay thế hay chỉ số đại tu);<\/li><li>Xác định các dạng hỏng (failure modes) đưa vào chỉ số;<\/li><li>Cách đánh giá từng dạng hỏng;<\/li><li>Ma trận chấm điểm đã hiệu chuẩn;<\/li><li>Tính điểm TAI cho từng máy.<\/li><li>Nguyên tắc: không đánh giá một dạng hỏng nhiều lần; tách dạng hỏng khắc phục được (OLTC, sứ) khỏi chỉ số thay thế; xử lý dữ liệu bất định hoặc thiếu (chương 4); vai trò thiết bị online (chương 5); chỉ số mức độ quan trọng (criticality, chương 6); ước tính xác suất hỏng (chương 7). Có ma trận chấm điểm cho phần tác dụng, sứ, OLTC, làm mát, thùng, dầu (Annex A).<\/li><\/ul>\n<h4>✅ CIGRE TB 630 (2015) – Guide on TICM systems (WG A2.44)<\/h4>\n<ul><li>Phương pháp luận cho hệ giám sát tình trạng thông minh: mô hình chức năng và mô hình thông tin MBA chung; chọn thuật toán chẩn đoán; kiến trúc và luồng dữ liệu; chuẩn hóa dữ liệu giám sát để tích hợp về sau; khía cạnh kinh tế–chiến lược.<\/li><li>Thách thức: người dùng phải xác định chức năng/lỗi cần giám sát; thuật toán cần giao diện chuẩn, mô-đun hóa (có thể từ nhiều nhà cung cấp); tổ chức phải sẵn sàng (quy trình, đào tạo). Khuyến nghị hướng tới các LN giám sát–chẩn đoán trong IEC 61850.<\/li><\/ul>\n<h4>✅ CIGRE TB 445 (2011) → 🌐 đã được thay bằng <b>TB 962 (2025) – Guide for transformer maintenance<\/b> (WG A2.69, 190 trang)<\/h4>\n<p>TB 962 cập nhật toàn bộ các chương và có khảo sát mới về thực hành bảo dưỡng. Cần tải TB 962 thay cho TB 445 (miễn phí cho hội viên CIGRE; người ngoài hội viên phải mua cho tới khi tài liệu đủ 3 năm).<\/p>\n<h4>✅ CIGRE TB 343 (2008) – Recommendations for condition monitoring and condition assessment facilities for transformers (WG A2.27)<\/h4>\n<h4>✅ CIGRE TB 298 (2006) – Guide on transformer lifetime data management (WG A2.23)<\/h4>\n<p>TB 995 liệt kê TB 298 là tài liệu nền về khía cạnh dữ liệu.<\/p>\n<h4>🌐 CIGRE TB 659 (2016) – Transformer thermal modelling (WG A2.38, 197 trang)<\/h4>\n<p>THNM, CFD, mô phỏng chuẩn một cuộn dây thực, mô hình động, thực hành đo trực tiếp. Đã trên 3 năm → <b>tải miễn phí<\/b> tại e-cigre.org. Nên bổ sung vào kho (TB 995 dẫn chiếu cho mô hình nhiệt).<\/p>\n<h4>🌐 IEEE C57.143-2024 – Guide for Application of Monitoring Equipment to Liquid-Immersed Transformers and Components<\/h4>\n<p>Phát hành 20/05/2025, 177 trang, thay bản 2012. Phạm vi: thông số giám sát, phân tích rủi ro/lợi ích, ứng dụng cảm biến và hệ thống; không gồm diễn giải kết quả. Phụ lục: PD, đo trực tiếp nhiệt độ cuộn dây, phân tích dữ liệu DGA online.<\/p>\n<h4>🌐 IEEE C57.104-2019 – Guide for the Interpretation of Gases Generated in Mineral Oil-Immersed Transformers<\/h4>\n<ul><li>98 trang, xây dựng từ dữ liệu khoảng 1 triệu mẫu DGA. Giới hạn theo phân vị 90th và 95th, phân nhóm theo tỷ số O2/N2 (≤ 0,2 hoặc &gt; 0,2) và tuổi MBA.<\/li><li>Ba mức trạng thái:<\/li><li>DGA Status 1: dưới phân vị 90 về nồng độ, delta và tốc độ;<\/li><li>Status 2: nằm giữa phân vị 90 và 95;<\/li><li>Status 3: vượt phân vị 95, hoặc delta/tốc độ vượt ngưỡng.<\/li><li>Tốc độ tăng tính bằng hồi quy tuyến tính trên 3–6 mẫu.<\/li><li>Một số nghiên cứu (Indonesia) cho rằng ngưỡng delta/tốc độ khá chặt, dễ xếp nhầm vào Status 2/3. Cần bản gốc để lấy bảng số liệu.<\/li><\/ul>\n<h4>🌐 IEEE C57.91-2025 – Guide for Loading Mineral-Oil-Immersed Transformers and Step-Voltage Regulators<\/h4>\n<ul><li>Phát hành 05/03/2026, 123 trang, thay bản C57.91-2011.<\/li><li>Có phương pháp tính có và không xét hiệu ứng dầu trong rãnh làm mát (duct oil); kèm mã nguồn mở trên IEEE Open-Source Platform.<\/li><li>TB 995 ghi nhận mô hình IEEE cho thêm nhiệt độ đáy thùng và đỉnh rãnh cuộn dây nhưng cần nhiều thông số hơn mô hình IEC.<\/li><\/ul>"}, {"title": "Fact sheet 03 – CIGRE TB 995 (2026) \"Digital twins for power transformers – Concept and future perspectives\" – tóm tắt từ bản gốc", "sub": "02_cigre_ieee", "html": "<p>Nguồn: bản PDF TB 995 trong library/02_cigre_ieee (JWG A2/D2.65, 108 trang). Tóm tắt do Phòng R&amp;D viết bằng lời của mình, đã đối chiếu bản gốc ngày 10/11/2026. Số chương/mục ghi trong ngoặc để tra lại.<\/p>\n<h4>1. Định nghĩa (mục 2.2)<\/h4>\n<ul><li>Digital twin (DT) của MBA = biểu diễn ảo của tài sản/hệ thống, được cập nhật động bằng dữ liệu từ đối tượng thật, có khả năng dự báo và hỗ trợ ra quyết định để tạo giá trị. Tương tác HAI CHIỀU ảo ↔ thực là cốt lõi.<\/li><li>Vòng phản hồi: dữ liệu thật → mô hình hóa/phân tích/dự báo → hành động → DT được cập nhật suốt đời tài sản.<\/li><li><b>Reality gap<\/b> (khoảng cách thực tế): độ lệch giữa hành vi của DT và MBA thật. Nguyên nhân: mô hình chưa đúng, dữ liệu hạn chế, hoặc thay đổi ở tài sản mà mô hình chưa tính đến. Quản lý reality gap là thước đo độ tin cậy của DT.<\/li><li>Lịch sử (mục 2.3): khái niệm do M. Grieves đề xuất năm 2002; tên \"digital twin\" được NASA dùng năm 2010; Industry 4.0 khoảng 2016; khoảng 2020 bắt đầu chuẩn hóa trong ISO/IEC JTC 1/SC 41. Với MBA, đa số vẫn ở mức pilot/prototype.<\/li><\/ul>\n<h4>2. Thành phần của Transformer DT (mục 2.4, theo TB 630)<\/h4>\n<ol><li>Cảm biến: nhiệt độ, khí hòa tan, dòng đầu sứ (bushing tap), thông số OLTC, rung, PD, dòng/áp.<\/li><li>Hạ tầng truyền thông: có dây, không dây hoặc kết hợp.<\/li><li>Hệ thu thập dữ liệu: thu, lưu, tiền xử lý, bảo đảm toàn vẹn dữ liệu.<\/li><li>Mô hình hóa, mô phỏng, phân tích (ML): nhận dạng mẫu, phát hiện bất thường, dự báo.<\/li><li>Trực quan hóa / giao diện người dùng (dashboard; có thể 3D, AR/VR – mục 2.5).<\/li><li>Dữ liệu ngoài vận hành: dữ liệu thiết kế, kết quả FAT/SAT (kể cả thử nghiệm phát nóng của máy cùng loại), hồ sơ bảo dưỡng, dữ liệu môi trường.<\/li><\/ol>\n<h4>3. Kỹ thuật diễn giải (2.6) và loại mô hình (2.7)<\/h4>\n<ul><li>Ba loại đầu ra: phát hiện bất thường (anomaly detection) → chẩn đoán nguyên nhân (diagnosis; thường cần thêm thử nghiệm offline để xác nhận) → tiên lượng (prognosis; tuổi thọ còn lại RUL).<\/li><li>Bốn loại mô hình: physics-based (từ CFD/FEM chi tiết tới mạch nhiệt thông số tập trung); data-driven (ML; thiếu dữ liệu sự cố vì MBA rất tin cậy); knowledge-based (luật chuyên gia, ontology, knowledge graph); hybrid (kết hợp ≥ 2 loại – được khuyến nghị khi thiếu dữ liệu thiết kế độc quyền).<\/li><\/ul>\n<h4>4. Năm cấp năng lực DT (mục 2.8, Bảng 2.1)<\/h4>\n<table><tr><th>Cấp<\/th><th>Tên<\/th><th>Năng lực chính<\/th><\/tr><tr><td>1<\/td><td>Descriptive<\/td><td>Biểu diễn số thời gian thực; giám sát từ xa, hiển thị trạng thái<\/td><\/tr><tr><td>2<\/td><td>Diagnostic<\/td><td>Phát hiện lỗi, nhận biết bất thường sớm (nhiệt tăng bất thường, khí bất thường, PD, suy giảm cách điện, lỗi làm mát)<\/td><\/tr><tr><td>3<\/td><td>Predictive<\/td><td>Dự báo trạng thái, RUL, xác suất hư hỏng, phân tích lão hóa, lập kế hoạch bảo dưỡng chủ động<\/td><\/tr><tr><td>4<\/td><td>Prescriptive<\/td><td>Khuyến nghị tối ưu (thời điểm xử lý dầu, bảo dưỡng OLTC, kiểm tra mục tiêu) dựa trên phân tích \"what-if\" có định lượng độ bất định<\/td><\/tr><tr><td>5<\/td><td>Autonomous<\/td><td>Tự thực hiện một số chức năng điều khiển (giới hạn tải, khởi động bảo dưỡng), phối hợp với hệ thống quản lý lưới và các DT khác<\/td><\/tr><\/table>\n<h4>5. Khảo sát ngành (chương 3) – 70 chuyên gia, 10/2024–02/2025<\/h4>\n<ul><li>Đối tượng: 33 % công ty điện/vận hành lưới, 33 % nhà chế tạo, 16 % viện/trường; theo vùng: châu Âu 33 %, châu Á 19 %, Bắc Mỹ 13 %. 87 % quen thuộc với khái niệm DT.<\/li><li>60 % tổ chức (42/70) đang có dự án DT cho MBA. Trong các dự án: khoảng 43 % ở giai đoạn pilot/prototype, 33 % ở giai đoạn ý tưởng/khả thi, chỉ 24 % đã vận hành.<\/li><li>64 % đã đạt cấp 1. Phần lớn kỳ vọng đạt cấp 2 trong 3 năm tới. 19 % không định làm cấp 4 và 52 % không định làm cấp 5.<\/li><li>92 % dự báo DT có tác động từ trung bình đến cao (49 % cho rằng tăng mạnh trong 10 năm).<\/li><li>Rào cản lớn nhất: dữ liệu thiếu hoặc kém chất lượng (hơn 84 % đánh giá quan trọng/rất quan trọng); tiếp theo là tích hợp hệ thống (khoảng 71 %); sau đó an ninh mạng, kỹ năng.<\/li><li>Tiêu chuẩn: 47 % cho là then chốt, 41 % cho là quan trọng. Lý do: giảm phụ thuộc nhà cung cấp (vendor lock-in) và chi phí tích hợp.<\/li><li>Năng lực: chỉ khoảng 21 % tự phát triển DT được; 67 % có hợp tác bên ngoài (49 % với viện/trường, 31 % với nhà chế tạo, 30 % với đơn vị dịch vụ).<\/li><li>Ngân sách: 56 % đã có ngân sách (23 % có dòng ngân sách riêng).<\/li><\/ul>\n<h4>6. Dữ liệu (chương 4)<\/h4>\n<ul><li>Nhóm dữ liệu: thiết kế–chế tạo; FAT/SAT; thử nghiệm/kiểm tra hiện trường; giám sát online; vận hành; cuối đời (post-mortem); cơ sở dữ liệu ngoài.<\/li><li>Quản lý dữ liệu: truyền thông/lưu trữ/truy cập; quản trị dữ liệu (data governance); an ninh mạng.<\/li><li><b>Mô hình đa trạng thái (multi-state)<\/b> (mục 4.4): biểu diễn sức khỏe MBA qua các trạng thái suy giảm rời rạc, từ bình thường qua các mức suy giảm tới hỏng. Trạng thái xác định từ FMEA và chỉ số quan sát hoặc suy luận (virtual sensor). Chuyển trạng thái được mô hình hóa tất định (vật lý) hoặc xác suất. Cho phép chạy song song nhiều mô hình chẩn đoán (ensemble).<\/li><\/ul>\n<h4>7. Mô hình vật lý (chương 5) – trọng tâm nhiệt<\/h4>\n<ul><li>Ba mức: mạch nhiệt thông số tập trung (loading guide) → mô hình mạng nhiệt-thủy lực (THNM) → CFD. Nhà chế tạo dùng CFD/THNM; công ty điện thường dùng mô hình đơn giản (chi tiết ở CIGRE TB 659; WG A2.60 đang làm về hành vi nhiệt động).<\/li><li>Mô hình IEC 60076-7:2018 dùng phương trình vi phân thường, chỉ cần chuỗi nhiệt độ môi trường và hệ số tải. IEEE C57.91-2025 cho thêm nhiệt độ đáy thùng và đỉnh rãnh làm mát cuộn dây nhưng cần nhiều thông số đặc thù hơn.<\/li><li>Lưu ý: hệ số mũ dầu/cuộn dây mặc định của IEC 60076-2:2011 và IEC 60076-7:2018 khác nhau; bộ của 60076-2 bảo thủ hơn.<\/li><li><b>Hiệu chỉnh thông số<\/b>:<\/li><li>Với MBA mới: chỉ định thử phát nóng mở rộng (extended temperature rise test) để rút ra thông số riêng.<\/li><li>Với MBA đang vận hành: học thông số từ dữ liệu đo θo/θh, cực tiểu sai số dự báo. Thông số học được chỉ đúng trong dải vận hành của dữ liệu học.<\/li><li>Không hiệu chỉnh các đại lượng đo trực tiếp ở định mức (tỷ số tổn hao, độ tăng nhiệt định mức).<\/li><li>Hạn chế của mô hình loading guide: chỉ 1 cuộn dây, 1 pha, nấc cố định, 1 cấp làm mát; sai lệch khi môi trường rất lạnh, khi đổi chế độ làm mát, khi đổi nấc, khi tải rất thấp → THNM động khắc phục.<\/li><li>Các mô hình khác: điện từ, suy giảm điện môi (đa vật lý), cơ học, thành phần (OLTC, sứ, hệ làm mát).<\/li><\/ul>\n<h4>8. Mô hình dữ liệu và lai (chương 6)<\/h4>\n<ul><li>Quy trình dữ liệu: thu thập, làm sạch, phát hiện ngoại lai, xử lý thiếu/mất cân bằng dữ liệu, tích hợp, biến đổi, giảm chiều, chia tập.<\/li><li>Hybrid: grey-box, PINN (physics-informed neural network), ensemble. Ví dụ ứng dụng: chẩn đoán lỗi, đánh giá tình trạng, quản lý tải nhiệt.<\/li><\/ul>\n<h4>9. Độ tin cậy &amp; VVUQ (chương 7)<\/h4>\n<ul><li>Độ tin cậy của DT = khả năng đưa ra kết quả đúng hạn trong giới hạn sai số đã thỏa thuận, đồng thời liên tục theo dõi và thu hẹp reality gap. Đây là đặc tính thay đổi theo thời gian, không cố định.<\/li><li>Cập nhật mô hình sau \"sự kiện thay đổi đời sống\" của MBA (life-changing events: thay linh kiện, lọc/thay dầu…).<\/li><li><b>Checklist VVUQ (mục 7.12)<\/b>:<\/li><li>Verification: kiểm tra dữ liệu đầu vào (đúng dải); độ tin cậy cảm biến (hiệu chuẩn, phát hiện trôi/hỏng); kiểm chứng thuật toán trên dữ liệu thử phủ miền thiết kế; kiểm chứng từng DT thành phần (sứ, OLTC…) riêng và khi ghép.<\/li><li>Validation: đánh giá reality gap so với đo thực trong biên sai số chấp nhận; quy trình kiểm định ngoài với dữ liệu chuẩn (ground truth); cập nhật sau sự kiện lớn; audit trail mọi quyết định/thay đổi.<\/li><li>UQ: theo dõi thống kê sai số (trung bình, độ lệch chuẩn…); phân tích độ nhạy; truyền đạt rõ độ bất định và giới hạn mô hình; hiệu chỉnh liên tục.<\/li><li>Sẵn sàng vận hành: tần suất cập nhật dữ liệu đủ; đào tạo người dùng; đầu ra rõ ràng, truy ngược được về dữ liệu đầu vào.<\/li><li>DT tự hành hoàn toàn hiện còn hiếm; luôn cần con người giám sát suốt vòng đời DT.<\/li><\/ul>\n<h4>10. Khuyến nghị (chương 8) &amp; kết luận (chương 9)<\/h4>\n<ul><li>Đầu tư sớm vào chất lượng và tích hợp dữ liệu (số hóa hồ sơ cũ, tích hợp SCADA, thiết kế, FAT, bảo dưỡng, môi trường). Dùng kỹ thuật phát hiện ngoại lai (k-NN), xử lý thiếu dữ liệu, sinh dữ liệu cân bằng (SMOTE).<\/li><li>Dùng tiêu chuẩn mở để tránh vendor lock-in. Kiến trúc thu thập linh hoạt, mở rộng được (đồng bộ thời gian, gắn time-stamp).<\/li><li>Theo dõi reality gap bằng chỉ số đơn giản như MAE. Triển khai theo pha, chạy \"DT offline song song\" trước khi dùng thật. Hiệu chuẩn cảm biến định kỳ. DT phải chạy được ở chế độ suy giảm khi hỏng cảm biến (ước lượng trạng thái).<\/li><li>Hợp nhất dữ liệu đa miền (nhiệt, DGA MBA và OLTC, điện) để giảm báo động giả. Chọn mô hình: white-box (dữ liệu thiết kế) cho MBA mới, grey-box tham số hóa bằng đo hiện trường cho MBA cũ/cải tạo.<\/li><li>Quản trị dữ liệu: thỏa thuận quyền sở hữu dữ liệu giữa nhà chế tạo, công ty điện, cơ quan quản lý; bảo mật (mã hóa, tokenization, differential privacy).<\/li><li>Tài liệu hướng dẫn sử dụng DT (giả định, giới hạn, miền hiệu lực); giải thích mô hình (SHAP, LIME). Không dùng \"accuracy\" cho bài toán mất cân bằng: một mô hình luôn đoán \"bình thường\" vẫn đạt khoảng 99 % accuracy nhưng vô dụng. Nên dùng Matthews Correlation Coefficient.<\/li><li>Tổ chức: xác định mục tiêu và tiêu chí thành công trước; bắt đầu từ use case giá trị cao (giám sát–chẩn đoán, bảo dưỡng dự báo, tối ưu vòng đời); nâng dần qua 5 cấp; đào tạo và hợp tác bên ngoài.<\/li><li>Kết luận: tiếp cận theo pha, pilot trên tài sản đại diện, chỉ mở rộng khi reality gap đã kiểm soát được trong giới hạn thỏa thuận. Kết quả nên trình bày dạng khoảng (bounded ranges) thay vì một con số.<\/li><\/ul>\n<h4>11. Tài liệu CIGRE liên quan được TB 995 liệt kê (mục 2.9) – để tìm đọc tiếp<\/h4>\n<p>TB 414, 443, 676, 761, 771, 779, 812, <b>962 (Guide for transformer maintenance – thay TB 445)<\/b>, 630, 783, 735, 738, 755, 577, <b>659 (Transformer thermal modelling)<\/b>, 944, 900–902, 298, 529, 939 (Analysis of AC transformer reliability). WG đang hoạt động (05/2026): D2.52 (AI), A2.60 (nhiệt động MBA), A2/D1.67 (DGA online), A2.73 (trao đổi thông tin MBA qua số hóa), A2/D1.74 (độ ẩm online), A2.75 (OLTC), A2.78 (sứ), A3/D2.52 (DT thiết bị đóng cắt), B4.104 (DT HVDC).<\/p>"}, {"title": "Fact sheet hãng – Hitachi Energy: TXpert™ Ecosystem, CoreTec™, Lumada APM / APM Edge", "sub": "03_vendor", "html": "<p>Nguồn: trang hitachienergy.com (TXpert Hub, APM Edge), thông cáo báo chí 2020/2023/2026, CISA advisory ICSA-23-089-01. Tra cứu 10/11/2026.<\/p>\n<h4>Danh mục<\/h4>\n<ul><li><b>TXpert™ Ecosystem<\/b> (ra mắt 09/2020): bộ sản phẩm, phần mềm, dịch vụ số hóa MBA; mở, tích hợp thiết bị hãng khác.<\/li><li><b>TXpert™ Hub<\/b> – \"trái tim\" hệ sinh thái: thiết bị giám sát–chẩn đoán–kết nối đặt tại MBA, tổng hợp dữ liệu cảm biến \"TXpert Ready\" của nhiều hãng; truy cập tại chỗ hoặc qua cloud. Thế hệ mới (02/2023) chạy trên nền <b>CoreTec™ 5<\/b> (trước đó CoreTec 4). Áp dụng cho MBA dầu hoặc khô, mới hoặc cải tạo, mọi hãng (hạn chế với MBA HVDC).<\/li><li>Biến thể: Distribution Transformer Basic / Basic+; Power Transformer Basic / Basic+ / Advanced; Dry Basic+ (tuabin gió). Kết hợp với APM Edge, TXpert Remote Services, TXpert Services.<\/li><li>Ví dụ ứng dụng hãng nêu: trạm TSO (giảm cử người ra hiện trường), nhà máy điện, trung tâm dữ liệu, trạm sạc xe điện, nhà máy luyện kim (đánh giá khả năng quá tải ngắn hạn).<\/li><li>Dữ liệu được chuyển thành thông tin hành động dựa trên tiêu chuẩn IEC, IEEE + kinh nghiệm chế tạo/bảo dưỡng của hãng.<\/li><li><b>An ninh mạng<\/b>: chứng nhận IEC 62443-4-2, phù hợp IEEE 1686, hỗ trợ tuân thủ NERC-CIP; đội phát triển đạt IEC 62443-4-1 và ISO 27001.<\/li><li>Truyền thông: có ngăn xếp <b>IEC 61850 MMS server<\/b> (xác nhận qua CISA advisory 2023: CVE-2022-3353 ảnh hưởng TXpert Hub CoreTec 4 v2.0–3.0 và CoreTec 5 v3.0 – đã có bản vá). Các CVE khác 2022 trên CoreTec 4 v2.0–2.2 (command injection, xác thực) → bài học: thiết bị biên DT phải có quy trình vá lỗi &amp; PSIRT.<\/li><li><b>APM Edge<\/b>: phần mềm APM gọn cho MBA, từ 1 máy đến toàn doanh nghiệp; thuật toán có bằng sáng chế, liên tục tính xác suất hư hỏng; tương thích thiết bị đa số hãng, plug-and-play với TXpert.<\/li><li><b>Lumada APM / Hitachi Energy APM<\/b> (enterprise): modules health, reliability, optimization (thế hệ mới 10/2023); hơn 175 mô hình dựng sẵn cho MBA, máy cắt, tài sản trạm; tích hợp EAM + FSM. IDC MarketScape 2025–2026 xếp Leader về APM cho ngành điện (công bố 17/02/2026). Đã triển khai cho Inner Mongolia Power (dự án bảo dưỡng MBA).<\/li><\/ul>\n<h4>Đánh giá theo khung CIGRE TB 995 (Phòng R&amp;D)<\/h4>\n<ul><li>Mức năng lực: Descriptive → Diagnostic → Predictive (xác suất hư hỏng, mô phỏng rủi ro theo tải) ở cấp đội máy; có Prescriptive một phần (ưu tiên bảo dưỡng/thay thế). GIẢ ĐỊNH dựa trên mô tả của hãng.<\/li><li>Điểm mạnh: hệ sinh thái đầy đủ thiết bị → APM doanh nghiệp; kinh nghiệm hãng sản xuất MBA lớn; an ninh mạng được chứng nhận.<\/li><li>Điểm yếu/rủi ro với khách hàng VN: chi phí và phụ thuộc hãng; dữ liệu có thể đưa lên cloud (cần đối chiếu Luật Dữ liệu VN); giá không công bố.<\/li><\/ul>"}, {"title": "Fact sheet hãng – Siemens Energy: Sensformer® / Sensformer® Advanced", "sub": "03_vendor", "html": "<p>Nguồn: thông cáo Siemens (Hannover Messe 2018, 2019 PR2019040210GPEN), siemens-energy.com (500th Sensformer – ISA CTEEP), bài Transformer Technology (02/2022) và Transformers Magazine (11/2023, Sherekar &amp; Pandya). Tra cứu 10/11/2026.<\/p>\n<ul><li><b>Sensformer (2018)<\/b>: chuyển toàn bộ danh mục MBA sang \"digital transformer\" từ 06/2018. Mỗi máy có IoT gateway đo trực tiếp: mức dầu, nhiệt độ dầu đỉnh, dòng cuộn hạ áp, vị trí GPS; tối thiểu hóa số đo vật lý, tránh thiết bị IT thừa tại trạm. Ứng dụng cloud (ban đầu trên MindSphere) hiển thị trạng thái; mở rộng cho cả MBA không phải của Siemens Energy.<\/li><li><b>Sensformer Advanced (Hannover Messe 2019)<\/b>: DT mô phỏng thời gian thực; active overload manager, full temperature view, phân tích tiêu hao tuổi thọ.<\/li><li><b>Mô hình DT của Siemens Energy<\/b>: dựng riêng cho từng MBA từ dữ liệu thiết kế; tiếp cận thermo-hydraulic, <b>multi-mass<\/b> có dòng chảy dầu, tính phân bố tổn hao trong phần tác dụng theo tỷ số biến và vị trí nấc; không dùng hằng số thời gian nhiệt cố định như mô hình IEC; bao phủ mọi cuộn dây và các chế độ làm mát. Hãng công bố so sánh: mô hình DT bám nhiệt độ dầu đỉnh đo được tốt hơn mô hình IEC tiêu chuẩn.<\/li><li>Ba kịch bản: mô phỏng chu kỳ tải và nhiệt độ môi trường 24 giờ tới; dự báo quá tải; tính lão hóa tương đối theo công thức IEC loading guide trong 24 h, 30 ngày và từ khi vận hành. Tính năng khác: mixed reality view, load simulation, lifetime prediction, tích hợp DGA/multigas. Bảo mật theo ISO/IEC 27001.<\/li><li>Định hướng (2022): bổ sung mô hình độ ẩm và suy giảm cách điện để thành \"DT hoàn chỉnh\".<\/li><li>Quy mô: giao chiếc Sensformer thứ 500 cho ISA CTEEP (Brazil); khách hàng đánh giá cao chức năng quá tải có kiểm soát.<\/li><\/ul>\n<h4>Đánh giá (Phòng R&amp;D)<\/h4>\n<ul><li>Mức năng lực TB 995: Descriptive + Predictive (nhiệt/quá tải) rất mạnh; Diagnostic DGA phụ thuộc cảm biến tích hợp.<\/li><li>Điểm mạnh: mô hình vật lý từ dữ liệu thiết kế của chính hãng → độ chính xác cao; \"born connected\".<\/li><li>Hạn chế: lợi thế lớn nhất chỉ có với MBA Siemens Energy (có dữ liệu thiết kế); với MBA hãng khác phải dùng mô hình đơn giản hơn – GIẢ ĐỊNH, cần kiểm chứng. Phụ thuộc cloud.<\/li><li>Bài học cho VTI: muốn cạnh tranh về mô hình nhiệt phải có dữ liệu heat-run test + thông số thiết kế; nên hiệu chỉnh tham số mô hình IEC theo dữ liệu đo (giống cách Dynamic Ratings làm).<\/li><\/ul>"}, {"title": "Fact sheet hãng – GE Vernova: Kelman™ DGA, MS 3000, Perception™ Fleet", "sub": "03_vendor", "html": "<p>Nguồn: brochure gevernova.com (DGA 900, DGA 900 PLUS R010 06/2026, TAPTRANS, MULTITRANS, Perception Fleet 2025/2026), báo Công Thương (EVNNPT). Tra cứu 10/11/2026.<\/p>\n<ul><li><b>Kelman DGA 900<\/b>: thế hệ thứ 4 công nghệ quang âm PAS của GE; đo 9 khí + độ ẩm; \"Rapid Mode\" cho khí nguy hiểm khoảng 30 phút; hỗ trợ dầu khoáng và este; I/O mở rộng; báo động TDCG và 7 tỷ số khí do người dùng định nghĩa, theo mức tuyệt đối và tốc độ thay đổi (ROC). Kết nối DS-Agile, Grid APM, Perception, historian, SCADA. Hãng nêu kinh nghiệm hơn 15 năm PAS và hơn 15.000 thiết bị lắp đặt.<\/li><li><b>DGA 900 PLUS<\/b>: thành hệ giám sát MBA (TMS) với add-on: sứ xuyên (C1, tanδ; tới 9 sứ ở bản 2026), PD (dùng chung adapter sứ; HFCT + PRPD phân biệt PD trong/ngoài), OLTC, làm mát, mô hình hệ cách điện (nhiệt độ dầu, dòng tải, độ ẩm…), camera nhiệt IRT tương quan với xu hướng khí (bản 2026).<\/li><li><b>DGA 900 TAPTRANS<\/b>: DGA riêng cho ngăn chính và ngăn selector/diverter OLTC. <b>MULTITRANS<\/b>: một máy cho 3 MBA một pha. <b>MINITRANS<\/b>: bản giá thấp. Brochure GE nêu phân bố vị trí sự cố: OLTC 35 %, thùng chính 30 %, sứ 15 %, làm mát 5 %, khác 15 % (số liệu do hãng nêu, không ghi nguồn khảo sát → CẦN KIỂM CHỨNG trước khi trích).<\/li><li><b>Perception Fleet<\/b>: phần mềm quản lý rủi ro đội MBA, chạy web; thuật toán theo tiêu chuẩn tính Risk Index 1–5 và risk score để xếp hạng; phân tích tốc độ tăng khí theo Piecewise Linear Rate of Change; dashboard toàn đội máy.<\/li><li><b>MS 3000<\/b>: hệ giám sát tổng quan bản thể MBA (IED tổng hợp nhiều cảm biến, nhiều MBA).<\/li><\/ul>\n<h4>Tại Việt Nam (đã kiểm chứng qua báo chí)<\/h4>\n<ul><li>EVNNPT trang bị <b>4 bộ MS 3000<\/b> cho MBA 500 kV tại trạm Phú Lâm, Pleiku 2, Đà Nẵng, Hiệp Hòa; PTC3 quản lý dự án; nhà thầu tích hợp <b>Công ty CP 3C<\/b>; kết nối qua WAN EVNNPT về <b>Perception Server<\/b> (đã đầu tư trong dự án giám sát dầu online cho MBA và kháng 500 kV). Đây là lần đầu EVNNPT thí điểm loại thiết bị này.<\/li><li>Thủy điện Sông Bung 4 dùng <b>MS3000 + DGA900<\/b> của GE (giám sát PD, DGA, áp suất, nhiệt độ).<\/li><\/ul>\n<p>→ GE có <b>lợi thế cài đặt sẵn (installed base)<\/b> lớn nhất tại EVNNPT cấp 500 kV.<\/p>\n<h4>Đánh giá (Phòng R&amp;D)<\/h4>\n<ul><li>Mức năng lực TB 995: Descriptive + Diagnostic mạnh (DGA), Predictive ở cấp đội máy (risk index). Chưa thấy mô hình DT vật lý chi tiết kiểu Siemens.<\/li><li>Cơ hội cho VTI: tích hợp/đọc dữ liệu Perception &amp; DGA 900 sẵn có của EVNNPT (Modbus/DNP3/IEC 61850) để làm lớp DT phía trên thay vì thay thiết bị → GIẢ ĐỊNH, cần xác minh giao thức thực tế đang dùng.<\/li><\/ul>"}, {"title": "Fact sheet hãng – Maschinenfabrik Reinhausen (MR): ETOS®, MSENSE®, TESSA®", "sub": "03_vendor", "html": "<p>Nguồn: reinhausen.com (ETOS, ETOS ED), tạp chí onload của MR (\"The Digital Triad\" 12/2018), thông cáo Doble–MR. Tra cứu 10/11/2026.<\/p>\n<ul><li><b>ETOS® (Embedded Transformer Operating System)<\/b>: MR gọi là hệ điều hành mở đầu tiên cho MBA thông minh; giám sát, điều khiển, điều chỉnh MBA; độc lập hãng MBA; tích hợp mới hoặc cải tạo, từ 1 máy tới cả đội máy. Gom \"tất cả công nghệ thứ cấp vào một hệ\" (thay nhiều tủ điều khiển). MR quảng bá \"không làm tăng tổng chi phí hệ thống\" (tuyên bố của hãng).<\/li><li>Kiến trúc 3 tầng: (1) <b>Process level<\/b> – cảm biến MSENSE®, thiết bị bảo vệ, mở cho cảm biến bên thứ 3; (2) <b>Field level<\/b> – ETOS phân tích bằng thuật toán MR hoặc thuật toán của khách hàng; 6 gói chức năng: giám sát MBA, giám sát OLTC, DGA online, điều khiển–giám sát làm mát, giám sát sứ…; (3) <b>Control level<\/b> – <b>TESSA®<\/b> giám sát đội máy.<\/li><li><b>ETOS ED<\/b>: tích hợp bộ truyền động OLTC + giám sát trong một vỏ; gửi dữ liệu về trung tâm qua giao thức mạng trên cáp quang; có thể kèm điều chỉnh điện áp và điều khiển làm mát.<\/li><li>Dòng cảm biến <b>MSENSE®<\/b>: DGA, BM (sứ), VAM (rung–âm OLTC), FO (nhiệt độ sợi quang), độ ẩm/BDV; MESSKO MTRAB (bình thở không cần bảo dưỡng); MLOG (giám sát vận chuyển).<\/li><li>MR làm đại lý bán lại <b>Doble Calisto R9<\/b> và cung cấp tích hợp ETOS + Calisto R9.<\/li><li>Hợp tác PSI Software: dùng dữ liệu ETOS tối ưu vận hành MBA, giảm chi phí redispatch.<\/li><li>MR nêu 26 % sự cố MBA bắt nguồn từ bất thường OLTC (số liệu hãng).<\/li><\/ul>\n<h4>Đánh giá (Phòng R&amp;D)<\/h4>\n<ul><li>Mức năng lực TB 995: Descriptive + Diagnostic; điểm khác biệt là <b>điều khiển<\/b> (OLTC, làm mát) → tiến gần vòng kín DT (Prescriptive/Autonomous ở mức cục bộ).<\/li><li>Điểm mạnh: thống trị thị trường OLTC → hiện diện sẵn trên rất nhiều MBA tại VN (GIẢ ĐỊNH cần khảo sát số lượng); kiến trúc mở.<\/li><li>Bài học cho VTI: DT không chỉ \"nhìn\" mà còn tác động (điều khiển làm mát theo mô hình nhiệt) – hướng phát triển cấp cao.<\/li><\/ul>"}, {"title": "Fact sheet hãng – Qualitrol: QTMS, Serveron® TM8, TM View / SmartSUB", "sub": "03_vendor", "html": "<p>Nguồn: qualitrolcorp.com (QTMS brochure AP-M40, blog TM8), UCA IUG certificate #2649. Tra cứu 10/11/2026.<\/p>\n<ul><li><b>QTMS (Qualitrol Transformer Monitoring System)<\/b>: thiết bị giám sát MBA dạng module, cấu hình theo đặc tính kỹ thuật; tới 196 đầu vào số / 112 rơ-le; tích hợp cảm biến Qualitrol và bên thứ 3 + đồng hồ truyền thống. Giám sát: áp suất, nhiệt độ (môi trường, dầu, cuộn dây mô phỏng và đo trực tiếp sợi quang ±1 °C), mức dầu, DGA, PD, sứ, GIC, làm mát, LTC.<\/li><li>Giao thức: IEC 61850, DNP3 (Level 3), Modbus, IEC 60870-5-104. <b>Chứng nhận IEC 61850 Ed 2<\/b> (UCA IUG #2649, phòng thử DNV, 10/2017; các phần 6, 7-1/2/3/4, 8-1).<\/li><li><b>Serveron TM8<\/b>: DGA online 8 khí bằng sắc ký khí (GC) – công nghệ phòng thí nghiệm; chu kỳ 4 giờ, tới 1 giờ khi có lỗi; tương quan khí, độ ẩm, nhiệt độ với tải; dùng cho dầu khoáng và este; công cụ Rogers, Duval Triangles 1/4/5, Duval Pentagon; giao thức TCP/IP, DNP3, Modbus RTU, ASCII, OPC, IEC 61850. Phần mềm TM View quản lý đội thiết bị; SmartSUB kết hợp TM8 với thiết bị giám sát khác.<\/li><li>Giá: không công bố.<\/li><\/ul>\n<h4>Đánh giá (Phòng R&amp;D)<\/h4>\n<ul><li>Mức năng lực TB 995: Descriptive + Diagnostic; thiên về phần cứng giám sát chất lượng cao, phần analytics dựa luật (rule-based).<\/li><li>Điểm mạnh: GC = độ chính xác DGA cao; IEC 61850 có chứng nhận.<\/li><li>Hàm ý: QTMS là \"đối thủ trực tiếp\" của tủ giám sát tích hợp mà VTI có thể làm; tiêu chí số I/O và chứng nhận IEC 61850 là ngưỡng hồ sơ thầu.<\/li><\/ul>"}, {"title": "Fact sheet hãng – OMICRON, Doble, Camlin, Dynamic Ratings, Schneider Electric", "sub": "03_vendor", "html": "<p>Nguồn: trang hãng và tạp chí ngành (TDWorld, Transformers Magazine, electricityforum), tra cứu 10/11/2026.<\/p>\n<h4>OMICRON – MONTRANO, MONTESTO 200, OMS 605<\/h4>\n<ul><li><b>MONTRANO<\/b>: giám sát online tình trạng điện môi sứ và MBA: điện dung, tanδ/power factor, PD, quá điện áp quá độ; độ chính xác điện dung/tanδ tương đương thử offline nhờ tham chiếu đo tuyệt đối tại hiện trường; tách nhiễu để nhận dạng nguồn PD; module hóa; giao diện web.<\/li><li><b>MONTESTO 200<\/b>: đo PD online và giám sát PD tạm thời, xách tay; dùng cảm biến của OMICRON và hãng khác (tụ ghép, cảm biến đầu sứ, UHF drain-valve, HFCT); máy tính tích hợp, truy cập từ xa. <b>OMS 605<\/b>: giám sát PD tạm thời 3(+1) kênh đồng bộ, IP65; có kit UHF cho MBA.<\/li><li>Kèm dịch vụ: khảo sát, lắp đặt, đào tạo, hỗ trợ đánh giá dữ liệu.<\/li><li>Vị trí: chuyên gia PD/điện môi; mạnh về chẩn đoán chính xác, không phải nền tảng DT tổng thể.<\/li><\/ul>\n<h4>Doble Engineering (ESCO) – Calisto®, doblePRIME™, INSIDEVIEW<\/h4>\n<ul><li><b>Calisto R9<\/b> (Morgan Schaffer, công ty Doble từ 2017): DGA online đo hằng giờ H2, CO, CH4, C2H2, C2H4, C2H6, CO2 + độ ẩm, O2, N2; công nghệ DIPAS (quang âm hồng ngoại vi sai, có bằng sáng chế Mỹ) + dẫn nhiệt cho H2; tự hiệu chuẩn bằng hơi nước, không cần bình khí chuẩn; màng chiết chịu chân không. MR bán lại và tích hợp với ETOS.<\/li><li><b>Calisto T1 / doblePRIME<\/b>: mở rộng từ 1 module tới hệ giám sát MBA đầy đủ (PD, sứ IDD – True PowerFactor, dữ liệu vận hành, DGA, thiết bị bên thứ 3); gói Essential → Advanced+; dashboard không cần CSDL/cloud độc quyền (tuyên bố của hãng).<\/li><li><b>dobleASSURANCE<\/b>: hợp đồng giám sát trọn gói 10 năm (bảo dưỡng, vật tư, thay thiết bị) – mô hình kinh doanh dịch vụ đáng học.<\/li><li><b>INSIDEVIEW / PowerBase<\/b>: phần mềm quản lý dữ liệu dầu, thí nghiệm, health index đội máy.<\/li><\/ul>\n<h4>Camlin Energy (Kelvatek) – TOTUS<\/h4>\n<ul><li>Hãng nêu TOTUS là thiết bị đầu tiên tích hợp DGA, PD, giám sát sứ, dòng sự cố xuyên qua (through-fault) và analytics trong một hệ; hơn 1.700 bộ lắp đặt; phân tích nhúng tại thiết bị (không bắt buộc gửi dữ liệu lên server); TOTUSPRO Web; dịch vụ Connected Insights (dùng dữ liệu online + offline bất kỳ nguồn). Hãng nêu cuộn dây chiếm hơn 40 % sự cố MBA (số liệu hãng).<\/li><\/ul>\n<h4>Dynamic Ratings (thuộc Wilson Transformer, Úc)<\/h4>\n<ul><li>Dòng C50 (giám sát đa chức năng: nhiệt, sứ, OLTC, làm mát, DGA, độ ẩm, PD), E3, B100 (ETM), DTM (sứ + PD). Đã có đại lý bán tại VN (TTECH).<\/li><li>Thế mạnh <b>dynamic rating<\/b>: mô hình nhiệt riêng từng MBA, tự hiệu chỉnh tham số bằng so sánh nhiệt độ dầu đo và tính (bằng sáng chế US9419430B1); hãng nêu tăng tải 10–20 % so với định mức tĩnh (thông cáo 2003).<\/li><\/ul>\n<h4>Schneider Electric – EcoStruxure Transformer Expert<\/h4>\n<ul><li>Đầu dò lắp vào van dầu (ren 3/4\"), đo water activity, nhiệt độ, PD, rung, H2 (tùy chọn); truyền 3G/4G lên dashboard cloud; thuật toán dựa IEEE, IEC, CIGRE; hiệu chuẩn tại nhà máy; bảo hành trọn đời khi còn thuê bao. 3 gói: Essential, All-in-One, Hydrogen. Mô hình \"sensor-as-a-service\" hoặc gói dịch vụ do chuyên gia Schneider giám sát.<\/li><li>Vị trí: MBA phân phối/công nghiệp; chi phí thấp, triển khai nhanh; phụ thuộc mạng di động và cloud (hạn chế với trạm truyền tải EVN do yêu cầu an ninh mạng – GIẢ ĐỊNH).<\/li><\/ul>"}, {"title": "Fact sheet 20 – Thị trường & bối cảnh Việt Nam cho giám sát online / Digital Twin MBA", "sub": "04_vietnam", "html": "<p>Cập nhật 10/11/2026 (lần 2). Mức tin cậy ghi rõ từng dòng.<\/p>\n<h4>Hệ thống đã triển khai (ĐÃ KIỂM CHỨNG qua báo chí ngành)<\/h4>\n<ul><li>EVNNPT: dự án \"Trang bị 4 bộ giám sát, đánh giá tổng quan bản thể MBA 500 kV\" tại các trạm 500 kV Phú Lâm, Pleiku 2, Đà Nẵng, Hiệp Hòa. Thiết bị GE MS 3000 (sản xuất tại Đức); PTC3 thay mặt EVNNPT quản lý dự án; Công ty CP 3C là nhà thầu, nghiệm thu và đóng điện bộ cuối cùng (AT1 Hiệp Hòa). Dữ liệu qua mạng WAN EVNNPT về phần mềm Perception Server (đã đầu tư từ dự án giám sát dầu online cho MBA và kháng 500 kV trước đó). Báo chí ghi đây là lần đầu EVNNPT thí điểm loại thiết bị giám sát tổng quan này. Nguồn: tapchicongthuong.vn (bài 63062, 64749).<\/li><li>Thủy điện Sông Bung 4: lắp GE MS3000 + Kelman DGA900, giám sát PD, DGA, áp suất, nhiệt độ, chẩn đoán thời gian thực. Nguồn: tapchicongthuong.vn (bài 131592).<\/li><li>Đại lý trong nước đã chào bán thiết bị Dynamic Ratings (TTECH). Nguồn: parts.ttech.vn.<\/li><\/ul>\n<h4>Hàm ý thị trường (PHÂN TÍCH của Phòng R&amp;D – cần kiểm chứng thêm)<\/h4>\n<ul><li>Cấp 500 kV của EVNNPT đã có hạ tầng GE (MS 3000 + Perception). Đối thủ có lợi thế cài đặt sẵn; cơ hội cho VTI nằm ở lớp phần mềm DT độc lập hãng đọc dữ liệu từ thiết bị sẵn có, hoặc ở cấp 110–220 kV, trạm không người trực, nhà máy thủy điện/năng lượng tái tạo.<\/li><li>Nhà tích hợp trong nước (ví dụ 3C) đóng vai trò triển khai → đối tác hoặc đối thủ tiềm năng của VTI.<\/li><\/ul>\n<h4>Pháp lý về dữ liệu (✅ đã đọc bản tiếng Anh Luật Dữ liệu trong library/04_vietnam; 🌐 nghị định tra cứu web)<\/h4>\n<ul><li>✅ <b>Luật Dữ liệu số 60/2024/QH15<\/b>, thông qua 30/11/2024, hiệu lực 01/7/2025.<\/li><li>Phân loại: dữ liệu cốt lõi, dữ liệu quan trọng, dữ liệu khác. Dữ liệu quan trọng là dữ liệu có thể ảnh hưởng quốc phòng–an ninh, đối ngoại, kinh tế vĩ mô, ổn định xã hội, sức khỏe cộng đồng, nằm trong danh mục do Thủ tướng ban hành. Dữ liệu cốt lõi là phần dữ liệu quan trọng tác động trực tiếp tới các lĩnh vực đó.<\/li><li><b>Điều 23 – chuyển, xử lý dữ liệu xuyên biên giới<\/b> với dữ liệu cốt lõi/quan trọng gồm 3 trường hợp:<\/li><li>chuyển dữ liệu lưu tại Việt Nam sang hệ thống lưu trữ ở nước ngoài;<\/li><li>chuyển cho tổ chức, cá nhân nước ngoài;<\/li><li><b>dùng nền tảng đặt ngoài lãnh thổ để xử lý<\/b>.<\/li><li>Điều 25: chủ quản dữ liệu phải đánh giá và quản lý rủi ro xử lý dữ liệu.<\/li><li>🌐 <b>Nghị định 165/2025/NĐ-CP<\/b> (30/06/2025, hiệu lực 01/7/2025) hướng dẫn Luật Dữ liệu: trước khi chuyển dữ liệu cốt lõi/quan trọng ra nước ngoài phải lập báo cáo đánh giá tác động; với dữ liệu cốt lõi, hồ sơ gửi Bộ Công an hoặc Bộ Quốc phòng.<\/li><li>🌐 Luật Bảo vệ dữ liệu cá nhân 91/2025/QH15 (hiệu lực 01/01/2026) và Nghị định 356/2025/NĐ-CP. Dữ liệu vận hành MBA thường không phải dữ liệu cá nhân.<\/li><li>🌐 Dự thảo Luật An ninh dữ liệu (dự kiến hiệu lực 01/12/2027).<\/li><li><b>Hàm ý cho DT (PHÂN TÍCH, cần luật sư xác nhận)<\/b>: nếu dữ liệu vận hành lưới truyền tải/trạm của EVN được xếp vào danh mục dữ liệu quan trọng, thì giải pháp DT xử lý trên cloud nước ngoài (Siemens Sensformer cloud, Schneider EcoStruxure qua 3G/4G, APM SaaS…) phải đánh giá tác động trước khi chuyển dữ liệu. Giải pháp xử lý tại Việt Nam (on-premise, local) có lợi thế tuân thủ. CẦN KIỂM CHỨNG danh mục dữ liệu quan trọng/cốt lõi do Thủ tướng ban hành có bao gồm dữ liệu vận hành hệ thống điện hay không.<\/li><li>Luật Điện lực 2024 và Nghị quyết 57-NQ/TW: CẦN đối chiếu văn bản gốc.<\/li><\/ul>\n<h4>Tài liệu Việt Nam còn thiếu (cần anh Khương bổ sung)<\/h4>\n<ul><li>Quy định/hướng dẫn của EVN, EVNNPT về trạm biến áp không người trực, hệ thống điều khiển máy tính, giám sát online thiết bị (quy trình, đặc tính kỹ thuật mẫu).<\/li><li>Hồ sơ mời thầu (HSMT) gần đây có hạng mục giám sát online MBA (110–500 kV) – để biết tiêu chí kỹ thuật &amp; giá trần.<\/li><li>Thống kê sự cố MBA của EVN/EVNNPT (nếu có báo cáo nội bộ).<\/li><\/ul>"}]};let tab="reports";
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(){const q=document.getElementById("q").value.trim().toLowerCase();const L=document.getElementById("list");L.innerHTML="";
D[tab].forEach((d,i)=>{const txt=(d.title+" "+d.html.replace(/<[^>]+>/g," ")).toLowerCase();if(q&&!txt.includes(q))return;
const it=document.createElement("div");it.className="item"+(q?" open":"");
it.innerHTML=`<button><span>${esc(d.title)}<small>${esc(d.sub)}</small></span><span class="chev">›</span></button><div class="body">${d.html}</div>`;
it.querySelector("button").onclick=()=>it.classList.toggle("open");L.appendChild(it);});
if(!L.children.length)L.innerHTML='<p style="color:var(--muted)">Không tìm thấy.</p>';}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render();});
document.getElementById("q").oninput=render;render();
</script></body></html>
